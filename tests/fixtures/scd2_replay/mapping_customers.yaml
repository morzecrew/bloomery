mapping_version: 1
source: crm__customers
target: customer
key:
  # Read from a same-named bronze column on purpose: the e2e tier seeds a
  # relation with every column any model mentions, so a key aliased to a
  # different name than its source shadows a real column there.
  customer_id: {from: "$.customer_id", transform: [to_string]}
fields:
  segment: {from: "$.segment"}
  signed_up_at: {from: "$.signed_up_at", transform: [{parse_ts: ISO8601}]}
unmapped: ["$._load_id", "$._ingested_at", "$._source_row_id"]
