# The current-reading fixture (S-0080/D-1). Identical to `scd2_as_of`
# except for its marts: `customer` is historical and is read at its current
# version, on the base of one mart and on the flatten hop of another.
#
# The entity model is deliberately shared verbatim with the refusal fixture, so
# the difference between "refused" and "compiled" is the `reading:` clause in
# marts.yaml and nothing else.
spec_version: 1
entities:
  customer:
    grain: one row per customer
    key: [customer_id]
    scd: type2
    fields:
      customer_id: {type: string, required: true}
      segment: {type: string}
      signed_up_at: {type: timestamp}
  order:
    grain: one row per order
    key: [order_id]
    fields:
      order_id: {type: string, required: true}
      customer_id: {type: string}
      amount: {type: "decimal(12,4)"}
      order_date: {type: date}
relationships:
  - name: order_of_customer
    from: order
    to: customer
    via: {customer_id: customer_id}
    cardinality: many_to_one
