mapping_version: 1
source: shop__order_lines
target: order_item
key:
  order_id: {from: "$.order_id", transform: [to_string]}
  line_no: {from: "$.index", transform: [to_int]}
fields:
  unit_price: {from: "$.price", transform: [{to_decimal: [12, 4]}]}
  quantity: {from: "$.qty", transform: [to_int]}
  order_date:
    from: "$.created_at"
    transform: [{parse_ts: ISO8601}]
