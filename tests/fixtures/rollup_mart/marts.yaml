# A wide mart at order-line grain, and a rollup of it at month × customer
# (RFC 0058 §5.1). The rollup names what it *keeps*; what it drops — every
# other column of `order_items` — is derived, because listing both is two
# statements of one fact that will disagree (D4).
marts_version: 1
marts:
  order_items:
    grain: order_item
    base: order_item
    flatten:
      - {via: item_of_order, prefix: order_}
      - {date: order_date, role: ordered}
    measures: [gross_revenue]

rollups:
  # `gross_revenue` is declared additive over an agg-over-expr, so R013
  # discharges the obligation: summing it to month × customer is the same
  # number as computing it there from silver.
  order_items_monthly:
    of: order_items
    keep: [order_customer_id, ordered_month]
    measures: [gross_revenue]
