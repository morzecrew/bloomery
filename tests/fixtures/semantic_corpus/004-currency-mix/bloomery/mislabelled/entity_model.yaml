spec_version: 1
entities:
  payment:
    grain: one row per payment
    key: [payment_id]
    fields:
      payment_id: {type: string, required: true}
      amount_eur: {type: "decimal(12,4)", canonical: amount_eur}
      amount_usd: {type: "decimal(12,4)", canonical: amount_usd}
      fee_usd: {type: "decimal(12,4)", canonical: fee_usd}
      paid_at: {type: date}
