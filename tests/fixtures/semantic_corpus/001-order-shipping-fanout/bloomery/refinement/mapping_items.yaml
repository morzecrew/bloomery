mapping_version: 1
source: corpus__order_items
target: order_item
key:
  order_id: {from: "$.order_id", transform: [to_string]}
  line_no: {from: "$.line_no", transform: [to_int]}
fields:
  unit_price:
    recipe: direct
    from: {unit_price: "$.unit_price"}
  landed_cost:
    recipe: naive_join
    from: {unit_price: "$.unit_price", shipping: "$.shipping"}
  ordered_at: {from: "$.ordered_at", transform: [{parse_ts: ISO8601}]}
