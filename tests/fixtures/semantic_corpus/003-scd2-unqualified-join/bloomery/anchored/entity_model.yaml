spec_version: 1
entities:
  order:
    grain: one row per order
    key: [order_id]
    fields:
      order_id: {type: string, required: true}
      customer_id: {type: string}
      ordered_at: {type: timestamp}
      amount: {type: "decimal(12,4)"}
  customer_tier:
    grain: one row per customer per tier version
    key: [customer_id]
    scd: type2
    fields:
      customer_id: {type: string, required: true}
      tier: {type: string}
relationships:
  - name: tier_of_customer
    from: order
    to: customer_tier
    via: {customer_id: customer_id}
    cardinality: many_to_one
