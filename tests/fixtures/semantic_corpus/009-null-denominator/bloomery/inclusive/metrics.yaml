# The other reading, declared. "Total carrier spend per parcel moved, overheads
# included" is a metric somebody wants: a shipment cancelled after the carrier
# charged for it cost money, and this reading says that cost belongs in the
# rate. The number is 4.00 — the same number the `declared` arm produced by
# accident, and the difference is that an author wrote down which question they
# were asking (RFC 0075 D2).
metrics_version: 1
metrics:
  carrier_cost:
    grain: shipment
    additivity: additive
    agg: sum
    expr: "carrier_cost"
  parcels:
    grain: shipment
    additivity: additive
    agg: sum
    expr: "parcels"
  cost_per_parcel:
    grain: shipment
    additivity: ratio
    ratio:
      numerator: carrier_cost
      denominator: parcels
      includes_zero_denominator: true
