# Shipping lives on `order`, discount on `order_item`, and each is only ever
# aggregated where it lives. The relationship is declared and never flattened
# onto a mart: RFC 0041 answers this by joining the two aggregates, so nothing
# here needs one mart to reach the other.
spec_version: 1
entities:
  order:
    grain: one row per order
    key: [order_id]
    fields:
      order_id: {type: string, required: true}
      shipping: {type: "decimal(12,4)"}
      ordered_at: {type: timestamp}
  order_item:
    grain: one row per line on an order
    key: [order_id, line_no]
    fields:
      order_id: {type: string, required: true}
      line_no: {type: int, required: true}
      discount: {type: "decimal(12,4)"}
      ordered_at: {type: timestamp}
relationships:
  - name: item_of_order
    from: order_item
    to: order
    via: {order_id: order_id}
    cardinality: many_to_one
