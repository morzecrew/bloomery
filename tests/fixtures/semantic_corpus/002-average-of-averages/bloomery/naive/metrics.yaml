# The declaration the corpus is about. The column already holds an average,
# and `additivity: additive` is a claim nothing checks — so the planner
# re-averages it and the number weights each order equally.
metrics_version: 1
metrics:
  average_item_price:
    grain: order_summary
    additivity: additive
    agg: avg
    expr: "average_item_price"
