# The shop being migrated onto. Every field is read from a different path than
# the other shop reads it from, which is the point of the union — and, with
# rules on the entity, the point of D32: one `coercible` marker per column,
# each branch comparing against the paths *it* reads.
mapping_version: 1
source: shopify__order_lines
target: order_line
key:
  order_id: {from: "$.order.id", transform: [to_string]}
  line_no: {from: "$.position", transform: [to_int]}
fields:
  sku: {from: "$.variant.sku", transform: [to_string]}
  quantity: {from: "$.quantity", transform: [to_int]}
  gift_note: {from: "$.properties.gift_note", transform: [to_string]}
  placed_at: {from: "$.created_at", transform: [{parse_ts: ISO8601}]}
  # This shop knows a status the other has never heard of, so the two branches
  # admit *different* sets — which is the whole of D32 for `in_enum`. A merged
  # set would admit `reversed` for legacy rows, whose chain can never produce
  # it, and the rule would have quietly stopped checking there.
  status:
    from: "$.financial_status"
    transform: [to_string, {enum_map: [pending, open, paid, closed, refunded, reversed]}]
    quality:
      - {rule: in_enum, on_fail: quarantine}
unmapped: ["$._load_id", "$._ingested_at", "$._source_row_id"]
