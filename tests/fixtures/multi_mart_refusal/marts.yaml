# Two marts at different grains with disjoint measures (S-0028/algorithm-and-refusals): each
# answers its own metric alone; the pair together is structurally
# unanswerable — the coverage precheck refuses before MetricFlow could plan
# the join (S-0030/D-6).
marts_version: 1
marts:
  orders:
    grain: order
    base: order
    flatten:
      - {date: order_date, role: ordered}
    measures: [shipping_cost]
  order_items:
    grain: order_item
    base: order_item
    flatten:
      - {date: item_date, role: added}
    measures: [line_discount]
