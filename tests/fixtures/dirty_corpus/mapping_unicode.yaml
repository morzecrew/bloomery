mapping_version: 1
source: dirty__unicode
target: dirty_name
key:
  case_name: {from: "$._case", transform: [to_string]}
fields:
  name:
    from: "$.raw_name"
    transform: [to_string]
    quality:
      # Fires on the quoted empty string, silent on the NULL beside it (D19) —
      # the pair the corpus keeps to pin that boundary.
      - {rule: length, min: 1, on_fail: flag}
      # Two bounds, two rules (§5.3): the upper one fires on exactly one row,
      # `long_grapheme_cluster` — thirteen codepoints rendering as one
      # grapheme, which is the upper-bound case any `length` rule has to have
      # an answer for. The astral and ZWJ emoji rows sit at 11 and 3 and stay
      # clean, which is what makes the assertion about codepoints and not bytes.
      - {rule: length, max: 12, on_fail: flag}
      # The one unicode row the corpus marks `quarantine`: the JSON escape of a
      # lone surrogate, which is the only specimen carrying a backslash.
      - {rule: pattern, regex: '^[^\\]*$', on_fail: quarantine}
      # Every name in the file is distinct, so this fires on nothing — the
      # whole-table slice of an unpartitioned FULL entity (D5).
      - {rule: unique, on_fail: flag}
      # D86's two rules, and the reason this file existed as a recorded gap
      # (D26) for two waves. `normalize` catches `nfd_form` — `café` spelled
      # with a combining acute, which every join, `unique` and dedupe reads as
      # a different value from the precomposed spelling a human cannot tell it
      # from — and `long_grapheme_cluster`, whose base composes.
      - {rule: normalize, form: nfc, on_fail: flag}
      # One policy, stated once: a Latin-script name column admits neither
      # invisible formatting nor a script whose letters are drawn like Latin
      # ones. The set is large because a *denylist of confusable blocks* is
      # large by nature — MAX_CHARSET_SIZE is what bounds it — and it is a
      # denylist rather than an allow-list because the clean rows here include
      # `café` and two emoji, which no reasonable allow-list for a name column
      # would enumerate.
      #
      # U+200D ZERO WIDTH JOINER is **deliberately absent**, and it is the one
      # character in this file no set-membership rule can decide: `👩‍🔬` needs
      # it and `Acme‍Corp` must not have it, so its legitimacy is a fact
      # about context, not about the character.
      - rule: charset
        on_fail: flag
        forbid:
          - U+0009            # tab — harmless here, fatal to a TSV re-export
          - U+00A0            # no-break space, which an ASCII trim leaves
          - U+00AD            # soft hyphen
          - U+0400-U+04FF     # Cyrillic — the homoglyph block
          - U+0660-U+0669     # Arabic-Indic digits
          - U+200B-U+200C     # zero-width space, zero-width non-joiner
          - U+200E-U+200F     # left/right-to-left marks
          - U+202A-U+202E     # bidi embeddings and overrides (trojan source)
          - U+2066-U+2069     # bidi isolates
          - U+FEFF            # a BOM that leaked into the field
          - U+FF01-U+FF5E     # fullwidth forms
          - U+FFFD            # a decode already failed upstream
unmapped:
  - "$._load_id"
  - "$._ingested_at"
  - "$._source_row_id"
  - "$._codepoints"
  - "$._expected"
  - "$._note"
