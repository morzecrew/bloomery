mapping_version: 1
source: dirty__keys
target: dirty_key
key:
  order_id: {from: "$.order_id", transform: [to_string]}
  line_no: {from: "$.line_no", transform: [to_int]}
fields:
  # RFC 0016 §5.3's worked example, on live data. Two rows one ulp apart sit on
  # the bound (`amount_at_range_min` / `amount_below_range_min`, D78): `min`
  # lowers to `col < min`, so the edge itself is kept and only the row below it
  # is diverted. Every *other* out-of-bounds value in the corpus is uncastable,
  # which is why `coercible` reaches it first and this pair had to be written.
  amount:
    from: "$.amount"
    transform: [{to_decimal: [38, 9]}]
    quality:
      - {rule: range, min: 0, on_fail: quarantine}
unmapped: ["$._load_id", "$._ingested_at", "$._source_row_id", "$._case", "$._expected", "$._note"]
