mapping_version: 1
source: dirty__extremes_decimal
target: dirty_decimal_extreme
key:
  case_name: {from: "$._case", transform: [to_string]}
fields:
  value: {from: "$.raw_value", transform: [{to_decimal: [38, 9]}]}
  # `decimal_sub_ulp` is the row: half a ulp does not fail the cast, DuckDB
  # rounds it up. The flag records the loss the disposition cannot.
  value_text:
    from: "$.raw_value"
    transform: [to_string]
    quality:
      - {rule: pattern, regex: '^-?[0-9]+(?:\.[0-9]{1,9})?$', on_fail: flag}
unmapped:
  - "$._load_id"
  - "$._ingested_at"
  - "$._source_row_id"
  - "$.raw_kind"
  - "$._expected"
  - "$._note"
