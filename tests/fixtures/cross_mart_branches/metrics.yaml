metrics_version: 1
metrics:
  customer_count:
    grain: customer
    additivity: additive
    agg: count
    expr: "customer_id"
  shipping_count:
    grain: order
    additivity: additive
    agg: count
    expr: "order_id"
  line_discount:
    grain: order_item
    additivity: additive
    agg: sum
    expr: "discount"
