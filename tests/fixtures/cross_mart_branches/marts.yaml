# Every mart reaches `customer.tier`, each under its own spelling: `tier` here,
# `customer_tier` one hop away, `order_customer_tier` two. RFC 0041 D12 makes
# them one dimension by provenance, which is what lets one request be answered
# from all three marts at once.
marts_version: 1
marts:
  customers:
    grain: customer
    base: customer
    flatten:
      - {date: signed_up, role: joined}
    measures: [customer_count]
  orders:
    grain: order
    base: order
    flatten:
      - {via: order_of_customer, prefix: customer_}
      - {date: order_date, role: ordered}
    measures: [shipping_count]
  order_items:
    grain: order_item
    base: order_item
    flatten:
      - {via: item_of_order, prefix: order_}
      - {via: order_of_customer, prefix: order_customer_}
      - {date: item_date, role: added}
    measures: [line_discount]
