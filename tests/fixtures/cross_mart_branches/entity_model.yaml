# The cross-mart branch fixture (RFC 0041 P1, logs/T-0026.md D-167).
#
# Three entities, each with a mart carrying one additive measure, and every
# mart reaching `customer.tier` — directly at `customers`, through one
# flattened hop at `orders`, and through two at `order_items`. So one request
# for all three measures by `tier` names three measures on three grains, and
# the three columns holding the answer are spelled `tier`,
# `customer_tier` and `order_customer_tier`.
#
# That is the point of the fixture, and why it is a fixture rather than an
# extension of `unflattened_hop`: RFC 0041 D12 makes those three one dimension
# by provenance, and nothing else in the corpus has two measure-carrying marts
# that reach one dimension at all. `unflattened_hop` is the neighbouring case
# — the hop declared and deliberately not flattened — and it owns checked-in
# parity rows that must not move for a reason unrelated to this phase.
spec_version: 1
entities:
  customer:
    grain: one row per customer
    key: [customer_id]
    fields:
      customer_id: {type: string, required: true}
      tier: {type: string}
      signed_up: {type: date}
  order:
    grain: one row per order
    key: [order_id]
    fields:
      order_id: {type: string, required: true}
      customer_id: {type: string}
      region: {type: string}
      order_date: {type: date}
  order_item:
    grain: one row per line on an order
    key: [order_id, line_no]
    fields:
      order_id: {type: string, required: true}
      line_no: {type: int, required: true}
      discount: {type: "decimal(12,4)"}
      item_date: {type: date}
relationships:
  - name: item_of_order
    from: order_item
    to: order
    via: {order_id: order_id}
    cardinality: many_to_one
  - name: order_of_customer
    from: order
    to: customer
    via: {customer_id: customer_id}
    cardinality: many_to_one
