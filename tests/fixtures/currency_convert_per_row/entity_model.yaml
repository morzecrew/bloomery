# The per-row denomination fixture (S-0066/the-input-currency-is-one-of-three-things shape 3, P2). One payment
# processor, many currencies: the amount and the code it was taken in arrive on
# the same row, so the rate is picked per row rather than per column.
spec_version: 1
entities:
  payment:
    grain: one row per payment
    key: [payment_id]
    fields:
      payment_id: {type: string, required: true}
      amount_src: {type: "decimal(12,4)"}
      currency_code: {type: string}
      amount_usd: {type: "decimal(12,4)", canonical: amount_usd}
      paid_at: {type: date}
