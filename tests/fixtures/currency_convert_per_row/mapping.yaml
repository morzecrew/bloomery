mapping_version: 1
source: psp__payments
target: payment
key:
  payment_id: {from: "$.id", transform: [to_string]}
fields:
  amount_src: {from: "$.amount", transform: [{to_decimal: [12, 4]}]}
  currency_code: {from: "$.currency", transform: [to_string]}
  # `currency_in:` names the column; `convert`'s first argument names it again
  # and is checked against the declaration, exactly as a literal code is
  # (S-0066/D-4, S-0066/D-10).
  amount_usd:
    currency_in: {column: currency_code}
    from: "$.amount"
    transform: [{to_decimal: [12, 4]}, {convert: [currency_code, USD, paid_at]}]
  paid_at: {from: "$.paid_at", transform: [{parse_date: ISO8601}]}
