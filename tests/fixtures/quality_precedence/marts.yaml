# One mart over `q_line`, and it exists for one claim: RFC 0016 §5.5's promise
# that "revenue excluding flagged rows becomes a plain `MetricRequest`". That
# promise is carried entirely by the generated `has_quality_flags` dimension,
# which the mart flattens in from the base entity's `_quality_ok` — so a mart
# is the only place its **polarity** is observable at all. Without one, an
# inverted dimension (a constant FALSE, say) is invisible to every execution,
# property and conservation assertion in the suite.
#
# The population is chosen so both truth values appear: `r09` fires the `fail`
# rule and is diverted by nothing, so it reaches the mart flagged, while the
# rows the split diverted never reach it at all (D15).
marts_version: 1
marts:
  lines:
    grain: q_line
    base: q_line
    flatten:
      - {date: order_date, role: ordered}
    measures: [line_amount_total]
    # RFC 0016 D89 — §10's "no month has zero revenue", made declarable, and
    # declared here rather than on a general-purpose fixture because an
    # assertion makes a project refuse to compile for dbt and Cube (neither has
    # the audit shape, and silently dropping a declared gate is what RFC 0008
    # D3 refuses). Two clauses, so the pair the surface exists for is present:
    # one groups and blocks, one does neither.
    assert:
      - name: amount_positive_every_month
        measure: amount
        agg: sum
        by: [ordered_month]
        min: "0.000000001"
        on_fail: fail
      - name: rows_present
        measure: amount
        agg: count
        min: 1
        on_fail: flag
