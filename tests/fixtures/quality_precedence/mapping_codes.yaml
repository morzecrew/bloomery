mapping_version: 1
source: q__codes
target: q_code
key:
  code_id: {from: "$.code_id", transform: [to_string]}
fields:
  code_flag:
    from: "$.code_flag"
    transform: [to_string]
    quality:
      - {rule: unique, on_fail: flag}
  code_quar:
    from: "$.code_quar"
    transform: [to_string]
    quality:
      - {rule: unique, on_fail: quarantine}
  code_fail:
    from: "$.code_fail"
    transform: [to_string]
    quality:
      - {rule: unique, on_fail: fail}
unmapped: ["$._load_id", "$._ingested_at", "$._source_row_id"]
# A week, which dbt's `period` enum cannot spell — the emitted entry carries
# fourteen days. The spec grammar is `quarantine.retention`'s (RFC 0057 D3) and
# the conversion belongs to the target, not to the spec surface.
freshness: {warn_after: 2w, error_after: 4w}
