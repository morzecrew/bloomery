# The vertical's vocabulary. `customer_ref` is a canonical field like any
# other — the fact that a *step* supplies it rather than a mapping is the
# whole point of RFC 0017 D49, and nothing in this document knows about it.
catalog_version: 1
vertical: crm

canonical_fields:
  customer_ref:
    entity: customer
    type: string
    recipes:
      - {id: direct, requires: [customer_ref]}
  resolved_at:
    entity: customer
    type: timestamp
    recipes:
      - {id: direct, requires: [resolved_at]}

date_dimension:
  name: dim_date
  grain: day
  start_year: 2020
  end_year: 2030

metric_templates:
  customer_count:
    requires: [customer_ref]
    grain: customer
    additivity: additive
    agg: count
    expr: "customer_ref"
