# The currency-conversion fixture (S-0040/phase-2-currency-as-a-declared-relation). One line of difference from
# `currency_convert_refusal`: this project's catalog declares `fx_rates:`, and
# that is what turns the refusal into a conversion. Everything else — the
# entity, the mapping, the convert step — is the same spec.
spec_version: 1
entities:
  payment:
    grain: one row per payment
    key: [payment_id]
    fields:
      payment_id: {type: string, required: true}
      amount_eur: {type: "decimal(12,4)", canonical: amount_eur}
      amount_usd: {type: "decimal(12,4)", canonical: amount_usd}
      fee_usd: {type: "decimal(12,4)", canonical: fee_usd}
      paid_at: {type: date}
