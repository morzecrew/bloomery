mapping_version: 1
source: psp__payments
target: payment
key:
  payment_id: {from: "$.id", transform: [to_string]}
fields:
  amount_eur: {from: "$.amount", transform: [{to_decimal: [12, 4]}]}
  amount_usd: {from: "$.amount", transform: [{to_decimal: [12, 4]}, {convert: [EUR, USD, paid_at]}]}
  fee_usd: {from: "$.fee", transform: [{to_decimal: [12, 4]}]}
  paid_at: {from: "$.paid_at", transform: [{parse_date: ISO8601}]}
