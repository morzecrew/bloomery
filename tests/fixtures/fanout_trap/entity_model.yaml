# The fan-out trap (RFC 0009 §5.3, RFC 0006 §5.3): `shipping_cost` lives at
# order grain; `landed_cost` combines it at line grain with no aggregation —
# the formula is right, the data is right, and every SUM is 3× wrong.
spec_version: 1
entities:
  order_item:
    grain: one row per line on an order
    key: [order_id, line_no]
    fields:
      order_id: {type: string, required: true}
      line_no: {type: int, required: true}
      unit_price: {type: "decimal(12,4)", canonical: unit_price}
      landed_cost: {type: "decimal(12,4)", canonical: landed_cost}
  order:
    grain: one row per order
    key: [order_id]
    fields:
      order_id: {type: string, required: true}
      shipping_cost: {type: "decimal(12,4)", canonical: shipping_cost}
relationships:
  - name: item_of_order
    from: order_item
    to: order
    via: {order_id: order_id}
    cardinality: many_to_one
