# The same trap at metric level: `requires` span entities with different
# grains, combined additively with no aggregation — a second GrainMismatch,
# batched with the derivation's into one GuardrailError (RFC 0006 D2).
metrics_version: 1
metrics:
  landed_revenue:
    requires: [unit_price, shipping_cost]
    grain: order_item
    additivity: additive
    agg: sum
    expr: "unit_price + shipping_cost"
  # Correct at its own grain — the mart-level trap (marts.yaml) puts this
  # order-grain measure on the item-grain mart: GrainViolation (RFC 0010 D2).
  shipping_cost:
    requires: [shipping_cost]
    grain: order
    additivity: additive
    agg: sum
    expr: "shipping_cost"
