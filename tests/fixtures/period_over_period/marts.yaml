# One mart, one date role. `measures:` lists only the metrics that *have* a
# measure: the two derived metrics are computed from `revenue` at query time
# and are emitted wherever their inputs are (RFC 0034 D4).
marts_version: 1
marts:
  sales:
    grain: sale
    base: sale
    flatten:
      - {date: sold_at, role: sold}
    measures: [booked_since_march, large_recent_revenue, paid_revenue, revenue, revenue_mtd, revenue_trailing_7d]
