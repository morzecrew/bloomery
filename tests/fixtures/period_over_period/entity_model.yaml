# The period-over-period fixture (RFC 0034): one sale fact with a date, a
# status to filter on and a channel to group by — the smallest shape that can
# ask "revenue vs. the same month last year" and be checked by hand.
#
# `units` and `is_test` carry no metric. They are here so a metric filter can
# be written against an integer and a boolean column: the guardrail checks a
# filter value against the column's declared type (RFC 0034 D9), and a fixture
# with only strings, decimals and dates cannot exercise the other two.
spec_version: 1
entities:
  sale:
    grain: one row per sale
    key: [sale_id]
    fields:
      sale_id: {type: string, required: true}
      amount: {type: "decimal(12,4)"}
      units: {type: int}
      is_test: {type: bool}
      status: {type: string}
      channel: {type: string}
      sold_at: {type: date}
      # A timestamp as well as a date, because they are not the same case: a
      # timestamp literal written in ISO form carries a `T`, and Trino refuses
      # to cast one (`INVALID_CAST_ARGUMENT`). Only a filter on this column
      # runs that rendering through an engine.
      booked_at: {type: timestamp}
