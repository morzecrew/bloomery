spec_version: 1
entities:
  order_item:
    grain: one row per line on an order
    key: [order_id, line_no]
    scd: type1
    partition_by: [days(order_date)]
    fields:
      order_id: {type: string, required: true}
      line_no: {type: int, required: true}
      unit_price: {type: "decimal(12,4)", canonical: unit_price}
      quantity: {type: int, canonical: quantity}
      order_date: {type: timestamp, assert: {not_null: true}}
      extensions: {type: variant}
  order:
    grain: one row per order
    key: [order_id]
    # RFC 0055: the three annotations, on the corpus's flagship project, so the
    # metadata slots are pinned as bytes in every target's golden rather than
    # only in a unit test's parsed YAML. `customer_id` flattens into the mart,
    # which is what makes Cube's `public: false` visible here.
    owner: commerce-platform@example.com
    fields:
      order_id: {type: string, required: true}
      customer_id: {type: string, classification: pii}
relationships:
  - name: item_of_order
    from: order_item
    to: order
    via: {order_id: order_id}
    cardinality: many_to_one
