metrics_version: 1
metrics:
  gross_revenue:
    # On a metric a mart actually carries, so the Cube measure's `meta.owner`
    # is pinned by the golden. `order_count` is no mart's measure, so an owner
    # there would reach no artifact at all.
    owner: finance-reporting@example.com
    template: gross_revenue
  order_count:
    grain: order
    additivity: additive
    agg: count
    expr: "order_id"
  average_order_value:
    requires_metrics: [gross_revenue, order_count]
    additivity: ratio
    ratio: {numerator: gross_revenue, denominator: order_count}
  # Unreachable on purpose: no mapping supplies `cogs`, so resolution reports
  # this metric with the specific missing leaf (RFC 0005 §5.3).
  margin:
    requires: [unit_price, cogs]
    grain: order_item
    additivity: additive
    agg: sum
    expr: "unit_price - cogs"
