# Wide-mart gold layer (S-0027/spec-kind). A measure-carrying mart must declare a
# date role (MartMissingTimeDimension otherwise — S-0027/D-9).
marts_version: 1
marts:
  order_items:
    grain: order_item
    base: order_item
    owner: analytics@example.com
    flatten:
      - {via: item_of_order, prefix: order_}
      - {date: order_date, role: ordered}
    measures: [gross_revenue]
    partition_by: [days(ordered_day)]
    cost_hint: 2
