# `order_items` declares no `{via: item_of_order}`, so `region` is not on it —
# while the relationship that would make the hop safe *is* declared. That is
# the whole point of the fixture: the gap is one line of spec, and the refusal
# should say so rather than guess a nearest name (S-0054/phasing (a) S-0054/phasing (P-2)).
marts_version: 1
marts:
  orders:
    grain: order
    base: order
    flatten:
      - {via: order_of_customer, prefix: customer_}
      - {date: order_date, role: ordered}
    measures: [shipping_count]
  order_items:
    grain: order_item
    base: order_item
    flatten:
      - {date: item_date, role: added}
    measures: [line_discount]
