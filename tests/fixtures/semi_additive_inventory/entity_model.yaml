# Inventory balances (RFC 0009 §5.3): a stock level is a point-in-time
# balance — additive across warehouses, never across days. The valid base
# fixture compiles clean at M4; the guardrail refusals are asserted on
# broken variants (missing over/rule, non-additive without components), and
# the 90/130 execution numbers are M7 planner scope (RFC 0009 §5.10).
spec_version: 1
entities:
  inventory_level:
    grain: one row per warehouse per day
    key: [warehouse_id, stock_date]
    fields:
      warehouse_id: {type: string, required: true}
      stock_date: {type: date, required: true}
      stock_level: {type: int, canonical: stock_level}
    # Data quality (RFC 0016). A WMS re-sends the same warehouse/day snapshot
    # whenever an operator corrects it, so the entity deduplicates on ingestion
    # recency; corrections occasionally arrive with a negative or uncastable
    # level, which is what the dispositions below are for. All three
    # dispositions appear on purpose — flag, quarantine, fail.
    dedupe: {keep: latest_by, field: _ingested_at, tie_break: [_load_id]}
    quarantine: {retention: 90d, redact: ["$.operator_note"]}
    quality:
      - {rule: expression, name: stock_level_not_negative,
         expr: "stock_level >= 0", on_fail: flag}

# A reconcile check (RFC 0016 §5.3) over the one entity this fixture declares:
# the per-key aggregate must equal the per-key value. That is only true while
# exactly one row survives per (warehouse, day) — so this is the *executable*
# statement of what dedupe promises, in the same shape as the RFC's
# order/order_item example. Non-blocking by construction: a WMS that starts
# re-sending corrections under a new _source_row_id shows up here as a
# disagreement, not as a stopped pipeline.
reconcile:
  - {name: stock_level_matches_snapshot,
     left: "sum(inventory_level.stock_level) by warehouse_id, stock_date",
     right: "inventory_level.stock_level",
     tolerance: "0.01", on_fail: flag}
