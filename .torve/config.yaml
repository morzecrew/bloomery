# yaml-language-server: $schema=schemas/config.json
# Runner configuration for bloomery under torve. Read from this repository's
# root by every verb (`--root .`); the gate manifest is `gates.yaml` beside it.
# Copied from torve's own configuration on 2026-09-17 and cut to what this
# repository uses: one live seat, the local broker, and the landing act this
# repository's process already has — a pull request a person merges.
schema_version: 1

runtime:
  adapter: docker
  image: python:3.13-slim
  sandbox_timeout: 2700      # strictly outside agent_timeout, refused otherwise
  agent_timeout: 2200        # hard cap per agent attempt, seconds
  network: host              # this host's egress runs through a local proxy

store:
  adapter: postgres
  dsn_env: TORVE_PG_DSN      # the name of the variable, never the DSN itself
  lease_for: 60
  max_run_duration: 7200

unmeasured_images: allow     # the images are torve's, measured over torve's own work

poison_ceiling: 3

reap:
  stale_after: 600

# Nothing reaches this repository's `main` except through a merged pull
# request (S-0080/D-1): the lane pushes the candidate, opens the task's pull
# request and stops. Merging is a person's act on the forge, and the engine
# reads what the person did on a later pass. `main` is pushed, so no `base`
# override: worktrees are cut from `origin/main` after a fetch.
promotion:
  landing: pull_request
  # A served pass lands finished candidates itself (S-0052/D-2); off, a night
  # would run its first phase and then wait on a person for the second. The
  # quiet window is the criterion that arms it: a tip younger than thirty
  # seconds waits for the next pass, which is the pass after the attempt's
  # own commit. Nothing here merges a pull request; that stays a person's act.
  auto_merge: true
  quiet_window: 30
  # One pull request per document (S-0083/D-1): every phase of a document lands
  # onto the document's own branch, `torve/S-NNNN`, by the local lane; the pull
  # request opens at the first landing and is refreshed at each; a person merges
  # once. A task's worktree is cut from that branch's tip, so the next phase never
  # waits on a merge. `task` would open one pull request per task.
  unit: document

scm:
  repo: morzecrew/bloomery
  open_pr: true              # the forge leg pushes and opens; credentials are `gh`'s on the host

tiers:
  planner: {harness: fake}
  executor:
    harness: claude-subscription
    profile: claude-equipped
    model: claude-opus-5
    provider: anthropic
  # The review tier, as close to shadow as the configuration allows: it runs
  # on every gate-green attempt and records its findings; only a `blocker`
  # stops a promotion (`blocks_at` below), a grade the reviewer has not once
  # used on torve's own work. Data for the arms, not a gate — yet.
  reviewer:
    harness: claude-subscription
    profile: review
    model: claude-opus-5
    provider: anthropic

broker:
  adapter: local
  mode: endpoint
  cost_tolerance: 0.25

providers:
  default: [anthropic]
  repositories: {}
  never_send: []

review:
  "on": [task_gated]         # judge every attempt whose gates went green (quoted: YAML reads a bare on as a boolean)
  blocks_at: blocker         # a `major` is recorded and promotes; only a blocker stops

# The review-thread leg (S-0084, S-0086): a served pass answers what landed and
# turns a reviewer's unresolved threads — and, with `record`, the tier's own
# non-blocking findings on the branch — into one revision round on the
# document's branch, landed by the lane like any phase. Never merges, never
# resolves a person's thread. Off by default; on here because the six findings
# the tier recorded on S-0009 reached #155 for a person to sweep by hand.
threads:
  enabled: true
  bots: [coderabbitai, codeant-ai]
  rounds_per_pass: 1
  sources: [forge, record]

# The runner signs the commits it writes — the candidate at `ready`, the
# landing, the checkpoints — with the host's SSH key (S-0010/signing). The key
# never enters a sandbox; the signature attests that torve produced the commit
# under its task. Without it every engine commit is unsigned and this
# repository's `required_signatures` rule holds every document pull request
# for a person with admin rights.
vcs:
  signing_key: /home/misery7100/.ssh/id_github.pub
