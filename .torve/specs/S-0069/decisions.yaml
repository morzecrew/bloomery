# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) The delta is stated in spec
      vocabulary, never as a text diff of emitted SQL. A reader who has to decide
      which textual differences are semantic is doing the compiler's job.
  - id: D-2
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) Superseded versions are related,
      never overwritten. History that replaces cannot answer the question the feature
      exists for.
  - id: D-3
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) The compiler never attributes
      a change to data. "No definition change" is the complete and correct answer
      when the definition did not change.
  - id: D-4
    grade: LOCKED
    text: >-
      Attribution runs over the dependency closure, not the named node. The single-node
      answer is the one `git log` already gives badly.
    paths:
      - src/bloomery/resolve/timeline.py
      - tests/unit/test_resolve/test_timeline.py
  - id: D-5
    grade: ASSUMED
    text: >-
      The version graph is derived per invocation and not persisted. Statelessness
      is worth more than the compile it saves until a measurement says otherwise.
  - id: D-6
    grade: OPEN
    text: >-
      **Superseded by 8.** Whether an unattributable spec field is a `check` refusal
      or a warning (§9).
  - id: D-7
    grade: ASSUMED
    text: >-
      The delta sits beside `ChangeClass` rather than replacing it. A gate reads a
      class and a person reads a description, and collapsing the two costs whichever
      reader was not being served.
  - id: D-8
    grade: ASSUMED
    text: >-
      **Neither — a test, plus a loud invariant; supersedes 6.** A `check` refusal
      would reject an author's specs for a gap in a table that ships with the compiler,
      and there is no warnings channel to put it in (S-0004 is unstarted). `test_every_field_of_every_comparable_record_has_a_facet`
      enumerates every field of every record the comparison can reach and requires
      a facet or an explicit identity exclusion for each, so a spec field added later
      turns red in CI — which is the mechanical failure §10's third question asks
      for. In production the same gap raises `InvariantViolated` rather than reporting
      a wrong answer. See `logs/T-0045.md`.
  - id: D-9
    grade: ASSUMED
    text: >-
      **The `supersedes` edge is S-0074's `TimelineChange`, and `ir/nodes.py` gains
      no edge kind.** §5.1 and §3 designed a new edge before that walk existed; it
      now relates two versions of one node, carries the delta, and is derived per
      invocation exactly as §5.2 requires. Two records of one relation would be two
      places to be wrong, and the lineage graph is built from one project at one instant,
      so a cross-version edge in it has no version to belong to. D2 is satisfied by
      it: the earlier version is related to the later and neither is overwritten.
      See `logs/T-0045.md`.
  - id: D-10
    grade: ASSUMED
    text: >-
      **The facets decide what a change *is*: one is emitted iff at least one facet
      differs, and `name`, `ref` and `id` belong to no facet.** §6's first test is
      that a pure rename attributes nothing, and it cannot be had any other way —
      a rename either moves no facet or is not a change. Identity is S-0067's business
      and is excluded once rather than blanked per kind, so the rule has one statement.
      See `logs/T-0045.md`.
  - id: D-11
    grade: ASSUMED
    text: >-
      **Ten facet members, keyed by `(record type, field)`, with no fall-through.**
      §5.1's six are metric-shaped and the comparison spans seven node kinds and ten
      record types; `QUALITY`, `STORAGE`, `RUNTIME` and `METADATA` are what the rest
      need. Keyed by the pair because one field name means two things across kinds
      — `kind` on an `ExposureIR` is what a consumer *is*, and on a `StepIR` what
      executes it. An unmapped field raises: a field silently classified as metadata
      is exactly the failure §9 names. See `logs/T-0045.md`.
  - id: D-12
    grade: ASSUMED
    text: >-
      **The additivity facet ships with the rest rather than waiting for P3.** §12
      deferred it to P3 "stated in S-0005's provenance vocabulary", and under row
      10 that would have made `agg: sum → avg` move no facet and therefore not be
      a change at all — §9's first risk, produced by the phasing. P3's deliverable
      is the *wording*, which §5.4 already presumes a facet to reword. See `logs/T-0045.md`.
  - id: D-13
    grade: ASSUMED
    text: >-
      **§5.3's `explain <node> --changed-between A B` is struck.** `explain` is S-0071's
      command — its subject is a metric *request*, not a graph node — and the timeline's
      own command is S-0074/phasing (P-3)'s. `--changed-between` is refused by S-0073/D-2
      in any case: it obliges bloomery to resolve an instant to a version, which is
      the caller's. Recorded rather than dropped, because a phase list with a command
      surface silently missing reads as a phase fully delivered. See `logs/T-0045.md`.
