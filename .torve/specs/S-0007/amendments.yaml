    title: D-9 gives R021 its surface; phase 4 builds it
    md: |-
      T-0173's first attempt halted with the finding this row answers: none of the
      three surfaces phase 4 gave R021 exists in the tree — a mart has no `filter:`,
      a metric filter compares a dimension to literals only, and a mart assertion
      carries no predicate — so admitting an author-written two-column predicate
