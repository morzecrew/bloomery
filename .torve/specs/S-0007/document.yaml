id: S-0007
title: Dimension algebra
kind: design
status: draft
implementation: none
depends_on: []
informed_by: [S-0001]
supersedes: []
superseded_by: null
owner: author role
schema_version: 4
summary: |
  Dimensions in bloomery have no algebra, and this document gives them three declared
  relations — one column determines another, a column plays a named role of a dimension,
  and two columns are the same dimension — each with the rule or surface that reads it.

  Measures already have an algebra: a closed vocabulary of aggregation kinds, rules about
  which composes over which, and a refusal when a project claims one that is not true.
  Dimensions have none. They are column names that appear in a rollup's `keep:`, in a
  flatten step's `prefix:` and in a filter, and nothing in the compiler says that two of
  them are related. This is deliberately a vocabulary rather than a feature: the rules that
  would consume these facts are named with each relation and mostly not designed here, and
  no rule lands ahead of the fact it reads. It is the dimension-side counterpart of the
  measure additivity algebra, and it is larger for the reason dimensions are: they relate
  to each other and values do not.
motivation: |
  **Hierarchy is refused at the query surface and unrepresentable at the spec surface.**
  `UnsupportedHierarchy` refuses `$descendant_of` and `$ancestor_of` and tells the author
  to model hierarchy as flattened level columns on the mart. They do — and the resulting
  `city`, `state` and `country` columns carry no declared relation, so the advice produces
  exactly the shape nothing can reason about.

  **A rollup's `keep:` is a set of names with no meaning attached.** `RollupMart.keep` is
  the parent's columns a rollup groups by, and R013 asks one question about the *measure*
  over the dropped columns. A rollup keeping `state` while dropping `city` is a
  **coarsening** — its groups are unions of the parent's. A rollup keeping `sku` while
  dropping `city` is a different question entirely. The two are indistinguishable to every
  rule in the registry.

  **A prefix is a naming device, not a role.** `ViaStep.prefix` is mandatory and
  disambiguates columns, so a mart with a billing address and a shipping address gets
  `billing_region` and `shipping_region`. Nothing says both are `region`. `DateRoleStep` is
  the one place a *role* is declared, and it is date-only: `{date: order_date, role:
  ordered}` expanding to `ordered_day` … `ordered_year`. Dates got the concept; every other
  dimension got a string prefix.

  **Multi-project composition makes this worse, and soon.** A platform project exporting
  `customer` and a domain project joining to it will each carry a `region`, and the composed
  graph will have two. The export list is a set of names; nothing says a name means the same
  thing on both sides. A dimension algebra is what a conformed dimension would be declared
  in, and the first conformed-dimension bug will be a cross-project one — the worst place to
  meet it.
current_state: |
  **Nothing in this document has landed.** No phase of it has been executed: `determines:`,
  `role_of:` and `same_as:` appear nowhere under `src/bloomery/`, and R020 and R021 are
  names with statements and no code. `RULES` holds seventeen rules and the next free
  identifier is R018. The only task log that names this design is the one that authored it
  alongside two sibling documents; it carries no divergence entries, because that work
  authored specs and executed none.

  What exists, verified against the tree:

  | What exists | Where | What it does not say |
  |---|---|---|
  | `DimensionRef(dimension, role)`, whose `qualified` gives `ordered_date` | `src/bloomery/ir/nodes.py` | anything relating two dimensions |
  | `DateRoleStep{date, role}` | `src/bloomery/spec/marts.py` | that a non-date dimension can play a role |
  | `ViaStep.prefix`, mandatory | `src/bloomery/spec/marts.py` | that two prefixes of one relationship are two roles of one dimension |
  | `RollupMart.keep`, at least one and each named once | `src/bloomery/spec/marts.py` | whether the kept set is a coarsening of the parent's |
  | R013 — a mart's measure is re-aggregable over the dimensions a rollup of it drops | `src/bloomery/semantic/proof.py` | anything about the dropped dimensions' own structure |
  | `UnsupportedHierarchy`, with its remediation | `src/bloomery/errors.py` | how a flattened hierarchy's levels relate once flattened |

  **The measure side, for contrast.** R008 and R011 through R017 reason about measures,
  aggregation kinds and time frames; R001 through R007 compose functional dependencies
  **between entities**, and `src/bloomery/semantic/closure.py` keys them on the determined
  reference's entity, so a determination *between two columns of one entity* has no home in
  them. Read the seventeen summaries and a dimension is the object of two — R013's dropped
  columns, R015's own dimension — and the subject of none. The asymmetry is not a decision
  anybody recorded; it is what happens when the pressure to reason about measures arrives
  first.

  **A determination relation already exists one level up and is not reusable here.** R005
  and R006 compose functional dependencies between *entities* and their keys. `city → state`
  is the same mathematics between two *columns of one entity*, and the existing machinery is
  keyed on entity grain rather than on columns, so the shape does not carry over without a
  new fact.
goals: |
  - An author can declare that one dimension column determines another.
  - An author can declare that a column plays a named role of a dimension, for any dimension
    and not only a date.
  - An author can declare that two columns are the same dimension.
  - Each fact has at least one named consequence — a refusal that becomes possible, or a
    proof that becomes constructible. A fact with no consumer is not added.
  - Existing projects compile unchanged. Every relation here is optional and additive.
non_goals: |
  - **Dimension tables as first-class relations.** A conformed dimension materialized once
    and referenced everywhere is a build-shape change; this is about facts, not about what
    is emitted.
  - **Slowly-changing dimension storage.** That design owns it and it is orthogonal: a
    versioned dimension still has levels and roles.
  - **Reviving `$descendant_of`.** A declared hierarchy does not make a recursive filter
    portable, which is why the query vocabulary refused it. The refusal stands and gains a
    better remediation, not an exemption.
  - **Inferring any of it.** Not from names, not from cardinality, not from the data.
  - **Solving the distinct-count corpus case.** A distinct count is not additive over a
    coarsening either — a customer who buys in two cities is one customer and two city-level
    counts. Determination gives disjointness of *groups*, which is not what a distinct count
    needs. Saying so here stops a plausible-sounding claim from being made later.
design:
  - key: determination
    md: |
      ```yaml
      entities:
        order:
          fields:
            city:    {type: string, determines: [state]}
            state:   {type: string, determines: [country]}
            country: {type: string}
      ```

      One column determines another when each value of the first corresponds to exactly one
      value of the second. It is declared on the **determinant**, transitively closed by the
      compiler, and refused on a cycle.

      It is a claim about the data that bloomery cannot check and does not try to — the same
      posture as a declared `many_to_one`, which R002 already reads and which is the closest
      existing relation and the one this is modelled on. A wrong `determines:` produces a
      wrong rollup with full compiler blessing, which the risks say plainly.
  - key: roles-for-any-dimension
    md: |
      ```yaml
      flatten:
        - {via: billing_address,  prefix: billing,  role_of: address}
        - {via: shipping_address, prefix: shipping, role_of: address}
      ```

      `role_of:` names the dimension a prefixed column family is a role of. `DateRoleStep`
      becomes the special case it always was — a date's roles expand to buckets, which is a
      date-specific elaboration of a general idea — rather than the only case.

      The prefix stays and stays mandatory: it is what keeps the emitted columns distinct,
      and the marts design already refused an empty one. `role_of:` adds what the prefix
      never carried, which is what the two prefixes have in common.
  - key: conformance
    md: |
      ```yaml
      marts:
        orders:
          flatten:
            - {via: customer, prefix: customer, role_of: party}
        tickets:
          flatten:
            - {via: reporter, prefix: reporter, role_of: party, same_as: orders.customer}
      ```

      Two roles are the same dimension when they draw from the same value set. Within a
      project this is mostly derivable — two roles of one `role_of:` are conformed by
      construction — so `same_as:` exists for the case that is not: two columns reaching the
      same dimension by different relationships, and, once multi-project composition lands,
      a local dimension conformed with an imported one.

      **This is the relation most likely to be cut.** The phasing puts it last precisely
      because the in-project case is derivable and the cross-project case has no consumer
      until composition reaches its emitted-reference phase.
  - key: what-each-fact-buys
    md: |
      A fact with no consumer is not added, so each relation is listed with the rule that
      would read it. **Every rule below is named, not designed** — that is what makes this a
      vocabulary document and what the phasing is built around.

      | Fact | Consumer | What becomes possible |
      |---|---|---|
      | `determines:` | **R020** — a rollup that keeps a determinant of every dropped dimension is a coarsening | The `state`/`city` rollup gets a proof the `sku`/`city` one does not. Today R013 grades both on the measure alone. |
      | `determines:` | the spec differ's impact report | Changing `city` reaches the `state` rollup built over it. Today they are unrelated nodes and the report says nobody. |
      | `determines:` | `UnsupportedHierarchy`'s remediation | The refusal can name the declared levels instead of telling an author to flatten and then saying nothing about the result. |
      | `role_of:` | **R021** — two roles of one dimension are comparable | A filter, a join predicate or an assertion across `billing_region` and `shipping_region` has a warrant. Today it is two strings. |
      | `role_of:` | the emitters | A role-playing non-date dimension can emit one shared dimension in Cube and MetricFlow rather than two unrelated column families. |
      | `same_as:` | multi-project composition | A downstream project's `region` conformed with the platform's. Nothing else needs it, which is why it is last. |
tests: |
  - **Unit:** `determines:` parses, closes transitively, refuses a cycle, and refuses naming
    a field the entity does not declare. `role_of:` and `same_as:` parse and refuse dangling
    names. These land in `tests/unit/test_spec/test_entity.py`,
    `tests/unit/test_spec/test_catalog.py`, `tests/unit/test_spec/test_marts.py` and
    `tests/unit/test_marts/test_flatten.py`.
  - **Semantic:** R020 proves a coarsening and refutes a rollup that keeps no determinant of
    a dropped dimension; R021 proves two roles comparable and refutes two unrelated columns.
    `tests/unit/test_semantic/test_proof.py` and `tests/unit/test_semantic/test_rollup.py`.
  - **Corpus:** no existing case converts. A new case is needed — *a rollup that keeps
    `state` and drops `city` alongside one that keeps `sku`* — and it belongs in the semantic
    bug corpus before it belongs here.
  - **Golden:** a role-playing non-date dimension in the Cube and MetricFlow artifacts,
    because the emitter row of the consumer table is the only consequence visible in output.
    `tests/golden/test_cube.py` and `tests/golden/test_metricflow_manifest.py`.
  - **Not tested:** that a declared `determines:` is true. It cannot be; it has the same
    standing as a declared `many_to_one`, and the risks say so where a reader meets it.
docs: |
  - A concepts page on dimensions as such. There is currently none — dimensions are
    described where marts, rollups and role-playing dates are described, which is three
    partial accounts.
  - `UnsupportedHierarchy`'s remediation is rewritten once there is something better to say
    than "flatten it".
  - The rollup how-to gains the coarsening distinction, which is the consequence an author
    will actually feel.
out_of_scope: |
  - **A `dimension:` document kind.** Tempting and larger: dimensions declared once,
    centrally, the way metrics are. This design attaches facts to columns where they already
    live. A central document is the escape hatch if per-column declarations prove unwieldy —
    named and not built.
  - **Ragged and skip-level hierarchies.** A geography where some countries have no state is
    a real modelling problem and `determines:` states nothing about totality. Deliberately
    excluded rather than half-handled.
  - **Aggregate navigation.** Answering a `state`-grain query from a `city`-grain mart by
    aggregating on the fly is the classic payoff of a hierarchy, and a planner change rather
    than a vocabulary one.
  - **Dimension-level security.** The grants design is per relation; per level is a
    different design.
risks: |
  - **A wrong `determines:` is invisible and consequential.** It produces a rollup proof
    that does not hold, which is a wrong number with a proof attached — worse than no proof.
    It has exactly the standing of a declared `many_to_one`, which is the precedent that
    makes it acceptable and also the precedent for how loudly the docs must say it.
  - **Three relations is a lot of vocabulary for facts with few consumers today.** Two of
    the six consumers named are future rules and one is a future design. The mitigation is
    the phasing order and the honest admission that `same_as:` may never be needed, which
    D-8 records as open.
  - **It reads as OLAP nostalgia.** Hierarchies and conformed dimensions are Kimball
    vocabulary, and a reviewer may read the whole document as importing a modelling
    tradition rather than solving a problem. The four pointers into the tree in the
    motivation are the answer, and the document has to lead with them rather than with the
    vocabulary.
  - **The large-and-unscheduled combination rots.** A vocabulary nobody executes goes stale
    while looking authoritative. The source document's status line says not scheduled and
    should keep saying so until a consumer is scheduled first; this document stays a draft
    for the same reason.
sections:
  - key: provenance
    md: |
      This document is a backfill of `rfcs/0076-dimension-algebra.md`, carried across into
      the specification corpus without redesign. That document's status line reads
      **Draft — not scheduled**, and its index row in `rfcs/INDEX.md` says the same. Its
      eight decision rows are carried here one for one with the grades its own table gives
      them: rows 1 to 3 `LOCKED`, rows 4 and 5 `ASSUMED`, rows 6 to 8 `OPEN`. Only `paths`
      and `consequence` are new, and both are read from the working tree rather than
      invented; nothing has been re-graded and no row has been added.

      **No phase of it has landed, so nothing is dropped from the phasing.** Its three
      phases — the determination relation with R020, the general role with R021, and
      conformance — are all carried as mintable units. `git log` over the paths those phases
      name shows the last landings there belonging to other designs: the ratio-over-one-row-set
      work and the declared-source-timezone work, neither of which touches this vocabulary.

      The source document names four related designs the corpus does not yet hold: the
      measure additivity algebra, the marts and role-playing dates design, the rollup marts
      design and the query vocabulary, all four retired on landing and readable at the
      commits `rfcs/RETIRED.md` names. Multi-project composition and the semantic bug corpus
      are named for sequencing. None of them is cited as an identifier here, because none of
      them is in this corpus; where the argument needs one it is named in prose instead.
alternatives:
  - option: >-
      Declare hierarchy as an ordered list on the mart — `levels: [country, state,
      city]`.
    rejected_because: >-
      A hierarchy is a property of the *entity's* columns, not of a mart that happens
      to carry them, so the same fact would be restated on every mart and the restatements
      would disagree. A list also cannot express a column determining two others independently:
      a `postcode` determining both `state` and `delivery_zone` is a lattice, and
      a list is exactly the shape that makes a lattice unrepresentable.
  - option: >-
      Infer determination from the data — one `GROUP BY` answers it exactly.
    rejected_because: >-
      An inference is indistinguishable from a declaration once written down, and
      this one would be inferred from *one* load of a source that happens not to have
      a counterexample yet. Refused by D-1, and by the compiler's standing refusal
      to read data at compile time.
  - option: >-
      Reuse the entity relationship vocabulary — model `city` and `state` as entities
      with a declared `many_to_one` and let R002 do the work.
    rejected_because: >-
      Genuinely tempting, because the mathematics is identical and the rules exist.
      It forces a dimension to be an entity with a grain, a key and a mapping, which
      is a large modelling tax for a fact about two columns, and it would make every
      hierarchy level a node in the lineage graph: a project with a five-level geography
      would gain five entities nobody builds. Refused by D-3.
  - option: >-
      Do nothing, and let `keep:` mean whatever it means.
    rejected_because: >-
      Defensible — no wrong number is currently attributed to this gap, unlike the
      two sibling designs it was written beside. What argues against it is composition:
      two projects' dimensions are composed by name alone, so the first conformed-dimension
      bug will be a cross-project one.
questions:
  - id: Q-1
    text: >-
      Whether `determines:` belongs on the entity model or on the catalog's canonical
      field. A canonical field is shared across mappings and a determination is a
      property of the values rather than of a feed, which argues for the catalog;
      the entity model is where fields are otherwise described.
  - id: Q-2
    text: >-
      Whether R020 should require a determinant of every dropped dimension, or merely
      prove more when one is present. Requiring it refuses today's legal rollups;
      proving more leaves the `sku`/`city` rollup exactly where it is, which may be
      the honest answer.
  - id: Q-3
    text: >-
      Whether two roles of one dimension are conformed by construction or need `same_as:`
      anyway. The conformance section assumes the former, which is what makes `same_as:`
      small; if it is wrong, `same_as:` becomes the primary relation and the phasing
      order inverts.
  - id: Q-4
    text: >-
      What a date is under this vocabulary. `DateRoleStep` already does roles and
      the date dimension already has levels — `day`, `month` and `year` are a declared
      hierarchy in all but name. Whether the general vocabulary absorbs it or sits
      beside it is a real choice, and absorbing it touches every existing project.
