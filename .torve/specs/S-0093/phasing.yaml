# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: >-
      A number SQLGlot cannot convert is refused at its door
    intent: >-
      The classes D-1 names, defined once in `spec/common.py` and caught at the five
      handlers; a Fixed entry in the changelog naming #281. Tests: a Tier 2 body `x->1e5`
      and a `sql_macro` body `x->>8e` are refused naming the step; an authored `expr:
      x->1e5` is refused at load with the "not parseable SQL" message; `_within_sql_depth`
      passes it on. Settles D-1.
    scope:
      - src/bloomery/spec/common.py
      - src/bloomery/resolve/steps.py
      - src/bloomery/resolve/build.py
      - tests/unit/test_spec/test_sql_text.py
      - tests/unit/test_spec/test_common.py
      - tests/unit/test_spec/test_steps.py
      - tests/unit/test_resolve/test_build.py
      - tests/unit/test_steps/**
      - CHANGELOG.md
    acceptance:
      - >-
        uv run pytest tests/unit/test_spec tests/unit/test_steps tests/unit/test_resolve/test_build.py
        -q
      - uv run mypy src
    character: routine
  - phase: 2
    title: The fuzz lane replays the finding
    intent: >-
      The #281 input written to `fuzz/fuzz_parse_doors_seed_corpus/json-arrow-exponent`
      from the base64 D-2 gives, and a line in the target's docstring naming it beside
      the `band-*` seeds, with the `just fuzz-repro` command that replays it. Settles
      D-2.
    scope: [fuzz/fuzz_parse_doors.py, fuzz/fuzz_parse_doors_seed_corpus/**]
    acceptance:
      - >-
        uv run --with 'atheris>=2.3' python fuzz/fuzz_parse_doors.py fuzz/fuzz_parse_doors_seed_corpus/json-arrow-exponent
    depends_on:
      - 1
    character: routine
