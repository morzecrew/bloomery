# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: >-
      A metric's own filter is composed, scoped to its measures
    intent: >-
      `_projected` and `_composable` admit a metric's own filter; the composed plan
      carries scoped `Filter` nodes; the two refusal tests become admissions; an engine-tier
      composed test with a filtered metric; the parity generator gains a filtered
      cross-mart shape and the baseline its conversion. Amends S-0055/D-8. Settles
      D-1 and D-2.
    scope:
      - src/bloomery/planner/**
      - tests/unit/test_planner/**
      - tests/engines/test_branch_join_engines.py
    acceptance:
      - uv run pytest tests/unit/test_planner -q
    character: structural
  - phase: 2
    title: The composed refusal names the filter
    intent: >-
      A request filter or row policy missing from a branch is refused naming the filter
      and the branches. Settles D-3.
    scope:
      - src/bloomery/planner/coverage.py
      - tests/unit/test_planner/test_coverage.py
    acceptance:
      - >-
        uv run pytest tests/unit/test_planner/test_coverage.py -q
    depends_on:
      - 1
    character: structural
  - phase: 3
    title: The docs say what crosses branches
    intent: >-
      `concepts/wide-marts.md` and the planner how-to describe composed filters and
      what still refuses.
    scope: [pages/docs/concepts/wide-marts.md, pages/docs/how-to/**]
    acceptance:
      - >-
        uv run pytest tests/unit/test_docs_floor.py tests/unit/test_docs_snippets.py
        -q
    depends_on:
      - 1
    character: routine
