      unnecessary — there is no staged bronze extract to read the evaluated population
      from, and no `_quality_flags` column to read a recorded verdict out of, since
      the manifest's `produces` is the entity's whole column set. One leg over the
      relation itself is the honest whole of what can be checked, and it covers the
      population that matters: the rows the step actually produced. The rules land
      on the **synthesized entity's** existing `EntityIR.quality` rather than on a
      new `StepOutputIR` field, which is why no fingerprint moves for a project that
      declares none — a new IR field would have moved every fingerprint in the corpus,
      the encoder covering field names and count rather than values (S-0020). The
      audit is named `step_<output>_<rule>` under the same `step_` namespace D43 established,
      attached to the output's own model so SQLMesh actually runs it (D42), and reads
