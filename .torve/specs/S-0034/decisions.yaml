      which is D43's argument about references applied to the same temptation. Nothing
      about metric resolution changed: the link draws the ordinary `canonical` edge
      and reachability follows. `reconcile` needed a second, unrelated repair — it
      resolved sides against *declared and mapped* entities, and a step output is
      neither, so a check naming one was refused as "declared but no mapping targets
