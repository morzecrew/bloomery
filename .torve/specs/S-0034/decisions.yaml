    text: >-
      *(2026-08-08, M13 re-audit)* **The consistency audit was emitted and never ran,
      and the wrapper never loaded at all.** Two defects in one blind spot, both invisible
      to every test written for them. (a) SQLMesh loads a bare `AUDIT` as a **model**
      audit, executed only where a model's `audits` list names it — and nothing named
      it, so D40's blocking check was inert. The test that "proved" it extracted the
      SELECT and ran it straight against DuckDB, so SQLMesh was never in the loop.
      (b) Loading the project properly then showed the `python_model` wrapper does
      not load *at all*: SQLMesh serializes the module globals a model function references
      into a fresh environment, and a global holding a `Decimal` parameter fails to
      reconstruct there — `name 'Decimal' is not defined`, before anything runs. The
      wrapper had only ever been `ast.parse`d. Audits are now attached to the child
      output's model, and the wrapper binds every name inside its function so there
      is nothing to serialize. The lesson is the general one: a generated artifact
      is only verified by the tool that will consume it, and parsing it yourself proves
      the grammar, not the contract.
