# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      Four-tier ladder — DSL transform → `sql_macro` (parsed + typechecked, spliced
      into the SELECT, lineage-transparent) → `sql_model` (parsed, schema inferred)
      → `python_model` (trust + verify) — with the rule: **lowest tier that works**.
      Tier 3's costs (data leaves the engine, memory-bound, coarse lineage) are named,
      not hidden.
    paths: [src/bloomery/ir/nodes.py]
  - id: D-2
    grade: ASSUMED
    text: >-
      `StepManifest` per §5.2: `ref`, `version`, `kind`, `determinism`, `runtime_lock`,
      typed `inputs`/`outputs` with grain + `key` (the grain's uniqueness columns)
      + `produces`, bounded `parameters`, `lineage: coarse|column`. Step bodies live
      in the platform repo — never in bloomery, never in tenant specs; tenant specs
      wire `use: ref@version` + bindings + parameters + optional S-0033 quality rules
      on outputs.
    paths: [src/bloomery/spec/steps.py]
  - id: D-3
    grade: ASSUMED
    text: >-
      `StepRegistry` is a frozen compile **input** (steps mapping + macro bodies),
      assembled by the caller; `compile_project(..., steps: StepRegistry = EMPTY_REGISTRY)`.
      Unknown ref or version → `UnknownStep` naming available versions. **No dynamic
      loading path exists** — tenant specs can never become an arbitrary-code-execution
      surface.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/spec/steps.py
      - src/bloomery/steps/registry.py
      - tests/unit/test_schema.py
  - id: D-4
    grade: ASSUMED
    text: >-
      Trust-then-verify: compile time trusts `produces` (DAG complete, downstream
      typechecked, `plan()` computes backfills across the step); the generated wrapper
      carries a non-optional, non-configurable `assert_step_contract` (outputs present,
      none undeclared, exact column set, assignable types, required-null check, grain
      uniqueness over the output's declared `key`). A claim that is checked is a commitment;
      a claim that isn't is a comment. New errors: `UnknownStep`, `StepDeterminismError`
      (compile), `StepContractViolation` (runtime, raised by generated code).
    paths: [src/bloomery/steps/contract.py]
  - id: D-5
    grade: ASSUMED
    text: >-
      Determinism tiers: `pure` (freely backfillable) | `seeded` (seed required in
      the spec, recorded) | `nondeterministic` (**compile error**). Restatement is
      the organizing capability of the architecture; refusing nondeterminism is the
      load-bearing constraint, not conservatism.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/ir/nodes.py
      - tests/support/identity.py
      - tests/unit/test_steps/test_identity_demo.py
  - id: D-6
    grade: ASSUMED
    text: >-
      `runtime_lock` is part of step identity: a dependency bump changes the step
      fingerprint and classifies `RESTATING`, triggering backfill (S-0024 amendment).
      Invisible — and wrong — without the lock.
    paths: [src/bloomery/plan/diff.py, tests/unit/test_plan/test_step_changes.py]
  - id: D-7
    grade: ASSUMED
    text: >-
      Multi-tenant rule: **parameterize, never fork.** Tenants configure parameters,
      never supply bodies; a requirement that cannot generalize is bespoke consulting,
      not product. The compounding loop (tenant 1's need → parameterized step → tenant
      2 reuses) grows the library and shrinks the bespoke surface.
  - id: D-8
    grade: ASSUMED
    text: >-
      Emission: `sql_macro` splices into the entity SELECT (one query); `sql_model`
      emits an ordinary model artifact from the registry body; `python_model` emits
      a generated SQLMesh Python-model `.py` artifact (S-0025/D-2 file-shaped) wrapping
      the impl + contract assertion. Step outputs are DAG entities with manifest grain;
      two steps writing one output is a compile error (settles Document 5 §11.5).
    paths:
      - src/bloomery/emit/steps.py
      - src/bloomery/resolve/steps.py
      - tests/unit/test_steps/test_emission.py
      - tests/unit/test_steps/test_lowering.py
  - id: D-9
    grade: ASSUMED
    text: >-
      Testing: the §8.7 adversarial fake-step battery (every liar fails loudly); nondeterminism
      caught behaviorally by the backfill-equivalence gate (static analysis out of
      scope, stated); step golden fixtures live in the platform repo under the version-bump-requires-new-fixtures
      review rule — the registry owner's obligation, documented as such.
  - id: D-10
    grade: ASSUMED
    text: >-
      Migration path (Document 5 §9): wrap with a manifest → into the DAG → push down
      the ladder → extract declared rules. Shipped as the how-to, not tooling.
  - id: D-11
    grade: ASSUMED
    text: >-
      Steps are IR and DAG citizens: `StepIR` nodes (ref, version, kind, determinism,
      `runtime_lock`, typed inputs/outputs) in a new `ProjectIR.steps` tuple (S-0020
      amendment) and first-class `step.<ref>` DAG nodes (S-0022 amendment). Fingerprint
      coverage is the whole mechanism: any manifest change — `runtime_lock` included
      — shifts `project_fingerprint`; `plan()` sees an ordinary structural IR diff
      (no special-casing); the S-0031 hydration cache self-invalidates via `HydrationKey.spec_fingerprint`,
      no new key component.
    paths:
      - src/bloomery/ir/nodes.py
      - src/bloomery/plan/diff.py
      - src/bloomery/resolve/graph.py
      - tests/unit/test_plan/test_step_changes.py
      - tests/unit/test_resolve/test_graph.py
  - id: D-12
    grade: ASSUMED
    text: >-
      pandas never joins bloomery's runtime dependencies: `bloomery/steps/contract.py`
      is emitted-code-facing and imports pandas lazily inside the generated wrapper's
      runtime path only; callers executing `python_model` steps install the `bloomery[steps]`
      extra (pandas and nothing else); compile-time use of the registry needs no pandas.
  - id: D-13
    grade: ASSUMED
    text: >-
      Implementation binding: `StepRegistry` gains `sql_bodies: Mapping[tuple[str,
      int], str]` (`sql_model` bodies, parsed at compile like `macro_bodies`); `StepManifest`
      gains `entrypoint: str` (`"package.module:function"`) for `python_model`, and
      the generated wrapper imports it at **run time**. The no-dynamic-loading rule
      is scoped to compile time — bloomery never imports or executes step code while
      compiling (manifests and SQL text only); runtime import of platform-owned code
      by the generated model is the normal SQLMesh execution path, and registry build
      (caller-side) verifies the entrypoint resolves.
    paths:
      - src/bloomery/spec/mapping.py
      - src/bloomery/steps/manifest.py
      - tests/e2e/test_sqlmesh_replan.py
      - tests/golden/schema/mapping.json
  - id: D-14
    grade: ASSUMED
    text: >-
      `StepRegistry` snapshots its mappings into an immutable, canonically sorted
      internal form at construction, **and** `StepManifest` plus every nested type
      is frozen — the shallow snapshot blocks dict-level mutation, frozen leaves block
      value-level mutation; byte-identical compilation follows from the two together
      (a snapshot over mutable manifests would not suffice).
  - id: D-15
    grade: ASSUMED
    text: >-
      `StepIR` additionally carries the resolved parameters (canonically sorted `(name,
      value)` pairs, `Decimal`-as-str per canon-bytes), the recorded seed for seeded
      steps, and the input/output wiring (sorted pairs) — all fingerprint-covered,
      so a parameter or seed change is a `RESTATING` diff exactly like a `runtime_lock`
      change.
    paths: [src/bloomery/ir/nodes.py]
  - id: D-16
    grade: ASSUMED
    text: >-
      Multi-output emission resolved — **supersedes the draft §10 entry and its execute-exactly-once
      constraint** (recorded honestly: that constraint is dropped, not satisfied):
      each declared output gets its own generated wrapper model, each executing the
      step and returning its own output; safe **for correctly declared steps** — nondeterministic
      steps are compile-refused and seeded steps re-execute with the same recorded
      seed (pure/seeded ⇒ identical results); residual risk recorded: a *misdeclared*
      step slips the compile check and, under N executions, can produce disagreeing
      sibling outputs within one run (behavioral gates catch run-to-run, not intra-run,
      divergence) — accepted for v1, with a cross-output consistency audit named as
      the demand-gated mitigation. `assert_step_contract` runs in every wrapper against
      **all** declared outputs, catching partial-output lies wherever the run starts.
      The N-executions-for-N-outputs cost is documented; a single-execution staging
      optimization is a demand-gated, named escape hatch — not built.
    paths:
      - src/bloomery/emit/steps.py
      - src/bloomery/resolve/steps.py
      - src/bloomery/steps/manifest.py
      - tests/execution/test_step_consistency.py
      - tests/golden/test_sqlmesh_duckdb.py
      - tests/unit/test_steps/test_emission.py
  - id: D-17
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13; scope only — D39 refuses all of them for now)* **Step-output
      quality rules are `expression` only.** §5.2's example shows one, and the other
      entity-level kind — `referential` — cannot be expressed here: it is identified
      by a `via` naming a relationship the entity model declares *between entities*,
      and a step output only becomes an entity as the step is lowered, so there is
      no relationship to name. It also carries no `name` for `applies_to` to key on.
      Widening this is an RFC amendment, not config (S-0033/D-5's closed-catalogue
      discipline).
  - id: D-18
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **Three refusals the RFC implies without spelling.** (a)
      An output `key` naming a column the step does not `produce` is refused at manifest
      parse: `assert_step_contract` groups by that key, so the assertion would have
      nothing to run on. (b) A `sql_macro` declaring more than one output, or an output
      of more than one column, is refused: §5.1 says Tier 1 splices into a SELECT
      *as an expression*, and an expression is one value — such a manifest is a Tier
      2 step wearing the wrong kind. (c) A seed on a `pure` step is refused: §5.5
      requires a seed for `seeded` and says nothing about the converse, but silently
      ignoring a seed leaves an author believing something is pinned that is not,
      which is the same failure the tiers exist to prevent.
  - id: D-19
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **A Tier 1/2 body is parsed at lowering, not at emit.**
      §5.8 says bodies are parsed at compile; doing it during lowering rather than
      during emission makes an unparseable body a compile error naming the step, instead
      of a broken artifact an engine discovers later. It is also what makes the splice
      possible at all — an expression must be an AST before it can be substituted
      into a SELECT. The canonicalized body is carried on `StepIR` rather than read
      from the registry at emit, because the import contract bars emitters from the
      spec and registry layers (S-0025): a body the emitter needs arrives through
      the IR or not at all.
  - id: D-20
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **`StepParameterIR` carries the declared type beside the
      value.** D15 says parameters are stringified `(name, value)` pairs so canon
      bytes never meet a float — correct for the *fingerprint*, and insufficient for
      *emission*: the generated wrapper has to call the step body with a real `Decimal`,
      `int` or `str`, and only the declared type says which. Inferring it from how
      the digits look would make `"0.9"` and `"09"` a guessing game. Found by reading
      an emitted wrapper, where `threshold` was being passed as the string `"0.9"`.
  - id: D-21
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **`render_type` is promoted to the type layer, one spelling
      for three consumers.** The step manifest a wrapper embeds records declared types
      as text, and `contract.py` looks them up in a table. Emitting `repr(logical_type)`
      — `StringType()` — matched nothing in that table, so every type check silently
      passed: a mandatory assertion degraded to a no-op with every test green. The
      spelling `plan()` already had privately is now `bloomery.typing.render_type`,
      and `plan/diff.py` delegates to it, so the two cannot drift again.
  - id: D-22
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **§9's "dependency-light by construction" was untrue as
      laid out, and is partly repaired.** Measured: `import bloomery.steps.contract`
      cost ~400 ms and 1011 modules, pulling in metricflow, jinja2, sqlglot, pydantic
      and yaml — because importing a submodule executes its parent packages' `__init__`
      first, and bloomery's top-level one imports the whole compile surface. A package-wide
      lazy `__getattr__` (PEP 562) fixed it completely — 6.5 ms, 55 modules, no heavy
      dependencies — and was **reverted**: `plan` and `resolve` are both public functions
      *and* submodule names, so once the submodule is imported the module attribute
      shadows the function and `from bloomery import plan` returns a module. Import-order-dependent
      silent breakage is worse than a slow import. Kept: the collision-free half,
      a lazy `bloomery.steps`. The remaining cost is §8's named escape hatch (extract
      `contract.py` into a micro-package), still not built; recorded here so the claim
      in §9 is not read as satisfied.
    paths: [src/bloomery/steps/__init__.py, tests/unit/test_steps/test_emission.py]
  - id: D-23
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **`contract.py` imports no pandas at all — stronger than
      D12.** D12 budgets for a lazy import inside the runtime path. In fact every
      check is expressible against the dataframe protocol the step already returned
      (`.columns`, `.dtype`, `.isna()`, `.duplicated()`), so the checker works on
      whatever frame it is handed and never names the library that made it. Consequence,
      recorded rather than papered over: the `bloomery[steps]` extra D12 specifies
      (pandas and nothing else) is **not added**, because nothing in bloomery would
      import it — a step body gets its dataframes from SQLMesh, which depends on pandas
      already. An extra installing a dependency nothing requires is cruft; if a caller
      ever executes a `python_model` outside SQLMesh, that is when the extra earns
      its place.
  - id: D-24
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **Steps diff by `ref`, not by `ref@version`.** Keyed by
      version, upgrading `resolve_customers@3` to `@4` would read as one step removed
      and a different one added — losing the backfill precisely where a version bump
      matters most. Keyed by ref it is one RESTATING change carrying `@3 → @4`, and
      the step's output relations enter `backfill_scope`. The `step.<ref>` DAG node
      is keyed the same way and for the same reason: a version bump must not move
      the node, or the lineage the node exists to preserve breaks on every upgrade.
      Removing a step is BREAKING and names the relations nothing produces afterwards.
  - id: D-25
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 self-audit)* **The generated wrapper is an escaping boundary,
      and it leaked.** Parameter values were interpolated into Python source by hand,
      so an authored `label: 'ACME" + __import__("os").getcwd() + "'` emitted a live
      expression that parsed and ran — D3's promise ("a spec can never become an arbitrary-code-execution
      surface") broken by the one component that writes executable text. Every literal
      is now built with `repr()` over canonically sorted structures: parameter values,
      parameter *names*, input names and bound relations alike. The old `json.dumps`-then-patch-`true`/`false`/`null`
      helper went with it — it edited string *contents*, so a column named `id, null`
      reached the wrapper as `id, None` and a **correct** step failed its own contract
      at run time, with the wrapper still parsing and every `ast`-based test green.
  - id: D-26
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 self-audit; `sql_macro` built by D50/D51)* **Refuse what is
      not built: `sql_macro` and step-output quality rules.** Tier 1 has no spec surface
      referencing a macro step, so a wired `sql_macro` bound an output and emitted
      nothing at all while the docs said its body was spliced into a SELECT. Quality
      rules on outputs parsed and were consumed by nothing — an author would write
      a rule, get no rule, and get no error, which is the worst possible failure for
      a feature whose job is catching bad data. Both are now named compile refusals.
      A Tier 2 step with no registry body is refused too: it previously emitted a
      `MODEL` with an empty `SELECT`, which is D19's own point turned inside out.
  - id: D-27
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 self-audit)* **A wrapper must declare its dependencies the
      way SQLMesh reads them.** The emitted model hardcoded `context.fetchdf("SELECT
      * FROM silver.customer_raw")`; SQLMesh infers a Python model's dependencies
      only from `context.table(...)`, so the step sat unordered in the DAG *and* the
      literal name resolved to the production view rather than the environment's snapshot
      — a dev backfill would silently read prod. Now `context.fetchdf(f"SELECT * FROM
      {context.table('…')}")`. This is §4's "backfillability preserved across steps"
      failing at the one place it is actually executed.
  - id: D-28
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 self-audit)* **Collisions are compared on the *emitted* relation,
      and entities count.** The duplicate check compared authored bindings, so `a.customer`
      and `b.customer` — different strings, one emitted model — both passed and produced
      two files at one path. A step output colliding with an **entity** of the same
      name was not checked at all. Both are refused now, and a step that failed another
      check still contributes its claims, because skipping it meant an author fixed
      a determinism error, re-ran, and only then learned two steps claim one relation:
      the second round-trip the batching exists to prevent.
  - id: D-29
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 self-audit)* **An unknown declared type is a contract violation,
      not a skip.** `_KIND_BY_TYPE` had no `decimal` entry and its absence did not
      fail — the lookup returned `None` and the check was skipped, so the RFC's own
      flagship column (`confidence: decimal(4,3)`) accepted a `datetime64` silently.
      Precisely the failure D21 records, one type short of it. `decimal` is added
      *and* an unrecognised base type now raises, so the next gap fails loudly instead
      of passing.
  - id: D-30
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 self-audit)* **Three smaller refusals and one correction.**
      (a) An input and a parameter sharing a name is refused at manifest parse: the
      wrapper calls `step(**inputs, **parameters)`, so it was a run-time `TypeError`
      decidable from the manifest alone; non-identifier names likewise. (b) Non-finite
      parameter values (`NaN`, `sNaN`) construct as `Decimal` and raise on *comparison*,
      so `InvalidOperation` escaped `compile_project` — a non-`BloomeryError` crossing
      the boundary, which S-0019 forbids. (c) Bound, binding and duplicate-relation
      failures raised `UnknownStep`, whose declared meaning is "the registry does
      not hold this `ref@version`"; they raise `StepError` now. (d) §5.2's own worked
      manifest writes `{type: decimal, default: 0.85}`, which the implementation rejected
      and the fixture corpus quietly worked around with `decimal(4,3)` — a bare `decimal`
      is now accepted for a *parameter*, which is a scalar knob rather than a stored
      column.
  - id: D-31
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 self-audit; narrowed by D52)* **Steps are refused on dbt and
      Cube rather than dropped, and the DAG edges were fiction.** `step_artifacts`
      is wired into the SQLMesh emitter only; the other two targets emitted no step
      artifacts and no error, silently withholding relations downstream models were
      typechecked against — now `UnsupportedByTarget` (S-0025/D-3: fail loud, never
      approximate). Separately, step edges hung off a synthetic `<entity>.*` node
      that no other producer or consumer ever creates, so the "upstream reaches it
      in topological order" claim was false and the node only detected self-loops.
      Input edges now come from every field of the named entity, output edges from
      the step's produced columns.
    paths: [tests/unit/test_steps/test_dbt_and_cube_emission.py]
  - id: D-32
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 re-audit)* **D25's injection fix was incomplete: the *output*
      binding was still raw.** D25 claimed every literal went through `repr()`; parameter
      values, parameter names and input names did, and the output relation did not
      — it was interpolated straight into `@model("…")`. An authored `outputs: {customer:
      'x", print(…))\n@model("y'}` produced a wrapper that **parsed**, carried a second
      decorator and executed at model import; the same binding injected a `DROP TABLE`
      into a `sql_model` artifact, and the artifact *path* carried a newline. Fixed
      with two independent locks, because one lock that is believed to hold is how
      this reached a second audit: `RELATION_PATTERN` constrains bound relations at
      the spec layer, and the emitter escapes the relation and the output name regardless.
      Manifest output names are constrained to identifiers for the same reason — they
      reach `return outputs[…]` and the wrapper docstring. The lesson recorded rather
      than the fix alone: a component that writes executable text has exactly one
      escaping boundary, and *every* value crossing it must go through the same function,
      not the ones the author of the fix happened to think of.
  - id: D-33
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 re-audit)* **The D31 graph rewrite silently removed cross-step
      cycle detection — a regression the fix wave introduced.** Drawing input edges
      from real entity fields fixed the synthetic-node problem D31 describes and broke
      the case that actually matters: a step reading *another step's output* found
      no entity, drew no edge, and two steps in a mutual loop compiled clean. Before
      the rewrite the (wrong) wildcard node caught it by accident. Steps now resolve
      producer-of-relation first, so a step→step dependency is a real edge and a loop
      is `CircularDerivation: step.s → step.t → step.s`. This is the second time on
      this project that a fix wave introduced a defect its own audit had to find;
      the re-audit is the practice that catches it, not the care taken while fixing.
  - id: D-34
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 re-audit)* **Parameter values are type-checked at lowering,
      and the input relation goes through the naming policy.** The emitter rebuilds
      a real `int`/`Decimal`/`date` from the IR's text, so an unparseable value surfaced
      as a bare `ValueError` out of `int()` — a non-`BloomeryError` crossing the compile
      boundary that D30(b) had just been written to prevent — or, for the temporal
      constructors, as an exception at model *import*. Manifest **defaults** took
      the same path. Separately, D27 routed the wrapper's read through `context.table(...)`
      but passed the *authored* binding, so under a scoping naming policy the wrapper
      wrote `acme_silver.customer` and read plain `silver.customer_raw`: two relations,
      one of which may not exist. Both are now checked and routed where the corresponding
      output already was.
  - id: D-35
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13 re-audit)* **Three smaller repairs, and a vacuous test replaced.**
      The dbt and Cube step guards were inserted *above* their `emit` docstrings,
      demoting each to a dead expression (`__doc__` was `None`). A body-parse failure
      dropped its relation claims — the same second-round-trip hole D28 closed elsewhere
      — and still raised `UnknownStep` for a step the registry *did* resolve. And
      `test_a_python_model_never_reaches_a_sql_harness` named `execution.materialize`
      in its docstring, never called it, and passed with the filter it existed to
      protect reverted; it now drives the real harness and asserts nothing was created.
      A test that names the thing it protects without exercising it is worse than
      no test, because it reads as coverage.
  - id: D-36
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13; narrowed by D41)* **Step outputs are entities, as §5.8 always
      said — now actually.** Outputs previously lived only inside `StepIR`, so §5.8's
      "downstream mappings, marts, and metrics reference them like any silver entity"
      and §5.4's "downstream models are typechecked against `produces`" were both
      untrue: a mart over a step output was refused with *"mart base names entity
      'customer', which no mapping lowers"*. `build_project_ir` now synthesizes one
      `EntityIR` per output. Three fields have no natural value and are **chosen**,
      recorded rather than left to be discovered: `source` names the relation the
      step itself writes (an entity's `source` is mandatory and a step has no bronze
      one — this is the honest reading, since that is where the rows come from as
      far as anything downstream can tell); `materialization`/`scd` are `FULL`/`TYPE1`,
      matching what the wrapper already declares, because an IR disagreeing with its
      own artifact is worse than an arbitrary-but-consistent choice; and each column's
      `expr` is the column referring to itself, which is what a downstream model selecting
      from the relation would emit anyway.
    paths:
      - src/bloomery/emit/dbt/__init__.py
      - tests/fixtures/identity_resolution/marts.yaml
  - id: D-37
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **`EntityIR.produced_by` marks a step-written entity, and
      the emitter skips it.** The entity exists so the rest of the compiler can reference
      it; the relation is written by the step's generated wrapper. Without the marker
      the emitter's entity loop would emit a *second* model at the same path — precisely
      the two-writers-one-relation collision D28 refuses everywhere else, arrived
      at from the inside.
    paths: [tests/fixtures/identity_resolution/marts.yaml]
  - id: D-38
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13)* **The plan double-report question, settled by measurement
      rather than by argument.** Synthesizing entities raised the worry that every
      step change would report twice. It does not, and the split is the useful one:
      *presence* changes report both (`step:resolve_customers` **and** `entity:customer`
      + its fields) because new relations genuinely did appear and a reader needs
      their columns before applying; a `runtime_lock` bump reports **only** the step,
      because the synthesized entity is byte-identical across it. `plan(ir, ir)` stays
      empty, so S-0024/D-2's identity property survives the new entity kind.
  - id: D-39
    grade: ASSUMED
    text: >-
      *(2026-08-08, M13; the `fail` half built by D48)* **Quality rules on step outputs
      stay refused, and synthesizing entities does not change that.** It was tempting
      to read D36 as unblocking them, since the rules now have an entity to attach
      to. They still cannot lower: S-0033's dispositions compile into a silver **SELECT**
      (`_quality_flags`, the routing `WHERE`, the coercible marker over transform
      chains), and a step-produced relation has no SELECT — the wrapper writes it
      in Python. The tractable subset would be `on_fail: fail`, which *would* lower
      to an audit over the relation rather than into its projection; `flag` and `quarantine`
      would not, and shipping a rule kind that works for one disposition and silently
      does nothing for the other two is worse than the refusal. So the shipped contract
      is the simple one — **every** quality rule on a step output is a compile error,
      whatever its `on_fail` — and the `fail`-only subset is named as the next increment,
      not built.
