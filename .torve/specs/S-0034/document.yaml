    text: >-
      Exact `StepManifest` Pydantic surface (parameter-bounds grammar, `requires`
      strictness) — implementation settles within §5.2's shape.
  - id: Q-2
    text: >-
      ~~Whether `sql_model` bodies take parameters via Jinja or sqlglot placeholder
      substitution~~ — **settled 2026-08-09 by D47: sqlglot placeholders.** Left open,
      it was not a choice pending a decision but a silent hole: nothing substituted,
      and nothing refused a body that expected it.
