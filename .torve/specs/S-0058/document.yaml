sections:
  - key: about
    md: |-
      - **Status:** 🚧 In progress — §11's first half has landed. §1, §3, §4, §5 and §6 are
        written, on `pages/docs/concepts/what-bloomery-proves.md`, with §1's short form and the
        positioning sentence in the README; D7 is answered by a gate rather than an owner, and
        D6 is decided for now and stays live. **§2 and §7's second sentence are not published**,
        which is D2 doing its job: `planner/semantic_plan.py` returns `None` for a derived,
        cumulative, semi-additive or mixed-restriction request and `QueryPlan.semantic` is
        optional, so bloomery answers requests it constructs no derivation for and §2's second
        sentence is false today. The document stays whole until they land (`INDEX.md` — retire
        whole, never in part). Execution's findings and the rows it proposes are in
        [`logs/T-0036.md`](logs/T-0036.md); nothing below has been amended to agree with what
        was built. A **documentation** decision, not a code change; it binds what README and the
        reference pages may assert once proof-producing semantics land.
        S-0005 is recommended first, since the strong form of the
        claim is only true once proofs exist.
      - **Scope:** The precise correctness claim bloomery makes, the representation-versus-
        answerability distinction the docs must draw, and the boundary around what is *not*
        proven. Arrived as `DOC-0001` in the semantic-correctness pack and is numbered into the
        corpus here, because "what the project may claim" is a decision with consequences and the
        corpus is where decisions with consequences live.
      - **Related:** [`README.md`](README.md) — the current one-line description;
        [`pages/docs/concepts/guardrails.md`](pages/docs/concepts/guardrails.md);
        S-0018 (project foundations, retired).
      - **Purpose:** Avoid both under-selling the compiler as "just artifact generation" and
        over-claiming that bloomery proves business truth.
  - key: decision-notes
    md: >-
      _(Decision rows from here on are this document's D-1…; see `decisions.yaml`.)_
  - key: phasing
    md: |-
      §1, §3, §4, §5 and §6 may be written as soon as this is accepted: they describe what is
      already true. §2 and §7's second sentence wait on the capability, and D2 is what holds them
      back.
questions:
  - id: Q-1
    text: >-
      **Whether the determinism claim moves or stays.** The current description leads
      with byte-identical output, which is true, shipped, and the thing users can
      check today. The proposed replacement leads with semantics and drops it.
  - id: Q-2
    text: >-
      **Who owns the "supported integrations" list in §5** so it does not go stale
      on the next target.
