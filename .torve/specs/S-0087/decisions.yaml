# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A mart's owner reaches its MetricFlow semantic model and a metric's owner its
      metric, both as `config.meta.owner`; with no owner `config` stays null, and
      an entity's owner is not carried: an entity reaches MetricFlow only as entity
      elements inside the marts' semantic models, which carry the marts' owners; this
      answers S-0062/Q-2
    paths: [src/bloomery/emit/metricflow/__init__.py, tests/unit/test_ownership.py]
    consequence: >-
      the fourth target carries the owner the other three already do
    rationale: >-
      `config.meta` is the slot the pinned MetricFlow offers; `owners` does not exist
      in it
    cites: [S-0062/D-2]
  - id: D-2
    grade: ASSUMED
    text: >-
      No `cron` is emitted, in `model_defaults` or on any model; an unstated cron
      makes a project late, never wrong, because it moves when an interval closes
      and not which rows the interval holds; a row that arrives after its interval
      ran is S-0087/D-5's arrival lag, not the cron's; this answers S-0061/Q-2
    paths:
      - src/bloomery/emit/sqlmesh/__init__.py
      - tests/unit/test_emit/test_sqlmesh.py
    consequence: >-
      cadence stays the caller's, outside a file every compile rewrites
    rationale: >-
      a cron written by bloomery would be overwritten by the next compile, the trap
      S-0061 names
    cites: [S-0061/D-8]
  - id: D-3
    grade: ASSUMED
    text: >-
      An exposure emits no MetricFlow `saved_query`, and this is not a refusal: a
      saved query is a request and an exposure a consumer, with no group-by, no slot
      for a mart, and metrics the manifest may lack; this answers S-0063/Q-1
    paths:
      - src/bloomery/emit/metricflow/__init__.py
      - tests/unit/test_emit/test_metricflow.py
    consequence: >-
      the manifest's `saved_queries` holds only queries someone wrote
    rationale: >-
      `ecom_basic`'s own exposures cannot be carried faithfully: one names a metric
      the manifest omits and one names only marts
    cites: [S-0063/D-4]
  - id: D-4
    grade: ASSUMED
    text: >-
      `freshness:` carries no `filter:`; a filter would have to name a bronze partition
      column no spec declares, and one that excluded the newest load would change
      the answer, so leaving it out costs scan time and never a wrong freshness; this
      answers S-0064/Q-1
    paths: [src/bloomery/spec/mapping.py, src/bloomery/emit/dbt/__init__.py]
    consequence: >-
      no unchecked SQL fragment enters dbt's freshness query
    rationale: >-
      the stake is cost, measurable before it is designed
    cites: [S-0064/D-8]
  - id: D-5
    grade: ASSUMED
    text: >-
      An entity materialized `incremental_by_partition` may declare `arrival_lag`,
      a duration in `quarantine.retention`'s grammar; SQLMesh's model pins `interval_unit
      'day'` and `lookback` is the lag in whole days, rounded up, so an operator's
      cron cannot shrink it, and a cron more frequent than daily is refused by SQLMesh
      at load; unset, neither is emitted. Declared on any other entity it is refused.
      dbt carries nothing: its incremental entity merges its whole select on the key
      every run, so a late row already lands.
    paths: [src/bloomery/spec/entity.py, src/bloomery/emit/sqlmesh/__init__.py]
    consequence: >-
      a row that lands after its interval ran is loaded on a later run instead of
      never, and a project that declares no lag compiles byte for byte as before
    rationale: >-
      `lookback` defaults to zero and the time column is business time, so SQLMesh
      loses late rows silently; the field is optional, which keeps the change additive
      within `spec_version: 1`.
  - id: D-6
    grade: ASSUMED
    text: >-
      No `interval_unit` is derived from a partition transform: a coarse partition
      under SQLMesh's daily interval loses nothing outside the interval's own time
      range on Trino. Measured on 2026-10-01 on `trinodb/trino:483` with a Hive 4
      metastore: the Hive catalog refuses any transform before a write, and on Iceberg
      the daily interval deletes and re-inserts its own time range, leaving the rest
      of the month intact.
    paths: [src/bloomery/emit/sqlmesh/__init__.py]
    consequence: >-
      the interval unit changes only on evidence, and a null result closes the question
      without code
    rationale: >-
      SQLMesh's Trino adapter sets `insert_existing_partitions_behavior=OVERWRITE`
      only on a Hive catalog, where a transform cannot be declared, and uses DELETE
      then INSERT by time range everywhere else; two backfilled days kept every row
      after the third day's interval ran.
  - id: D-8
    grade: ASSUMED
    text: >-
      On Trino, a partition transform reaches the SQLMesh model in the connector's
      singular spelling, `day`, `month`, `year` or `hour`; the spec keeps its plural
      grammar. A Hive catalog takes no transform at all, and the docs say to partition
      by a date column there.
    paths: [src/bloomery/dialects/trino.py, src/bloomery/emit/sqlmesh/__init__.py]
    consequence: >-
      once phase 3 lands, a transform-partitioned model builds on a Trino Iceberg
      catalog; today that catalog refuses every transform bloomery emits
    rationale: >-
      Measured on 2026-10-01: Trino's Iceberg connector refuses `DAYS`, `MONTHS`,
      `YEARS` and `HOURS` (`Invalid partition field declaration`) and accepts the
      singular forms. The engine tier runs on the memory connector, which creates
      no partitions, so no test saw it. The spelling is the dialect port's, as every
      per-engine spelling is (S-0025/D-1).
