# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: The owner reaches MetricFlow
    intent: >-
      `_semantic_model` and `_metric` build `config.meta.owner` when an owner is set;
      the canary asserts `config`; a test pins `saved_queries` empty for a project
      with exposures; the MetricFlow goldens and the corpus hash move; `annotate-a-spec.md`
      loses the false `owners` claim and the changelog notes the change. Settles D-1
      and records D-2 to D-4.
    scope:
      - src/bloomery/emit/metricflow/__init__.py
      - tests/unit/test_ownership.py
      - tests/unit/test_metricflow_canary.py
      - tests/unit/test_emit/test_metricflow.py
      - tests/golden/**
      - pages/docs/how-to/annotate-a-spec.md
      - CHANGELOG.md
    acceptance:
      - >-
        uv run pytest tests/unit/test_ownership.py tests/unit/test_metricflow_canary.py
        tests/unit/test_emit/test_metricflow.py tests/golden -q
    character: routine
