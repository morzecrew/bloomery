# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      **The aggregation vocabulary is a closed typed set, never a target-interpreted
      string.** `Additive`, `SemiAdditive`, `NonAdditive`, `Ratio`, `DistinctCount`,
      `Snapshot`. Locked because the planner, the proof rules and every emitter branch
      on it: an open string set makes each target the authority for what a measure
      means, which is the arrangement this whole sequence exists to end. Staging the
      *implementation* across releases is fine; encoding a future class as a string
      is not.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/guardrails/additivity.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/spec/common.py
      - tests/fixtures/semantic_corpus/005-semi-additive-balance/expected/semantic_outcome.json
      - tests/fixtures/semantic_corpus/005-semi-additive-balance/problem.md
      - tests/fixtures/semantic_corpus/007-distinct-users-fanout/expected/semantic_outcome.json
      - tests/fixtures/semantic_corpus/007-distinct-users-fanout/problem.md
      - tests/unit/test_guardrails/test_additivity.py
      - tests/unit/test_semantic/test_rollup.py
  - id: D-2
    grade: LOCKED
    text: >-
      **A ratio is stored as its operands, not as a materialized quotient.** `SUM(num)/SUM(den)`
      and `AVG(ratio)` differ, the second is what a numeric-looking column invites,
      and the difference is a plausible wrong number. This is also S-0055's precondition
      — a derived metric spanning two branches cannot be reconstructed after the operands
      are gone — so reversing it later strands that document.
    paths:
      - src/bloomery/emit/lower/rollups.py
      - src/bloomery/errors.py
      - src/bloomery/guardrails/additivity.py
      - src/bloomery/guardrails/metrics.py
