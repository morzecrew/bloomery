  - id: D-3
    grade: LOCKED
    text: >-
      **Superseded in part by D9 (currency) and D10 (units).** **Units participate
      in type checking; incompatible arithmetic is refused without an explicit declared
      conversion.** Existing currency behaviour becomes a proof-producing rule rather
      than a waiver that suppresses the mismatch. Locked because a waiver and a proof
      are indistinguishable at the call site and only one of them survives being asked
      "on what basis?".
    paths: [tests/fixtures/semantic_corpus/004-currency-mix/problem.md]
  - id: D-4
    grade: ASSUMED
    text: >-
      **Migration prefers conservative semantics over inference; no project silently
      gains a stronger additivity claim.** The stated risk is one-directional in the
      RFC and is not: a measure acquiring an origin grain can *newly refuse* an accepted
      project. Not `LOCKED` because the conservative default may prove unusable in
      practice — if so, execution departs with a migration note naming the projects
      it moves, rather than quietly widening.
  - id: D-5
    grade: ASSUMED
    text: >-
      **This is a consolidation of vocabulary that already exists in three places,
      not a greenfield model.** `Additivity` and `SemiAdditiveRule` are on the metric,
      `Unit` on the column, currency in a transform. Execution should expect to *move*
      declarations rather than invent them, and the risk is a second spelling of a
      fact rather than a missing one.
    paths: [src/bloomery/guardrails/additivity.py]
  - id: D-6
    grade: OPEN
    text: >-
      *(closed: derived, gated on the axis being exposed — logs/T-0019.md D107, logs/T-0028.md.)*
      **Whether a measure's origin grain becomes authored syntax or stays derived
      from its entity.** Derived is smaller and matches what projects already write;
      authored is explicit and survives a measure that outlives its defining entity.
      Whichever is chosen decides §7's migration cost, so decide it before the migration
      is written, and log the decision with the shape of spec it implies.
  - id: D-7
    grade: ASSUMED
    text: >-
      **A metric declaring `ratio:` declares `additivity: ratio`, and either half
      without the other is refused.** Until the member was minted the only spelling
      was `non_additive` with a `ratio:` block beside it, which made the additivity
      a field the compiler read for one thing and the author wrote for another — D5's
      second-spelling risk, installed as the only option. This newly refuses projects
      accepted yesterday, which §7 and D4 licence as a breaking change carrying a
      migration note rather than a silent tightening. Not `LOCKED` because the one-word
      migration is cheap to revisit; the alternatives — deriving the class from the
      block, or accepting both words — both leave the resolved IR disagreeing with
      the document that produced it. Bloomery's own generated `quality_quarantine_rate`
      was the first spec the guard refused, which states D2's reason rather than excepting
      it (see [`logs/T-0023.md`](logs/T-0023.md), D145, D147).
    paths:
      - src/bloomery/guardrails/additivity.py
      - tests/unit/test_guardrails/test_metrics.py
      - tests/unit/test_guardrails/test_stage.py
  - id: D-8
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **A site branching on additivity
      tests the property it means, never the member it happened to observe.** Fifteen
      sites across the emitters, the planner and the guardrails read `NON_ADDITIVE`,
      and twelve of them meant something else — nine "never emits a measure", three
      "a ratio specifically" — so minting `RATIO` narrowed twelve branches at once
      and no test in the tree could see it. `bloomery.ir.COMPUTED` is that property
      under its own name, and is already complete for all six members. Locked because
      it is what the `RESOLVABLE` canary's promise rests on: minting `DistinctCount`
      or `Snapshot` is an enum edit and a lowering, not a second sweep of fifteen
      judgement calls (see [`logs/T-0023.md`](logs/T-0023.md), D146).
  - id: D-9
    grade: ASSUMED
    text: >-
      **Supersedes D3's currency clause.** D3 asks currency behaviour to become a
      proof-producing rule "rather than a waiver that suppresses the mismatch", and
      there is no waiver: S-0040/D-5 deleted the `CONVERT_CURRENCY` marker, and what
      stands in its place is a declaration the guard reads. The mixed-currency refusal
      is unconditional and unwaivable; a conversion's output was checked against the
      catalog at resolution — every step's, which S-0066/the-column-s-currency-is-the-chain-s-last-conversion
      then narrowed to the last one, because comparing each refused a correct two-hop
      chain. What is missing is not a rule but the fact a rule would read — a conversion's
      declared *input*, which the spec language cannot express, so `{convert: [JPY,
      USD, paid_at]}` applies the yen rate to euros and compiles clean. That fact
      is S-0066's, and R009 is minted there rather than here. Added by execution 2026-09-06
      — see [`logs/T-0024.md`](logs/T-0024.md) (D153, D154, D155, attempt 1).
  - id: D-10
    grade: ASSUMED
    text: >-
      **Supersedes D3's unit clause, scoping it to the refusal it already has.** "Refused
      without an explicit declared conversion" reads on units as well as currency,
      and for units there is no conversion to declare: `convert` is currency-only
      by signature and by its `fx_rates:` backing, and `Unit` has two members. So
      §5's `Distance<km> + Distance<m>` has its refusal and nothing else, and naming
      an escape an author cannot write is worse than naming none. A declared unit
      conversion needs factors and a dimension algebra — a document, not a row, and
      unwritten. Added by execution 2026-09-06 — see [`logs/T-0024.md`](logs/T-0024.md)
      (D156, attempt 1).
  - id: D-11
    grade: ASSUMED
    text: >-
      **`Snapshot` is declared as `semi_additive` with a `rule`; it has no authored
      word.** §4 asks a snapshot for "explicit time-selection semantics (first/last/as-of)
      before cross-time aggregation", and `semi_additive: {over: <axis>, rule: first
  - id: D-12
    grade: ASSUMED
    text: >-
      **§3 is met by the fields in place; the consolidated node is not built, and
      `Unit` stays on the column.** T-0019's D108 deferred the single `Measure<…>`
      node to the first consumer needing it in one piece — S-0054's planner — and
      S-0054 and S-0055 both shipped reading the seven facts §3 lists where they are:
      `MetricIR.{grain, additivity, agg, expr, ratio, derived, semi_additive}` and
      `ColumnIR.{unit, currency}`. Every one is target-independent IR, which is what
      §3 demands; the consolidation is a refactor with no reader. §10's second question
      closes the same way: `Unit` is read through the column, as S-0066's conversion
      rule reads currency. Added by execution 2026-09-08 — see [`logs/T-0028.md`](logs/T-0028.md).
