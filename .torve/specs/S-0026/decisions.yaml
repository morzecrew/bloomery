      - tests/fixtures/role_playing_dates/entity_model.yaml
  - id: D-13
    grade: ASSUMED
    text: >-
      `tests/bench/` ships the hydration benchmark (S-0029): `loads` under 5 ms asserted,
      `perf`-marked, run as a scheduled job — the only benchmark in v0.1.
  - id: D-14
    grade: ASSUMED
    text: >-
      Tenant-agnosticism is a named guard alongside the determinism guard (D9): `grep
      -ri tenant src/bloomery/` returns only `naming.py` docstrings, enforced as a
      CI quality gate and a unit-tier guard test.
    paths: [src/bloomery/quality/mart.py]
  - id: D-15
    grade: ASSUMED
    text: >-
      **Three-way equivalence (pivot R10, amends D11):** tier 7 is MetricFlow ↔ Cube
      ↔ hand-written reference SQL. Reference SQL in `tests/equivalence/reference_sql/`
      for the ~15 hardest golden requests is the tiebreaker when the two engines disagree;
      the `known_divergences.yaml` rule is unchanged.
  - id: D-16
    grade: ASSUMED
    text: >-
      **Golden-doctrine split (pivot R10, amends D5):** compiler-emitted goldens (`sqlmesh/`,
      `dbt/`, `cube/`, `metricflow/manifest.json`) keep the strict unexplained-diff-fails
      rule. Planner-SQL golden diffs on a MetricFlow version bump are review aids,
      not failures, provided execution tests pass — execution tests are the primary
      correctness gate for planner SQL. Every fixture gains a sorted-keys `metricflow/manifest.json`
      golden (S-0030 R1).
  - id: D-17
    grade: ASSUMED
    text: >-
      Two new **merge-blocking** property invariants (pivot R4/R6): every dimension
      the MetricFlow emitter produces round-trips through `planner/names.py`; adversarial
      `FilterExpr` values render to SQL that parses with unchanged predicate structure
      and exactly the expected scanned relations.
  - id: D-18
    grade: ASSUMED
    text: >-
      **Version-drift canary (pivot R10):** `tests/unit/test_metricflow_api_surface.py`
      is a third named guard beside the determinism and tenant guards — it pins the
      MetricFlow internal API surface the backend depends on, turning a silent breakage
      on a version bump into a loud failure. Per-commit, tier 1.
  - id: D-19
    grade: ASSUMED
    text: >-
      **Bench budgets revised (S-0031, supersedes D13's 5 ms):** `tests/bench/test_hydration.py`
      asserts 50 ms cold / 10 ms warm hydration; still `perf`-marked, scheduled, and
      the only benchmark in v0.1.
  - id: D-20
    grade: ASSUMED
    text: >-
      **Semi-additive fixture seed erratum (V2, 2026-08-07 — [`spikes/metricflow/VERIFICATION.md`](spikes/metricflow/VERIFICATION.md)):**
      the pivot's paired assertions ("unscoped Jan 1–3 → 90" and "Jan 3 → A 90 + B
      40 = 130") are unsatisfiable on one seed — with B=40 on Jan 3 the global MAX
      date is Jan 3, so the unscoped 3-day answer is 130. `semi_additive_inventory`
      keeps 100/80/90 as **warehouse-A** balances (A-scoped 3-day → 90), B=40 on Jan
      3 (global Jan-3 and unscoped 3-day → 130), and asserts by-month over three months
      → three rows (issue #241 fixed in metricflow 0.211.0). Month-grain DuckDB results
      are `TIMESTAMP`s — normalized in the test helper. §5.3/§5.10 amended accordingly;
      the row-policy AST test asserts "predicate in every scan", not a fixed subquery
      count.
    paths: [tests/execution/test_planner_numbers.py]
  - id: D-21
    grade: ASSUMED
    text: >-
      *(2026-08-10)* **The Trino engine tier is built, on the memory connector, and
      `spark` is struck from §5.2.** Trino was the engine bloomery made the most claims
      about and executed the least: three decisions — D83's reject-table constructions,
      D86's `normalize`/`charset`, D89's mart-assertion body shapes — were each verified
      against `trinodb/trino:483` **by hand**, through `docker exec`, because the
      repository carried no Trino client. A hand-verification is a claim with a date
      on it, not a test, and all three are now a permanent tier (`trino` + `testcontainers[trino]`
      in the `engines` group). The strongest assertion is the one D75 said was impossible:
      the `<entity>__reject` model *materializes*, and its `reject_id` is compared
      against the canon-bytes digest computed here in Python rather than against Trino
      agreeing with itself — cross-engine *agreement* being the property that identity
      actually needs, since a replay run on one engine must find the row another quarantined.
      Sabotage-verified: dropping the `LOWER` from Trino's `TO_HEX` makes the digest
      disagree in case alone, which the tier catches and which no rendering test could.
      **The connector is `memory`, diverging from §5.2's `trino+iceberg+minio (compose)`
      sketch**: bloomery emits SELECTs and models and never storage-format DDL, so
      an object store and a table format would be three more moving parts serving
      no assertion in this tier — recorded rather than silently simplified. **`spark`
      is struck from the same row.** S-0025 ships DuckDB, Postgres and Trino; there
      is no Spark dialect, so a Spark cell had nothing to exercise and the word promised
      a matrix column that could never have contained a test. It returns if and when
      a Spark dialect does.
    paths:
      - tests/engines/test_trino.py
      - tests/engines/test_trino_execution.py
      - tests/support/cube.py
      - tests/unit/test_examples.py
  - id: D-22
    grade: ASSUMED
    text: >-
      *(2026-08-10)* **`dbt parse` is built, and building it found that `dbt build`
      cannot pass.** §5.2 names dbt's tier-6 cell in three words, and the tier now
      runs `dbt parse` over every fixture the dbt target compiles plus a Tier 2 step
      project — closing the claim S-0034/D-52 explicitly left open, that the emitted
      step model is a file dbt accepts. It carries its own control: one model's `config()`
      is deliberately malformed and dbt must refuse it, so the nine passes above it
      are not a parser that accepts anything. **The finding.** `dbt build` on the
      same project fails, and not because of the tier: bloomery's dbt models reference
      their inputs by **literal relation name** (`FROM silver.order_item`) rather
      than through `{{ ref(...) }}` or `{{ source(...) }}`. So dbt has no dependency
      edges between bloomery's models — it cannot order them — and it materializes
      each into the profile's target schema while the `FROM` clause names `silver`.
      Both halves have to be true for a build to work, and neither is. Two candidate
      fixes, **neither built**, because this is S-0025's decision about how deep the
      dbt target goes rather than a testing-tier patch: rewrite silver/gold references
      to `ref()` and bronze to `source()` (a real DAG, but `ref()` resolves through
      dbt's own schema config, so the naming policy stops owning the namespace); or
      emit per-directory `+schema` config in `dbt_project.yml` (relations line up,
      ordering still absent). Recorded here because the limitation was **unwritten
      anywhere** until this tier was built — S-0025 calls dbt "the compatibility target,
      minimal but honest", and this is the part that was not written down.
    paths: [src/bloomery/emit/dbt/__init__.py, tests/e2e/test_dbt_parse.py]
  - id: D-25
    grade: ASSUMED
    text: >-
      *(2026-08-11)* **D22 is closed, and the tier that found it now builds.** S-0025/D-20
      took **both** of D22's candidates — the "or" between them was wrong, since `+schema`
      alone leaves ordering absent and `ref()` alone costs the naming policy its namespaces,
      and each repairs the other's cost. §5.2's dbt cell is now `parse` + `compile`
      + `build`: parse for "dbt loads this at all" (with the malformed-`config()`
      control), compile because parse does **not** resolve test macros (S-0025/D-19),
      and build for D22 itself. Sources are seeded **empty**, read off the emitted
      models rather than hand-listed, each column taking the type of the nearest enclosing
      `CAST` — the model's own statement of what it expects to read, and necessary
      because an all-`VARCHAR` seed makes DuckDB refuse `CAST(total / qty AS DECIMAL)`
      before the build has said anything about references. Zero rows is deliberate
      and the limit is stated: resolution, ordering and placement fail identically
      on an empty warehouse, and arithmetic belongs to the execution and equivalence
      tiers rather than being restated here.
  - id: D-23
    grade: ASSUMED
    text: >-
      *(2026-08-10)* **An empty engine/e2e lane is a nightly failure, not a tolerance.**
      The CI step swallowed pytest's exit code 5 with the comment "tiers land with
      M7". They landed: 39 tests collect under `engine or e2e` across postgres, trino,
      the SQLMesh replan and `dbt parse`. With the suites written, an empty collection
      can only mean an import or collection error — and tolerating it means exactly
      the failure mode that matters most in a nightly lane nobody watches: a broken
      import turning the whole thing green. The tolerance is removed.
  - id: D-24
    grade: ASSUMED
    text: >-
      *(2026-08-10)* **The Cube container and the three-way equivalence tier are built;
      `QueryPlan.columns` does not name the columns the SQL returns.** §5.2's last
      tier-6 cell and §5.8's tier-7 both need Cube alive, so one harness pairs it
      with the Postgres holding the mart it describes — on one network, with the table
      created from `MartIR` through the Postgres dialect port rather than a hand-written
      column list, since a third statement of the schema would be free to drift from
      the two that matter. **Cube loads what bloomery emits**, and the load-bearing
      assertion is the `meta:` block: S-0025/ports says the emitted `additivity`/`grain`/`semi_additive`
      is what a consumer audits Cube's behaviour against, which is only true if it
      survives to the API — no golden can show that, and dropping it from the emitter
      fails the test that names it. The tier does not stop at `/meta`: it issues a
      query, because parsing a model and running its measure expression are different
      claims. **Equivalence** points both engines at one relation by construction
      — Cube's `sql_table` and the planner's SQL name the same `gold.mart_<name>`
      under the naming policy — so a difference can only come from the query rather
      than from two seeding routines kept in step. The corpus is smaller than §5.8's
      "~40 requests", visibly and deliberately: the *classes* buy the coverage (an
      additive measure at three grains, an ungrouped request, a ratio recomputed per
      group, a multi-metric request), each costs a Cube round trip in a nightly lane,
      and growing it is adding YAML entries. The reference SQL runs on **every** request
      that declares one rather than only after a disagreement — §5.8 calls it the
      tiebreaker, and a tiebreaker nobody has ever checked cannot break a tie. `known_divergences.yaml`
      ships **empty**, with its required shape asserted, because §5.8 holds that a
      silent divergence is a bug in one of the implementations and a pre-populated
      file would let the first real one hide among plausible neighbours. The ratio
      fixture seeds groups of **unequal size** on purpose: a ratio averaged from stored
      per-row values agrees with a ratio of summed components on equal-sized groups
      and only on those, so equal groups would let the wrong arithmetic pass. Sabotage-verified
      — a wrong Cube measure expression fails ten of the fifteen. **The finding.**
      `QueryPlan.columns` is S-0028's "self-describing envelope", but its dimension
      descriptors carry the *requested* name (`ordered_month`) while the SQL MetricFlow
      generates aliases them its own way (`order_item__ordered_day__month`). Positional
      binding works and is what every consumer in this repo does; binding by name
      silently finds nothing. Two ways to close it, **neither built** — wrap the generated
      SQL in an outer SELECT aliasing to the requested names (S-0030's call, since
      MetricFlow owns the aliasing), or state in S-0028 that the envelope is positional
      and `name` is the request's word rather than the frame's. Recorded because it
      was written down nowhere. **One harness trap, recorded because it cost a wrong
      diagnosis:** Postgres logs "database system is ready to accept connections"
      *twice* — once on the unix socket while `initdb` runs its scripts, then again
      for real — so a container waiting on the first occurrence connects during the
      init shutdown and fails with "server closed the connection unexpectedly". It
      is a race, so it failed intermittently and read as container-memory pressure;
      the fix is the `PostgresContainer` class the other engine tiers already use,
      not fewer containers.
    paths:
      - src/bloomery/planner/result.py
      - tests/equivalence/test_three_way.py
      - tests/support/equivalence.py
      - tests/unit/test_planner/test_names.py
  - id: D-26
    grade: ASSUMED
    text: >-
      *(2026-08-12)* **The engine/e2e lane runs on pull requests that touch what it
      covers, and the cost premise it was skipped on was wrong.** D21–D25 built tiers
      5–7 and left them `force_full` only — nightly, `workflow_dispatch`, release
      — on the reading that Docker-backed means expensive per-commit. **Measured rather
      than assumed:** 199s on run 31534974983, against a Python test matrix taking
      203–325s in the same run. The lane finishes *inside* the existing critical path
      and adds no wall-clock to a PR at all. What the skip actually cost was visible
      on the PR that measured it: it changed the Postgres `TRY_CAST` guard (D93) and
      rewrote how every dbt model names its inputs (S-0025/D-20), and CI would have
      exercised neither until the following night — the tiers built precisely to catch
      that class of change were the ones not running on it. Now triggered by a path
      filter over the dialect ports, the emitters and the two tiers' own suites, since
      nothing outside those can move its verdict. **Two exclusions, both deliberate
      and both the same asymmetry.** Fork pull requests keep the nightly path: secrets
      are unavailable to them, so their pulls go out anonymous against the runner
      IP's shared Docker Hub budget and the lane would fail for reasons no test changed.
      And it stays **out of `required-ci`** — advisory on a PR, blocking nightly —
      because a rate limit or a container that will not start must not block a merge.
      That is a weaker gate than D23 made the nightly lane, and the difference is
      the point: D23 could remove a tolerance because a scheduled run has no one waiting
      on it.
