# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      Six tiers, fastest first (unit, golden, property, execution, engines, e2e);
      unit is 90%+ of test count and covers 100% of guardrail branches. `just test`
      = tiers 1–4; engines/e2e are opt-in markers (postgres per-commit; trino/spark/e2e
      nightly).
  - id: D-2
    grade: ASSUMED
    text: >-
      Layout is `tests/{unit,golden,property,execution,engines,e2e,fixtures,support}/`
      with `tests/unit` mirroring `src/bloomery`; `tests/README.md` documents the
      tiers (forze convention).
  - id: D-3
    grade: ASSUMED
    text: >-
      Markers `unit, property, execution, engine(<name>), e2e, perf` under `--strict-markers`/`--strict-config`
      in `pyproject.toml`; an undeclared marker is a collection error.
  - id: D-4
    grade: ASSUMED
    text: >-
      The fixture corpus is exactly spec §7.7 (`minimal`, `ecom_basic`, `fanout_trap`,
      `semi_additive`, `messy_types`, `multi_source`, `evolution_v1..v5`), stored
      as YAML under `tests/fixtures/<name>/`, loaded only via public `load_project`/`load_catalog`.
      Consequence: the corpus is also the doc example set and future LLM-eval set
      — fixture edits carry corpus-level review weight. `multi_source` covers deterministic
      two-source union merge only; identity xref is out of scope for v0.1.
    paths:
      - tests/fixtures/identity_resolution/entity_model.yaml
      - tests/fixtures/multi_source/entity_model.yaml
      - tests/unit/test_fixtures.py
  - id: D-5
    grade: ASSUMED
    text: >-
      Goldens are checked in per (fixture × target × dialect), regenerated via `pytest
      --snapshot-update`, and reviewed like source code — an unexplained golden diff
      fails review. sqlglot pin bumps regenerate goldens in a dedicated PR (S-0020/D-2).
  - id: D-6
    grade: ASSUMED
    text: >-
      Property tier generates only valid projects (strategies in `tests/support/strategies.py`);
      invariants: SQL parses under target dialect, SELECT columns ⇔ entity fields,
      `plan(ir, ir)` empty, no-BREAKING plan ⇒ column superset, compile twice ⇒ identical
      bytes.
  - id: D-7
    grade: ASSUMED
    text: >-
      Execution tier is in-process DuckDB with `Decimal` assertions and houses the
      fan-out regression suite (spec §7.4) as executable proof of the grain guardrail.
  - id: D-8
    grade: ASSUMED
    text: >-
      The S-0020/determinism-tests-the-enforcement determinism test is the named guard
      `tests/unit/test_determinism_guard.py`, run per-commit in tier 1.
  - id: D-9
    grade: ASSUMED
    text: >-
      Coverage: branch on, `fail_under=80` overall, per-package floors ratcheting
      up (forze pattern); `bloomery/guardrails/` is floored at 100% branch from day
      one.
    paths:
      - src/bloomery/guardrails/quality.py
      - tests/README.md
      - tests/unit/test_quality/test_coverage.py
  - id: D-10
    grade: ASSUMED
    text: >-
      The strongest acceptance test is SQLMesh replan-is-a-no-op (`plan.has_changes
      == False`); dbt (`dbt parse`) and cube (`/meta`) get equivalents.
  - id: D-11
    grade: ASSUMED
    text: >-
      Tier 7, planner equivalence (_bloomery-changes.md D7): `tests/equivalence/`
      holds `test_native_vs_cube.py` and `golden_requests.yaml` (~40 `MetricRequest`s
      across the fixtures); `engine("cube")`-marked, nightly; native and Cube result
      frames must be equal within `atol=0.01`. Requests the native planner refuses
      with `UnreachableAtGrain` must be refused by Cube too or listed in a reviewed
      `known_divergences.yaml` with a written justification.
  - id: D-12
    grade: ASSUMED
    text: >-
      The corpus grows to fourteen fixtures (D7): `role_playing_dates`, `semi_additive_inventory`
      (the former `semi_additive`, renamed and extended), `non_additive_aov`, and
      `multi_mart_refusal` join the spec §7.7 set; `fanout_trap` now proves the compile-time
