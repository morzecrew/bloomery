# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A `"*"` as the source of `enum_map`'s last pair is the fallback: a non-NULL
      value no earlier pair lists yields that pair's target, and NULL stays NULL.
      A `"*"` in any other pair is refused at typecheck. The arguments stay flat string
      pairs
    paths:
      - src/bloomery/transforms/_builtins.py
      - src/bloomery/typing/check.py
      - tests/unit/test_transforms/test_builtins.py
      - tests/support/reference.py
      - tests/execution/test_enum_fallback.py
    consequence: >-
      An open vocabulary maps onto a closed set in one step, `enum_map` stays non-nulling,
      and the implicit `coercible` rule stays on for the chain; a spec whose final
      pair maps a literal `*` changes meaning
    rationale: >-
      The reporter's three-step chain existed only to null the unlisted ids for `coalesce`,
      and the nulling step is what turned `coercible` off (#323). A token inside the
      pairs keeps S-0021/D-8's scalar arguments and the mapping schema unchanged,
      which the mapping-shaped alternative does not
    cites: [S-0021/D-8, S-0033/D-73]
  - id: D-2
    grade: ASSUMED
    text: >-
      `in_enum` over a field whose `enum_map` has a fallback is refused at the guardrail
      stage, naming the fallback
    paths:
      - src/bloomery/guardrails/quality.py
      - tests/unit/test_guardrails/test_quality.py
    consequence: >-
      A rule that could never fire is not emitted as an audit that always passes,
      and `enum_chain` never reads `"*"` as an admissible spelling
    rationale: >-
      With a fallback every non-NULL value is admissible, so the rule tests nothing.
      The guardrail already refuses `in_enum` with no `enum_map` for the opposite
      reason, a set that is empty
    cites: [S-0033/D-49]
  - id: D-3
    grade: ASSUMED
    text: >-
      `parse_ts` gains two reserved formats, `UNIX_SECONDS` and `UNIX_MILLIS`, which
      read a count of seconds or milliseconds since `1970-01-01 00:00:00` UTC. Their
      input is a `string`, as every `parse_ts` format's is
    paths:
      - src/bloomery/transforms/_builtins.py
      - src/bloomery/transforms/__init__.py
      - tests/unit/test_transforms/test_builtins.py
    consequence: >-
      An epoch lands as bronze sent it and maps to a `timestamp` in one step, from
      a text extraction or a typed column, which reaches the chain as its text
    rationale: >-
      `parse_ts` is where an author looks for a timestamp's format, and it is how
      the reporter asked for it (#324). A chain starts as `string` whatever the bronze
      column's type (`resolve/build.py:493`), so an `int` input would be reachable
      only after a `to_int`, which buys nothing
    cites: [S-0081/D-2]
  - id: D-4
    grade: ASSUMED
    text: >-
      An epoch count is an optional sign and at most fifteen digits, with spaces around
      it, naming an instant from `0001-01-01 00:00:00` to `9999-12-31 23:59:59.999`.
      Any other value yields NULL: a fraction, an exponent, text that is not a number,
      or a count out of range
    paths: [src/bloomery/transforms/_builtins.py, tests/execution/test_epoch.py]
    consequence: >-
      The guarded cast to `BIGINT` cannot overflow, and the four texts the engines
      disagree on give NULL everywhere; under the quality system that NULL is a coercion
      failure `coercible` disposes of, and without it the value is NULL rather than
      an aborted run
    rationale: >-
      Measured: DuckDB's `BIGINT` cast rounds `1761561600.5` to a different second,
      reads an exponent, and returns year 10000, where PostgreSQL raises and Trino
      gives NULL. Only a guard ahead of the cast gives one answer, and fifteen digits
      is the widest count the range admits
    cites: [S-0033/D-84, S-0081/D-2]
  - id: D-5
    grade: ASSUMED
    text: >-
      An epoch parse is an instant under S-0081/D-2's rules: the zone guard treats
      its value as never a wall clock, a `to_utc` after it is refused at resolve,
      and `zone_in:` may only be `UTC`
    paths:
      - src/bloomery/guardrails/zone.py
      - src/bloomery/resolve/build.py
      - tests/unit/test_guardrails/test_zone.py
    consequence: >-
      A date role over an epoch column needs no declared zone, and a chain cannot
      reinterpret the instant as a wall clock somewhere else
    rationale: >-
      A count since the epoch names one instant, as `Z` or an offset does for ISO
      text; the rule that already governs `ISO8601_INSTANT` is the one that fits,
      and a second rule for the same fact could drift from it
    cites: [S-0081/D-2]
  - id: D-6
    grade: ASSUMED
    text: >-
      The epoch formats lower to a `BLM_EPOCH_SECONDS` or `BLM_EPOCH_MILLIS` marker
      that a port declaring `DialectFeature.EPOCH` renders as integer arithmetic from
      the epoch, never as a zone-aware function. DuckDB declares it with `make_timestamp`;
      every port that does not declare it refuses the marker as `UnsupportedByTarget`
      until its spelling is measured on the engine
    paths:
      - src/bloomery/dialects/base.py
      - src/bloomery/dialects/duckdb.py
      - tests/unit/test_dialects/test_base.py
      - tests/unit/test_dialects/test_duckdb.py
    consequence: >-
      An epoch gives one instant on DuckDB under any session time zone, and a project
      on a port without the feature learns at compile time that the formats are not
      there yet
    rationale: >-
      `to_timestamp(n)` and `from_unixtime(n)` were measured to move with the session
      zone on all three engines, and the arithmetic spellings were zone-stable and
      agreed for every integer count in range. A marker refused by the base render
      is the S-0044 pattern for a transform a port must spell itself
    cites: [S-0012/D-2, S-0044, S-0020]
  - id: D-7
    grade: ASSUMED
    text: >-
      PostgreSQL and Trino declare `DialectFeature.EPOCH` with the measured arithmetic
      spellings, `TIMESTAMP '1970-01-01' + n * INTERVAL '1 second'` and `date_add('second',
      n, TIMESTAMP '1970-01-01 00:00:00.000000')` and their millisecond forms, held
      to DuckDB's answers by an engine differential under a UTC and a non-UTC session
    paths:
      - src/bloomery/dialects/postgres.py
      - src/bloomery/dialects/trino.py
      - tests/unit/test_dialects/test_postgres.py
      - tests/unit/test_dialects/test_trino.py
      - tests/engines/test_epoch_differential.py
    consequence: >-
      One bronze row gives one instant on all three shipping ports under any session
      time zone; Snowflake, BigQuery, Databricks and Redshift still refuse
    rationale: >-
      These spellings were zone-stable and agreed with DuckDB's for every integer
      count in range when measured. A row of its own because the ports land in their
      own phase, and a row whose paths span two phases mints a contract that contradicts
      itself
    cites: [D-6, S-0012/D-2]
