# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-10-27T20:28:57Z'
    title: >-
      D-6: ports rewrite the epoch markers themselves, with no new DialectFeature
    changes:
      - subject: D-6
        field: text
        before: >-
          The epoch formats lower to a `BLM_EPOCH_SECONDS` or `BLM_EPOCH_MILLIS` marker
          that a port declaring `DialectFeature.EPOCH` renders as integer arithmetic
          from the epoch, never as a zone-aware function. DuckDB declares it with
          `make_timestamp`; every port that does not declare it refuses the marker
          as `UnsupportedByTarget` until its spelling is measured on the engine
        after: >-
          The epoch formats lower to a `BLM_EPOCH_SECONDS` or `BLM_EPOCH_MILLIS` marker
          that a port rewrites in its own render, through `dialects.base.epoch_timestamps`,
          as integer arithmetic from the epoch, never as a zone-aware function. DuckDB
          does it with `make_timestamp`; the base render refuses a marker that survives
          as `UnsupportedByTarget`, naming the format, so every port that does not
          rewrite it refuses until its spelling is measured on the engine
      - subject: D-6
        field: fingerprint
        after: 3b3ef01ff85b923c/18abeb6e8f5a8b03
    md: >-
      Found while building phase 2. Every port's `features` defaults to `frozenset(DialectFeature)`
      (`dialects/base.py`), so a new `DialectFeature.EPOCH` would be claimed by every
      port that did not subtract it, and refusing the unmeasured ones would have meant
      editing five port files outside phase 2's scope. The ISO markers already settle
      the same question without a feature: each port rewrites its markers in its own
      `render`, and the base render refuses one that survives. The epoch markers follow
      that shape, so a port that never heard of them refuses rather than claiming
      a feature it does not have. The rule the row exists for, integer arithmetic
      and never a zone-aware function, is unchanged.
