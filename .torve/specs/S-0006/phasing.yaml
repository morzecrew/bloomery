# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: MetricFlow, the two cases the first column left
    intent: >-
      The first MetricFlow pass measured three of the twelve cases and named two it
      owed and did not run — `009-null-denominator` and `011-timezone-boundary` —
      where `fill_nulls_with` and `join_to_timespine` are both in the manifest schema
      and both look relevant. Looking relevant is not a cell. This phase authors the
      two bundles at the fixed layout, fills only the rows they answer, and leaves
      every other cell `UNKNOWN`. It finishes the column that already backs a live
      documentation sentence before a second system is opened, and it is the two rows
      where bloomery published a wrong number until recently, so the comparison is
      against the case as it now stands.
    scope: [comparisons/**, tests/unit/test_comparisons_floor.py]
    acceptance:
      - >-
        uv run pytest tests/unit/test_comparisons_floor.py -q
  - phase: 2
    title: dbt Core, the second column
    intent: >-
      dbt Core resolves at `1.12.3` as a dependency of this repository, so a bundle
      needs no install and D-10's version half applies to it as written — which also
      means the bundle directory must be added to the gate's distribution map or its
      version pin goes unchecked. This phase opens the column with the cases MetricFlow
      already answers, so that the first rows compared across three columns are rows
      where two of them are already measured, and marks every case it does not run
      `UNKNOWN`.
    scope: [comparisons/**, tests/unit/test_comparisons_floor.py]
    acceptance:
      - >-
        uv run pytest tests/unit/test_comparisons_floor.py -q
    depends_on:
      - 1
  - phase: 3
    title: SQLMesh, the third column
    intent: >-
      SQLMesh resolves at `0.236.1` as a dependency of this repository, so the same
      argument that makes dbt Core cheap makes this column cheap, and the same distribution
      map entry is owed. It follows dbt Core rather than running beside it because
      the table is edited by both and one system at a time is what keeps a half-measured
      column from being read as a measured one.
    scope: [comparisons/**, tests/unit/test_comparisons_floor.py]
    acceptance:
      - >-
        uv run pytest tests/unit/test_comparisons_floor.py -q
    depends_on:
      - 2
  - phase: 4
    title: dbt Core, the seven cases with no bundle
    intent: >-
      Add a dbt Core bundle under `comparisons/dbt/<case>/` for each of 001-order-shipping-fanout,
      003-scd2-unqualified-join, 004-currency-mix, 006-two-grains-one-request, 007-distinct-users-fanout,
      010-many-to-many-bridge and 012-rollup-recounts-identities, run through `comparisons/dbt/run.py`
      unchanged. Each bundle has the five entries the floor test checks (`README.md`
      with the `System:` pin and a `Checked:` date of the run, `config/`, `commands.txt`,
      `observed.txt` as that command's stdout verbatim, `sources.md` citing installed
      package files), reads the case's `schema/` and `data/` in place, and records
      what the system does with the case's question — measured, never from memory
      (D-2): a cell that cannot be run stays unrun and the README says why. Nothing
      in a bundle fetches at run time (no `dbt deps`, no hosted features). `comparisons/MATRIX.md`
      is not touched: phase 7 fills the cells from these bundles. D-2 and D-9 have
      no check, so the attempt owes divergence entries for them (`torve log owed`).
    scope: [comparisons/dbt/**]
    acceptance:
      - >-
        uv run pytest tests/unit/test_comparisons_floor.py -q
      - >-
        sh -c 'for d in comparisons/dbt/*/; do sh "$d/commands.txt" | diff -q - "$d/observed.txt"
        >/dev/null || { echo "$d does not reproduce"; exit 1; }; done'
    character: structural
  - phase: 5
    title: MetricFlow, the seven cases with no bundle
    intent: >-
      Add a MetricFlow bundle under `comparisons/metricflow/<case>/` for each of 001-order-shipping-fanout,
      003-scd2-unqualified-join, 004-currency-mix, 006-two-grains-one-request, 007-distinct-users-fanout,
      010-many-to-many-bridge and 012-rollup-recounts-identities. `comparisons/metricflow/run.py`
      renders one metric per request with no group-by and cannot create a relation;
      extend it additively, with grouped and multi-metric requests and a setup SQL
      file a bundle's `config/` may carry for a view its case needs, so that every
      existing bundle still reproduces its `observed.txt` byte for byte. Each bundle
      has the five entries the floor test checks (`README.md` with the `System:` pin
      and a `Checked:` date of the run, `config/`, `commands.txt`, `observed.txt`
      as that command's stdout verbatim, `sources.md` citing installed package files),
      reads the case's `schema/` and `data/` in place, and records what the system
      does with the case's question — measured, never from memory (D-2): a cell that
      cannot be run stays unrun and the README says why. Nothing in a bundle fetches
      at run time (no `dbt deps`, no hosted features). `comparisons/MATRIX.md` is
      not touched: phase 7 fills the cells from these bundles. D-2 and D-9 have no
      check, so the attempt owes divergence entries for them (`torve log owed`).
    scope: [comparisons/metricflow/**]
    acceptance:
      - >-
        uv run pytest tests/unit/test_comparisons_floor.py -q
      - >-
        sh -c 'for d in comparisons/metricflow/*/; do sh "$d/commands.txt" | diff
        -q - "$d/observed.txt" >/dev/null || { echo "$d does not reproduce"; exit
        1; }; done'
    character: structural
  - phase: 6
    title: SQLMesh, the seven cases with no bundle
    intent: >-
      Add a SQLMesh bundle under `comparisons/sqlmesh/<case>/` for each of 001-order-shipping-fanout,
      003-scd2-unqualified-join, 004-currency-mix, 006-two-grains-one-request, 007-distinct-users-fanout,
      010-many-to-many-bridge and 012-rollup-recounts-identities. `comparisons/sqlmesh/run.py`
      rewrites one metric with no GROUP BY; extend it additively with a query option
      for a grouped or multi-metric `METRIC(...)` request, so that every existing
      bundle still reproduces its `observed.txt` byte for byte. Model names avoid
      the relations a case's schema already creates (`silver.customer_tier` in 003,
      `silver.fx_rate` in 004). Each bundle has the five entries the floor test checks
      (`README.md` with the `System:` pin and a `Checked:` date of the run, `config/`,
      `commands.txt`, `observed.txt` as that command's stdout verbatim, `sources.md`
      citing installed package files), reads the case's `schema/` and `data/` in place,
      and records what the system does with the case's question — measured, never
      from memory (D-2): a cell that cannot be run stays unrun and the README says
      why. Nothing in a bundle fetches at run time (no `dbt deps`, no hosted features).
      `comparisons/MATRIX.md` is not touched: phase 7 fills the cells from these bundles.
      D-2 and D-9 have no check, so the attempt owes divergence entries for them (`torve
      log owed`).
    scope: [comparisons/sqlmesh/**]
    acceptance:
      - >-
        uv run pytest tests/unit/test_comparisons_floor.py -q
      - >-
        sh -c 'for d in comparisons/sqlmesh/*/; do sh "$d/commands.txt" | diff -q
        - "$d/observed.txt" >/dev/null || { echo "$d does not reproduce"; exit 1;
        }; done'
    character: structural
  - phase: 7
    title: The matrix reads what the new bundles measured
    intent: >-
      Fill `comparisons/MATRIX.md` from the bundles phases 4 to 6 landed: the 45 cells
      of the seven cases' 15 rows, each value one the bundle's `observed.txt` and
      README support under the six values `comparisons/README.md` defines (a cell
      a bundle left unrun stays `UNKNOWN`); the Last-checked and Coverage lines; each
      system's "Reading the ... column" section, which D-13 requires beside a filled
      column; and "Where bloomery loses", with any row the new cells add. No bundle
      changes. D-2 and D-13 have no check, so the attempt owes divergence entries
      for them.
    scope: [comparisons/MATRIX.md]
    acceptance:
      - >-
        uv run pytest tests/unit/test_comparisons_floor.py -q
    depends_on:
      - 4
      - 5
      - 6
    character: structural
contract_example:
  schema_version: 2
  id: T-0100
  spec: S-0006
  phase: 1
  role: implement
  title: MetricFlow, the two cases the first column left
  intent: >-
    The first MetricFlow pass measured three of the twelve cases and named two it
    owed and did not run — `009-null-denominator` and `011-timezone-boundary`. This
    phase authors the two bundles at the fixed layout, fills only the rows they answer,
    and leaves every other cell `UNKNOWN`.
  depends_on: []
  targets: []
  scope:
    allow: [comparisons/**, tests/unit/test_comparisons_floor.py]
    deny: []
  acceptance:
    - >-
      uv run pytest tests/unit/test_comparisons_floor.py -q
  decisions:
    - id: D-1
      grade: LOCKED
      text: >-
        A cell claims a property of a tested configuration, never a property of a
        product: every claim names the version, the date, the feature set and the
        configuration it was measured under, and a universal statement of the form
        "system X cannot do Y" is refused wherever it appears
      paths: [comparisons/**]
      consequence: ''
      check_state: shadow
    - id: D-2
      grade: LOCKED
      text: >-
        No cell is filled from reputation or memory; an unrun cell says `UNKNOWN`,
        which is an honest value and the default
      paths: [comparisons/**]
      consequence: ''
      check_state: shadow
  budget: {}
  tier: executor
