# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      A replay guard compares the macro with the project it was compiled with or the
      relations that are built, never with the spec that quarantined a row
    paths: [src/bloomery/emit/dbt/__init__.py]
    consequence: >-
      replaying after a spec change, which is replay's purpose, is never refused
    rationale: >-
      S-0033's replay re-runs the current mapping by design, and the tests replay
      after widening a rule
  - id: D-2
    grade: ASSUMED
    text: >-
      `dbt_project.yml` carries `vars: {bloomery_fingerprint: <project fingerprint>}`,
      and the dbt replay macro refuses before its first statement when the var differs
      from the fingerprint it was emitted under
    paths: [src/bloomery/emit/dbt/__init__.py]
    consequence: >-
      a replay left over from another compile, or run against a project compiled elsewhere,
      refuses instead of writing
    rationale: >-
      the byte fingerprint is exact between files one compile wrote together, and
      a refusal is cheap to clear by recompiling
    cites: [S-0060/D-3, S-0025/D-4]
  - id: D-3
    grade: ASSUMED
    text: >-
      Before its first statement the dbt replay macro checks that the entity and its
      reject table carry every column the statements write, and refuses, naming the
      missing columns and the rebuild that adds them
    paths: [src/bloomery/emit/dbt/__init__.py, src/bloomery/emit/lower/silver.py]
    consequence: >-
      a reject table missing a column the macro writes is refused before a statement
      commits, including on Databricks; one that has every column passes whatever
      its age
    rationale: >-
      without a transaction a half-applied replay is the state S-0060/D-14 exists
      to prevent
    cites: [S-0060/D-14]
  - id: D-4
    grade: ASSUMED
    text: SQLMesh's replay script is unchanged
    paths: [src/bloomery/emit/sqlmesh/__init__.py]
    consequence: no SQLMesh golden moves
    rationale: >-
      a script the caller runs has nothing at run time to compare against
  - id: D-5
    grade: ASSUMED
    text: >-
      No id-only fingerprint is introduced; if a guard ever needs a narrower scope
      it is a new entity fingerprint beside an unchanged `project_fingerprint`; this
      answers S-0067/Q-2 for replay
    paths: [src/bloomery/ir/fingerprint.py]
    consequence: >-
      the project fingerprint keeps every meaning it has
    rationale: >-
      S-0067's ids cover no entity, and a downstream fingerprint includes its upstream's
      whole (S-0002/D-3)
    cites: [S-0002/D-3, S-0067/D-1]
  - id: D-6
    grade: ASSUMED
    text: >-
      `how-to/emit-dbt.md` names rebuilding the entity and its reject table from the
      same checkout before a replay, and what the guard refuses
    paths: [pages/docs/how-to/emit-dbt.md]
    consequence: >-
      the documented order matches what the guard enforces
    rationale: >-
      the current example rebuilds only the reject table
  - id: D-7
    grade: ASSUMED
    text: >-
      bloomery writes no ledger into the warehouse: a stale checkout whose own compile
      is self-consistent is an operator error, and S-0086/D-6's documentation is its
      guard.
    paths: [src/bloomery/emit/dbt/__init__.py]
    consequence: >-
      every relation bloomery emits is owned by a model, and the replay guards read
      only what the compile and the relations already carry
    rationale: >-
      D-2 and D-3 catch the mismatches a compile can see; a ledger would be the first
      state no model owns, with its own permissions and a design per target, for the
      one case they cannot see.
  - id: D-8
    grade: ASSUMED
    text: >-
      `--out` deletes nothing; `how-to/emit-dbt.md` says to compile into a clean directory,
      and a left-over replay macro is what S-0086/D-2 refuses.
    paths: [pages/docs/how-to/emit-dbt.md]
    consequence: >-
      a hand-written file beside the emitted project is never removed by a compile
    rationale: >-
      Deleting needs a record of earlier writes and can remove files bloomery did
      not write; the case it would clean up is already refused.
  - id: D-9
    grade: ASSUMED
    text: >-
      Every incremental model the dbt emitter writes, an entity's and its reject table's,
      carries `on_schema_change='fail'`: a changed column set fails the run instead
      of leaving the table without the column, and the fix is `dbt build --full-refresh
      -s <entity> <entity>__reject`, which recomputes history as SQLMesh's rebuild
      does and loses resolved reject rows, as the how-to says.
    paths: [src/bloomery/emit/dbt/__init__.py]
    consequence: >-
      a field added to an incremental entity can never be silently missing from its
      dbt table, and dbt and SQLMesh agree on the history of the new column once the
      refresh runs
    rationale: >-
      dbt's default `ignore` drops a new column without a word. `append_new_columns`
      and `sync_all_columns` fill the new column with NULL for every earlier row,
      where SQLMesh recomputes it, so a consumer of the dbt target would undercount
      silently; `fail` is the only mode that keeps the targets agreeing, at the cost
      of a full refresh per schema change. The owner chose it on 2026-10-01.
  - id: D-10
    grade: ASSUMED
    text: >-
      `bloomery plan` names the dbt full refresh beside every change that adds, drops
      or renames a field of an incremental entity, naming the entity when it is an
      incremental type 1 model and its reject table whenever it quarantines (a `full`
      table rebuilds whole, and a type 2 entity is a snapshot that widens itself),
      reading the entity's materialization from the new IR, so the operator reads
      it in the plan rather than from a failed run; the change keeps its class, and
      SQLMesh's output is unchanged.
    paths: [src/bloomery/plan/diff.py, src/bloomery/cli/render.py]
    consequence: >-
      an ADDITIVE field on dbt costs a full refresh, and the plan says so before it
      is applied
    rationale: >-
      S-0024/D-1 classes an optional new field ADDITIVE (document §5.5's presence
      rule), which promises no backfill; on dbt under D-9 it needs one, and a promise
      the plan does not keep is worse than a cost it states.
    fingerprint: a27acac3cec42926/7c6179a571180cc5
