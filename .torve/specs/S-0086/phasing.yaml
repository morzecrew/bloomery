# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: The dbt replay refuses another compile
    intent: >-
      `dbt_project.yml` carries `bloomery_fingerprint`, and the replay macro refuses
      before its first statement on a mismatch; the guard does not use the `{% set
      statement_` prefix the property test splits on; SQLMesh replay bytes stay. The
      docs name the rebuild order. Goldens move for the dbt project files and replay
      macros. Settles D-1, D-2, D-4 and D-6. The how-to also says to compile into
      a clean directory.
    scope:
      - src/bloomery/emit/dbt/__init__.py
      - pages/docs/how-to/emit-dbt.md
      - tests/golden/**
      - tests/unit/test_emit/**
      - tests/property/test_compile_properties.py
      - tests/e2e/test_dbt_quality.py
      - examples/targets/out/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_emit tests/property/test_compile_properties.py
        tests/golden -q
      - uv run pytest tests/e2e/test_dbt_quality.py -q
    character: structural
  - phase: 2
    title: >-
      The dbt replay refuses a relation missing a column it writes
    intent: >-
      Measure `adapter.get_columns_in_relation(ref())` on the oldest and newest dbt-core
      bloomery supports, then check before its first statement that the entity and
      its reject table carry every column the statements write, case-insensitively,
      refusing with the missing names and the rebuild. Settles D-3 and D-5.
    scope:
      - src/bloomery/emit/dbt/__init__.py
      - src/bloomery/emit/lower/silver.py
      - tests/golden/**
      - tests/unit/test_emit/**
      - tests/e2e/test_dbt_quality.py
    acceptance:
      - >-
        uv run pytest tests/unit/test_emit tests/golden -q
      - uv run pytest tests/e2e/test_dbt_quality.py -q
    depends_on:
      - 1
    character: structural
  - phase: 3
    title: A schema change fails loudly on dbt
    intent: >-
      Every incremental dbt model, entity and reject alike, carries `on_schema_change='fail'`
      in its config header. `bloomery plan` appends the dbt full refresh to every
      field added to or dropped from an entity whose new `EntityIR.materialization`
      is incremental, in both its text and JSON renderings, without changing the change's
      class. The dbt goldens move; the end-to-end dbt test shows a field added between
      two builds failing the second build, and `--full-refresh` recovering it. The
      how-to's schema-change section says what fails, why, and the command. Settles
      D-9 and D-10.
    scope:
      - src/bloomery/emit/dbt/__init__.py
      - src/bloomery/plan/diff.py
      - src/bloomery/plan/model.py
      - src/bloomery/cli/render.py
      - tests/unit/test_emit/**
      - tests/unit/test_plan/**
      - tests/unit/test_cli.py
      - tests/golden/**
      - tests/e2e/test_dbt_quality.py
      - pages/docs/how-to/emit-dbt.md
      - CHANGELOG.md
    acceptance:
      - >-
        uv run pytest tests/unit/test_emit tests/unit/test_plan tests/unit/test_cli.py
        tests/golden -q
      - uv run pytest tests/e2e/test_dbt_quality.py -q
    depends_on:
      - 2
    character: routine
