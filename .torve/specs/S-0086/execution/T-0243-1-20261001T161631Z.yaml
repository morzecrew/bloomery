entries:
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-10-01T16:02:46Z'
    claim: >-
      The replay guard is not a security boundary to bypass: it exists (S-0086/D-2)
      to refuse a replay macro left over from another compile or run against a project
      compiled elsewhere, i.e. an accident. An operator who overrides bloomery_fingerprint
      with --vars is deliberately asserting the match and already holds the dbt credentials
      that let them run the same statements directly through any SQL client, so no
      privilege is gained. S-0086/D-2 names the dbt_project.yml var as the mechanism
      and S-0086/D-7 assigns operator error beyond a self-consistent compile to documentation;
      no change made.
    evidence: >-
      src/bloomery/emit/dbt/__init__.py:502-508 — guard compares var('bloomery_fingerprint')
      with the emitted fingerprint; src/bloomery/emit/dbt/__init__.py:1903-1904 is
      where dbt_project.yml carries the var, as S-0086/D-2 specifies
    action: decided
    proposal: >-
      ASSUMED — the dbt replay guard defends against stale or foreign macros, not
      against an operator who overrides bloomery_fingerprint via --vars; an explicit
      override is an operator assertion and is honoured
