# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-10-01T14:57:49Z'
    title: The owner settles Q-3
    changes:
      - subject: D-9
        field: text
        after: >-
          Every incremental model the dbt emitter writes, an entity's and its reject
          table's, carries `on_schema_change='fail'`: a changed column set fails the
          run instead of leaving the table without the column, and the fix is `dbt
          build --full-refresh -s <entity> <entity>__reject`, which recomputes history
          as SQLMesh's rebuild does and loses resolved reject rows, as the how-to
          says.
      - subject: D-10
        field: text
        after: >-
          `bloomery plan` names the dbt full refresh beside every change that adds
          or drops a field of an incremental entity, reading the entity's materialization
          from the new IR, so the operator reads it in the plan rather than from a
          failed run; the change keeps its class, and SQLMesh's output is unchanged.
    md: >-
      The owner answered Q-3 on 2026-10-01: incremental dbt models fail on a schema
      change (D-9), and the plan names the full refresh that fixes it (D-10). Phase
      3 builds both. Of the four modes dbt offers, `ignore` drops a new column silently,
      `append_new_columns` and `sync_all_columns` give it NULL history where SQLMesh
      recomputes it, and `fail` alone keeps the targets agreeing.
  - id: A-2
    at: '2026-10-02T10:26:54Z'
    title: The refresh covers renames and spares snapshots
    changes:
      - subject: D-10
        field: text
        before: >-
          `bloomery plan` names the dbt full refresh beside every change that adds
          or drops a field of an incremental entity, reading the entity's materialization
          from the new IR, so the operator reads it in the plan rather than from a
          failed run; the change keeps its class, and SQLMesh's output is unchanged.
        after: >-
          `bloomery plan` names the dbt full refresh beside every change that adds,
          drops or renames a field of an incremental entity, naming only the reject
          table for a type 2 entity, whose dbt snapshot widens itself, reading the
          entity's materialization from the new IR, so the operator reads it in the
          plan rather than from a failed run; the change keeps its class, and SQLMesh's
          output is unchanged.
      - subject: D-10
        field: fingerprint
        after: 92021ca4379f400c/7c6179a571180cc5
    md: >-
      Phase 3's review found two edges D-10 did not name. A rename changes the column
      set exactly as an addition does, so it carries the refresh too (T-0256). A type
      2 entity is a dbt snapshot, which widens itself and carries no `on_schema_change`,
      so its hint names only the reject table, and nothing when it has none.
