# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      **The completion criterion is `QueryPlan.semantic` becoming non-optional**,
      not the node count. A phase that adds nodes and leaves the field optional has
      changed nothing a caller can depend on and nothing S-0058/the-planner-claim
      can be published against. Locked because it is the whole purpose: every other
      row here is a means to it, and a plan-shaped deliverable that stops short would
      read as done.
    paths:
      - src/bloomery/cli/__init__.py
      - src/bloomery/planner/result.py
      - src/bloomery/planner/semantic_plan.py
  - id: D-2
    grade: LOCKED
    text: >-
      **No request that is answered today may start being refused.** Making the field
      non-optional by refusing the four shapes satisfies row 1 and is a capability
      regression sold as a soundness improvement — the refusal would mean "bloomery
      cannot describe this", which is not a safety statement. Locked because it is
      the cheap path to a green suite and it would be defended as rigour.
    paths: [src/bloomery/planner/semantic_plan.py]
  - id: D-3
    grade: LOCKED
    text: >-
      **Every node that makes a claim ships with the rule that closes it, in the same
      change.** `check()` asks the node whether it claims, so a node landing with
      `claims = False` is exempt from proof permanently and invisibly. A node and
      its rule are one unit of work; splitting them is how the exemption gets introduced
      as temporary.
    paths: [tests/unit/test_semantic/test_plan.py]
  - id: D-4
    grade: ASSUMED
    text: >-
      **Three nodes, one per operation kind — arithmetic, reduction, window — rather
      than one general node.** A single opaque node satisfies row 1 with a third of
      the work and makes `check()` meaningless: every unmodelled shape arrives as
      a closed proof of nothing. Not `LOCKED` because a fourth shape might genuinely
      warrant merging two of these; the escape-hatch shape is what row 3 and S-0065/D-3's
      reasoning refuse.
  - id: D-5
    grade: ASSUMED
    text: >-
      **These rules explain an existing acceptance rather than converting a refusal,
      and are held to that bar instead of S-0056/D-5's.** Every shape here is answered
      correctly today, so `SafeQueries` does not grow and no case moves from `unguarded`
      to `accepted` — checked, not assumed: the two `unguarded` cases are unrelated,
      `005-semi-additive-balance` is already `accepted` citing a retired guardrail
      row, and no cumulative case exists (§3). D5's "a rule with nothing to convert"
      was written for capability-widening rules and would block these for lacking
      evidence they cannot in principle have. The bar instead: the rule states something
      falsifiable about the declaration it reads, and the corpus case that was accepted
      on a guardrail's authority now cites the rule.
  - id: D-6
    grade: ASSUMED
    text: >-
      **`Compute` carries a proof because the *ordering* is the claim, not the arithmetic.**
      Division needs no authorization; computing after aggregation rather than before
      is S-0055/D-1 and changes the number. Not `LOCKED` because if a later reading
      shows the ordering is structural — forced by where the node sits — the proof
      becomes decoration and the row should be revisited rather than defended.
  - id: D-7
    grade: ASSUMED
    text: >-
      Per-measure restriction scopes on `Filter`. `Filter.measures` names the measures
      its predicates restrict, empty meaning every measure beneath, because `Filter`
      is the node that makes the restriction claim. A scoped `Filter` with no predicates
      is refused at construction.
    fingerprint: 9e29cb918413b73a/202c11f3690cefb1
  - id: D-8
    grade: ASSUMED
    text: >-
      `_plannable` is replaced by `_measures_are_embedded`, the precondition of R008
      alone: every reduced number is a measure the mart embeds, at a statable additivity.
      Its other three exclusions became plan nodes, and `build` returns `None` only
      where coverage or the additivity guardrail has already refused.
    paths: [src/bloomery/planner/semantic_plan.py]
    fingerprint: 3234bb4ae0485c21/483498c4fe039a93
  - id: D-9
    grade: ASSUMED
    text: >-
      No semantic-corpus case evidences the cumulative shape. R016 is evidenced by
      plan-level tests: `test_a_cumulative_metric_states_its_window` asserts the `Window`
      node, its frame and its proof, and `test_the_window_rule_and_the_rollup_refusal_agree`
      ties R016's terminal half to the rollup lowering's refusal of a `cumulative:`
      measure
    paths:
      - tests/unit/test_semantic/test_plan.py
      - tests/fixtures/semantic_corpus/README.md
      - src/bloomery/marts/rollup.py
    consequence: >-
      The corpus stays limited to cases where valid SQL returns a wrong number, and
      a change to R016 or to the rollup refusal meets a unit test rather than a fixture
    rationale: >-
      A cumulative metric was answered correctly before `Window` existed, so a corpus
      case written for it would be admitted for the wrong reason and dilute what the
      corpus proves; execution departed from P3's plan to write one on that ground
      (log T-0037)
    cites: [D-5, S-0065/D-5]
