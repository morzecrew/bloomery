out_of_scope: |-
  - Data-dependent evidence of any kind. The boundary, restated in §5.5.
  - Cost or row-count estimation.
  - Approve/reject judgement, scoring, or confidence.
  - Replacing `resolve()` or `compile_project()`.
  - Caching. Callers cache on `fingerprint`, as they do for compilation.
risks: |-
  | Risk | Mitigation |
  |---|---|
  | `evaluate()` becomes the place data-dependent evidence gets added | §5.5 and decision 6 state the refusal; S-0036's purity guard blocks an engine import in `src/` structurally. The pressure is predictable and the guard is not advisory. |
  | `stage_reached` is ignored and an empty `unreachable` at `PARSE` is read as "all reachable" | The docstring leads with it; §6 tests the ambiguous case; the CLI renderer prints the stage first. It cannot be made impossible, only loud. |
  | Partial analysis reports a shape derived from an invalid spec | §5.2: stages are never reordered or skipped to salvage more, and analysis stops at the first refusing stage. An over-eager partial answer is worse than an incomplete one. |
  | A third entry point diverges from `compile_project`'s view of a spec | It composes the same `build_project_ir` → `resolve` path; §6's equality test against `resolve()` is the guard. |
  | The narrow `except BloomeryError` swallows a bug wearing a `BloomeryError` | Known and named: `InvariantViolated` is exactly that, and is re-raised explicitly (§5.3). Any future leaf meaning "bloomery bug" must join it — recorded as the assumption this rests on. |
sections:
  - key: about
    md: |-
      - **Status:** 📝 Draft
      - **Scope:** One new public function, `evaluate(project) -> SpecEvidence`, returning
        everything knowable about a spec **without touching data**: reachable and unreachable
        metrics with their specific missing leaves, batched refusals with source paths, and a
        mart summary. A re-presentation of `resolve()` plus batched compile errors under one
        call and one return type. Adds no analysis bloomery does not already perform, executes
        nothing, and reads no data.
      - **Related:** S-0022 (`Resolution`, reachability with specific missing leaves — the
        substance this exposes), S-0019 (batched errors with source paths), S-0023 (the
        batched guardrail stage), S-0027 (mart grain and flattening — the summary),
        S-0035 (**blocking**: signature closure covers
        the new return type),
        S-0037 (landed as M17 and retired; `bloomery resolve` is re-pointed at this in M19),
        S-0038 §5.5 (the boundary this respects).
      - **Adoption audit:** every claim in §3 verified; no corrections were needed.
  - key: decision-notes
    md: >-
      _(Decision rows from here on are this document's D-1…; see `decisions.yaml`.)_
  - key: phasing
    md: |-
      Design locked by this RFC; implementation lands as wave **M19**, after S-0035's M15
      (decision 1 adds root exports, which the signature-closure test must already exist to
      police). S-0037's M17 has landed, so `bloomery resolve` exists and is re-pointed rather
      than written twice.

      Independent of S-0036 and S-0038.

      Within the wave: `SpecEvidence` and the stage-stopping pipeline first (decisions 1–5, 7),
      then the CLI re-point (decision 8). That re-point can no longer be "an amendment appended
      to S-0037" as decision 8 words it — M17 landed and the document was retired with it, so
      the amendment lands as the change itself: `bloomery resolve` calls `evaluate()`, and
      `pages/docs/how-to/use-the-cli.md` says what it now reports.
questions:
  - id: Q-1
    text: >-
      1. Should `SpecEvidence` carry the compiled artifacts when `stage_reached is
      COMPLETE`? It would let a caller replace `compile_project` entirely. Leaning:
      no — a type meaning "assessment" should not sometimes also mean "output," and
      compilation is per-target while evidence is not. 2. Should `MartSummary` include
      an estimated column count, or anything shape-adjacent beyond names? Leaning:
      no — it is one step from row estimates, which is one step from needing data.
      3. Does `evaluate()` need a `targets` parameter, so target-specific refusals
      (`UnsupportedByTarget`) appear? Today it stops before emission and cannot see
      them. Leaning: yes eventually, as `targets: tuple[Target, ...] = ()` with an
      `EMIT` stage — but only once a consumer needs it, since it makes evidence target-dependent
      and the proposal loop's first question is target-independent. 4. Should `Stage`
      be public, or is exposing the pipeline's internal sequence a coupling bloomery
      will regret? It must be public for `stage_reached` to be readable; the question
      is whether adding a stage is then a breaking change. Leaning: treat `Stage`
      as an open enum in the policy — consumers compare against `COMPLETE` and treat
      everything else as incomplete.
