        before: OPEN
        after: ASSUMED
      - subject: D-8
        field: text
        before: >-
          What happens to a rule identifier when a rule is split or subsumed. They
          become a public contract the moment continuous integration asserts on them,
          so decide the versioning discipline before the first identifier ships, since
          the choice is unmakeable afterwards
        after: >-
          Rule identifiers in `RULES` are append-only: an id is never reused or repointed.
          A split or a subsumption mints new ids. The old `Rule` keeps its entry,
          with `superseded_by` naming its replacements and its id listed in `SUPERSEDED`.
          `Proof` refuses any rule id that is not in `RULES`.
      - subject: D-8
        field: fingerprint
        after: 6c3959e6a868f764/8c4f61cccc92992d
