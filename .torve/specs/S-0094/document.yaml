# yaml-language-server: $schema=../../schemas/document.json
id: S-0094
title: >-
  Descriptions, labels and synonyms on fields and metrics
kind: design
change:
  type: feat
  scope: spec
status: draft
implementation: none
depends_on: [S-0024]
informed_by: [S-0011, S-0027, S-0030, S-0062, S-0079]
supersedes: []
superseded_by: null
owner: Lev Litvinov
schema_version: 4
summary: |-
  Descriptions, labels and synonyms as annotations that route to their targets' own slots. An entity field gains `description:`, `label:` and `synonyms:`, a metric gains `label:` and `synonyms:`, and each reaches the slot its target has for it: MetricFlow's `description`, `label` and `config.meta`, Cube's `description`, `title` and `meta`, dbt's column `description`. None of them changes a SELECT, and a change to any of them is metadata-only in a plan.

  Today a field's description arrives only through a bound `canonical:` field, which restates the column's history to add a sentence, and Cube receives no description at all, not even a metric's.
motivation: |-
  **A dimension has nowhere to say what it is (#313).** `Field` refuses `description:` (`SpecModel` is `extra="forbid"`, `spec/common.py:469`), so a wide mart carries `product_brand` and `customer_kind` with nothing a catalog page, a chart axis or an agent choosing dimensions can show. Metrics have `description` (`spec/metrics.py:364`); the dimensions they are grouped by do not.

  **The workaround restates history.** The one way a column gets a description today is binding a catalog canonical field that has one (`resolve/build.py:585`). Binding `canonical:` is a RESTATING change, which adds the entity to the backfill scope (S-0024/D-4): a project pays a backfill to attach a sentence.

  **Synonyms are written into prose (#311).** A front end that maps a question to a `MetricRequest` matches the user's words to metric names. Users say «продажи», «оборот» or «сколько заработали» for `revenue`, and today the reporter writes them into the description, `Выручка по заказам, с НДС, по дате заказа. Синонимы — продажи, оборот, сколько заработали`. That mixes two things in one string, and MetricFlow and Cube receive the synonyms as prose.

  **Cube emits no description.** Searching `emit/cube/__init__.py` and the Cube goldens finds no `description` and no `title`: a metric's authored description reaches MetricFlow and stops there.
current_state: |-
  - **Spec.** `Field` (`spec/entity.py:67`) carries `type`, `required`, `canonical`, `renamed_from`, `assert`, `classification` and `determines`. `Metric` carries `description` (`spec/metrics.py:364`), merged from a template with the authored value first (`resolve/metrics.py:99`). Neither has a label or synonyms.
  - **IR.** `ColumnIR.description` already exists (`ir/nodes.py:661`) and is filled from the bound canonical field only (`resolve/build.py:585`, `:657`, `:667`). `MetricIR.description` exists (`ir/nodes.py:1061`). Neither node has a label or synonyms. `bloomery_ir_version` is 26 (`ir/nodes.py:1797`), and the canonical encoder writes every dataclass's field names and count (`ir/fingerprint.py:65`).
  - **MetricFlow.** Dimensions take their source column's description through `(source_entity, source_column)` (`emit/metricflow/__init__.py:843`, `:360`), so a prefixed mart column and a date role's day bucket already inherit it. Metrics carry `description` (`:676`, `:700`). The semantic interfaces at 0.213.0 offer `description`, `label` and `config` on both `PydanticDimension` and `PydanticMetric`; `config.meta` already carries `owner` (`_config`, `:458`, S-0087/D-1).
  - **Cube.** `_dimensions` (`emit/cube/__init__.py:226`) and `_measures` (`:336`) write no `description` and no `title`. A measure's `meta` carries `additivity`, `owner`, `grain` and the semi-additive policy (`_metric_meta`, `:158`).
  - **dbt.** `schema.yml` lists an entity model's columns when they carry tests or a classification (`emit/dbt/__init__.py:1223`), with the classification under `meta`. No `description` is written.
  - **SQLMesh.** No description is written.
  - **Plan.** A change to `ColumnIR.description` is already ADDITIVE, "description changed (metadata only)", with no backfill (`plan/diff.py:763`).
goals: |-
  - A field states its own description, label and synonyms, and a metric its label and synonyms, without binding a catalog field.
  - Each reaches every target that has a slot for it, through that slot and no other, and Cube gains the descriptions it has never had, metrics' included.
  - A mart column carries its source field's description, label and synonyms, as MetricFlow already does for descriptions.
  - No SELECT changes, and a change to any of the three is metadata-only in a plan.
non_goals: |-
  - **A free `meta:` passthrough.** S-0062/D-3 (LOCKED) prefers routed keys to an open map, because a key nobody routes cannot be refused when a target has no slot for it.
  - **A per-mart override of a column's description.** A mart has no per-column authoring surface (S-0027/D-6), and a description belongs to the data, which is the same column under any prefix.
  - **Localisation.** One label and one description per field or metric; a translated catalog is a different design.
  - **Embedding or ranking descriptions.** That is retrieval (S-0011).
design:
  - key: the-spec-surface
    md: |-
      ```yaml
      # entity_model.yaml
      fields:
        brand:
          type: string
          description: The brand printed on the product, as the supplier spells it
          label: Brand
          synonyms: [бренд, марка, производитель]

      # metrics.yaml
      metrics:
        revenue:
          grain: order
          additivity: additive
          agg: sum
          expr: total
          description: Order revenue including VAT, by order date
          label: Revenue
          synonyms: [продажи, оборот, сколько заработали]
      ```

      `description`, `label` and `synonyms` are optional on `Field`; `label` and `synonyms` are optional on `Metric`, beside its existing `description`. Each string is refused empty after stripping, and `label` is refused if it holds a line break, because every target renders it as a single-line title. `synonyms` is a list of distinct non-empty strings, refused when two are equal. The IR stores it sorted, so the authored order never reaches an artifact's bytes (S-0020). A metric template (`MetricTemplate`, in `spec/catalog.py`) gains the same two keys, and they merge like its `description`: the authored value wins, and an absent one takes the template's. For `synonyms` absence is `None`, not an empty list, so a metric can write `synonyms: []` to drop a template's.
  - key: precedence-with-the-catalog
    md: >-
      `ColumnIR.description` is the field's own `description:` when it has one, and
      the bound canonical field's otherwise. That is the order metrics already use,
      authored over template. A project can then describe a column without binding
      a canonical field, and a project that binds one keeps the catalog's text unless
      it writes its own. The label has no catalog counterpart and comes from the field
      alone.
  - key: where-each-lands
    md: |-
      | Annotation | MetricFlow | Cube | dbt `schema.yml` | SQLMesh |
      |---|---|---|---|---|
      | field `description` | dimension `description` (as today) | dimension `description` | column `description` | — |
      | field `label` | dimension `label` | dimension `title` | — | — |
      | field `synonyms` | dimension `config.meta.synonyms` | dimension `meta.synonyms` | column `meta.synonyms` | — |
      | metric `description` | metric `description` (as today) | measure `description` | — | — |
      | metric `label` | metric `label` | measure `title` | — | — |
      | metric `synonyms` | metric `config.meta.synonyms` | measure `meta.synonyms` | — | — |

      A metric has no dbt schema entry and no SQLMesh model of its own (the `_metric_meta` comment says so), so those columns stay empty. The dbt emitter writes a model's `schema.yml` entry today only for a column with tests or a classification (`emit/dbt/__init__.py:1223`), and a mart's only when it has an owner or grants, so an annotated column is a third reason for an entry and a mart's columns are listed for the first time. SQLMesh has `column_descriptions` and is left out until someone asks for it, since no consumer of the SQLMesh artifacts has. Synonyms never go into `label` or `description`: `label` is one display string, and the complaint in #311 is exactly that prose and synonyms share one slot.
  - key: through-the-flatten
    md: >-
      A mart column carries the description, label and synonyms of the column it was
      flattened from, prefixed or not, and a date role's buckets carry their source
      column's. MetricFlow already does this for descriptions by looking the column
      up through `(source_entity, source_column)`, and Cube and dbt marts use the
      same lookup. This is not the inheritance S-0062/D-2 refuses for `owner`. An
      owner is a claim about who answers for a relation, and a mart is a different
      relation; a description is a claim about the data, and a prefixed column is
      the same data.
  - key: the-ir-and-the-plan
    md: >-
      `ColumnIR` gains `label: str | None` and `synonyms: tuple[str, ...]`, and `MetricIR`
      gains `label: str | None` and `synonyms: tuple[str, ...]`. `bloomery_ir_version`
      moves by one with them, because the canonical encoder writes field names and
      counts, so every fingerprint moves whether or not a project declares anything
      (S-0079/D-2's reasoning). In `plan/diff.py`, a change to a column's `label`
      or `synonyms`, or to a metric's `description`, `label` or `synonyms`, joins
      the column description's existing branch: ADDITIVE, metadata only, no backfill.
      Moving a description from a canonical binding to the field's own key is a metadata
      change. Only the `canonical:` link itself moving is RESTATING (S-0024/D-4).
tests: |-
  - Load: each new key is accepted where it belongs and refused elsewhere, an empty string and a label with a line break are refused, duplicate synonyms are refused, and a template's label and synonyms merge under the authored ones (D-2, D-3).
  - IR: a field's own description wins over its canonical field's, synonyms are sorted, and `bloomery_ir_version` is the bumped value (D-2, D-4).
  - dbt: an entity whose only column metadata is an annotation, and an unowned mart without grants, both get `schema.yml` entries listing the annotated columns (D-5).
  - Emit: one fixture declaring every annotation compiles for every target, and each value appears in exactly the slots of the routing table. Every existing golden's SQL is byte-identical, which is the assertion D-1 makes, not an assumption (D-1, D-5, D-6).
  - Cube: a fixture's metric description now reaches its measure (D-6).
  - Flatten: a prefixed mart column and a day bucket carry their source's description, label and synonyms on MetricFlow, Cube and dbt (D-7).
  - Plan: a description, label or synonyms change is ADDITIVE metadata-only with an empty backfill, and moving a description off a canonical binding without changing the link restates nothing (D-8).
docs: |-
  - `spec-schemas.md`: the new keys on `Field` and `Metric`.
  - `annotate-a-spec.md`: the routing table, beside owner and classification.
  - `emit-cube.md` and `emit-dbt.md`: what each annotation becomes there; the MetricFlow slots go in `annotate-a-spec.md`'s table, since no page is the MetricFlow target's own.
  - The agent skill's metrics and entity references: synonyms on a metric or a field instead of in its description.
  - A changelog entry naming the IR version bump.
out_of_scope: >-
  - SQLMesh `column_descriptions`, until a consumer of the SQLMesh artifacts asks.
risks: |-
  - **Every Cube golden whose fixture describes a metric moves**, gaining a `description:` line. That is the D-6 change landing, not drift, and the review should read it as such.
  - **Every fingerprint moves once** with the IR version, and `plan()` refuses to diff across it. A project's first plan after upgrading cannot be shown as metadata-only.
  - **No target reads `meta.synonyms` by itself.** A front end reads it from the artifact; a reader expecting Cube or MetricFlow to match synonyms natively will be disappointed, and the docs say so.
  - **A description is a claim nothing checks.** bloomery carries the text; whether it is true is the author's, as with `owner`.
sections:
  - key: about
    md: >-
      Raised by #311 (synonyms) and #313 (field descriptions), from a project that
      generates fields from source profiles and wants the reason an analyst approved
      to travel with the column. Triaged against `main` at `89185408`.
alternatives:
  - option: >-
      An open `meta:` map on fields and metrics, passed to every target.
    rejected_because: >-
      S-0062/D-3 rejected it for classification: a key nobody routes cannot be refused
      where a target has no slot for it, and it cannot be checked. Three routed keys
      cost three rows of the routing table.
  - option: >-
      Synonyms written into `label` or into `description`.
    rejected_because: >-
      `label` is a single display string, and the description is prose for a reader;
      #311's complaint is that the two uses already share one slot.
  - option: >-
      Keep descriptions on the catalog's canonical fields only.
    rejected_because: >-
      It is today's workaround, and binding `canonical:` is RESTATING with a backfill
      (S-0024/D-4) for a change that alters no value.
  - option: >-
      Let a mart override a flattened column's description.
    rejected_because: >-
      A mart has no per-column authoring surface (S-0027/D-6), and two marts describing
      one column differently is a disagreement about the data with nowhere to resolve
      it.
questions:
  - id: Q-1
    text: >-
      Whether synonyms belong on entity fields and mart dimensions too, and if so
      where. Either S-0011's retrieval kind carries them, or `Field` does and S-0011/D-1
      (LOCKED) is amended to say lexical aliases are not retrieval semantics. The
      owner's reading to make.
    status: settled
    settled_by: D-9
