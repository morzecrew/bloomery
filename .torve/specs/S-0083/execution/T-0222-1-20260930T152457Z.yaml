  - decision: D-6
    grade: ASSUMED
    kind: departed
    at: '2026-09-30T15:19:03Z'
    claim: >-
      the window is not spelled with @start_ds/@end_ds: in an audit on an INCREMENTAL_BY_TIME_RANGE
      model the pinned SQLMesh already renders @this_model as the physical table filtered
      to the run's interval on the time column, typed to that column; a literal @start_ds
      BETWEEN would drop all but midnight of the last day on a timestamp column. Keys
      come from @this_model and are counted against the unfiltered table via @resolve_template(...,
      'table'); every other kind and every dbt entity reads the whole model
    evidence: >-
      .venv/lib/python3.13/site-packages/sqlmesh/core/model/definition.py:504-540
      — this_model is a subquery filtered by time_column.between(start, end) in render_audit_query;
      src/bloomery/emit/sqlmesh/__init__.py:880-892 is the emitted form
    action: departed
  - decision: unlisted
    grade: UNLISTED
    class: spec-gap
    at: '2026-09-30T15:19:11Z'
    claim: >-
      the contract does not say whether rows with a NULL key part share a key; the
      audit groups by the key as written, so two rows with the same NULL key part
      collide and fire. Null keys are the not_null/coercible rules' subject, and no
      fixture run by the suite reaches silver with one
    evidence: >-
      src/bloomery/emit/lower/silver.py:1836-1842 — plain GROUP BY over entity.key,
      no IS NOT NULL filter
    action: decided
    proposal: >-
      ASSUMED — the key audit groups NULL key parts together; a row with a null key
      part is reported by the key audit as well as by any not_null rule
