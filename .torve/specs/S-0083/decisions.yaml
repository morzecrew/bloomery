# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      Every entity with a declared key and no `dedupe` gets one generated, blocking
      audit, `<entity>_key_unique`: no two rows share the key, among the current versions
      on an `scd: type2` entity and among all rows otherwise
    paths:
      - src/bloomery/emit/lower/silver.py
      - src/bloomery/emit/sqlmesh/__init__.py
      - src/bloomery/emit/dbt/__init__.py
    consequence: >-
      a build whose data breaks a declared key stops before a mart or a rollup reads
      it
    rationale: >-
      the closure proves rollups from declared keys, so an unchecked key is an unchecked
      premise under every proof built on it; blocking only, with no `warn`, because
      a build that carried on would publish marts whose rollups are reported proved
      on a premise the data breaks — an author whose source repeats keys declares
      `dedupe`, and a project upgrading onto the audit is told so by the changelog
    cites: [S-0017/D-3, S-0080/D-4]
  - id: D-2
    grade: ASSUMED
    text: >-
      `dedupe` is the one declaration that enforces a key by construction, and an
      entity declaring it gets no key audit; a `unique` rule does not count, and neither
      does an incremental merge
    paths: [src/bloomery/emit/lower/silver.py]
    consequence: >-
      an author who already guarantees the key pays no scan, and one who does not
      is checked
    rationale: >-
      dedupe partitions by the entity key; `unique` is per partition slice (S-0033/D-5),
      and a merge's handling of one key delivered twice depends on the engine
    cites: [S-0033/D-5]
  - id: D-3
    grade: ASSUMED
    text: >-
      On a type2 entity the audit reads the current version through `emit/lower/predicates.py::current_version`,
      the predicate S-0080's marts read
    paths:
      - src/bloomery/emit/lower/silver.py
      - src/bloomery/emit/lower/predicates.py
    consequence: >-
      the audit and the mart agree on which version is current by construction
    rationale: >-
      two readings of `current` would let the audit pass on data the mart reads wrongly
    cites: [S-0080/D-2]
  - id: D-4
    grade: ASSUMED
    text: >-
      The audit is derived at emit time from the key, the `scd` kind and `dedupe`
      already in the IR; `bloomery_ir_version` does not move
    paths:
      - src/bloomery/emit/sqlmesh/__init__.py
      - src/bloomery/emit/dbt/__init__.py
    consequence: >-
      no fingerprint moves for the IR's sake; goldens change only by the new audit
    rationale: >-
      every fact the audit needs is already carried, and an IR bump would move every
      artifact for nothing
  - id: D-5
    grade: ASSUMED
    text: >-
      The claims page says a declared key is a `LOCKED` premise that the build checks,
      and the data quality page lists the generated audit and how `dedupe` removes
      it
    paths:
      - pages/docs/concepts/what-bloomery-proves.md
      - pages/docs/concepts/data-quality.md
    consequence: >-
      a reader learns the key is checked, not only trusted
    rationale: >-
      S-0058 lets the docs claim only what the build does
    cites: [S-0058/D-1]
  - id: D-6
    grade: ASSUMED
    text: >-
      On an `incremental_by_partition` entity emitted to SQLMesh (`INCREMENTAL_BY_TIME_RANGE`)
      the audit checks only the keys in the run's `@start_ds`..`@end_ds` range of
      the model's time column against the whole model; a `full` entity, an `incremental_by_key`
      entity (`INCREMENTAL_BY_UNIQUE_KEY`, whose writes no window bounds), an `scd:
      type2` entity and every entity emitted to dbt audit the whole model
    paths:
      - src/bloomery/emit/sqlmesh/__init__.py
      - src/bloomery/emit/lower/silver.py
    consequence: >-
      a daily run pays for its own keys rather than for the whole history, and dbt's
      incremental entities pay the whole-model scan until a project needs otherwise
    rationale: >-
      Measured 2026-09-30 on bloomery's generated `silver.order_item`: over a full
      build the audit is 14–15% of the build on DuckDB (10M, 50M rows) and 19–29%
      on PostgreSQL 16 (5M, 20M); on a daily incremental run of 20M rows with a 1%
      slice, PostgreSQL built the slice in 6.05s, the whole-model audit took 9.95s
      and the run-scoped one 2.41s (2.15s indexed). Scoping is sound because a new
      duplicate must involve a key the run wrote, earlier runs having checked the
      rest. A dbt test has no notion of the run's window, so dbt cannot scope without
      run metadata not every entity carries; the range is the run's write set only
      where SQLMesh confines a run's writes to it, which is the time-range kind —
      a key-incremental run can write a late or back-dated key outside any window
      (bloomery #231 review)
    cites: [D-1]
