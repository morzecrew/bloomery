  - id: D-8
    grade: OPEN
    text: >-
      Whether an optional field a mapping does not produce needs explicit acknowledgement,
      and in what spelling. Silence is indistinguishable from a typo, which argues
      for acknowledgement; `unmapped:` is the nearest existing mechanism but is source-column-shaped.
      Whoever builds it decides and logs it.
  - id: D-9
    grade: ASSUMED
    text: >-
      Change classification needs no new class — but adding a mapping to a single-source
      entity is **two** `ADDITIVE` changes, rows and the `_source` column, not one.
      `_source` exists only on merged entities (D7), so the column set does depend
      on mapping count; emitting it everywhere to avoid that would churn every golden
      in the corpus for a constant. Verify the removal rows during implementation:
      dropping to one mapping removes `_source`, and anything reading it must trip
      the existing contract check.
    paths:
      - tests/unit/test_plan/test_diff.py
      - tests/unit/test_resolve/test_build.py
  - id: D-10
    grade: OPEN
    text: >-
      `scd: type2` combined with multi-source. The collision audit would misfire across
      versions, and fixing it needs validity columns nothing models (S-0040/phase-2-the-as-of-join).
      Refusing the combination is the expected answer; whoever builds this decides
      and logs it.
  - id: D-11
    grade: OPEN
    text: >-
      Whether the union stage emits a generated `IS NULL` audit over `required: true`
      columns. D4's coverage check proves each mapping *declares* the field and proves
      nothing about what its source path returns per row — `required:` is a schema
      declaration, and the runtime null check is the separate `assert: {not_null:
      true}` mechanism. The asymmetry predates this RFC; a merge makes it worse, because
      one bad source poisons a column the others fill correctly. Whoever builds this
      decides, and the decision is either the audit or an explicit statement that
      `required:` means coverage only.
  - id: D-12
    grade: LOCKED
    text: >-
      `(target, source)` is **unique**: two mappings for one entity may not read the
      same source relation. Lexicographic ordering needs a total order and two branches
      on one relation tie, which would leave branch order undefined, `_source` ambiguous,
      and the collision audit unable to name a branch. Consequence: reading one relation
      twice is expressed as one mapping with a filter, not two mappings.
    paths:
      - src/bloomery/emit/lower/silver.py
      - src/bloomery/resolve/build.py
      - tests/unit/test_guardrails/test_quality.py
      - tests/unit/test_resolve/test_build.py
  - id: D-13
    grade: LOCKED
    text: >-
      The collision audit reads the **union output, before dedupe**, and groups by
      **every** declared key column. Reading `silver.order` would let dedupe collapse
      the colliding rows before the audit counts them — the audit would be checking
      the one relation guaranteed not to contain what it looks for. Grouping by a
      partial key would merge distinct composite keys and block valid data, which
      on a blocking audit is the worst failure available.
    paths:
      - src/bloomery/emit/lower/silver.py
      - tests/execution/test_merged_cleaning.py
      - tests/unit/test_emit/test_quality_artifacts.py
  - id: D-14
    grade: LOCKED
    text: >-
      **P1 refuses `dedupe:` and `quarantine:` on a merged entity** (§5.6). The boundary
      is drawn at those two block-level declarations because it is exact, not approximate:
      every use of the per-source row identity in the silver lowering sits behind
      one of them — the reject projection, the conservation audit, the dedupe sort
      key, the replay merge — and the `on_fail: fail` audit path references it zero
      times. A merged entity may still carry field and row rules (`flag`/`fail`),
      `assert:`, `references:` and `coverage:`. Consequence: P1 ships the union to
      entities with no dedupe and no quarantine, which is the shape the `multi_source`
      fixture needs, and the two blocks return in P2.
    paths:
      - src/bloomery/guardrails/quality.py
      - src/bloomery/plan/diff.py
      - tests/fixtures/multi_source/entity_model.yaml
      - tests/unit/test_plan/test_diff.py
      - tests/unit/test_quality/test_reconcile.py
  - id: D-15
    grade: ASSUMED
    text: >-
      **Discovery: the metadata audit would refuse valid data on a merged entity.**
      It is `COUNT(*) OVER (PARTITION BY _source_row_id) > 1` over `@this_model`,
      and `_source_row_id` is unique per *source relation* (S-0033/D-21), so two sources
      with ordinary per-table row sequences collide on the first run — a **blocking
      false refusal**, the failure D13 names as the worst available. The one-word
      fix (`PARTITION BY _source, _source_row_id`) is deliberately not taken in P1:
      it makes the audit body depend on mapping count, which is the same "does the
      artifact shape vary" question as D7 and belongs with the reject-table decision
      in P2 rather than scattered ahead of it.
  - id: D-16
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **S-0033/D-10 is not reopened
      here.** That decision chose one reject table per entity *on the ground that
      per-mapping tables make replay N-way*, and a merged entity is N-way by construction.
      `reject_id` itself survives — it is already a digest of `(source_relation, row
      identity)`, so the pair was designed for exactly this — but replay re-runs *the*
      current mapping, and branching it per source is the thing D10 refused. N-way
      replay gets its own RFC, argued against D10 directly, rather than being decided
      inside a feature branch.
  - id: D-17
    grade: ASSUMED
    text: >-
      **`bloomery_ir_version` 5 → 6.** `EntityIR` gains its source tuple, and the
      canonical encoder writes each dataclass's field names and count, so every fingerprint
      moves whether or not a project merges anything. Stated because it is exactly
      what went unstated at v4, where the bump was missed and only the encoder's own
      strictness kept it honest. `plan()` refuses to diff a v5 IR against a v6 one.
    paths: [src/bloomery/ir/nodes.py]
  - id: D-18
    grade: LOCKED
    text: >-
      **`_source` joins `RESERVED_MEMBER_NAMES`.** Every other generated column is
      reserved — `_quality_flags`, `_quality_ok`, `_load_id`, `_ingested_at`, `_source_row_id`,
      `has_quality_flags` — and a generated column that is not is one an author can
      collide with. Reserved unconditionally, not only on merged entities: a name
      that is legal until a second mapping arrives is a trap laid for the change that
      adds one.
    paths:
      - src/bloomery/emit/lower/silver.py
      - src/bloomery/resolve/steps.py
      - src/bloomery/spec/common.py
      - tests/unit/test_spec/test_entity.py
  - id: D-19
    grade: ASSUMED
    text: >-
      **The quality mart accounts per entity, not per source.** Its mapping identity
      is `f"{source.relation}->{entity.name}"`, which has no single value on a merged
      entity. Per entity, because the mart's row is "one rule evaluation on this entity"
      and the rules run on the merged relation (D6) — a per-source split would report
      rule counts against a population the rule never saw. Provenance is still reachable:
      `_source` is a real column, so a per-source view is a filter rather than a schema.
    paths:
      - src/bloomery/emit/lower/quality_mart.py
      - src/bloomery/emit/lower/silver.py
  - id: D-20
    grade: ASSUMED
    text: >-
      **dbt emits one `source()` per mapping**, and the model body unions them. Nothing
      about the union needs a dbt capability it lacks, so refusing it there — as dbt
      is refused for `python_model` steps, mart assertions and reject tables — would
      be a limitation invented rather than found.
    paths: [src/bloomery/emit/dbt/__init__.py, tests/unit/test_emit/test_dbt.py]
  - id: D-21
    grade: LOCKED
    text: >-
      **A merged entity may not mix a mapped source with a step-produced output**,
      refused explicitly rather than left to fail somewhere downstream. §8 already
      puts it out of scope; this is the refusal that makes the scope real, since a
