# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      Several mappings may target one entity; they are merged with `UNION ALL`. This
      replaces the refusal at `resolve/build.py:849` and keeps the promise its message
      makes. Consequence: `EntityIR` gains a set of source mappings where it had one,
      and every consumer reading "the mapping" of an entity must be revisited.
    paths:
      - src/bloomery/guardrails/quality.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/resolve/build.py
      - tests/unit/test_resolve/test_build.py
  - id: D-2
    grade: LOCKED
    text: >-
      **No new syntax.** Multi-source is expressed by two mappings naming one `target:`.
      A `sources:` list or a `union:` kind would duplicate what `target:` already
      says, with the failure mode that the two can disagree.
    paths: [tests/fixtures/multi_source/mapping_platform.yaml]
  - id: D-3
    grade: LOCKED
    text: >-
      Mappings are unioned in **lexicographic order of source name**, so the emitted
      artifact is byte-identical across processes. Row order is explicitly **not**
      claimed — `UNION ALL` is a bag, and nothing downstream may depend on source
      order.
    paths:
      - src/bloomery/emit/lower/silver.py
      - src/bloomery/ir/nodes.py
      - tests/unit/test_determinism_guard.py
      - tests/unit/test_emit/test_sqlmesh.py
      - tests/unit/test_resolve/test_build.py
  - id: D-4
    grade: LOCKED
    text: >-
      Every mapping must produce the entity's **full declared key** and **every required
      field**. A partial key makes the union meaningless; a NULL-filled required field
      is a broken contract silently created by the merge.
    paths: [src/bloomery/resolve/build.py, tests/unit/test_resolve/test_build.py]
  - id: D-5
    grade: LOCKED
    text: >-
      A key appearing in more than one source is refused by a generated **blocking**
      audit (`on_fail: fail`), not configurable to `flag` or `quarantine`. Overlap
      is either duplication or a shared key space by accident, and both are refusals.
      The message names the identity-resolution step as the escape hatch. Consequence:
      bloomery's union is for disjoint key sets, permanently — matching stays a step,
      and S-0038 is not reopened.
    paths:
      - src/bloomery/emit/dbt/__init__.py
      - src/bloomery/emit/lower/silver.py
      - tests/e2e/test_dbt_parse.py
      - tests/e2e/test_sqlmesh_replan.py
      - tests/execution/test_merged_cleaning.py
      - tests/golden/test_sqlmesh_duckdb.py
      - tests/unit/test_examples.py
  - id: D-6
    grade: LOCKED
    text: >-
      The union is the **first** silver stage: union → dedupe → rules. A rule evaluated
      per source would judge rows the merged relation does not contain, which is the
      same argument that fixed dedupe-before-rules in S-0033.
    paths:
      - src/bloomery/emit/lower/silver.py
      - tests/unit/test_resolve/test_build.py
  - id: D-7
    grade: ASSUMED
    text: >-
      A `_source` system column carries provenance. It is load-bearing rather than
      diagnostic: the collision audit reports which sources collided, and without
      it the report is unactionable on a multi-source entity.
    paths:
