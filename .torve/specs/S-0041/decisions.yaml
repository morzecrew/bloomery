    paths: [src/bloomery/resolve/steps.py, tests/unit/test_steps/test_lowering.py]
  - id: D-22
    grade: ASSUMED
    text: >-
      **Answers D8 (`OPEN`) — no acknowledgement, and §9's premise for wanting one
      is false.** A mapping naming a field the entity model does not declare is *already*
      refused: `MissingReference: mapping maps unknown field 'loyalty_teir' of entity
