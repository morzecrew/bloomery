      fields of a merged entity, which is where a reader meets the asymmetry.
  - id: D-25
    grade: OPEN
    text: >-
      **Where per-source column expressions live — the IR restructure D1 understates,
      found by building.** D1 says `EntityIR` "gains a set of source mappings where
      it had one", which reads as a one-field change. It is not: `ColumnIR` carries
      **one** `expr: SqlExpr`, lowered from *the* mapping's field (`resolve/build.py:_column`),
      and a union needs one projection per source per column — different source paths
      and different transform chains. No arrangement of `EntityIR.sources` alone can
      express that, so the union cannot be emitted until this is settled. Three shapes,
      none free: **(a)** `SourceIR` gains `columns`, and `EntityIR.columns` becomes
      the merged *schema* (name, type, canonical, unit, tax_basis, required) with
      `expr`/`recipe_id` moving per-source — correct, and it touches the IR's central
      node plus 37 `.columns` read sites outside marts, `plan/diff.py:338`'s `column.expr.sql`,
      and the guardrails that walk derivations; **(b)** keep `expr` on `EntityIR.columns`
      as the first source's — a lie on every merged entity and exactly the silent-wrong-answer
      this project refuses; **(c)** `ColumnIR.exprs` as a tuple index-coupled to `sources`
      — no new node, and a coupling nothing enforces. **Lean (a).** Whoever takes
      this decides and logs it *before* writing the union, because it decides what
      P1 costs.
  - id: D-26
    grade: ASSUMED
    text: >-
      **Answers D25 (`OPEN`) — option (a), and D25's blast-radius figure was wrong
      by an order of magnitude.** The lowered expression moves to a new column-grained
      `SourceColumnIR` on `SourceIR`; `ColumnIR` keeps the schema (§5.7). D25 said
      "37 `.columns` read sites" and estimated the cost from that; measured, **exactly
      8 sites read a `ColumnIR` lowering field, in 3 files** — `plan/diff.py` (`renamed_from`
