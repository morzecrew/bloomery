  - id: D-33
    grade: LOCKED
    text: >-
      **Every mapping of an entity opts into the quality system, or none does; disagreement
      is refused (P2a).** `opts_in(entity, mapping)` is a disjunction over one mapping's
      field-level `quality:` blocks, so two mappings can disagree about whether the
      entity joined the system at all — and the same predicate selects `_try_cast_shape`,
      so the disagreement reaches column lowering and not only rule generation. This
      is not the "where is it computed" question D32 answers; it is two contradictory
      statements by an author, and the honest response to those is a refusal naming
      both source paths. It also settles a **fourth** per-mapping coupling D29 did
      not enumerate: `_repair_bodies` (`resolve/build.py`) reads `mapping.fields[<column>].quality[].repair`,
      so two mappings may name different repair recipes for one column. Under agreement
      that is the same refusal rather than a fifth case — and the spliced body itself
      is invariant, since it reads the *produced* column, not a source path. Consequence:
      `lower_quality` may go on taking one `Mapping`. Agreement is what makes any
      of them the same answer, and the refusal — not a merge rule — is what makes
      that safe.
