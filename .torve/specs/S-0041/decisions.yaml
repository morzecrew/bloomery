  - id: D-34
    grade: LOCKED
    text: >-
      **Artifact shape varies with mapping count; `_source` stays merged-only (P2b).**
      The question D7 and D15 both defer, answered once for the provenance column,
      the metadata audit body and the collision audit together. The metadata audit
      becomes `PARTITION BY _source, _source_row_id` on a merged entity and stays
      `PARTITION BY _source_row_id` elsewhere. **The cost is a new precedent, stated
      here rather than discovered later:** until now the *set* of emitted artifacts
      varied with a spec, never a generated **body**. The alternative — `_source`
      on every entity, one uniform audit body, mapping count invisible in the artifacts
      — buys a reader the property that a merged entity looks like any other, and
      costs a corpus-wide golden re-stamp plus a constant column on every single-source
      silver model, which is precisely what D9 declined to pay on measured grounds.
      Continuing that decision is cheaper than reversing it, and reversing it buys
      nothing but uniformity. **A third option is named only to close it:** making
      `_source_row_id` globally unique in bronze would dissolve the question, and
      it does so by relocating the problem into S-0033/D-21's ingestion contract and
      breaking every table already landed under it.
