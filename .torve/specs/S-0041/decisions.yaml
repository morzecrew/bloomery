      of those eight are `renamed_from`, which D25 mis-assigned to the lowering half
      and which is declared on the EntityModel `Field`, so it does not move at all.
      The 37 was a count of `.columns` readers, and `.columns` readers are overwhelmingly
      *schema* readers — they survive untouched, which is the whole point of the split.
      **Real cost: two constructors where there was one, and four call sites.** The
      golden churn stands regardless — the IR shape moves and D17 bumps the version.
    paths:
