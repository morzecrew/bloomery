  - id: D-36
    grade: ASSUMED
    text: >-
      **Answers D28 — `direct:` is allowed on a merged entity when *every* mapping
      records one for the column, and refused when they disagree.** D28 refused the
      combination outright and handed P2 a choice between "one shadow projection per
      source with a null-safe audit" and "a coverage rule in D4's shape". Measured
      with the refusal disabled against two mappings that *agree*, the null-safe audit
      is answering the wrong question: the shadow column is duplicated on the entity
      **and on every branch**, the reconcile audit is emitted twice, and each branch
      carries the other's extraction — `shop__items` projecting `$.unit_price` off
      a relation that does not have it. That is not a NULL-shadow problem, it is `Derivation`
      being built per mapping while `_shadow` returns one projection: the same per-mapping-fact-on-a-shared-node
      shape D26 split for `expr` and D32 for the rule inputs. So the coverage rule
      is the answer and the null-safe audit is unnecessary under it — under agreement
      no branch's shadow is NULL for want of a path, and the reconcile check keeps
      the meaning it has on one source: the recipe-derived value against the direct
      value *that row's own mapping* extracted, which is D32's principle applied to
      a second reader. Consequence: `Derivation` carries its source relation, `path_conflict_amendments`
      fans out per source like every other lowering, and disagreement is refused by
      D33's pattern rather than tolerated. D28's row stands unamended — its refusal
      is correct until this one is executed, and what it predicted is the thing this
      has to be read against. *Added by execution 2026-09-03 — see logs/T-0012.md
      (F-8), which carries the probe output.*
