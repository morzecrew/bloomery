  - id: D-35
    grade: LOCKED
    text: >-
      **`_source` joins the dedupe sort key, immediately ahead of `_source_row_id`
      (P2b).** `dedupe_sort_columns` ends in the row identity, and its totality argument
      is "no two rows can compare equal *given the D21 metadata contract*" — an identity
      unique per **source relation**. On a merged entity two rows from different sources
      sharing an entity key therefore compare equal and the survivor is undefined.
      That shape is what D5's collision audit refuses, but an audit runs *after* the
      model materialises, so the window is real and the totality argument would be
      leaning on a blocking check in a different artifact. Adding `_source` restores
      it structurally and locally, for one extra sort term on merged entities only
      (D34). It is the same defense-in-depth already pinned into that exact column
      by `NULLS LAST`, against an illegally-null identity the audit also catches.
      Consequence: where two rows would have compared equal, the survivor is the lexicographically-later
      source — arbitrary as business logic, deterministic as an artifact, and reachable
      only in the run the collision audit then stops.
    paths:
