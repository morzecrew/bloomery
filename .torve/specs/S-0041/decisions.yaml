    paths: [src/bloomery/resolve/build.py, tests/unit/test_resolve/test_build.py]
  - id: D-24
    grade: ASSUMED
    text: >-
      **Answers D11 (`OPEN`) — `required:` means coverage, and the runtime null check
      stays `assert: {not_null: true}`.** No generated `IS NULL` audit. D11 framed
      the choice as the audit or an explicit statement; this is the statement. Generating
      one for merged entities only would make a third thing depend on mapping count,
      and the authored mechanism already exists, is documented, and lowers to the
