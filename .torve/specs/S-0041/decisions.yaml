  - id: D-27
    grade: OPEN
    text: >-
      **The `direct:` shadow column builds a lowering outside the builder, and on
      a merged entity it is not one column.** `guardrails/conflict.py:_shadow` constructs
      a `ColumnIR` with a lowered `expr` — the `<field>__direct` extraction that the
      reconcile audit compares a recipe-derived value against — and the guardrail
      stage merges it into the entity after `_build_entity` has finished. Under D26's
      split that constructor has to produce a schema column *and* a projection, which
      is mechanical. What is not mechanical: **the direct extraction reads a source
      payload**, so a merged entity needs one shadow projection per source, and D14
      does not refuse the combination — `direct:` is a catalog-recipe property, unrelated
      to `dedupe:`/`quarantine:`. Three options: emit one shadow projection per source
      and keep the audit comparing the merged column (probably right, and it is the
      same fan-out the union already does); refuse `direct:` on a merged entity in
      P1 (cheap, and it narrows a capability for a reason unrelated to it); or refuse
      the whole path-conflict amendment there (worse — it removes a check rather than
      scoping it). Decide before writing the split, not during: the shadow is built
      from a `Derivation`, which is per entity and not yet per source.
  - id: D-28
    grade: LOCKED
    text: >-
      **Answers D27 — a `direct:` path is refused on a merged entity in P1.** `direct:`
      is a field of `RecipeFieldMapping`, so it is per mapping, and two mappings may
      record *different recipes* for one column — `recipe_id` is in the lowering half
      for exactly that reason. A merged entity can therefore have a direct path on
      one source and none on another, which leaves the `<field>__direct` shadow NULL
      for the second source's rows. That is not a gap to fill: a NULL shadow is indistinguishable
      from a genuinely NULL direct value, so the reconcile audit either reports a
      false disagreement or silently skips rows it was built to check — and a check
      that quietly stops checking is worse than one that is absent. **The cost of
      refusing is measured, not assumed: `direct:` appears once in the entire corpus**
      (`tests/fixtures/path_conflict/mapping.yaml`), so no project shape loses anything.
      P2 chooses between one shadow projection per source with a null-safe audit,
      and a coverage rule in D4's shape (if any mapping records a direct path, all
      must); this RFC does not pick, because the choice is about what a reconcile
      check *means* across sources and that deserves the argument. Consequence for
      D26: `_shadow` only ever runs on a single-source entity, so the split feeds
      it the same way it feeds `_column_ir` and nothing about it becomes N-way.
    paths: [src/bloomery/quality/predicates.py]
  - id: D-29
    grade: LOCKED
    text: >-
      **§5.6's consequence was wider than its argument — P1 refuses the whole quality
      system on a merged entity, not only `dedupe:` and `quarantine:`.** D14's *reason*
      survives measurement: every use of `_source_row_id` in the silver lowering does
      sit behind one of those two blocks. Its *consequence* — "a merged entity may
      therefore still carry field rules and row rules" — does not follow, because
      the row identity is not the only per-mapping coupling. **The rule lowering itself
      is per mapping, and sits behind neither block**: `lower_quality(entity, mapping,
      …)` takes one `Mapping` (`resolve/build.py`), so `mappings[0]` would silently
      win; `opts_in(entity, mapping)` is true when *that mapping's* fields carry `quality:`,
      so two mappings can disagree about whether the entity joined the system at all
      — and that same predicate selects `_try_cast_shape`, so opt-in reaches column
      lowering; a generated `coercible` rule carries `field_sources(mapping, column)`,
      *that mapping's* raw JSONPaths, which the extract projects per branch, so source
      B's branch would have to read source A's `$.a.b` off a relation that need not
      have it, for a rule evaluated once over the merged relation; generated `enum`
      spellings come from the mapping's transform chain the same way; and `check_quality`'s
      `by_target` dict keeps the **last** mapping per target, so every per-mapping
      quality guardrail would check one of N. The boundary D14 wanted — exact rather
      than approximate — is therefore `opts_in`, one predicate that already exists
      and already decides this. **`assert:`, `references:` and `coverage:` survive**,
      measured rather than assumed: `lower_asserts` reads the entity model and the
      draft IR and never a mapping, and the relationship-driven checks are entity-model-shaped.
      Consequence: P1 ships the union to entities outside the quality system, which
      is the shape the `multi_source` fixture needs, and P2 restores the system to
      a merged entity as one piece rather than in two unrelated halves. *Added by
      execution 2026-08-16 — see logs/T-0004.md (V-001, attempt 1).*
    paths: [tests/unit/test_quality/test_reconcile.py]
  - id: D-30
    grade: ASSUMED
    text: >-
      **Departs from D20 — the dbt target refuses a merged entity in P1**. D20's claim
      about the *union* holds and shipped: the `UNION ALL` is the same shared SELECT
      both targets render, and the dbt emitter does emit one `source()` per mapping.
      What D20 did not account for is that the merge's correctness condition is a
      **blocking audit** (D5), and this emitter has no artifact for one: its whole
      test surface is `schema.yml` entries covering `not_null`, `accepted_values`
      and a single expression test, and it emits no singular-test path at all. A generated
      `GROUP BY <key> HAVING COUNT(DISTINCT _source) > 1` is none of those. Emitting
      the union without it produces a model that compiles here, runs anywhere, and
      double-counts an entity in silence — the degradation S-0025/D-3 refuses. **S-0033/fixed-pipeline-order-and-lowering's
      target-coverage sentence deliberately was not stretched to cover this**: it
      authorizes dbt's partiality for the *quality* artifacts, and a rule an author
      chose to make blocking is not the same thing as the one check a feature cannot
      be correct without. Consequence: merged entities are SQLMesh-only until the
      dbt emitter grows a singular-test surface, which is its own change and not P2's.
      D20's row is left standing — what it predicted is the thing this has to be read
      against. *Added by execution 2026-08-16 — see logs/T-0004.md (V-002, attempt
      1).*
    paths: [tests/e2e/test_dbt_parse.py, tests/unit/test_emit/test_dbt.py]
  - id: D-31
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **P2 is demand-gated: the
      design lands now, the code waits for a named consumer.** S-0040/D-6 applies
      this test to its own P2 and this document did not, which left §12 reading as
      a queue rather than a boundary. The asymmetry has no justification — P1's refusals
      are honest, tested, and route to the shipped workaround, so nothing is broken
      while P2 is unbuilt, and P2a's cost falls on S-0033's rule catalogue, which
      every entity reads, merged or not. What is **not** deferred is the design: D29's
      couplings were measured against this tree while P1's context was live, and that
      context is the asset that decays — the prose does not. So D32–D35 are settled
      here and §12's P2a–P2c are specified; implementation begins when a project needs
      quality rules on a merged entity, and not before. Consequence: the two refusal
      messages stop saying "until P2 restores it". A promise in an error message is
      one a user plans around, and this decision makes P2 a phase rather than a date.
  - id: D-32
    grade: LOCKED
    text: >-
      **A rule's per-mapping dependency is projected as a branch-local column; the
      rule stays entity-grained (P2a).** The mechanism is not invented here — `coercible`
      already reads projected `_src_<rule>_<n>` aliases (`quality/predicates.py:source_alias`)
      rather than inline JSONPaths, because the raw paths live one level down in the
      extract SELECT, and P1 turned that projection site into `_branch_select`. So
      a fact only one branch knows already has a way to reach a rule the merged relation
      evaluates once. **D6 is not violated, and the reading that says it is — that
      projecting a verdict per branch just *is* "a rule evaluated per source" — mistakes
      what D6 argues.** D6 argues from the *row population* — "a rule evaluated per
      source would judge rows the merged relation does not contain" — and the union
      is `ALL`, so a branch-projected **scalar** verdict judges exactly the rows the
      union contains. Dedupe runs after the union and may drop a row; that row's flag
      is then unused, which is not a wrong answer. **The boundary is `WINDOWED_KINDS`**
      (`quality/predicates.py`, currently `{unique}`): a windowed verdict depends
      on the population and so may not be computed per branch — and it does not need
      to be, since its inputs are the produced column values, which D26's split already
      makes mapping-invariant. Consequence: `coercible` sheds its per-source alias
      set for one branch-computed boolean ("every source path *this branch* read was
      non-null"), which collapses the arity problem at the level where arity is known;
      `in_enum` takes the same shape rather than a second mechanism, its admissible
      set being the branch's own `enum_map` chain. **The tempting wrong fix is recorded
      so it is not re-proposed:** NULL-filling a missing `_src_` alias to make the
      arities agree renders `is_not_null` false, the conjunction never fires, and
      the rule silently stops checking on that branch — the failure D28 refuses by
      name, a check that quietly stops checking being worse than one that is absent.
    paths:
      - src/bloomery/emit/lower/silver.py
      - src/bloomery/guardrails/quality.py
