amendments:
  - id: A-1
    at: '2026-09-29T02:32:04Z'
    title: OPEN rows the implementation settled
    changes:
      - subject: D-5
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-5
        field: text
        before: >-
          Whether `to_bool`/`to_int` across the boolean boundary get a PostgreSQL
          spelling (`x::int::boolean`) or a refusal. A spelling is cheap; a refusal
          is honest about `to_bool` over an arbitrary integer having no agreed meaning.
        after: >-
          `to_bool` over an integer is spelled, not refused, and spelled once in the
          builder as `x <> 0`, the non-zero-is-true meaning DuckDB and Trino already
          agree on; `to_int` over a boolean builds `CAST(CAST(x AS INT) AS BIGINT)`.
          No engine-specific spelling exists.
      - subject: D-5
        field: fingerprint
        after: 241df38357020f53/19bd40cf41544d81
      - subject: D-6
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-6
        field: text
        before: >-
          Whether Trino's `coalesce`/`nullif` literals are cast to the column type
          at build (needing D1) or the spec surface narrows to reject a literal whose
          type cannot match.
        after: >-
          `coalesce` and `nullif` cast their literal to the column's logical type
          at build, through `_typed_literal` with the builder's `input_type` (D1).
          A string literal over a string column stays uncast. The spec surface does
          not narrow.
      - subject: D-6
        field: fingerprint
        after: 24aa2a3bf72f2428/202c11f3690cefb1
    md: |-
      These rows were graded OPEN and the implementation has since answered them. Each settled row now states what the code does and is graded ASSUMED; the owner's merge of this amendment is the acceptance, and LOCKED stays the owner's act.

      Settled by the implementation:
      - D-5: The refusal's premise (no agreed meaning) was measured false. `x <> 0` is used rather than `::int::boolean` because the latter overflows for a bigint outside int4. Evidence: src/bloomery/transforms/_builtins.py; tests/unit/test_transforms/test_builtins.py::test_to_bool_spells_the_integer_boundary_portably; tests/unit/test_transforms/test_builtins.py::test_to_int_routes_a_boolean_through_int.
      - D-6: The build-time cast was chosen because rejecting a mismatched literal would stop specs compiling that already run on two of three engines. Evidence: src/bloomery/transforms/_builtins.py; tests/unit/test_transforms/test_builtins.py::test_coalesce_casts_its_fallback_to_the_column_type.
