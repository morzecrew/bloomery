    title: The unit rule as the code applies it (S-0090)
    changes:
      - subject: D-3
        field: text
        before: >-
          `unit`/`tax_basis` originate only on catalog canonical fields and propagate
          via `canonical:`; a monetary operand without metadata is `unknown`, and
          `unknown` in any `+`/`-` is an error. No inference from names or values,
          ever.
        after: >-
          `unit`/`tax_basis` originate only on catalog canonical fields and propagate
          via `canonical:`; the unit check refuses two declared, different units in
          `+`/`-` and lets an undeclared unit pass, and `unknown` poisons additive
          arithmetic through the tax-basis check, which refuses an operand with no
          `tax_basis` beside a monetary one. No inference from names or values, ever
