  - id: A-1
    at: '2026-09-29T05:02:53Z'
    title: Rows for what the implementation decided
    changes:
      - subject: D-12
        field: text
        after: >-
          Guardrails read the parsed expression with sqlglot's `find_all` over the
          node types they judge — `arithmetic.py` visits `exp.Add`, `exp.Sub`, `exp.Mul`
          and `exp.Div` and branches with `isinstance` — rather than a visitor class
          or a `match` statement. The `RECONCILE` audit selects rows where `<column>
          IS DISTINCT FROM <column>__direct`
    md: |-
      Questions this document left to implementation were answered by the code, and no row said so. Each new row states what the code does, checked against it on 2026-09-29, and is graded ASSUMED; the owner's merge is the acceptance.

      - D-12 answers Q-1.
  - id: A-2
    at: '2026-10-06T19:26:57Z'
    title: The unit rule as the code applies it (S-0090)
    changes:
      - subject: D-3
        field: text
        before: >-
          `unit`/`tax_basis` originate only on catalog canonical fields and propagate
          via `canonical:`; a monetary operand without metadata is `unknown`, and
          `unknown` in any `+`/`-` is an error. No inference from names or values,
          ever.
        after: >-
          `unit`/`tax_basis` originate only on catalog canonical fields and propagate
          via `canonical:`; the unit check refuses `+`/`-` only where each side declares
          exactly one unit and the two differ, and lets an undeclared unit pass; `unknown`
          poisons additive arithmetic through the tax-basis check, which refuses an
          operand with a currency or undeclared unit whose `tax_basis` is absent or
          `unknown` beside a monetary one. No inference from names or values, ever
      - subject: D-3
