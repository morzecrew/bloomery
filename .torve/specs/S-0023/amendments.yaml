    title: Rows for what the implementation decided
    changes:
      - subject: D-12
        field: text
        after: >-
          Guardrails read the parsed expression with sqlglot's `find_all` over the
          node types they judge — `arithmetic.py` visits `exp.Add`, `exp.Sub`, `exp.Mul`
          and `exp.Div` and branches with `isinstance` — rather than a visitor class
