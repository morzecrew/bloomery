  - id: A-3
    at: '2026-09-29T05:02:53Z'
    title: Rows for what the implementation decided
    changes:
      - subject: D-12
        field: text
        after: >-
          `bloomery_ir_version` 20 absorbs both shape changes: S-0007 added `role_of`
          to `MartColumnIR` and `MartJoinIR` while the version stayed 19, and this
          document's 19 → 20, which `ProjectIR`'s docstring records for `determines`,
          is the bump that covers it. `role_of` gets no bump of its own
      - subject: D-13
        field: text
        after: >-
          A mart dimension's `ref.qualified` equals its `column` for every column
          `_mart_ir` builds, plain or date bucket, and `test_every_flattened_column_is_a_requestable_dimension`
          pins it. `_determinations` does not lean on it: it translates each column
          to its qualified name through the mart's `dimensions`
    md: |-
      Questions this document left to implementation were answered by the code, and no row said so. Each new row states what the code does, checked against it on 2026-09-29, and is graded ASSUMED; the owner's merge is the acceptance.

      - D-12 answers Q-1.
      - D-13 answers Q-3.
