        after: 57b1b1df6f2b2caa/281e6728f9236115
    md: |-
      D-3 counted fourteen fingerprint-bearing golden directories and named
      them; `tests/golden/roles_of_one_dimension` carries the same header and
      re-fingerprints with the rest, and the row did not name it. T-0020's
      first attempt was convicted at the scope gate for regenerating it and
      its second halted on the count. The row and phase 1's scope now name
      all fifteen; the rule — the header line is the whole expected diff — is
      unchanged.

      The same phase also reaches `src/bloomery/resolve/facets.py`: a field added
      to `ColumnIR` owes a row in the spec differ's `_FACETS` table, which the
      module documents as total over every comparable record's fields, and the
      review tier stopped T-0020's rerun on exactly that (T-0022, T-0023). The
      scope had the IR and the builder and not the table the IR's fields are
      enumerated in.

      Phase 2 reaches the two pinned corpus-size counters and runs the unit
      tier: a fixture that enters the corpus owes a row in
      `parity_baseline.tsv` and a bump to the counts in `test_parity.py` and
      `test_resolution.py`, which their docstrings describe and the phase's
      acceptance did not run — T-0021's tree was green at every gate and red
      on `tests/unit` (T-0025, T-0026).
