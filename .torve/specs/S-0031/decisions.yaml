# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      Supersedes S-0029: the planner artifact is MetricFlow's own transformed manifest,
      not a bespoke `CompiledSemantic`. Survivors carried over: deterministic serialization,
      version-mismatch-refuses-never-migrates, the LRU-instead-of-resident-memory
      scaling argument, and specs-are-durable / artifacts-are-cache.
    paths: [src/bloomery/runtime/hydration.py]
  - id: D-2
    grade: ASSUMED
    text: >-
      `HydrationKey(spec_fingerprint, bloomery_version, metricflow_version)` — the
      `metricflow_version` component is new; a MetricFlow bump invalidates every cache
      entry.
    paths:
      - src/bloomery/runtime/hydration.py
      - tests/unit/test_runtime/test_hydration.py
  - id: D-3
    grade: ASSUMED
    text: >-
      Two-level cache: L2 = post-`transform()` manifest JSON (~145 KB, ~23 ms to build)
      in the **caller's** store — bloomery defines only the key and the bytes (no
      I/O, hard invariant #1) via pure `build_manifest_bytes` / `hydrate_manifest`;
      L1 = hydrated `SemanticManifestLookup` (~1.6 MB, ~29 ms from L2) in an in-process
      LRU (`ManifestHydrator` Protocol + `LruManifestHydrator(max_entries=...)`).
      Post-transform storage makes hydration `parse_raw` + lookup only.
    paths:
      - src/bloomery/emit/metricflow/__init__.py
      - src/bloomery/runtime/hydration.py
      - tests/unit/test_runtime/test_hydration.py
  - id: D-4
    grade: ASSUMED
    text: >-
      Budgets: **50 ms cold / 10 ms warm**, asserted in `tests/bench/test_hydration.py`
      (median over N iterations, relaxed CI multiplier, `perf` marker — S-0026). S-0029's
      5 ms is recorded as not achievable and not needed; the LRU absorbs the ~29 ms
      measured cold cost.
  - id: D-5
    grade: ASSUMED
    text: >-
      Serialization via MetricFlow's pydantic-v1-style `.json()` / `.parse_raw()`,
      sorted keys where controllable; never pickle (not deterministic, not version-safe).
      Manifest determinism is S-0030's emitter contract; this RFC owns key + budgets
      + LRU.
    paths:
      - src/bloomery/emit/metricflow/__init__.py
      - src/bloomery/runtime/hydration.py
      - tests/unit/test_runtime/test_hydration.py
  - id: D-6
    grade: ASSUMED
    text: >-
      L1 sizing: ~1.6 MB/entry → 500 entries ≈ 800 MB; `max_entries` configurable;
      hit-rate exposed as a plain counter/attribute the caller reads — no metrics-framework
      dependency.
    paths:
      - src/bloomery/runtime/hydration.py
      - tests/unit/test_runtime/test_hydration.py
  - id: D-7
    grade: ASSUMED
    text: >-
      Version mismatch is a cache **miss by construction** (the key changes), never
      an error — S-0029's `IncompatibleArtifact` is retired with it; the load-time
      refusal path cannot be reached because versions live in the key, not the artifact.
    paths:
      - src/bloomery/runtime/hydration.py
      - tests/unit/test_runtime/test_hydration.py
  - id: D-8
    grade: ASSUMED
    text: >-
      The LRU is confined mutable state: `runtime/` is the one impure-adjacent package
      (no I/O; `fetch_l2` is caller-owned), kept out of the compile pipeline by an
      import-linter contract — nothing in the compile path imports `runtime/`.
    paths: [src/bloomery/runtime/hydration.py]
  - id: D-9
    grade: ASSUMED
    text: >-
      **V3 verified (2026-08-07):** budgets **confirmed and kept** at 50 ms cold /
      10 ms warm — measured cold hydration 10.5 ms median (`parse_raw` 5.7 ms + lookup
      4.5 ms; ~19 ms worst-case with the lazy first-`explain()` tail), 1.54 MB/lookup
      at 30 models / 90 metrics / 144.9 KB payload, ≥4× headroom. Two additions: the
      bench suite gains a 3× model-size point, and hydration may issue one optional
      throwaway `explain()` to absorb the lazy-initialization tail before a lookup
      counts as warm (`spikes/metricflow/VERIFICATION.md` (`spikes/metricflow/VERIFICATION.md`)).
    paths: [src/bloomery/runtime/hydration.py]
