# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      House scaffold adopted from forze; deliberate divergences: the `rfcs` directory
      (since retired) is committed, mermaid over d2, no CI sharding/conformance/DST
      apparatus.
    paths: [pages/zensical.toml]
  - id: D-2
    grade: ASSUMED
    text: >-
      uv + hatchling + hatch-vcs; version derives from git tags only; release is tag-driven
      with PyPI Trusted Publishing.
  - id: D-3
    grade: ASSUMED
    text: >-
      `requires-python = ">=3.12,<3.15"`; CI matrix 3.12–3.14.
  - id: D-4
    grade: ASSUMED
    text: >-
      `just quality` is the single quality authority, run identically locally and
      in CI (`-s` in CI); Codecov is informational only.
  - id: D-5
    grade: ASSUMED
    text: >-
      import-linter mechanically enforces the compiler layering (emitters never import
      `spec`; `spec` imports only `errors`).
  - id: D-6
    grade: ASSUMED
    text: >-
      Determinism bans (`datetime.now`, `uuid4`, `time.time`, `os.environ` in `src/bloomery/`)
      are pre-commit pygrep hooks, not review vigilance.
  - id: D-7
    grade: ASSUMED
    text: >-
      All workflow actions SHA-pinned + harden-runner in every job; `required-ci`
      aggregator is the only branch-protection check.
  - id: D-8
    grade: ASSUMED
    text: >-
      Docs: zensical + mike under `pages/`, Diátaxis nav, versioned per minor release.
  - id: D-9
    grade: ASSUMED
    text: >-
      (Amended for `_bloomery-metricflow-pivot.md`) `metricflow==0.211.*` becomes
      a tightly pinned runtime dependency at M4.5; V1 may narrow `requires-python`
      and the sqlglot window. Bumping metricflow is a deliberate PR with goldens regenerated
      (S-0030).
  - id: D-10
    grade: ASSUMED
    text: >-
      **Supersedes D9's conditional wording — V1 answered (PASS, 2026-08-07):** no
      narrowing needed. `metricflow==0.211.*` joins `[project].dependencies` directly
      (no separate group; joint resolution with the dev group verified on Python 3.12–3.14);
      `requires-python` stays `">=3.12,<3.15"`; the sqlglot window is unchanged (`>=30.8,<31`,
      resolving 30.8.0). deptry gains the transitive metricflow packages and the top-level
      `msi_pydantic_shim` module (§5.2). Deliberate-PR-per-bump rule from D9 stands.
  - id: D-11
    grade: ASSUMED
    text: >-
      *(2026-08-09)* **D4's Codecov half was never built, and the code claimed the
      omission was deliberate.** §7 lays out `test` → `coverage` (`--fail-under=80`,
      Codecov informational-only); what shipped had no `coverage` job, no upload,
      and a comment in `ci.yml` asserting there is "no Codecov upload (deliberate
      — no token, no third-party authority)". That comment contradicted an accepted
      RFC, which makes it the bug (CLAUDE.md) — and the more expensive kind, because
      it reads as a decision and would have stopped the next person from restoring
      the design. Built now as specified: each interpreter leg measures into its own
      data file and uploads junit results, one `coverage` job combines them, uploads,
      then gates. Combining across 3.12–3.14 rather than gating each leg is what makes
      version-gated lines honest. `informational: true` in `codecov.yml` is what actually
      enforces "informational only" — D7 says `required-ci` is the *only* branch-protection
      check, and a Codecov status that could fail would quietly become a second one.
  - id: D-12
    grade: ASSUMED
    text: >-
      *(2026-08-09)* **Docker Hub auth on the nightly Docker lane, guarded on the
      token's presence.** Anonymous pulls are rate-limited by runner IP, which on
      shared runners is a budget split with strangers: the failure mode is testcontainers
      timing out nightly for reasons no test changed. Guarded on `secrets.* != ''`
      rather than on the event, because secrets are unavailable to a fork's pull request
      — anonymous has to stay a working path, or the login locks out the contributors
      it exists to serve. Credentials are bound to the single login step rather than
      the job environment, and the token's scope (`Public Repo Read-only`) is what
      bounds the credential `docker login` necessarily leaves in the runner's config
      for the rest of the job.
