# yaml-language-server: $schema=../../schemas/document.json
id: S-0078
title: The RFC corpus retired into documents
kind: design
status: accepted
implementation: complete
depends_on: []
informed_by: [S-0001]
supersedes: []
superseded_by: null
owner: Lev Litvinov
schema_version: 4
summary: >-
  Every retired RFC becomes a document in `.torve/specs/`, with its decisions kept
  under their numbers, and every `RFC NNNN …` citation in the tree becomes the new
  grammar. Sixty retired RFCs became S-0018 to S-0077 on 2026-09-18, mechanically:
  834 decision rows, 312 design sections, 54 alternatives, 115 questions, 717 files
  rewritten, and one mapping in `.torve/archive/identifiers.yaml` that answers every
  old identifier. The `rfcs/` directory, its index and register, the checker and the
  `rfc-corpus` gate are gone; `torve spec check` is the corpus gate now. The execution
  logs keep their history with their citations rewritten.
motivation: |-
  The seventeen live RFCs had been carried across by the author role (S-0002 to S-0017), but the sixty-seven retired ones lived only in git history, and 4,376 citations in `src/`, `pages/` and `tests/` — 1,872 naming a decision, 426 distinct decisions — pointed at them in a grammar torve reads as its own legacy. Two consequences: the tree could not carry a `spec-valid` gate, and a task inheriting a decision from a retired RFC inherited nothing, because no row existed for the engine to hand it.

  torve did the same to itself once (S-0057 and RFC number 0058 in its corpus): every document converted in the commit that deleted `rfcs/`, an identifier mapping beside the archive, `torve spec show` answering a legacy id through it. This document does the same for bloomery, with the differences bloomery's RFC template forces.
current_state: >-
  Before this document: 17 live RFCs in `rfcs/` mirrored by S-0002 to S-0017; 67 retired
  files readable only through `rfcs/RETIRED.md`'s commit table and `git show`; `tools/check_rfc_corpus.py`
  holding the citations followable; the `rfc-corpus` gate at shadow; no `spec-valid`
  gate. Decision tables in the retired RFCs were regular — `| # | Grade | Decision
  |` in 34, `| # | Decision |` without grades in 22, a handful in other shapes — and
  60 of the 67 files were numbered RFCs (the rest: design notes, the old execution
  log, a deviations file already folded into `logs/`).
goals: >-
  Every decision a retired RFC made is a row the engine can hand a task, cite from
  code, and project into the directory it governs. Every citation in the tree resolves.
  Nothing is written by an agent: the conversion is a script over the archived text,
  reviewable as a mapping rather than as four thousand diff lines.
non_goals: >-
  Re-grading anything. Rewriting prose. Turning the 560 divergence blocks in `logs/`
  into engine execution records. Deleting the historical `tasks/*.json` or the vendored
  `rfc-writer` skill (Q-2).
design:
  - key: numbering
    md: >-
      The 60 numbered retired RFCs take S-0018 to S-0077 in RFC-number order. A decision
      row `k` becomes `D-k` of its document; a suffixed row (`2a`, `2b`, `2c` in RFC
      number 0056 and RFC number 0057) becomes the next free integer after the table's
      last row, with its text prefixed by the row it was. Section numbers map to keys:
      the standard H2s (Summary, Motivation, Current state, Goals / Non-goals, Design,
      Tests, Docs, Out of scope, Risks) to the typed anatomy fields; H3s under Design
      and every non-standard H2 to design sections keyed by their title's slug; Unresolved
      questions to `Q-n`; Alternatives considered to the alternatives list. A citation
      of `§n.m` becomes `S-NNNN/<key>`, or `S-NNNN/<h2-key> (§n.m)` where only the
      H2 has a key.
  - key: grades-and-paths
    md: >-
      A grade the table carried is kept. A row with no grade is `ASSUMED`: it was
      never graded, and `ASSUMED` is the grade that costs nothing to revisit. A row's
      `paths` are the files that cite it in `src/`, `pages/` and `tests/` — 470 rows
      have some. A `LOCKED` row no file cites (74 rows) keeps its lock, with the directories
      and files its RFC's header names as its paths — the owner's call on 2026-09-19
      (Q-1), taken knowing a directory-wide lock owes a divergence entry to every
      task under it.
  - key: citations
    md: >-
      `RFC NNNN Dk` → `S-NNNN/D-k`; `RFC NNNN §n.m` → the section key; `RFC NNNN Pk`
      → `S-NNNN/phasing (P-k)` for a converted document (its phasing is prose) and
      `S-NNNN/P-k` for an author-converted one; `RFC NNNN D-Qk` → the row that carries
      `D-Qk` where the RFC numbered decisions that way (RFC number 0015), else `Q-k`;
      `RFC NNNN Rk` → the section holding the rule table; `RFC NNNN/MMMM` → two documents.
      A decision number past the table's last row is an execution-log entry and is
      written `S-NNNN (log entry Dk)`. Three-digit `D-NNN` and `A-N` in prose are
      the logs' own numbering and lose their hyphen so the corpus check does not read
      them as rows. Every file in the repository outside `.git`, `.venv`, `.wt` and
      `rfcs/` is rewritten the same way, `logs/` included.
  - key: what-goes
    md: >-
      `rfcs/` whole — the 17 live files, `INDEX.md`, `RETIRED.md` — `tools/check_rfc_corpus.py`
      and its unit test, the `rfc-corpus` gate and the `RFC corpus` line of `just
      quality`. `spec-valid` (`uv run torve spec check`) enters blocking in their
      place. CI's `corpus` trigger watches `.torve/specs/**` and `.torve/archive/**`.
      The corpus test resolves a cited decision in that document's `decisions.yaml`
      and reads `implementation: complete` where it read `RETIRED.md`.
  - key: the-mapping
    md: >-
      `.torve/archive/identifiers.yaml` holds every RFC number, `RFC NNNN`, `RFC NNNN
      §n[.m]` and `RFC NNNN Dk` with what it became, the live seventeen included.
      `torve spec show` answers a legacy identifier through it, which is what makes
      an old commit message, an old log entry or an old review comment still followable.
tests: >-
  `torve spec check` over the 77 documents: 0 problems, 29 warnings (unresolvable
  links to files that moved since, and seven summaries whose first sentence runs long).
  `tests/execution/test_semantic_corpus.py` resolves every cited rule against the
  corpus; `tests/unit/test_semantic_corpus_guard.py` pins the citation predicate on
  the new shape. Zero `RFC NNNN` citations remain outside `.git`.
docs: >-
  `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` say where design lives and how to
  read an old citation. `torve spec project` renders the governing rows into 105 `AGENTS.md`
  files.
out_of_scope: >-
  The engine's own citation scan learning an adopter's grammar; that need is gone.
risks: >-
  The projection is large: `src/bloomery/AGENTS.md` carries every row that governs
  the package root. A converted document's `about` section keeps the RFC's status
  line as it was at retirement, which for many says Draft or In progress: the retiring
  commit, not the line, is what says it landed.
alternatives:
  - option: >-
      Convert with the author role, one RFC per session
    rejected_because: >-
      Sixty sessions at five to seven dollars and ten to fifteen minutes each, and
      prose that drifts from the archived text; a script converts in a minute and
      is reviewable as a mapping
  - option: >-
      Archive the converted documents as `superseded`, the way torve's own are
    rejected_because: >-
      torve's archived documents were superseded by later ones; bloomery's retired
      RFCs are the landed design the code cites as governing, so they are live and
      complete
  - option: >-
      Keep a `LOCKED` row's lock with the RFC's scope directory as its paths
    rejected_because: >-
      Every task under `src/bloomery/resolve/**` would owe an entry for every lock
      the RFC ever made there, most of which no file names
questions:
  - id: Q-1
    text: >-
      Which of the 74 downgraded locks are re-locked, each naming the file that pins
      it
  - id: Q-2
    text: >-
      Whether the historical `tasks/*.json` and the vendored `rfc-writer` skill go
      in a later change
