  - id: D-10
    grade: ASSUMED
    text: >-
      (Amended for `_bloomery-metricflow-pivot.md`) `metric_time` is a reserved dimension/field
      name, rejected at spec validation with a clear message (S-0030 R4). The `Metric`
      model reserves optional `cumulative:` (window / grain_to_date) and derived-expression
