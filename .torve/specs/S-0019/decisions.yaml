      - tests/unit/test_spec/test_metrics.py
  - id: D-14
    grade: ASSUMED
    text: >-
      *(2026-08-12)* **An entity or mart name is an identifier, because it reaches
      the model envelope and nothing there quotes it.** Both were unconstrained —
      `entities: dict[str, Entity]`, and marts under `MemberName`, which only rejects
      reserved words. Field names travel a *different* path and were always safe:
      they reach SQL through SQLGlot, which quotes them and doubles an inner quote,
      verified by compiling a field named `amt") OR 1=1 --` and reading the escaped
      identifier back out. A **relation** name also reaches the SQLMesh `MODEL (...)`
      block, which is Jinja over pre-rendered strings (D4) and quotes nothing, so
      an entity named `t"; DROP TABLE x --` emitted `name silver.t"; DROP TABLE x
      --,` into the model definition verbatim. Fixed at the spec layer with `^[a-z][a-z0-9_]*$`
      rather than by escaping at the envelope, on the same reasoning that pins `StepRef`:
      a relation name has no business carrying anything but identifier characters,
      and a pattern refuses at the source path where the author can act on it instead
      of silently mangling the artifact. Step output bindings were already covered
      by `RELATION_PATTERN`; metric names do not become relations. Every name in the
      fixture corpus already matched, so the constraint documents existing practice
      rather than narrowing it.
    paths:
      - src/bloomery/spec/common.py
      - tests/unit/test_spec/test_relation_names.py
  - id: D-15
    grade: ASSUMED
    text: >-
      Spec unions discriminate on their literal `rule` field where one exists, and
      otherwise through a callable `Discriminator` with `Tag`s (`FieldMapping`, `FlattenStep`).
      Single-value checks are `AfterValidator`s on `Annotated` aliases (`SqlText`,
      `MemberName`), cross-field checks are `model_validator(mode="after")`, and pre-coercion
      hooks appear only where the raw input must be seen
    paths: [src/bloomery/spec/*.py]
    consequence: >-
      A new spec union picks the member from a tag field or from which key is present,
      so pydantic reports an error against one member rather than listing every member's
      failures
    rationale: >-
      Settled at implementation: the mapping and flatten shapes carry no tag key,
      so a callable decides by key presence, and `_filter_value` is the one `BeforeValidator`
      because it must see a YAML float before union coercion turns it into a `Decimal`
    cites: [D-1]
  - id: D-16
    grade: ASSUMED
    text: >-
      A value field's mapping may be `{const: <literal>}`, a fourth shape beside a
      path, a recipe and a macro. The literal is a boolean, an integer, or a string
      that may carry a decimal or an ISO date or instant; a float, a non-finite number,
      a NUL byte and a template brace are refused at parse. It is checked against
      the field's declared type at the typecheck stage by the rule a metric filter's
      value is held to, and lowers to `CAST(<literal> AS <type>)`, a temporal in UTC
      without the ISO `T`. An unquoted YAML date fits only a date or timestamp field,
      and a string is kept as written, whitespace included. It reads no source path,
      carries no `transform:` and no `quality:`, gets no implicit `coercible` rule,
      and draws no lineage edge; a `convert` step that names it as a sibling column
      reads its literal. A key field is not a constant
    paths:
      - src/bloomery/spec/mapping.py
      - src/bloomery/resolve/build.py
      - src/bloomery/resolve/graph.py
      - src/bloomery/quality/lower.py
      - src/bloomery/guardrails/quality.py
      - src/bloomery/guardrails/metrics.py
      - tests/unit/test_spec/test_mapping_const.py
      - tests/execution/test_mapping_const.py
      - tests/golden/schema/mapping.json
      - pages/docs/reference/spec-schemas.md
    consequence: >-
      Two marketplaces landing in one merged entity each name their rows, and so
      does a single mapping, without `_source`, which names a relation and exists
      only once two mappings feed an entity. Lineage walks upstream from such a field
      to nothing, which is the truth, rather than to a source column it never reads.
      A value outside the field's type is refused with the field's path, not cast at
      run time
    rationale: >-
      #375. The workaround read a path that is always present and mapped every value
      to the constant through an `enum_map` fallback: it broke on a NULL in that path
      and named the path in lineage. The brace is refused because dbt renders the
      whole model as Jinja, quoted literals included. The literal is typed as a filter
      value is, so no text is implicitly cast. Transforms and rules are left out because
      there is no bronze value for them to read, and a constant key would make every
      row of a mapping share one key
    cites: [D-15, S-0030/D-8, S-0033/D-3, S-0020/D-5]
