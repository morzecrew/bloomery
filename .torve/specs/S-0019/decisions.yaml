# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      All spec models are Pydantic v2, `extra="forbid"`, `frozen=True`. Unknown keys
      are hard errors at parse.
  - id: D-2
    grade: ASSUMED
    text: >-
      Loaders are pure text-in: `load_catalog(text)`, `load_project(sources: Mapping[str,
      str])`. No path/file API will be added to the core package — I/O belongs to
      callers.
    paths: [src/bloomery/spec/project.py]
  - id: D-3
    grade: ASSUMED
    text: >-
      Every raisable failure derives from `BloomeryError` and carries `source_path`;
      all error classes are declared in `bloomery/errors.py` so `except BloomeryError`
      needs one import. Pydantic/yaml exceptions never escape.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/guardrails/quality.py
      - src/bloomery/spec/common.py
  - id: D-4
    grade: ASSUMED
    text: >-
      Parse validates shape and grammar only; reference existence (entities, transforms,
      canonical fields) is deferred to resolve/typecheck. Consequence: a shape-valid
      spec with dangling references parses fine — callers must run `resolve` to trust
      it.
    paths:
      - src/bloomery/marts/flatten.py
      - src/bloomery/resolve/refs.py
      - src/bloomery/spec/__init__.py
      - src/bloomery/spec/entity.py
      - src/bloomery/spec/mapping.py
      - src/bloomery/spec/metrics.py
      - src/bloomery/spec/quality.py
      - tests/golden/schema/metrics.json
      - tests/property/test_schema_agreement.py
      - tests/unit/test_spec/test_entity.py
  - id: D-5
    grade: ASSUMED
    text: >-
      PyYAML (`safe_load` + duplicate-key rejection) is added as a runtime dependency.
    paths: [src/bloomery/spec/common.py]
  - id: D-6
    grade: ASSUMED
    text: >-
      Parse-stage errors are batched per document (all failures reported at once).
    paths:
      - src/bloomery/cli/__init__.py
      - src/bloomery/errors.py
      - src/bloomery/evidence.py
      - src/bloomery/guardrails/stage.py
      - src/bloomery/resolve/build.py
      - src/bloomery/resolve/refs.py
      - src/bloomery/spec/common.py
      - src/bloomery/spec/project.py
      - src/bloomery/typing/check.py
      - tests/unit/test_cli.py
      - tests/unit/test_evidence.py
      - tests/unit/test_resolve/test_build.py
      - tests/unit/test_resolve/test_refs.py
      - tests/unit/test_spec/test_mapping.py
      - tests/unit/test_spec/test_project.py
      - tests/unit/test_spec/test_sql_text.py
  - id: D-7
    grade: ASSUMED
    text: >-
      `materialization` is explicit-with-derived-default (settles original open question
      #4); the resolved value is IR-recorded and diffable.
    paths:
      - src/bloomery/emit/lower/silver.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/marts/flatten.py
      - src/bloomery/resolve/build.py
      - src/bloomery/spec/entity.py
      - tests/unit/test_emit/test_quality_artifacts.py
      - tests/unit/test_resolve/test_build.py
      - tests/unit/test_spec/test_entity.py
  - id: D-8
    grade: ASSUMED
    text: >-
      Catalog is passed separately from `Project` (vertical-level vs tenant-level),
      matching spec §8's `compile_project(..., catalog=...)`.
    paths:
      - src/bloomery/cli/io.py
      - src/bloomery/schema.py
      - src/bloomery/spec/catalog.py
      - src/bloomery/spec/project.py
      - tests/property/test_schema_agreement.py
  - id: D-9
    grade: ASSUMED
    text: >-
      (Amended for `_bloomery-changes.md`) A fifth spec kind `marts:` joins the four
      (S-0027); `semi_additive` metrics carry a typed `SemiAdditivePolicy` and `non_additive`
      metrics a `RatioSpec` (S-0028/D-5). Spec-layer scope is still shape/grammar
      only.
    paths:
      - src/bloomery/spec/common.py
      - src/bloomery/spec/marts.py
      - tests/golden/schema/catalog.json
      - tests/golden/schema/metrics.json
      - tests/unit/test_spec/test_metrics.py
  - id: D-10
    grade: ASSUMED
    text: >-
      (Amended for `_bloomery-metricflow-pivot.md`) `metric_time` is a reserved dimension/field
      name, rejected at spec validation with a clear message (S-0030 R4). The `Metric`
      model reserves optional `cumulative:` (window / grain_to_date) and derived-expression
      forms lowered per S-0030's mapping table; both are additive spec surface, parse-validated
      only.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/guardrails/metrics.py
      - src/bloomery/spec/common.py
      - src/bloomery/spec/entity.py
      - src/bloomery/spec/marts.py
      - src/bloomery/spec/metrics.py
      - tests/golden/schema/catalog.json
      - tests/golden/schema/entity_model.json
      - tests/golden/schema/marts.json
      - tests/golden/schema/metrics.json
      - tests/unit/test_guardrails/test_metrics.py
      - tests/unit/test_spec/test_metrics.py
  - id: D-14
    grade: ASSUMED
    text: >-
      *(2026-08-12)* **An entity or mart name is an identifier, because it reaches
      the model envelope and nothing there quotes it.** Both were unconstrained —
      `entities: dict[str, Entity]`, and marts under `MemberName`, which only rejects
      reserved words. Field names travel a *different* path and were always safe:
      they reach SQL through SQLGlot, which quotes them and doubles an inner quote,
      verified by compiling a field named `amt") OR 1=1 --` and reading the escaped
      identifier back out. A **relation** name also reaches the SQLMesh `MODEL (...)`
      block, which is Jinja over pre-rendered strings (D4) and quotes nothing, so
      an entity named `t"; DROP TABLE x --` emitted `name silver.t"; DROP TABLE x
      --,` into the model definition verbatim. Fixed at the spec layer with `^[a-z][a-z0-9_]*$`
      rather than by escaping at the envelope, on the same reasoning that pins `StepRef`:
      a relation name has no business carrying anything but identifier characters,
      and a pattern refuses at the source path where the author can act on it instead
      of silently mangling the artifact. Step output bindings were already covered
      by `RELATION_PATTERN`; metric names do not become relations. Every name in the
      fixture corpus already matched, so the constraint documents existing practice
      rather than narrowing it.
    paths:
      - src/bloomery/spec/common.py
      - tests/unit/test_spec/test_relation_names.py
