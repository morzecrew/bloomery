# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      `tests/support/reference.py` states each built-in transform's value semantics
      as a Python function over `None`, `int`, `Decimal`, `str`, `bool`, `date`, zoneless
      UTC `datetime` and parsed JSON for a variant (`JSON_NULL` for JSON `null`, compared
      structurally), written from the transform reference page and the decision rows
      it cites, never from the SQLGlot builders. Decimals are quantized to the declared
      output type with `ROUND_HALF_UP`; a value beyond the declared precision is `Overflow`,
      which a plain entity's engine must raise and a quality-ruled entity's must return
      as NULL. A transform whose input is not text is reached through a typed setup
      step the reference also applies, and `convert` receives the fixture's `fx_rates`
      relation and the row's anchor date.
    paths: [tests/support/reference.py]
    consequence: >-
      a transform's behaviour is stated twice, independently, and a test can say which
      statement an engine broke
    rationale: >-
      A reference derived from the builder agrees with it by construction, mistakes
      included.
  - id: D-2
    grade: ASSUMED
    text: >-
      A differential property draws, for each built-in, a declared input type and
      values of it, NULL and the boundary values included, compiles a one-entity fixture
      with the transform on one field, runs its silver SQL, and requires every row's
      value to equal the reference's exactly. The DuckDB half is a `property` test
      and runs in `just test`; the PostgreSQL 16 half is an `engine("postgres")` test
      under `tests/engines/` on a session-scoped container from `tests/support/postgres.py`.
    paths:
      - tests/property/test_reference_transforms.py
      - tests/engines/test_reference_postgres.py
      - tests/support/postgres.py
    consequence: >-
      both engines are held to one statement on inputs nobody chose, and the DuckDB
      half guards every pull request
    rationale: >-
      The engine tier needs Docker and runs nightly and on path-matched pull requests;
      DuckDB is in-process and costs the required job seconds.
    check: >-
      uv run pytest tests/property/test_reference_transforms.py -q
  - id: D-3
    grade: ASSUMED
    text: >-
      `tests/support/engine_differences.py` lists every allowed difference as an engine,
      a transform, a predicate over the input, what the engine is held to instead
      (a value, or a bound on its answer against the reference's), and the decision
      row or `path:line` that makes it legitimate. A disagreement no row names fails,
      printing the input, each engine's answer and the reference's.
    paths: [tests/support/engine_differences.py]
    consequence: >-
      an engine difference is either a written decision or a defect, never a tolerance
    rationale: >-
      DuckDB's inexact `divide` and its `''` for a regex non-match are already known
      and cited in the dialect code; a table makes the next one a choice someone writes
      down.
  - id: D-4
    grade: ASSUMED
    text: >-
      The comparison is exact except where a D-3 row states a bound. Decimals compare
      after quantizing to the declared scale, timestamps as zoneless UTC, text byte
      for byte, variants structurally; no tolerance exists anywhere in the differential
      tests outside the table.
    paths:
      - tests/property/test_reference_transforms.py
      - tests/engines/test_reference_postgres.py
    consequence: >-
      a rounding or widening slip is a failure, not a pass within 0.01
    rationale: >-
      The three-way equivalence corpus's `ATOL = 0.01` is right for float metrics
      and would hide exactly the decimal errors this exists to find.
  - id: D-5
    grade: ASSUMED
    text: >-
      `tests/conftest.py` registers Hypothesis profiles: `dev` (the default), `ci`
      (fewer examples, derandomized, `print_blob` on) and `nightly` (more examples),
      chosen by `HYPOTHESIS_PROFILE`. Every CI job that runs property or engine tests
      sets `ci`, except the engine job's nightly schedule, which sets `nightly`; the
      phases' acceptance commands set `ci` too.
    paths: [tests/conftest.py, .github/workflows/ci.yml]
    consequence: >-
      a failure in CI prints the blob that reproduces it locally, and the nightly
      run searches wider than a pull request can afford
    rationale: >-
      No profile is registered today, so every property test runs Hypothesis's defaults
      everywhere.
  - id: D-6
    grade: ASSUMED
    text: >-
      Chains of up to three built-ins, catalog recipes and the marts' time buckets
      join the differential. A chain's reference is the composition of its steps'
      references. A recipe's `/` divides a dividend cast to `decimal(min(38, digits
      + scale), scale)`, where `digits` is the larger of 29 and the declared integer
      digits and `scale` the larger of the declared scale and `min(9, 38 - digits)`
      (`resolve/build.py`, S-0090/D-3), and its result is narrowed to the declared
      type with `ROUND_HALF_UP`; an engine whose internal division scale rounds twice
      is a D-3 row, not a tolerance. A bucket is `DATE_TRUNC` to day, week, month,
      quarter or year of a zoneless UTC timestamp, as a `date`.
    paths:
      - tests/support/reference.py
      - tests/property/test_reference_chains.py
      - tests/engines/test_reference_postgres.py
    consequence: >-
      the widening and narrowing between steps, and the division a recipe promises,
      are checked where they compose
    rationale: >-
      Single transforms pass while their composition narrows twice; the build step
      is where those meet.
    check: >-
      uv run pytest tests/property/test_reference_chains.py -q
  - id: D-7
    grade: ASSUMED
    text: >-
      The rollup aggregates (`count`, `sum`, `min`, `max`) join the differential over
      generated groups. The emitter aggregates the metric's expression, so `count`
      is `COUNT(expr)`: a retained group whose expression is NULL on every row counts
      0 and sums, minimises and maximises to NULL. A group the filter removes entirely
      produces no row, and the reference states its absence rather than a value. The
      rollup SQL adds no `COALESCE` to change either.
    paths:
      - tests/support/reference.py
      - tests/property/test_reference_rollups.py
      - tests/engines/test_reference_postgres.py
    consequence: >-
      an empty or all-NULL group's value is a stated fact, not an accident of the
      engine
    rationale: >-
      Empty groups are where an aggregate's answer is most often assumed and least
      often tested.
    check: >-
      uv run pytest tests/property/test_reference_rollups.py -q
  - id: D-8
    grade: ASSUMED
    text: >-
      At query time only the build-time `divide` and a recipe's `/` are exact (S-0046/D-3,
      S-0090/D-3); every other division is the engine's own `/`. A ratio metric divides
      its numerator by `NULLIF(denominator, 0)`, in the composed planner and the Cube
      emitter alike, and MetricFlow's PostgreSQL rendering of a ratio casts the numerator
      to `DOUBLE PRECISION`. A metric's `expr` and a `derived:` expression keep their
      authored SQL: their `/` has no automatic zero guard, and its result type is
      the engine's for the emitted operand types and casts. This is intended: S-0020/D-5
      bans floats in the IR and in emitted artifacts, not in the arithmetic an engine
      runs. The later query-time reference models these cases as stated here and cites
      this row.
    paths:
      - src/bloomery/transforms/_builtins.py
      - src/bloomery/planner/compose.py
      - src/bloomery/emit/metricflow/__init__.py
    consequence: >-
      a reference for query-time SQL has a stated semantics to hold the planner to,
      instead of guessing which division is meant
    rationale: >-
      Settles Q-1 (owner, 2026-10-13). `_builtins.py` already says a ratio keeps the
      engine's own division; this makes it a row a test can cite.
