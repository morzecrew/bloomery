entries:
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    class: spec-gap
    at: '2026-10-14T19:48:57Z'
    claim: >-
      The finding asserts that tests/property/test_reference_chains.py:17 carries
      a docstring claiming support.engine_differences is consulted, and that the DuckDB
      chains test never imports it. That file does not exist in this tree: phase 3
      of S-0092, whose path this is, is unbuilt, and the row index records S-0092/D-6
      as implementation: none (tests/property/AGENTS.md:196). With no module there
      is no docstring to contradict and no import to add, so the claim does not hold
      against the tree.
    evidence: >-
      tests/property/AGENTS.md:196 — the row index marks S-0092/D-6 implementation:
      none; `ls tests/property/test_reference_chains.py` prints ls: cannot access
      tests/property/test_reference_chains.py: No such file or directory
    action: decided
    proposal: >-
      When the phase-3 chains differential lands under S-0092/D-6, tests/property/test_reference_chains.py
      must state its D-3 handling truthfully: either consult support.engine_differences
      the way tests/property/test_reference_transforms.py:38 and tests/engines/test_reference_postgres.py:37
      do, or say in the docstring that chains compare exactly and why no register
      row applies.
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    class: spec-gap
    at: '2026-10-14T19:48:57Z'
    claim: >-
      The finding asserts that the S-0092/D-6 recipe check does not catch a recipe
      that skips the dividend widening, citing tests/support/reference.py:684 and
      a RECIPE_OPERANDS corpus. Neither exists: tests/support/reference.py:684 is
      a blank line inside the timezone strategies, and a search of tests/ finds no
      RECIPE_OPERANDS, recipe_quotient, _run_mapping or _assert_exact. The recipe
      differential is unbuilt (tests/property/AGENTS.md:196 marks S-0092/D-6 implementation:
      none), so there is no operand corpus to weaken and no edit is possible.
    evidence: >-
      tests/support/reference.py:684 — the line is blank, sitting between _SAFE_HOUR
      and _unambiguous; `grep -rn RECIPE_OPERANDS recipe_quotient _assert_exact tests/`
      returns no matches
    action: decided
    proposal: >-
      When the recipe differential lands, its operand corpus must include a pair that
      separates the widened-then-narrowed quotient from a single rounding — a dividend
      whose magnitude exceeds the declared integer digits at the widened scale, drawn
      unconditionally rather than inside one branch of a one_of — so that replacing
      CAST(... AS DECIMAL(38, 9)) with no cast or a narrower one makes the check fail.
