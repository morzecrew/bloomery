id: S-0092
title: Generated SQL agrees with a reference evaluator
kind: design
change:
  type: test
  scope: transforms
status: draft
implementation: none
depends_on: [S-0020, S-0021, S-0045, S-0046, S-0090]
informed_by: []
supersedes: []
superseded_by: null
owner: Lev Litvinov
schema_version: 4
summary: |-
  bloomery's correctness lives in the SQL it emits, and the tests that judge that SQL either compare it with itself (395 golden files, byte for byte) or run it on fixed inputs someone chose (the execution tier on DuckDB, the engine tier on PostgreSQL 16, the three-way equivalence corpus). Nothing states what a transform should return on an input nobody thought of, and nothing compares the engines' answers against that statement. The semantics that go wrong are the quiet ones: NULL in, NULL out or not; exact or float division; a decimal widened, rounded or narrowed; a timestamp that carries an offset; an empty group's aggregate.

  This document adds a reference evaluator: a small Python function per built-in transform, written from the transform reference page and the decision rows rather than from the SQL, over `None`, `int`, `Decimal`, `str`, `bool`, `date` and zoneless UTC `datetime`. Hypothesis generates inputs from each transform's declared input type; the compiled silver SQL runs on PostgreSQL 16 and on DuckDB; each engine's answer must equal the reference's, exactly. Where an engine legitimately differs (DuckDB's inexact `divide`, a regex non-match that DuckDB returns as `''`), the difference is a named row in a table the test reads, citing the decision or line that allows it; a difference the table does not name fails. Chains, recipes, the marts' time buckets and the rollup aggregates follow the same pattern. Query-time SQL (MetricFlow, the composed planner) is a later document.
motivation: >-
  Queued by the owner on 2026-10-13 from the research "Should Torve Prove Its Code?"
  (torve artifact WV2nKgN5QSy78B7SUod3o5): differential and property testing against
  a reference found more defects than proofs in the case it cites (Cedar: 21 against
  4), and bloomery's SQL generator is the component in the organisation where a reference
  is cheapest to write and a wrong answer is most expensive.
current_state: >-
  `transforms/_builtins.py` defines the 24 built-ins as SQLGlot builders with declared
  output types (decimal widening capped at 38 digits, every result narrowed by a CAST);
  `divide` and a recipe's `/` emit `BLM_EXACT_DIV`, which `dialects/base.py` renders
  as exact division on every port but DuckDB, where it is knowingly inexact. Quality-ruled
  entities turn every CAST into TRY_CAST, which PostgreSQL renders through `pg_input_is_valid`.
  Tests: golden snapshots, an in-process DuckDB execution tier, a PostgreSQL engine
  tier where ten modules each start their own `postgres:16-alpine` container, `tests/equivalence/test_three_way.py`
  (planner, Cube and hand-written SQL over one PostgreSQL, `ATOL = 0.01`), and ten
  Hypothesis modules under `tests/property`, of which `test_conservation.py` runs
  generated bronze batches on DuckDB. Hypothesis never runs against PostgreSQL, registers
  no profiles, and no Python code computes a transform's value.
goals: |-
  - Every built-in transform's value semantics is stated once, in Python a reader can check against the reference page, and both engines are held to it on generated inputs.
  - Every place PostgreSQL and DuckDB may legitimately disagree is a named, cited row; any other disagreement fails.
  - A failing example is reproducible from the CI log.
non_goals: |-
  - Query-time SQL: MetricFlow's planned SQL and the composed planner are a later document, which the reference evaluator here is shaped to serve.
  - Engines other than PostgreSQL and DuckDB: the other ports' rungs stay as they are.
  - Replacing the golden or execution tiers: they pin bytes and fixtures; this states values.
  - Changing any transform's semantics: a disagreement this finds is filed and fixed under its own document.
design:
  - key: the-reference
    md: |-
      `tests/support/reference.py` maps each built-in's name to a Python function over the logical values a column can hold:

      | Logical type | Python value |
      |---|---|
      | NULL | `None` |
      | integer | `int` |
      | decimal(p, s) | `Decimal`, quantized to `s` and checked against `p` |
      | text | `str` |
      | boolean | `bool` |
      | date | `datetime.date` |
      | timestamp | zoneless `datetime.datetime`, UTC by S-0045 |

      Each function is written from `pages/docs/reference/transforms.md` and the decision rows it cites, never by reading the builder, so the two are independent statements of one behaviour. Output types reuse the declared ones the type checker already computes; the reference quantizes to them.
  - key: the-differential
    md: >-
      For each transform, a strategy draws a declared input type and values of it,
      NULL and the boundary values included (zero, the decimal's maximum, empty text,
      DST edges, offset-bearing timestamp text). A one-entity fixture is compiled
      with the transform on one field, its silver SQL runs on a session-scoped PostgreSQL
      16 container and on DuckDB, and each row's value must equal the reference's.
      The comparison is exact: no tolerance.
  - key: legitimate-differences
    md: >-
      `tests/support/engine_differences.py` is the table of allowed differences: an
      engine, a transform, a predicate over the input, the value that engine returns
      instead, and the citation (decision row or `path:line`) that makes it legitimate.
      It starts with DuckDB's inexact `divide` (`dialects/base.py`) and DuckDB's `''`
      for a regex non-match (`dialects/postgres.py`). A disagreement no row names
      fails and prints the input, both answers and the reference's.
tests: ''
docs: ''
out_of_scope: |-
  - Query-time SQL (MetricFlow, the composed planner), including how a ratio, derived or metric `expr` divides: today those render as engine division, which on PostgreSQL is a `DOUBLE PRECISION` cast (Q-1).
  - Moving the ten existing PostgreSQL modules onto the shared container fixture this adds.
risks: ''
alternatives:
  - option: >-
      Compare PostgreSQL against DuckDB only, with no reference.
    rejected_because: >-
      Two engines that agree on a wrong answer pass, and the existing spellings test
      already does this on fixed inputs; a reference is what says which one is right
      when they differ.
  - option: >-
      Derive the reference from the transform builders (evaluate the SQLGlot tree
      in Python).
    rejected_because: >-
      It would agree with the builder by construction, including on the builder's
      mistakes; the reference is useful because it is written from the documented
      behaviour.
questions:
  - id: Q-1
    text: >-
      Outside this document's scope but found while mapping it: a metric's `expr`,
      a ratio, a derived metric and the composed planner divide with the engine's
      own `/`, which PostgreSQL renders as `CAST(... AS DOUBLE PRECISION) / NULLIF(...,
      0)`. `transforms/_builtins.py` says a ratio "must keep the engine's own division
      semantics", while S-0020/D-5 bans floats in the IR and emission. Is float division
      at query time intended, so the later query-time document's reference should
      expect it, or should query-time division be exact as the build-time `divide`
      is? Lean: intended for ratios and derived metrics, stated in a decision row
      so the reference can cite it.
