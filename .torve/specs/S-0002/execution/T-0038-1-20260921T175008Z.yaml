    at: '2026-09-21T17:30:21Z'
    attempt: 3
    claim: >-
      the ProjectIR field this phase requires moves every project's fingerprint, importing
      or not, so the golden tier is left red and its scope does not include the snapshots
    evidence: >-
      src/bloomery/ir/nodes.py:1704 — bloomery_ir_version 20 to 21 for the appended
      upstream field; `uv run pytest tests/golden -q` reports 37 failed, 25 passed,
      every failure a fingerprint line such as int: blm1:0d0c… against int: blm1:5240…
    action: decided
    proposal: >-
      the phase that lands the composed fingerprint names tests/golden/** in its scope,
      or the runner regenerates the snapshots: any field appended to ProjectIR moves
      every fingerprint
