    at: '2026-09-23T11:33:33Z'
    claim: >-
      the review claim does not hold: imported nodes do not join ProjectIR.entities/.marts,
      no downstream model is emitted for an imported relation, and no quality verdict
      is hard-coded for one; ProjectIR.upstream is a separate collection and with_imported
      is a resolver-only view the emitters never walk
    evidence: >-
      `uv run python /tmp/probe_t0074.py` — compiling a downstream importing platform's
      order/order_item entities and order_items mart emits exactly ['config.yaml',
      'models/gold/dim_date.sql', 'models/silver/shipment.sql']; ProjectIR.entities
      is ['shipment'], ProjectIR.marts is [], and the imported nodes sit under ProjectIR.upstream;
      src/bloomery/resolve/build.py:2567 binds them to upstream= rather than entities=,
      src/bloomery/emit/sqlmesh/__init__.py:1109 walks ir.entities and src/bloomery/emit/sqlmesh/__init__.py:1167
      uses with_imported only to resolve mart bases; tests/unit/test_emit/test_cross_project.py:163
      asserts this for all targets and passes
    action: decided
    proposal: >-
      no change; the claim's cited coordinate src/bloomery/resolve/build.py:2597 is
      inside the currency-conversion region, not the import binding at 2312-2391,
      and S-0002/D-5's stripping at 2380 is correct precisely because the stripped
      nodes are never emitted
    notes: >-
      Claim rejected, nothing changed in src. The behaviour it describes would require
      imported entities to reach ProjectIR.entities; they do not, by construction
      of _bind_imports and with_imported (src/bloomery/ir/nodes.py:1587).
