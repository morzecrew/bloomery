entries:
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-09-23T12:09:06Z'
    claim: >-
      rejected: an imported mart whose base entity is not imported does not crash
      the compile. _bind_imports returns UpstreamIR rows into draft.upstream, never
      draft.marts, so the sqlmesh emitter (which builds _mart_artifact only over ir.marts)
      never looks the missing base up; the four targets all compile the described
      spec. The claim's stated mechanism does not exist in this tree.
    evidence: >-
      src/bloomery/resolve/build.py:2567 — _bind_imports feeds the upstream= field,
      and src/bloomery/emit/sqlmesh/__init__.py:1168 iterates ir.marts (local only)
      while passing with_imported(ir) purely as the base-lookup view; compiling a
      downstream importing marts:[order_items], metrics:[gross_revenue, order_count]
      from ecom_basic with no entities imported printed 'DOWN marts: []', 'DOWN upstream
      marts: [order_items]' and then 'sqlmesh OK 3 / dbt OK 6 / cube OK 2 / metricflow
      OK 1' with no InvariantViolated
    action: decided
    proposal: >-
      no change: the reported crash is not reachable in this tree; the guaranteed()
      lookup at emit/sqlmesh/__init__.py:507 is only reached for local marts, whose
      unresolvable base is already refused by the mart-base guardrail (GuardrailError:
      "mart base names entity 'order_item', which no mapping lowers")
    notes: >-
      Second route checked too: a local mart naming an unimported base is refused
      at the guardrail stage, not at emit.
