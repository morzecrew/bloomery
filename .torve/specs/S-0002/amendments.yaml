amendments:
  - id: A-1
    at: '2026-09-21T21:59:34Z'
    md: |-
      Phase 3 gives `ProjectIR` its `upstream` field, typed `UpstreamIR`, and
      the `with_imported` builder beside it, and `bloomery.ir` re-exports every
      other public node while its own `__init__.py` sat outside the phase's
      scope: T-0053 found the two names unreachable from the package's public
      module and T-0068, the round the leg minted for it, halted three times on
      the same scope. Phase 3 reaches the facade; nothing else in the phase
      changes.
      Phase 3 reaches the ir facade that re-exports its nodes
  - id: A-2
    at: '2026-09-23T11:55:34Z'
    title: >-
      Guards that judge a local declaration read the composed view
    md: |-
      Phase 3 ran three guards over the composed view and every other one over
      the draft, on the reasoning that an imported node was judged where it was
      authored. The reviewer's three outside-diff comments on #172 name the
      declarations that reasoning misses: a local mart listing an imported
      metric skips `check_metrics`, a local published mart flattening an
      imported entity's `secret` column skips classification, and an exposure
      cannot name an imported mart or metric. D-9 says those guards read the
      composed view with local marts and rollups as the publication targets;
      it is an author's row, `ASSUMED` until the owner grades it, and the code
      change it asks for is a hand landing on this document's branch.
  - id: A-4
    at: '2026-09-24T03:05:01Z'
    title: D-9 and D-10 locked; phase 6 implements D-10
    md: |-
      The owner graded D-9 and D-10 `LOCKED` after #172 merged with D-9's code
      and D-10's row. Phase 6 is the phase D-10 lacked: the producer's dbt
      project name on the exports document, carried on `ExportsIR` and
      `UpstreamIR`, spelled by the dbt target into `dbt_project.yml`,
      `dependencies.yml` and the two-argument `ref()`, with the import guard
      refusing a nameless upstream on that target. It owns `tests/golden/**`
      because the fixture that exports a name moves its `dbt_project.yml` and
      the corpus pin with it — the lesson phase 4 taught when it moved the
      fingerprint and left the goldens to phase 5.
  - id: A-5
    at: '2026-09-28T07:47:05Z'
    title: >-
      Phases 7 and 8: the command compiles an importing project
    md: |-
      Two gaps the 0.3.0 changelog recorded rather than closed. Composition landed
      reachable from Python only: `compile_project(upstream=...)` is the whole
      door, so an importing project is refused at the command line with
      `UnknownUpstream`, and the design's own D-8 — how the artifact reaches the
      compile is the caller's — was never given a caller. Phase 7 gives the IR a
      canonical file form and the command a way to read and write it, and leaves
      discovery where D-8 put it. Phase 8 writes the cycle check D-4 locks:
      execution left it "satisfied by construction" because one compile cannot
      form a cycle, and phase 7 makes two projects naming each other one command
      away, which is the arrangement D-4 exists to refuse.
      Phases 7 and 8: the CLI compiles an importing project, and a cycle is refused
  - id: A-6
    at: '2026-09-29T05:02:53Z'
    title: Rows for what the implementation decided
    changes:
      - subject: D-11
        field: text
        after: >-
          A downstream project reads an imported entity and never extends it: an import
          names nodes with no field list, a mapping targets only an entity the local
          model declares, and a local entity of the imported name is refused as an
          `ImportCollision`, so a field is added upstream and exported from there
      - subject: D-12
        field: text
        after: >-
          A name two or more upstreams supply under one kind is an `ImportCollision`,
          as a local-against-imported name is: `_claimed_twice` refuses it once per
          name, naming every alias that supplies it, and `_bind_imports` binds it
          from none of them
      - subject: D-13
        field: text
        after: >-
          The cross-boundary grain refusal belongs to the resolution phase, not the
          declaration phase: once imported names resolve, `check_grain` reads an imported
          entity's grain off the upstream's IR and refuses a fan-out across the boundary
          exactly as within one project, and a grain neither project declares stays
          unknown
    md: |-
      Questions this document left to implementation were answered by the code, and no row said so. Each new row states what the code does, checked against it on 2026-09-29, and is graded ASSUMED; the owner's merge is the acceptance.

      - D-11 answers Q-2.
      - D-12 answers Q-4.
      - D-13 answers Q-5.
  - id: A-7
    at: '2026-10-01T09:04:35Z'
    title: Settled by S-0085
    md: >-
      S-0085, accepted by the owner on 2026-10-01, answers Q-1 in S-0085/D-6: the
      IR records no naming policy until a surface other than Python can select one;
      then it records each export's resolved relation and the emit seam refuses a
      mismatch.
