alternatives:
  - option: >-
      Everything public by default, with no export list
    rejected_because: >-
      A project that exports its whole spec has no boundary at all, and its first
      refactor breaks every consumer. The surface has to be a list somebody wrote,
      so that a name absent from it is not exported however public it looks from inside.
  - option: >-
      Handing the upstream's spec documents to the downstream compile
    rejected_because: >-
      Re-resolving them downstream would put the upstream's mappings, steps and quality
      surfaces inside the boundary — all three of which are how a thing is built rather
      than what it is. The boundary is what was built, not what was written.
  - option: A path the downstream compile opens and reads
    rejected_because: >-
      Compilation is a pure function of its inputs and performs no I/O; the upstream
      is a value passed to `compile_project`, exactly as a step registry is.
  - option: >-
      Hashing only the exports the downstream actually touched
    rejected_because: >-
      It removes the churn and costs the property that makes a fingerprint worth having:
      it would depend on analysis rather than on identity, and two compiles that read
      the same upstream differently would disagree about what the upstream was.
  - option: >-
      Resolving import cycles rather than refusing them
    rejected_because: >-
      A cycle among projects is a modelling mistake, not a scheduling problem, and
      the resolution would have to invent an order nobody wrote.
  - option: >-
      Letting a downstream project extend an imported entity by adding fields
    rejected_because: >-
      It is what people will want, and it makes the boundary a subclassing relationship
      — a much larger claim than a dependency needs. Left open below rather than closed
      for good.
  - option: >-
      A registry, a package manager, or any form of distribution
    rejected_because: >-
      How the upstream artifact reaches the compile is the caller's, and a tempting
      answer to a real question is how this design grows into a different project.
questions:
  - id: Q-1
    text: >-
      Should the upstream IR carry the naming policy it was compiled under, so a mismatch
      between two composing projects is a refusal rather than a run-time surprise?
  - id: Q-2
    text: >-
      May a downstream project extend an imported entity — adding fields — or only
      read it? Extension makes the boundary a subclassing relationship.
  - id: Q-3
    text: >-
      Should `bloomery resolve` report imported-but-unused exports? It is the upstream's
      dead code, visible only downstream.
  - id: Q-4
    text: >-
      Accept or refuse the row execution proposed in `logs/T-0061.md`: a name supplied
      by two upstreams is a collision, proposed LOCKED. The guard already refuses
      it; the source document's text names only the local-against-imported case.
  - id: Q-5
    text: >-
      Accept or refuse the row execution proposed in `logs/T-0061.md`: grain conflict
      belongs to the resolution phase, proposed ASSUMED, because it has no reachable
      input until an imported entity is nameable by a mart. The phasing below already
      places it there; the row is what would make that a decision rather than an arrangement.
  - id: Q-6
    text: >-
      Accept or refuse the row execution proposed in `logs/T-0061.md`: the cycle refusal
      is satisfied by construction for a fresh compile, proposed ASSUMED, and a stale
      cycle is out of reach until a project has an identity.
  - id: Q-7
    text: >-
      Accept or refuse the row execution proposed in `logs/T-0061.md`: the CLI cannot
      compile an importing project until an IR has a serialized form, proposed OPEN.
      The out-of-scope section names the gap; no row carries it.
