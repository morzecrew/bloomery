# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 3
    title: Imported nodes in the graph
    intent: >-
      Make an imported name resolvable. Today `build_project_ir` resolves every reference
      against the IR it is building and an unknown name is refused as though it should
      have been local, so an import list declares a dependency nothing can read through.
      This phase lets a mart, a metric or a derivation name an imported entity, mart
      or metric; puts the imported nodes into the dependency graph with a project
      component on their ids while local ids keep their `<kind>.<name>` spelling;
      extends the namespace guard to refuse a local name colliding with an imported
      one; and adds the grain refusal, which belongs here rather than with the other
      refusals because until an imported entity is nameable by a mart the refusal
      has no reachable input. The upstream's identity has to reach `ProjectIR` in
      this phase, because the next one composes the fingerprint from it.
    scope:
      - src/bloomery/compile.py
      - src/bloomery/resolve/build.py
      - src/bloomery/resolve/graph.py
      - src/bloomery/resolve/lineage.py
      - src/bloomery/resolve/refs.py
      - src/bloomery/spec/imports.py
      - src/bloomery/guardrails/imports.py
      - src/bloomery/guardrails/lineage.py
      - src/bloomery/guardrails/grain.py
      - src/bloomery/guardrails/stage.py
      - src/bloomery/ir/__init__.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/errors.py
      - pages/docs/reference/errors.md
      - tests/unit/test_resolve/**
      - tests/unit/test_ir/test_nodes.py
      - tests/unit/test_guardrails/test_imports.py
      - tests/unit/test_guardrails/test_lineage.py
      - tests/unit/test_guardrails/test_grain.py
      - tests/fixtures/cross_project/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_resolve tests/unit/test_ir/test_nodes.py tests/unit/test_guardrails/test_imports.py
        tests/unit/test_guardrails/test_lineage.py tests/unit/test_guardrails/test_grain.py
        -q
      - uv run mypy src
  - phase: 4
    title: The composed fingerprint
    intent: >-
      Compose the downstream fingerprint from its own IR and the upstream fingerprint
      whole, so that "same specs in, byte-identical artifacts out" keeps meaning something
      once one of the specs is another project. The upstream identity reaches `ProjectIR`
      in the previous phase, so this one is the hash function and its test: the downstream
      moves when the upstream does, is byte-identical when neither moves, and is undisturbed
      by an upstream whose documents were reformatted without its IR moving. The surprising
      half is deliberate and belongs in the determinism page: an upstream change that
      touches nothing the downstream reads still moves it.
    scope:
      - src/bloomery/ir/fingerprint.py
      - tests/unit/test_ir/test_fingerprint.py
      - pages/docs/concepts/determinism.md
    acceptance:
      - >-
        uv run pytest tests/unit/test_ir/test_fingerprint.py -q
      - uv run mypy src
    depends_on:
      - 3
  - phase: 5
    title: The emitted reference
    intent: >-
      Emit a cross-project reference, which is where the boundary becomes something
      a warehouse sees. dbt needs `ref('upstream_project', 'model')` and the `dependencies.yml`
      entry that makes it resolvable — a different call shape from the local `ref()`,
      so the reference map gains a project component rather than a special case. SQLMesh
      has no cross-project reference and names the imported relation directly, which
      is what makes the shared naming policy a constraint rather than a preference.
      Cube and MetricFlow read an imported mart as a mart. The phase's second deliverable
      is the corpus-wide assertion that a single-project compile did not move, which
      is the claim most worth pinning in a change this size.
    scope:
      - src/bloomery/emit/**
      - src/bloomery/naming.py
      - tests/unit/test_emit/**
      - tests/golden/**
      - pages/docs/how-to/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_emit tests/golden -q
      - uv run mypy src
    depends_on:
      - 4
  - phase: 6
    title: The producer's dbt project name
    intent: >-
      Implement D-10. `exports.yaml` gains an optional `name` — the producer's dbt
      project name, the one identity a bloomery project carries and only because one
      target needs it; `Exports` and `ExportSet` parse it, `ExportsIR` carries it
      across, and `_bind_imports` puts it on `UpstreamIR` beside the alias. The dbt
      target then spells the two-argument `ref()` and the `dependencies.yml` entry
      with the upstream's name, and names the project in `dbt_project.yml` after its
      own export name when it has one and `bloomery` otherwise; an upstream that exports
      no name is refused at the import guard on the dbt target rather than emitted
      as files dbt cannot resolve, and every other target is untouched — SQLMesh names
      the relation, Cube and MetricFlow read a mart. The `ecom_basic` fixture exports
      a name so the cross-project tests and the goldens show it; the corpus pin moves
      for that fixture's `dbt_project.yml` and nothing else, which is the assertion
      to keep. The alias stays what keys the compile input and the resolver (D-2).
    scope:
      - src/bloomery/spec/exports.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/resolve/build.py
      - src/bloomery/guardrails/imports.py
      - src/bloomery/emit/dbt/__init__.py
      - pages/docs/how-to/emit-dbt.md
      - tests/unit/test_spec/test_exports.py
      - tests/unit/test_ir/test_nodes.py
      - tests/unit/test_emit/**
      - tests/unit/test_guardrails/test_imports.py
      - tests/fixtures/ecom_basic/exports.yaml
      - tests/golden/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_spec/test_exports.py tests/unit/test_ir/test_nodes.py
        tests/unit/test_emit tests/unit/test_guardrails/test_imports.py tests/golden
        -q
      - uv run mypy src
    depends_on:
      - 5
    character: structural
  - phase: 7
    title: The CLI compiles an importing project
    intent: >-
      Composition is reachable from Python and from nothing else: `compile_project`
      takes `upstream={alias: ProjectIR}` (D-2) and `bloomery compile` has no way
      to hand one over, so a project with an imports document is refused at the command
      line with `UnknownUpstream`. Give the IR a file form and the command a way to
      read it. The compiled IR gains a canonical JSON dump and a loader — `ir_json(ir)`
      and `ir_from_json(text)` under `bloomery.ir` — over the same type-driven walk
      the fingerprint takes, so the bytes are a function of the IR and nothing else
      and the loader refuses a `bloomery_ir_version` other than its own with the message
      `plan()` already uses for the same mismatch. `bloomery compile --emit-ir <path>`
      writes it beside the artifacts; `bloomery compile --upstream <alias>=<path>`
      (repeatable) reads one back per alias and passes the mapping through unchanged,
      so the resolver, the guards and the fingerprint see exactly what the Python
      caller passes. The path is the caller's (D-8): no discovery, no registry, no
      relative lookup beside the spec directory. A how-to shows the two commands end
      to end on the `cross_project` fixture, and the CLI test compiles the downstream
      from an upstream it wrote a moment earlier.
    scope:
      - src/bloomery/ir/__init__.py
      - src/bloomery/ir/json.py
      - src/bloomery/cli/__init__.py
      - src/bloomery/errors.py
      - pages/docs/how-to/emit-dbt.md
      - pages/docs/how-to/use-the-cli.md
      - tests/unit/test_ir/test_json.py
      - tests/unit/test_cli.py
      - tests/fixtures/cross_project/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_ir tests/unit/test_cli.py tests/unit/test_emit/test_cross_project.py
        -q
      - uv run mypy src
    depends_on:
      - 6
    character: structural
  - phase: 8
    title: An import cycle is refused
    intent: >-
      Write the check D-4 locks and execution left "satisfied by construction". A cycle
      cannot form in one compile because an upstream arrives compiled, but two projects
      that each name the other's export are exactly what D-4 refuses, and the CLI of phase
      7 makes that arrangement one command away. What a compile holds today is one hop:
      `ProjectIR.upstream` names the direct upstreams and an `UpstreamIR` carries no
      ancestry of its own, so A → B → A is visible and A → B → C → A is not. The IR
      therefore gains the closure: `UpstreamIR.ancestry`, the identity — export `name`
      where one is declared, fingerprint always — of every project above that upstream,
      filled when the upstream is bound from its own `upstream` tuple and their
      ancestries, so the serialized artifact of phase 7 carries the whole chain and a
      downstream needs nothing it was not given (D-8). `bloomery_ir_version` moves to 23
      for the new field and every fingerprint moves with it, once. The guard then refuses,
      as `ImportCycle` in `bloomery.errors`, any upstream whose ancestry names this
      project's own export `name` or carries this compile's own fingerprint, and the
      message names the chain alias by alias and ends with D-4's fix: decide which project
      owns the shared concept. Nothing is resolved and no order is invented. The error
      table gains the row; the `cross_project` fixture gains the three-project loop, and a
      test asserts the two-project one and the three-project one are both refused.
    scope:
      - src/bloomery/guardrails/imports.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/ir/json.py
      - src/bloomery/resolve/build.py
      - src/bloomery/errors.py
      - pages/docs/reference/errors.md
      - pages/docs/concepts/determinism.md
      - tests/unit/test_guardrails/test_imports.py
      - tests/unit/test_ir/**
      - tests/fixtures/cross_project/**
      - tests/golden/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_guardrails/test_imports.py tests/unit/test_ir
        tests/unit/test_docs_floor.py tests/golden -q
      - uv run mypy src
    depends_on:
      - 7
    character: structural
