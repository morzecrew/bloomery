# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: Evidence grades what crossed the boundary
    intent: >-
      `check_evidence` reads the composed view; a fact bound from an upstream grades
      ASSUMED, derived from `ProjectIR.upstream`; a strict consumer of one is refused
      by a boundary template the docs quote. Tests build the downstream inline as
      the cross-project tests do, cover the laundering scenario, and keep a dangling
      name leafless. No golden moves. Settles D-1 to D-5.
    scope:
      - src/bloomery/guardrails/evidence.py
      - src/bloomery/guardrails/stage.py
      - tests/unit/test_guardrails/test_evidence.py
      - tests/unit/test_emit/test_cross_project.py
      - tests/unit/test_docs_floor.py
      - pages/docs/concepts/what-bloomery-proves.md
    acceptance:
      - >-
        uv run pytest tests/unit/test_guardrails/test_evidence.py tests/unit/test_docs_floor.py
        tests/unit/test_emit/test_cross_project.py tests/unit/test_semantic/test_proof.py
        -q
      - uv run pytest tests/golden -q
    character: structural
