    grade: ASSUMED
    text: >-
      *(2026-08-10)* **Postgres hosts quality-carrying entities: `TRY_CAST` is a guard
      around Postgres' own input parser, not a regex. D30 is closed.** D30 named the
      escape hatch as "a per-type `CASE`-based fallback whose semantics are proven
      equal to `TRY_CAST`'s on the corpus", and a per-type regex is what that sounded
      like. It is the wrong build: a regex is an *approximation* of the parser, and
      it would have to be kept in step with it forever. `pg_input_is_valid` (Postgres
      16+) is the parser, so `CASE WHEN pg_input_is_valid(x, 't') THEN CAST(x AS t)
      END` accepts exactly what `CAST` accepts and yields NULL exactly where `CAST`
      raises — equal **by construction** rather than by a proof that decays. Measured
      anyway, because a claim that is checked is a commitment: over a 57-value adversarial
      corpus × 5 types, 284 of 285 cases identical to plain `CAST` modulo NULL-on-error.
      The rewrite lives in the dialect's `render`, so the IR keeps the dialect-neutral
      `TryCast` node it already had. **The 285th case is the finding.** Postgres accepts
      `now`/`today`/`tomorrow`/`yesterday` as datetime input and resolves them to
      the *transaction timestamp*, so a bronze cell spelling `now` coerces to a different
      value on every run — a backfill disagreeing with the run it replaces, which
      S-0020 exists to prevent, arriving green and unrestatable. The temporal guard
      excludes them, which is the one place it is deliberately **stricter** than `CAST`:
      such a cell becomes a coercion failure the `coercible` rule disposes of, a quarantined
      row rather than a silently unstable one. It also moves Postgres *toward* DuckDB,
      which rejects `now` outright. Verified by execution, not rendering — rendering
      was never the hard part, and D30's whole point was that a plain `CAST` renders
      beautifully and aborts the run: the quality-carrying fixture materializes on
      postgres 16 with the clean row kept and one specimen per failure mode quarantined,
