  - id: D-7
    grade: ASSUMED
    text: >-
      Fixed pipeline order — extract → transform → dedupe → field rules → row rules
      → route — never configurable. Dedupe before rules: validating first silently
      replaces a corrupt latest row with a stale clean one — data loss disguised as
      data quality.
