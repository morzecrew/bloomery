    grade: ASSUMED
    text: >-
      *(2026-08-12)* **A `pattern` rule may not nest unbounded repetition, because
      the cost is invisible from the spec and lands on one engine only.** The portable-subset
      scanner asked whether a regex *means* the same thing on every dialect (D5) and
      never what it *costs*. `^(?:a+)+$` passed — capturing groups are already refused,
      so the audit's first example was wrong, but `(?:…)` is accepted and reaches
      the engine. That is the textbook catastrophic-backtracking shape: two quantifiers
      can split one input exponentially many ways, and a non-matching subject makes
      the matcher try all of them. **Why the spec layer and not the engine.** DuckDB
      (RE2) and Trino (RE2J) match in linear time and would shrug; **Postgres** backtracks.
      So the rule passes review on the dialect a developer runs locally and hangs
      the one production uses — the same "silently means something else on another
      dialect" failure D5 exists to prevent, with the argument applied to cost rather
      than meaning. The check is one flag per open group in the existing single-pass
