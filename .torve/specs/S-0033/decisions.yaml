    text: >-
      *(2026-08-08, M12 fix)* **The portable regex subset is an allowlist, closed
      by construction.** It had been a seven-prefix denylist plus `re.compile`, which
      accepts every construct nobody listed — verified on DuckDB: a backreference
      (`(a)\1`), an atomic group (`(?>abc)`), a possessive quantifier (`a*+`) and
      `\A\d+\Z` all parsed clean and *aborted the run*, while `[[:alpha:]]` and `(?i)`
      were accepted with divergent meaning. The scanner now names what it accepts
      — literals, `.`, character classes with ranges and negation, `\d`/`\w`/`\s`
      and their negations, the anchors `^`/`$`, the quantifiers `* + ? {n} {n,} {n,m}`,
      alternation, and non-capturing groups `(?:…)` — and refuses everything else
      *by name*, including anything unrecognized. Refused with reasons: capturing
      groups (a rule is a boolean match and captures nothing, and numbered groups
      are what backreferences read — write `(?:…)`), backreferences, atomic groups,
      possessive and lazy quantifiers, lookaround, named groups, inline flags, comments
      and conditionals, POSIX classes/collating elements/equivalence classes (locale-defined
      on Postgres, fixed on RE2), `\A`/`\Z`/`\b`/`\G`, property and character-code
      escapes, and `\D`/`\W`/`\S` *inside* a bracket expression (an error in ARE,
      legal in RE2). Two divergences are accepted and stated rather than pretended
      away: `.` excludes newline on RE2 and includes it on ARE; `\d`/`\w`/`\s` are
      ASCII on RE2 and locale-defined on ARE. Loosening a refusal later is backward-compatible;
      tightening one is not (S-0027/risks), so the subset starts small.
