    grade: ASSUMED
    text: >-
      *(2026-08-08, PR #7 review)* **A quality predicate derived from a transform
      chain must be derived from the chain's *final* value, and the compiler refuses
      where it cannot prove that.** Two rules read the chain and both read it at the
      wrong point. `in_enum`'s admissible set is the `enum_map` targets and spellings
      (D49) while the predicate tests the column's final value, so a step *after*
      the `enum_map` moves that value off the set: `{enum_map: [paid, paid]}` then
      `upper` quarantined **every correctly-mapped row** — executed on DuckDB the
      entity came out empty and all three rows sat in the reject table, the worst
      failure this feature has. Lowering targets through the remaining chain is not
      available to a compiler that executes nothing (`regex_extract`, `split_part`
      and the `strip_*` family are only evaluable by running SQL — S-0020), so the
      chain is refused at compile instead, naming the offending step. A further `enum_map`
      may follow: the union of both steps' targets contains every reachable final
      value, so the set can only be too generous, and too generous never withholds
      a good row. No fixture could have caught it — every `enum_map` in the corpus
      happens to be the last step.
