    grade: ASSUMED
    text: >-
      *(2026-08-08, PR #7 review; closed by D83)* **Trino cannot host a reject table
      today, and says so at emit.** Both constructions `<entity>__reject` is built
      from are ones Trino rejects, verified against `trinodb/trino:483` rather than
      reasoned about: `SHA256` takes `varbinary` there and returns `varbinary`, so
      `reject_id` over text fails to plan, and the positional `JSON_OBJECT('k', v)`
