  - id: D-20
    grade: ASSUMED
    text: >-
      Dedupe is a total order: after `field` DESC and the `tie_break` columns, the
      final sort key is the stable source-row identity `_source_row_id` — the winner
      is unique by construction *given the metadata contract* (D21): `_source_row_id`
      is declared **NOT NULL and unique per source row**, an ingestion-layer obligation
      enforced at run time by a generated blocking audit on the metadata columns (a
      data property, not compile-checkable). Null ordering pinned: `NULLS LAST` on
      **every** sort key including `_source_row_id` (defense in depth — DESC defaults
      to NULLS FIRST on several engines, so an illegally-null identity must still
      lose, never win).
    paths:
      - src/bloomery/ir/nodes.py
      - src/bloomery/quality/dedupe.py
