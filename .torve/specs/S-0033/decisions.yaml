      which is all D30 tested. Declared as two `DialectFeature`s rather than one,
      so each can be lifted on its own once the rendering is split per dialect, and
      gated on `entity.quarantine` so a Trino project with quality rules but no reject
      table still compiles. Emitting SQL the engine refuses is worse than refusing
      to emit it: the refusal names the dialect where the author can act on it. The
      portable spellings are known (`LOWER(TO_HEX(SHA256(TO_UTF8(...))))`, `JSON_OBJECT(KEY
