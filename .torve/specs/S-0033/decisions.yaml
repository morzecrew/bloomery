      changes its answer. Unlike the two universal columns it is emitted only where
      a repair rule exists: §12 budgeted the silver-schema churn once, and a third
      column empty for every project not using the feature is not worth re-opening
      every golden and fingerprint for. **`fallback` is required**, for the same reason
      `on_fail` is (D2): a recipe that ran and failed leaves the rule violated and
      the row is disposed of exactly as if no repair had been declared — the alternative,
      a still-broken value landing in silver marked as fixed, is the `drop` this RFC
      refuses wearing a friendlier name. **Refusals**, each a property of the declaration
