  - id: D-22
    grade: ASSUMED
    text: >-
      Replay merge semantics: replay applies the **same dedupe ordering** as the pipeline
      — a replayed candidate merges by entity key and wins/loses against an incumbent
      by the dedupe total order (recency, tie-breaks, `_source_row_id`); multiple
      rejects resolving to one key are ordered the same way. The per-entity replay
      batch is one atomic MERGE (transactionality is the executing engine's; bloomery
      emits the artifact); idempotence follows from the total order — re-running replay
      re-derives the same winners — and is defined over **semantic state** (winners
      merged, `resolved_at` transitions), observability columns excluded: `last_seen`
      updates only when a row is actually re-evaluated.
    paths:
      - src/bloomery/emit/lower/silver.py
      - tests/execution/test_quality_precedence.py
      - tests/execution/test_replay_to_bronze.py
      - tests/fixtures/quality_precedence/entity_model.yaml
      - tests/support/precedence.py
  - id: D-23
    grade: ASSUMED
    text: >-
      `_quality_flags` **and** `failed_rules` share one physical contract: rule names
      identifier-constrained at parse (no escaping in any lowering); the column is
      never NULL (empty array / empty delimited string per `DialectFeature.ARRAY`);
      delimited fallback joins with `,` in lexicographic rule-name order; `_quality_ok`
      generated per shape; flag-set equality across lowerings asserted in the dialect-matrix
      tier. The reject table's `failed_rules` lowers by exactly this contract — array
      where `DialectFeature.ARRAY`, else the lexicographic comma-delimited string.
    paths:
      - src/bloomery/resolve/build.py
      - src/bloomery/spec/common.py
      - src/bloomery/spec/quality.py
