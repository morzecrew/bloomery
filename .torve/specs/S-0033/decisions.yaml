  - id: D-6
    grade: ASSUMED
    text: >-
      Entity-level `dedupe` requires `tie_break` under `keep: latest_by` (nondeterministic
      winners violate the core invariant); dedupe-referenced fields' `coercible` is
      forced to `fail`. Row rules `expression` and `referential` (`on_missing ∈ {unknown_member,
      quarantine, flag}` — `fail` deliberately excluded: orphans are an expected,
      recoverable data condition; a pipeline-stopping orphan gate is a `reconcile`
      check; `unknown_member` keeps aggregates correct via a reserved member row and
      requires a string-typed fk in v1 — the reserved member is the string `'__unknown__'`;
      a non-string fk with `unknown_member` is a compile-time `GuardrailError` naming
      the alternatives, typed per-key sentinels rejected); `reconcile` blocks emit
      model + non-blocking audit.
    paths:
