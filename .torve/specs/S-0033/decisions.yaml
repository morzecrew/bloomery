  - id: D-10
    grade: ASSUMED
    text: >-
      One `<entity>__reject` table per entity with the §5.6 schema (stable sha256
      `reject_id` for idempotent replay). Retention is **required** whenever any quarantine
      disposition exists — missing retention is a compile error; retention deletes
      **all** reject rows on expiry (unresolved measured from `last_seen`, resolved
      from `resolved_at`) and is the only deleter — replay never deletes. `redact:`
      paths apply at write time and must not intersect any path the entity's mappings
      read (`from` paths, recipe aliases included) — an intersecting redact is the
      compile error `RedactionConflict`. Bloomery emits the reject/replay artifacts
      and never executes them.
