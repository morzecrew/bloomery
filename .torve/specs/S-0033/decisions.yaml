      - tests/unit/test_spec/test_quality.py
  - id: D-24
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12)* **The implicit `coercible` rule is opt-in per entity**,
      diverging from §5.2's "implicit, always present". An entity joins the quality
      system by declaring `quality:`, `quarantine:`, or any field-level `quality:`;
      `dedupe:` alone does not. Rationale: applying it universally gives every field
      in every existing project a `quarantine` disposition, which makes every project
      fail `QuarantineRetentionMissing` on its next compile — a break §12 budgets
      for `_quality_flags`'s schema churn but not for a hard compile refusal. Consequence:
      a project that wants coercion routing must opt in explicitly, and an entity
      with no quality surface keeps the shipped produce-or-raise transform lowering.
    paths: [src/bloomery/emit/lower/silver.py]
  - id: D-25
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12)* **The ingestion-metadata columns carry no `coercible` rule,
      and the D21 audit must close the gap.** D6 forces `coercible` to `fail` on any
      field the dedupe order reads, but `_ingested_at`/`_load_id`/`_source_row_id`
      are ingestion metadata, not mapped fields — no rule is generated for them, and
      the D21 blocking audit asserts only that `_source_row_id` is non-null and unique.
      An uncastable `_ingested_at` therefore survives with dedupe ordering silently
      undefined. **Decided contract:** the D21 audit additionally asserts `_ingested_at`
      is castable to timestamp, blocking the run when it is not. Unimplemented as
      of M12 and held open by a strict-`xfail` execution test (`keys.csv::uncastable_ingested_at`)
      rather than a comment.
    paths: [src/bloomery/emit/lower/silver.py]
  - id: D-26
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12; closed by D86)* **`unicode.csv`'s flag expectations are not
      expressible in v1.** They encode "contains an invisible or deceptive character";
      the portable regex subset (D5) has no lookaround, no named groups and no property
      classes, so it cannot separate NFC from NFD, a homoglyph from its Latin twin,
      or an astral emoji from a ZWJ sequence. The corpus rows are asserted for the
      class invariant the disposition model actually promises — **flagged, never dropped**
      (D2) — plus whatever a declared rule (`length`, `pattern`) decides. Expressing
      the rest needs a new rule shape: a `normalize`/`confusables` rule taking a Unicode
      normal form and/or a confusables table, evaluated outside the regex engine.
      Demand-gated, not built — new rules are RFC amendments, not config (D5).
  - id: D-27
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12)* **`referential` on a self-relationship is refused at compile
      time.** The lowering is a `LEFT JOIN` inside the dependent entity's own model
      (§5.4), so a rule whose relationship's `to` side is the declaring entity is
      unexecutable — a model cannot join the table it is being built from, and the
      emitted SQL would either fail or resolve against a stale previous version and
      answer the wrong question. It is a `GuardrailError` (bare, per §5.9's five-named-leaves
      rule) naming both alternatives: model the referenced side as a separate entity
      built from the same source, or express the check as a `reconcile:` block, which
      runs silver→mart against finished tables. Self-referencing *data* stays expressible;
      the single-entity *shape* does not.
    paths: [src/bloomery/guardrails/quality.py]
  - id: D-28
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12; closed by D85)* **The corpus has no `range` specimen** —
      a recorded gap, not a rule defect. Every out-of-bounds row it carries is also
      uncastable, so `coercible` reaches the value first and `range` evaluates over
      the resulting NULL, staying `UNKNOWN` and never firing (D19). Closing it needs
      a row that casts cleanly and *then* violates a declared bound. The suite asserts
      the absence explicitly (zero rows failed, zero diverted) rather than leaving
      a rule that silently covers nothing, so the day a specimen lands the assertion
      is what changes.
  - id: D-29
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12)* **Conservation audit shape.** The emitted per-entity audit
      reads exactly two relations — the bronze source and `@this_model` — because
      SQLMesh does not rewrite model references inside an `AUDIT` body, so a body
      naming a sibling silver entity would resolve against whatever that name means
      outside the plan. It is therefore **skipped** for the one shape an audit body
      cannot express: `referential` with `on_missing: quarantine`, whose routing predicate
      reads a sibling entity. The skip is asserted in a unit test rather than silently
      dropped, and §6's conservation *property* still covers that shape.
  - id: D-30
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12; closed by D84)* **Postgres cannot host quality-carrying entities.**
      `coercible` needs a real NULL-on-failure cast (`DialectFeature.TRY_CAST`); sqlglot
      renders `TRY_CAST` on Postgres as a plain `CAST`, which aborts the run instead
      of marking the row, so the dialect declares the feature gap and compiling a
      quality-carrying entity for it raises `UnsupportedByTarget` — loud, never a
      silent degradation into an aborted run. Consequence for §6's dialect matrix:
      there is no Postgres dirty-corpus tier to add until either sqlglot renders a
      real `TRY_CAST` or the lowering grows a per-type `CASE`-based fallback whose
      semantics are proven equal to `TRY_CAST`'s on the corpus. Named as the escape
      hatch, not built.
    paths: [pages/docs/reference/errors.md, src/bloomery/emit/lower/silver.py]
  - id: D-31
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12)* **D25's contract is implemented; the strict `xfail` is closed.**
      The D21 blocking audit now reports a third condition beside the null and duplicate
      `_source_row_id` checks: `_ingested_at IS NOT NULL AND TRY_CAST(_ingested_at
      AS TIMESTAMP) IS NULL` — *present but uncastable*, built as a SQLGlot AST through
      the dialect port like every other term of the audit. `keys.csv::uncastable_ingested_at`
      (`key_018`) is now an ordinary passing execution assertion, paired with a non-trigger
      probe of two rows differing only in whether `_ingested_at` parses, so the check
      cannot go vacuous. Consequence for D30: the metadata audit needs `DialectFeature.TRY_CAST`
      **independently** of any `coercible` rule, and under D24 a *dedupe-only* entity
      carries no rules at all — so the audit lowering restates the refusal instead
      of relying on the coercible-rule one, and a dedupe-only entity compiled for
      Postgres is now `UnsupportedByTarget` as well. That is the edge of D30's sentence,
      reached, not a widening of it.
    paths: [src/bloomery/emit/lower/silver.py]
  - id: D-32
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12 fix)* **A `fail` rule's audit reads the pre-route population.**
      Routing is stage 6 and an audit runs after the model is built, so an audit over
      `@this_model` sees only the rows the split kept — a row failing a `fail` rule
      *and* a `quarantine` rule was diverted and the run carried on, inverting D18's
      severity order. The body is a query over the staged extract (the same rows the
      routing predicate is evaluated over), which stays inside D29's two-relation
      scope limit because `referential` cannot carry `fail` (D6). Consequences: every
      kind lowers through the same `violation` predicate (retiring a `coercible`-at-`fail`
      special case that had silently redefined the rule as `not_null`), and FAIL-disposition
      rule names are recorded in **both** `failed_rules` and `_quality_flags`, so
      the quality mart's `rows_failed` is no longer structurally zero for the rules
      whose firing matters most.
    paths:
      - src/bloomery/emit/dbt/__init__.py
      - src/bloomery/emit/lower/silver.py
      - tests/execution/test_quarantine_replay.py
      - tests/unit/test_emit/test_dbt.py
  - id: D-33
    grade: ASSUMED
    text: >-
      *(2026-08-08, M12 fix)* **A window-valued violation predicate is projected once
      and referenced by name.** SQL allows a window function only where a projection
      is being built; the lowering reads a violation predicate from a `WHERE` (routing),
      an audit body, and an aggregate's argument (the conservation count). `unique`
      — the only windowed kind in the v1 catalogue (D5) — is therefore computed as
      a column above the dedupe `QUALIFY` (rules run after dedupe, D7) and read back
      from there. Before this only `unique/flag` produced executable SQL; the other
      two dispositions emitted a binder error. `WINDOWED_KINDS` carries the declaration,
      and a unit test pins it against the predicates themselves so a future rule that
