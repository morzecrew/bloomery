      them, so an inline recipe would have been a second, weaker copy of all of it
      reachable only from here. **The lowering.** The recipe is spliced at IR build,
      where the registry lives, and travels as SQL in the rule's params the way an
      `expression` rule's body does — so emission needs no registry, and a version
      or `runtime_lock` bump lands in the IR where the fingerprint and `plan()` see
      it (measured: a body change classifies RESTATING and puts the entity in `replay_scope`,
      because the kind's params define neither an ordered interval nor a membership
      set and D52's undecidable-means-replay applies). The rewrite happens at the
      **extract** level, inside the column's own projection: `CASE WHEN <violation
      over the raw expression> THEN <recipe> ELSE <raw> END`. That placement is what
      makes every other rule see the repaired value with no extra nesting, and it
      forces both halves to be rewritten to read the column's expression rather than
      its name, since the column is being defined in the same `SELECT`. **The marker.**
      `_quality_repairs` is a separate column, which was cubic's condition in review
      and is the right one: a rule is recorded there when its recipe *ran and worked*
      — it fired over the value as delivered and no longer fires over the value that
      replaced it. `_quality_flags` stays empty for a repaired row, so `has_quality_flags`
