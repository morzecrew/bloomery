    text: >-
      *(2026-08-10)* **`repair` lands, its recipe is a registered `sql_macro`, and
      its marker is its own column. D17 is closed.** D17 gated the disposition on
      a repair-recipe contract and left §10 asking *inline vs catalog-referenced*.
