  - id: D-18
    grade: ASSUMED
    text: >-
      Disposition precedence for a row failing multiple rules — severity order `fail
      > quarantine > flag`: any failing `fail` rule stops the run (blocking audit);
      else any failing `quarantine` rule diverts the row, with **all** failed rule
      names recorded in the reject's `failed_rules` (flag-level failures included);
      else flags accumulate in `_quality_flags`. Deterministic for every combination
      — no compile-time rejection of rule/disposition combinations needed.
    paths:
