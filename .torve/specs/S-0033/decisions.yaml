  - id: D-19
    grade: ASSUMED
    text: >-
      Three-valued logic: each rule defines a violation predicate and fires only when
      it is definitively TRUE — NULL-involved comparisons evaluating to SQL `UNKNOWN`
      do **not** fire (`not_null`/`coercible` own nulls; declare them if nulls are
      invalid). Applies to `range`/`length`/`pattern`/`in_enum`/`in_set`/`expression`/`referential`
      — a NULL fk is not an orphan. Corrects Document 5's referential lowering: the
      bare `COALESCE(fk, '__unknown__')` sketch was wrong (it maps a NULL fk to the
      unknown member); the lowering is `CASE WHEN ref.<pk> IS NULL AND fk IS NOT NULL
      THEN '__unknown__' ELSE fk END`.
    paths:
