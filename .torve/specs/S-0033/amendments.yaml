  - id: A-8
    at: '2026-10-27T12:13:35Z'
    title: Malformed JSON in bronze is a coercion failure
    changes:
      - subject: D-101
        field: paths
        before: []
        after: [src/bloomery/dialects/redshift.py]
      - subject: D-101
        field: text
