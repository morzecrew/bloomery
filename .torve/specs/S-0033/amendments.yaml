# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-28T07:47:20Z'
    title: 'Phase 1: character rules are textual rules'
    md: |-
      The operator source `character-rules-on-a-non-textual-column-lower-to-refused-sql`
      (CodeAnt on #149) records that `normalize` and `charset`, added by D-86,
      accept any column at the spec layer and lower over the bare column, so a
      declaration on a number or a date compiles to SQL every shipped engine
      refuses at execution. This document had no phasing: it arrived implemented
      from the RFC that preceded it. Phase 1 is the first phase it has, and closes
      the gap where the rule is declared rather than in the lowering, since a
      character rule over a non-textual value has no meaning a cast would supply.
  - id: A-2
    at: '2026-09-28T12:48:33Z'
    title: >-
      Phase 1 is scoped to where the advisory and the refusal live
    md: |-
      T-0175's first attempt halted on the scope: it named
      `src/bloomery/observability/**`, which no tree has, while the advisory the
      phase must change lives in `src/bloomery/evidence.py` with its test in
      `tests/unit/test_advisories.py`; and it found that a mapping document does
      not know its column's type, so a refusal at declaration has to be raised
      where `load_project` joins the mapping to the entity model, in
      `spec/project.py`. Scope and intent say so now; nothing else moves.
      Phase 1's scope names the advisory where it lives, and the seam the refusal
      needs
  - id: A-3
    at: '2026-09-29T05:02:53Z'
    title: Rows for what the implementation decided
    changes:
      - subject: D-97
        field: text
        after: >-
          `pattern` is evaluated on every row and never sampled. `PatternRule` takes
          only `regex`, with extra keys forbidden, and lowers to a per-row `NOT REGEXP_LIKE(column,
          regex)` violation predicate. Its cost is bounded at parse, by refusing nested
          unbounded repetition, rather than by reading fewer rows
    md: |-
      Questions this document left to implementation were answered by the code, and no row said so. Each new row states what the code does, checked against it on 2026-09-29, and is graded ASSUMED; the owner's merge is the acceptance.

      - D-97 answers Q-4.
  - id: A-4
    at: '2026-10-01T09:04:35Z'
    title: Settled by S-0084
    md: >-
      S-0084, accepted by the owner on 2026-10-01, answers S-0033/Q-5 in S-0084/D-2:
      `coverage:` counts admitted rows on both sides and has no 'exists' form, so
      a check phrased 'has an order' is correct and D-90 stands.
  - id: A-5
    at: '2026-10-27T12:13:14Z'
    title: Malformed JSON in bronze is a coercion failure
    changes:
      - subject: D-98
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-98
        field: paths
        before: []
        after: [src/bloomery/resolve/build.py, src/bloomery/dialects/base.py]
      - subject: D-98
        field: text
        before: <decision>
        after: >-
          On an entity in the quality system, a bronze column read through a JSON
          path is guarded by the port's JSON validity check, so a value that is not
          JSON reads NULL instead of aborting the run. Outside the quality system
          the read stays produce-or-raise, as a plain cast does (D-3, D-24)
      - subject: D-98
        field: fingerprint
        after: 602fffe58ee3013b/1dfc0b036c094a77
    md: >-
      Reported in review of #316 (CodeRabbit) and taken up by the owner: malformed
      JSON in a bronze column aborts the run on DuckDB and PostgreSQL, even inside
      the quality system, where a bad value is meant to become a quarantined row.
      D-98 to D-101 make it a coercion failure on a quality-carrying entity, through
      the rule that already owns coercion. The `json_path` transform over a `string`
      input is out of scope: it is declared `nullifies` (D-73), so `coercible` already
      skips it, and whether a malformed input to it should fail the row is a separate
      question. D-98 to D-100 are implemented by the change that follows this amendment;
      the document's phases all landed before it, so its implementation field stays
      `complete`, as torve's spec check asks of a document whose phases have landed.
  - id: A-6
    at: '2026-10-27T12:13:21Z'
    title: Malformed JSON in bronze is a coercion failure
    changes:
      - subject: D-99
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-99
        field: paths
        before: []
        after:
          - src/bloomery/quality/predicates.py
          - tests/unit/test_quality/test_predicates.py
      - subject: D-99
        field: text
        before: <decision>
        after: >-
          `coercible` counts a JSON-path source as present when its bronze column
          is present and not valid JSON. A row whose column is not JSON then fails
          `coercible` on every field read through that column, at that rule's disposition
          (default `quarantine`), while a NULL column and a missing key stay legitimate
          NULLs. No rule kind is added (D-5)
      - subject: D-99
        field: fingerprint
        after: 460d1c948018de06/3edb8b9bee8b37b8
    md: >-
      The marker half of A-5: without it, the guard of D-98 would turn an abort into
      a silent NULL.
  - id: A-7
    at: '2026-10-27T12:13:28Z'
    title: Malformed JSON in bronze is a coercion failure
    changes:
      - subject: D-100
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-100
        field: paths
        before: []
        after:
          - src/bloomery/dialects/duckdb.py
          - src/bloomery/dialects/postgres.py
          - src/bloomery/dialects/trino.py
