entries:
  - decision: unlisted
    grade: UNLISTED
    kind: contradicted
    at: '2026-09-29T11:25:54Z'
    claim: >-
      Claim rejected: parse_ts ISO8601_INSTANT, to_string, a second parse_ts, then
      to_utc is not a false positive. to_string of the UTC instant renders UTC wall-clock
      text, so the re-parse yields a UTC wall clock and a to_utc from any other zone
      shifts the instant a second time — the double conversion S-0081/D-2 refuses.
      D-2 states literally that to_utc after an ISO8601_INSTANT parse is refused at
      resolve; the check over every later link conforms to it. No change made.
    evidence: >-
      src/bloomery/resolve/build.py:1085-1095 — any to_utc after the instant parse
      is refused, as S-0081/D-2 specifies; src/bloomery/transforms/_builtins.py:372
      shows to_string renders the instant as text, carrying its UTC value into the
      re-parse
    action: decided
    proposal: >-
      Amend S-0081/D-2 only if a round-trip through text with to_utc: UTC must be
      admitted; otherwise none needed
