# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) Identity is declared, never
      inferred. No similarity heuristic over names, SQL or column sets decides that
      two nodes are the same node; a wrong guess here rewrites history rather than
      raising an error.
  - id: D-2
    grade: LOCKED
    text: >-
      The id is opaque. Compared for equality, never parsed, never used to derive
      a path, a relation name or an ordering.
    paths: [src/bloomery/spec/project.py, tests/unit/test_spec/test_metrics.py]
  - id: D-3
    grade: LOCKED
    text: >-
      Absence of `id:` reproduces today's behaviour byte for byte. A feature that
      changes artifacts for projects that did not ask for it is not optional.
    paths: [src/bloomery/cli/render.py, src/bloomery/plan/diff.py]
  - id: D-4
    grade: OPEN
    text: >-
      Whether partial adoption within a project is refused by `check` (§10).
  - id: D-5
    grade: ASSUMED
    text: >-
      Emitted relation names stay derived from `name`. Decoupling them is a warehouse-migration
      feature wearing this document's clothes.
  - id: D-6
    grade: OPEN
    text: >-
      Whether node identity is a write-once `id:` or a one-shot `renamed_from:` in
      S-0024/D-3's shape (§10). Recorded rather than assumed: the codebase already
      chose the second answer for fields, and a document that does not say why nodes
      differ is one that looks like it did not know.
    paths:
      - src/bloomery/resolve/timeline.py
      - tests/unit/test_resolve/test_timeline.py
  - id: D-7
    grade: ASSUMED
    text: >-
      Existing node-id spellings do not move — the dot separator, the four prefixes,
      and `source.<relation>.<path>`'s three segments. `lineage --node metric.gross_revenue`
      is documented surface and the ecosystem stores those strings.
  - id: D-8
    grade: ASSUMED
    text: >-
      **`plan()` takes a node-id-to-name map per side rather than reading an `id:`
      from the IR.** §5.3 assumes the ids are reachable and they are not: neither
      `MetricIR` nor `StepIR` carries one, because P1 substitutes the id into node
      ids and lowers nothing — and putting it in the IR is what D3 forbids, since
      the canonical encoder writes each dataclass's field count and every field name,
      so a defaulted `id=None` moves the bytes of every project with a metric. `node_labels(project,
      catalog)` produces the map and both parameters default to empty, so every existing
      caller keeps today's report. Not `LOCKED`: handing `plan` the two `Project`s
      reads more naturally and re-admits the spec layer into a diff whose whole design
      is that it consumes IR, and a later document may prefer that trade. Added by
      execution 2026-09-11 — see [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-9
    grade: ASSUMED
    text: >-
      **The citation list is `Change.citations`, populated only for a node rename.**
      §5.3 and §12 name it and no section designs one; nothing under `plan/` carried
      citations. It names what the compiler can see — the metrics whose definition
      reads the old name, the marts carrying it as a measure, the exposures declaring
      it — in `Change`'s own `<kind>:<name>` grammar. A dashboard or a decision row
      cites a node too and is outside the project, which is why the list is what it
      is rather than everything §2 imagines. Added by execution 2026-09-11 — see [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-10
    grade: ASSUMED
    text: >-
      **P3 is `lineage` alone; the `explain` half of §5.4 is struck.** `Explanation`
      carries `mart`, `grain`, `measures`, `filters`, `policy_applied` and `branches`
      — no node id in any of them — and is built from the IR, which carries none either.
      There is nothing there to print as a name or to carry as an id. If `explain`
      is to carry node identity, what it would carry has to be designed first: its
      subject is a metric *request*, not a graph node. Added by execution 2026-09-11
      — see [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-11
    grade: ASSUMED
    text: >-
      **P2 reports metric and step renames only.** `node_keys` mints ids for three
      kinds and `plan()` diffs two of them: there is no canonical-field pass and there
      cannot be one, because `ProjectIR` holds no canonical record at all — the field
      survives lowering only as `ColumnIR.canonical`, a string reference. A renamed
      canonical field is unreachable here whatever else changes, and making it reportable
      means changing what the IR *is* rather than what `plan()` reads. Added by execution
      2026-09-11 — see [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-12
    grade: ASSUMED
    text: >-
      **A label is the node spelled with its name, not the bare name — supersedes
      nothing, narrows §5.4.** `metric.mtr_7f3a9c` maps to `metric.gross_revenue`.
      A bare name leaves an adopted node as the only one in a lineage walk without
      a kind prefix, so the edge list reads `canonical.quantity --requires--> gross_revenue`:
      two spellings in one column, harder to read than either. The label is what the
      id would have been had the project adopted nothing, which is also what makes
      it substitutable wherever an id appears. Added by execution 2026-09-11 — see
      [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-13
    grade: ASSUMED
    text: >-
      **The walk is rendered in names and a suggestion is answered in ids.** §5.4
      settles the first; the second is what a reader *types*, so `_find_node`'s did-you-mean
      and its collision refusal keep node ids. Offering a name `--node` does not accept
      would be worse than the mistype it answers. Added by execution 2026-09-11 —
      see [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-14
    grade: ASSUMED
    text: >-
      **A rename that lands on a name the old version already used is refused.** Relabelling
      `a` to `b` in the version that deletes `b` leaves two nodes called `b`, and
      every pass below keys by name — so one silently wins and which one is an artefact
      of tuple order. §4 already refuses the shape in prose ("two metrics becoming
      one is a different change with a different report"); this is the refusal in
      code, checked *after* the substitution so a legitimate chain — `a` to `b` while
      `b` becomes `c` — still lands in one version. Reporting a merge properly means
      keying the whole diff by identity rather than by name, which is a change to
      what `plan()` is. Added by execution 2026-09-11 — see [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-15
    grade: ASSUMED
    text: >-
      **Each side of a rename diff carries its own catalog.** A metric defined by
      a `template:` lives in the catalog, so a rename moves text there too and one
      catalog read for both versions describes neither. A *version* is its documents
      and its catalog — which the CLI already had right, each spec directory carrying
      its own — and the how-to did not. Added by execution 2026-09-11 — see [`logs/T-0044.md`](logs/T-0044.md).
  - id: D-16
    grade: ASSUMED
    text: >-
      **The identity material sits with the lineage how-to rather than in `pages/docs/concepts/`.**
      §7 asks for siting "with the lineage material rather than with the spec reference",
      and the lineage material is `how-to/trace-lineage.md`, where P1 already put
      the `id:` section; the rename half lands in `evolve-a-spec.md` beside `renamed_from`'s.
      §7's reason is honoured and its directory is not: a concepts page is worth minting
      when there is a concept to explain rather than a surface to use. Added by execution
      2026-09-11 — see [`logs/T-0044.md`](logs/T-0044.md).
