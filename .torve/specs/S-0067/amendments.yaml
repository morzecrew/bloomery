        before: >-
          Whether partial adoption within a project is refused by `check` (§10).
        after: >-
          Partial adoption is allowed: a node without `id:` keys by its name (`spec.project.key`)
          beside nodes that adopted one. Only a collision is refused, at parse: two
          nodes minting one id, or an id equal to another node's name. Nothing refuses
          a project for mixing adopted and unadopted nodes.
