  - decision: D-9
    grade: ASSUMED
    at: '2026-09-19T03:57:34Z'
    claim: >-
      Both sabotage proofs were performed in this attempt and both fire, but neither
      could be a re-narrowed guard: no line in the current tree whose deletion either
      oracle catches was found. Removing every AST copy on the emit path (SqlExpr.ast,
      capture_group's transform, the ports' entry copies) leaves all four emit targets
      byte-identical across compiles on all three dialects, and the fixture set reaches
      no column quality rule, so physical_type is never called during a compile of
      it. Both documented cases are therefore injected defects, recorded as such in
      the targets' docstrings: a fingerprint made identity-dependent in compile.py
      for determinism, a raise in trino's render for cross-dialect, the latter standing
      in for the bare ValueError in duckdb's _nfc_normalize that the fixture set cannot
      reach.
    evidence: >-
      `uv run --with 'atheris>=2.3' python fuzz/fuzz_compile_determinism.py fuzz/fuzz_compile_determinism_seed_corpus/marts`
      with hex(id(project)) appended to compile.py's fingerprint — AssertionError:
      a freshly loaded Project compiled differently, four differing checksums; the
      same replay of fuzz_cross_dialect.py with a raise in trino.py:113 reports ValueError
      from the trino leg with duckdb already compiled
    action: decided
  - decision: unlisted
    grade: UNLISTED
    at: '2026-09-19T03:57:44Z'
    claim: >-
      The fuzz fixture set cannot express a column quality rule, which is why the
      cross-dialect oracle's one real known-catchable defect is unreachable. A mapping-level
      rule pulls in the implicit coercible rule's quarantine disposition, which needs
      quarantine: on the entity, which in turn needs the ingestion metadata contract
      in the mapping — three documents changing together, where one execution replaces
      one. The consequence is wider than the sabotage case: the whole quality, quarantine
      and audit surface is unreachable from every target in the lane, and physical_type
      is never called at all during a compile of these fixtures.
    evidence: >-
      src/bloomery/guardrails/quality.py:269 — an entity with any quarantine disposition
      is refused without quarantine:, and the implicit coercible rule gives every
      mapping-level rule one; src/bloomery/dialects/base.py:481 is the physical_type
      no compile of the fixtures reaches
    action: decided
    proposal: >-
      A row deciding whether the fixture set carries the quality surface — quarantine:
      on the order entity plus _ingested_at, _load_id and _source_row_id in the mapping
      — or whether that enrichment belongs to a follow-up. Either way the lane should
