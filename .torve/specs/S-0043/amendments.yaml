      - subject: D-6
        field: text
        before: >-
          **The test-file naming scheme.** A singular test's name is its filename
          in a namespace shared with generic tests. Audit names are unique per project
          and `[a-z0-9_]+`-constrained, so the raw name may suffice; a `bloomery_`
          prefix would match the macro's convention at the cost of length. Whoever
          builds this decides and logs it.
        after: >-
          A singular test is emitted as `tests/<audit>.sql` under the audit's own
          name, unprefixed. Audit names are unique per project and `[a-z0-9_]+`, and
          dbt names generic tests mechanically from model, column and arguments, so
          nothing collides; `assert_unique_paths` guards the emitted set.
