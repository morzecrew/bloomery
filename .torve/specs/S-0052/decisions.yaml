# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      **`parse_ts: ISO8601` reads a local wall clock, and text carrying a numeric
      UTC offset is out of contract.** This is S-0045's contract restated at the boundary
      that enforces it, not a new rule: `to_utc` is the only door into UTC, so a value
      that states its own zone is telling the compiler something the declaration already
      claimed to know. Locking it is what makes §5.3's refusal a consequence rather
      than a preference — an implementation that "helpfully" converted would be contradicting
      the spec layer, not extending it.
    paths: [src/bloomery/dialects/base.py, src/bloomery/transforms/_builtins.py]
  - id: D-2
    grade: LOCKED
    text: >-
      **Out-of-contract text becomes NULL; it is never converted and never raises.**
      NULL is the project's existing spelling for text that is not what the spec said
      it was, which is why this needs no new reporting surface: `coercible`, the reject
      table and D21's audit all already read it. Raising was rejected because the
      offending value is one row's bytes and a compiler that stops the pipeline on
      one row has no way back; converting was rejected in §5.3 on two independent
      grounds, one of them measured. Consequence: on an entity with no `quality:`
      block the refusal is silent, which §9 accepts and §8's door is the answer to.
    paths: [src/bloomery/dialects/base.py]
  - id: D-3
    grade: LOCKED
    text: >-
      **The guard lives in `strip_iso_text`, once, and every port inherits it.** The
      ports already must call that function or be refused at render (`dialects/base.py:305`),
      so this is the one place where "every target got the fix" is enforced by something
      other than memory. A per-port guard would land three times and drift in the
      copy no tier runs — the failure `logs/T-0012.md` F-1 recorded with D34's partition
      clause, forty lines from a lowering that had the right shape.
    paths: [src/bloomery/dialects/base.py, tests/unit/test_dialects/test_duckdb.py]
  - id: D-4
    grade: ASSUMED
    text: >-
      **A `Z` suffix is kept and truncated as it is today.** `Z` names UTC, the target
      type *is* UTC and zoneless, so the wall clock and the instant are the same number
      and nothing is lost — where a numeric offset loses exactly the difference between
      them. Not `LOCKED`, because the reasoning holds only while no `to_utc:` follows
      in the chain (§5.2): with one, the author has declared a zone the data contradicts,
      and that case stays wrong. Departing here means refusing `Z` too, which needs
      §8's door built first — there is otherwise no legal spelling for the commonest
      bronze timestamp there is.
    paths: [src/bloomery/dialects/base.py]
  - id: D-5
    grade: ASSUMED
    text: >-
      **Detection is `SUBSTRING(x, 11)` plus two `LIKE`s, not a regex.** Portable
      with no per-port spelling and no escaping dialect, and correct for every ISO
      8601 form these engines parse: the ten-character calendar date is the only place
      a `-` can appear innocently. Departing means a regex, and the cost of departing
      is three function names — `regexp_like`, `regexp_matches`, `~` — for the same
      boolean.
    paths: [src/bloomery/dialects/base.py, tests/engines/test_zoneless_utc.py]
  - id: D-6
    grade: ASSUMED
    text: >-
      **F-9's framing is corrected in the record: the truncation is uniform across
      PostgreSQL, Trino and DuckDB, not a Trino divergence.** It matters because it
      decides where the fix may live: a real divergence would belong in `dialects/trino.py`,
      and shipping it there would have left the other two ports wrong while a green
      engine tier said otherwise. *Recorded here rather than by amending the log,
      which is append-only.*
    paths: [src/bloomery/dialects/base.py]
  - id: D-7
    grade: ASSUMED
    text: >-
      **The detection window is taken over an explicit `VARCHAR` cast, refining D5.**
      D5 wrote the predicate as `SUBSTRING(x, 11)` over the marked operand, which
      is text in a transform chain by `parse_ts`'s declared input type — but the marker's
      *other* caller is S-0033/D-21's metadata audit, where it sits on a bronze column
      typed however the project landed it. Measured: none of the three engines plans
      `SUBSTRING(<timestamp>, 11)`, so the guard as D5 spelled it would refuse to
      **compile** the audit rather than refuse the value, on the one column no `coercible`
      rule can reach — a check that stops checking, which is the failure this project
      ranks worst. It is the same totality the Trino port bought with the cast before
      its own `replace`, and a guard one node above it has to buy it too or the port's
      is undone. *Added by execution 2026-09-03 — see logs/T-0013.md (F-1), which
      carries the binder error.*
  - id: D-8
    grade: ASSUMED
    text: >-
      **The separator normalisation moves to a shared spelling and DuckDB starts calling
      it, departing from §8's "the engines' own ISO handling, unchanged by this RFC
      in either direction".** §8 excluded the separator question as S-0044's, and
      it is — but the exclusion was written believing the port comment that said DuckDB
      "takes both `2026-01-06T12:00:00` and the space-separated spelling, so there
      is nothing for this port to add". Measured, DuckDB *raises* on the lowercase
      `t` that ISO 8601 permits and that PostgreSQL and Trino both read: a plain cast
      aborts the run and a `TRY_CAST` quarantines the row. Keeping that out of scope
      would have shipped a guard against a wrong number beside an untouched abort,
      in the same expression, on the same input class. The Trino port's `space_separated`
      becomes `dialects.base.space_separated` and both ports call it — one body, since
      the two engines need the same one and a second copy diverges in whichever port
      a tier does not run. *Added by execution 2026-09-03 — see logs/T-0013.md (F-3),
      which carries the measurement, and F-6.*
