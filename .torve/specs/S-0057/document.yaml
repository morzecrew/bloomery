sections:
  - key: about
    md: |-
      - **Status:** ✅ Complete — §9's P1 has landed: `bloomery check`, its per-surface counts,
        and the CI exit contract ([`logs/T-0030.md`](logs/T-0030.md)). **P2 moved out on
        2026-09-13** and is S-0075;
        executing it here halted at the plan gate on five load-bearing questions this document
        does not settle ([`logs/T-0053.md`](logs/T-0053.md)), three of which are the phase
        rather than details of it. **This document stays as the ✅ root of a live sequence**
        (`INDEX.md`): 0070 argues from D1–D4 rather than merely citing them — D3 and D4 are the
        rows it sharpens into a mapping and a conflict predicate — so it is retired with 0070
        and not before. P1 was smaller than §2
        describes, because `resolve` has since gained the exit-code contract §2 says it lacks and
        the CLI encoder has since gained the refusal serialisation D6 asks for — the command is
        the shape those two did not have, not the purity they already did. D7 is settled as a
        separate command over one shared evaluation and D8 by omitting the obligations line, both
        in that log. **P2 (mechanical imports) is unscheduled** and is what holds this document
        open; it depends on S-0005's provenance model, which is
        itself still in progress. Execution's findings and the rows it proposes are in the same
        log; nothing below has been amended to agree with what was built. **§§2, 3 and 7 read as
        they were written and describe the pre-P1 state** — no `check`, no exit contract on
        `resolve`, an obligations line, a `status` field, D7 and D8 open. They are the record of
        what was believed when the design was made, and retrofitting them would destroy the only
        evidence that any of it changed; what shipped instead is the code, the tests and
        [`use-the-cli.md`](pages/docs/how-to/use-the-cli.md).
      - **Scope:** A low-friction CI command performing semantic validation and proof without
        emission or execution, and a conservative provenance model for importing facts from
        external project artifacts.
      - **Related:** [`src/bloomery/cli/__init__.py`](src/bloomery/cli/__init__.py) — the
        existing `compile`, `plan`, `resolve`, `lineage`, `explain`, `schema` and `fingerprint`
        commands; S-0020 (determinism contract, retired), S-0047 (unresolved-work report,
        retired).
  - key: decision-notes
    md: >-
      _(Decision rows from here on are this document's D-1…; see `decisions.yaml`.)_
  - key: phasing
    md: |-
      **P1 — native `check`.** Deterministic human and machine output, stable refusal codes, a
      documented CI exit contract, and nothing outside today's compiler.

      **P2 — mechanical imports.** At least one external artifact importer, provenance on every
      imported fact, heuristic facts unable to prove safety, explicit conflict refusal, and
      adoption through semantic overlays rather than a full DSL migration.

      > **Moved out, 2026-09-13.** P2 is S-0075.
      > The paragraph above stands as written — it is what this document asked for — and 0070 is
      > what answering it turned out to require: a command, an artifact reader, a mapping table,
      > a conflict predicate, and a change to how provenance is keyed, which is more than a phase
      > of a document about a check command. D2, D3 and D4 govern it there.
questions:
  - id: Q-1
    text: >-
      **Whether `check` is a new command or `resolve` grown an exit-code contract.**
      The surfaces overlap; two commands that mostly agree is its own defect.
  - id: Q-2
    text: >-
      **What "requested semantic obligations" counts before the planner exists.**
      §3's fifth line has no denominator until S-0054 lands, and a count nobody can
      reproduce is a vanity total by another name.
