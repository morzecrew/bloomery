# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-28T07:47:15Z'
    title: >-
      Phase 4: fusion fixes its constants and the lexical side names its analyser
    md: |-
      Phase 3's second consumer found two real gaps and the design recorded them:
      `fusion: {method: rrf}` fixes no rank constant and no depth, so two
      consumers honour the same document and rank differently; and the lexical
      side carries no analyser identity while the dense side carries two encoder
      identities for exactly the reason a mismatch must be refusable. Both are the
      kind's own to close, additively — a project that declares neither is
      unchanged and the manifest version stays — so phase 4 closes them under the
      identity rule D-2 already sets for encoders: an opaque name compared for
      equality and never resolved.
      Phase 4: fusion declares its constant, and the lexical side its analyser
  - id: A-2
    at: '2026-09-29T02:32:04Z'
    title: OPEN rows the implementation settled
    changes:
      - subject: D-11
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-11
        field: text
        before: >-
          Whether a vector field may be declared on an entity or only on a mart
        after: >-
          A vector field may be declared on an entity as well as on a mart. `vector(<scalar>,
          <dimensions>)` is in the `TYPE_STRING_PATTERN` that every entity `Field.type`
          reads, and a profile's `CorpusRelation` names either a `mart` or an `entity`.
          On an entity, a vector arrives as a step's declared output.
      - subject: D-11
        field: fingerprint
        after: 9c75a60a52d8382f/abd323801e0115d6
      - subject: D-12
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-12
        field: text
        before: >-
          Whether `distance` is a property of the semantic space or of the retrieval
          profile
        after: >-
          `distance` is a property of the semantic space: `SemanticSpace.distance`
          is one of `cosine`, `dot` or `l2`, `RetrievalProfile` has no distance field,
          and every field claiming one space is scored the same way.
      - subject: D-12
        field: fingerprint
