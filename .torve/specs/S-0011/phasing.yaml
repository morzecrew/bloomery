# yaml-language-server: $schema=../../schemas/phasing.json
phasing:
  - phase: 1
    title: The type, the kind, the guardrails
    intent: >-
      Grow `LogicalType` an eighth member for a declared vector, teach the spec layer
      the `retrieval_version` kind carrying semantic spaces and retrieval profiles,
      and land the six refusals - dimension mismatch, scalar mismatch, a non-vector
      vector field, a producer mismatch, a grain that is not the corpus relation's
      key, and a filterable or returned field the corpus does not have. No manifest
      is emitted in this phase: the refusals are the feature and they are worth having
      before anything is written out. This phase answers Q-1 yes by building it, so
      it must not start until the owner has settled that question; two rows it inherits
      are graded `OPEN` and the executor decides and logs both.
    scope:
      - src/bloomery/typing/**
      - src/bloomery/spec/**
      - src/bloomery/ir/**
      - src/bloomery/transforms/**
      - src/bloomery/dialects/**
      - src/bloomery/guardrails/**
      - tests/unit/test_typing/**
      - tests/unit/test_spec/**
      - tests/unit/test_transforms/**
      - tests/unit/test_dialects/**
      - tests/unit/test_guardrails/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_typing tests/unit/test_spec tests/unit/test_transforms
        tests/unit/test_dialects tests/unit/test_guardrails -q
      - uv run mypy src
    character: structural
  - phase: 2
    title: The manifest, the target and one example
    intent: >-
      Add the retrieval target, emit one deterministic `retrieval_manifest.json` with
      each profile's space inlined, put it through the existing cross-process and
      cross-hash-seed determinism guard, and ship `examples/retrieval/` compiling
      a document-chunk corpus alongside the concepts page and the two reference pages.
      It waits for phase 1 because there is nothing to resolve into a manifest until
      the kind loads and the refusals hold. A dev-only script showing a runtime consuming
      the manifest may live beside the example; it is a demonstration, not a test,
      and its dependency stays optional.
    scope:
      - src/bloomery/compile.py
      - src/bloomery/emit/**
      - examples/**
      - pages/docs/**
      - tests/unit/test_emit/**
      - tests/unit/test_determinism_guard.py
      - tests/unit/test_examples.py
      - tests/golden/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_emit tests/unit/test_determinism_guard.py tests/unit/test_examples.py
        tests/golden -q
      - uv run mypy src
    depends_on:
      - 1
    character: structural
  - phase: 3
    title: >-
      A second consumer, before the grammar is called stable
    intent: >-
      Demonstrate the manifest against a second, unrelated retrieval runtime and write
      down what the two consumers disagreed about. The semantics are claimed to be
      vendor-neutral and exactly one demonstrated consumer is not evidence of that;
      this is the phase most likely to be skipped and the one that decides whether
      the claim was true. It waits for phase 2 because there is no manifest to consume
      until that lands, and it changes no source: what it may change is the example
      corpus and the pages that describe the contract.
    scope:
      - examples/**
      - pages/docs/**
      - tests/unit/test_examples.py
      - tests/unit/test_docs_floor.py
      - tests/unit/test_docs_snippets.py
    acceptance:
      - >-
        uv run pytest tests/unit/test_examples.py tests/unit/test_docs_floor.py tests/unit/test_docs_snippets.py
        -q
    depends_on:
      - 2
    character: routine
  - phase: 4
    title: >-
      Fusion declares its constant, and the lexical side its analyser
    intent: >-
      Phase 3's second consumer recorded two gaps rather than fixing them, and both
      are the kind's own to close. `fusion:` names a method and neither the rank constant
      nor the candidate depth per side, so two consumers honour `rrf` and return different
      orders for one query; it gains `k` (a positive integer, default 60, which is
      the constant the published method names) and `depth` (the candidates each side
      contributes, a positive integer, default 100), both carried into the manifest
      so a consumer that ignores them is the one that diverged. The lexical side declares
      `fields` and nothing about how they are tokenised, while the dense side carries
      two encoder identities so a corpus written by one model and queried by another
      is refusable; it gains an optional `analyser` — the same opaque `{family, model}`
      identity shape as an encoder, compared for equality and never resolved (D-2)
      — and a seventh guardrail refuses a profile whose lexical analyser differs from
      the one the corpus relation declares in its own retrieval document, when both
      are declared. A profile that declares neither keeps today's meaning, and a project
      with no retrieval document still compiles byte-identically. The manifest version
      does not move: the keys are additive. Their omission rule is exact — a declared
      `fusion` block carries its *effective* `k` and `depth` in the manifest, the
      defaults written out when the document did not, so two consumers of one profile
      read one number; `fusion` is absent from a profile only when the document declares
      no fusion at all, and `analyser` is absent only when none is declared. The example,
      the concept page and the error table carry the two.
    scope:
      - src/bloomery/spec/retrieval.py
      - src/bloomery/guardrails/retrieval.py
      - src/bloomery/emit/retrieval.py
      - examples/retrieval/**
      - pages/docs/concepts/retrieval.md
      - pages/docs/reference/errors.md
      - pages/docs/reference/spec-schemas.md
      - tests/unit/test_spec/test_retrieval.py
      - tests/unit/test_guardrails/test_retrieval.py
      - tests/unit/test_emit/test_retrieval.py
      - tests/golden/**
    acceptance:
      - >-
        uv run pytest tests/unit/test_spec/test_retrieval.py tests/unit/test_guardrails/test_retrieval.py
        tests/unit/test_emit/test_retrieval.py tests/golden -q
      - uv run mypy src
    depends_on:
      - 3
    character: structural
