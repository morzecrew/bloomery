    claim: >-
      The retrieval target lands as a member naming an artifact and nothing else:
      no vector-database member joins the target enum, and the vendor-oriented vector
      emitter stays out of tree behind register_emitter. The enum gains RETRIEVAL
      only, the registry gains one default emitter for it, and the emitter writes
      one JSON manifest and no DDL, so core carries no vendor name and no compatibility
      promise. Close-out over a touched LOCKED area, not a divergence.
    evidence: >-
      src/bloomery/compile.py:57-61 — the enum's five members: SQLMESH, CUBE, DBT,
      METRICFLOW, RETRIEVAL, with no vendor member; src/bloomery/emit/__init__.py:42-50
      lists the five default emitters and register_emitter above it is unchanged
    action: decided
  - decision: unlisted
    grade: UNLISTED
