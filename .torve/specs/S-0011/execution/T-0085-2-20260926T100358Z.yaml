    attempt: 2
    claim: >-
      The contract asks for the concepts page and the scope allows pages/docs/**,
      but the docs nav that makes a page reachable lives outside that allow list,
      so the page ships written and unpublished. Shipped it anyway rather than editing
      the nav, because the scope gate is blocking and structural while the nav audit
      is neither in this battery nor in this scope; flagging beats a boundary violation.
    evidence: >-
      pages/zensical.toml:30-37 — the concepts nav lists eight pages and is the file
      the audit reads, and no scope entry reaches pages/zensical.toml
    action: decided
    proposal: >-
      A scope naming pages/docs/** for a new page also names pages/zensical.toml,
      the way a scope naming a module names its test file — a page absent from the
      nav is a page nobody can reach, which is what tests/unit/test_docs_floor.py::test_every_docs_page_is_in_the_nav
      convicts on
