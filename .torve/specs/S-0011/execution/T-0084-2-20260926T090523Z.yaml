  - decision: D-11
    grade: OPEN
    at: '2026-09-26T08:37:20Z'
    attempt: 4
    claim: >-
      decided: a vector field may be declared on an entity as well as on a mart, and
      a profile's corpus relation names either. Confining it to marts saves nothing
      now the union member exists either way, and a mart column is traced to an entity
      column, so a mart-only vector is not a shape the flattener can produce; a mapping
      chain still cannot build one, so on an entity it arrives as a step's declared
      output, which is where an embedding is produced
    evidence: >-
      src/bloomery/spec/retrieval.py:140-141 — CorpusRelation takes mart or entity;
      src/bloomery/spec/common.py:72 admits vector() in TYPE_STRING_PATTERN, which
      every entity field reads
    action: decided
