# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) A fact's grade is derived
      from how the compiler obtained it and can never be written in a spec. A declared
      grade is an unchecked claim about a claim.
  - id: D-2
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) This sits above S-0005's
      floor and never below it. No annotation here makes a project compile that would
      otherwise be refused.
  - id: D-3
    grade: LOCKED
    text: >-
      Absence of the annotation is byte-identical to today. Strictness that arrives
      unrequested is a breaking change wearing a safety feature's clothes.
    paths: [tests/unit/test_guardrails/test_evidence.py]
  - id: D-4
    grade: LOCKED
    text: >-
      The refusal names how the fact was obtained and what to write instead. A message
      that only says "insufficient evidence" gets worked around by deleting the requirement.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/guardrails/evidence.py
      - src/bloomery/guardrails/stage.py
      - src/bloomery/semantic/proof.py
      - tests/unit/test_guardrails/test_evidence.py
  - id: D-5
    grade: ASSUMED
    text: >-
      Three grades, not five. The consumer-facing question is "did a human here write
      this down", and `Provenance`'s finer distinctions do not change a mart's answer
      to it.
    paths: [src/bloomery/semantic/proof.py]
  - id: D-6
    grade: OPEN
    text: >-
      Where the annotation lives: mart, exposure, or project with overrides (§10).
  - id: D-7
    grade: LOCKED
    text: >-
      The grades are a total function of `Provenance` and every member maps to exactly
      one, checked by a test. A second vocabulary that drifted from the first would
      grade facts by a rule nobody could find.
    paths: [src/bloomery/semantic/proof.py]
  - id: D-8
    grade: OPEN
    text: >-
      **Superseded by 9.** Whether `IMPORTED_VERIFIED` grades `ASSUMED` or `LOCKED`
      (§5.1). It is authored, and not authored here, and which of those a statutory
      consumer means is the question.
  - id: D-9
    grade: ASSUMED
    text: >-
      **`IMPORTED_VERIFIED` grades `ASSUMED`, following §5.1's table — supersedes
      8.** The question a strict consumer asks is "did a human *here* write this down",
      and an exact read of another project's artifact answers no however exact the
      rule was. Not `LOCKED` because nothing yet produces that provenance — S-0057/phasing
      (P-2) would — so the choice was made where it was unobservable, and S-0002 asks
      the same question from the other direction (§10). Added by execution 2026-09-09
      — see [`logs/T-0031.md`](logs/T-0031.md) (D8, attempt 1).
  - id: D-10
    grade: ASSUMED
    text: >-
      **The grade is rendered by the CLI, off `QueryPlan.semantic`, not by `Explanation`.**
      §12 says `explain` renders it and does not say in which layer; `Explanation`
      carries no fact and no proof, and every golden pins it. S-0054/D-7 put the semantic
      plan *beside* `sql`, `columns` and `explanation` for that reason, and a phase
      §12 calls close to free should not be the one that moves a pinned surface. Added
      by execution 2026-09-09 — see [`logs/T-0031.md`](logs/T-0031.md) (unlisted,
      attempt 1).
  - id: D-11
    grade: ASSUMED
    text: >-
      **The grade is derived on demand and is never a field.** D1 says a grade can
      never be written; a field on `SemanticFact` would make it writable everywhere
      except a spec, which is the letter of that rule and not its point. `--format
      json` carries `provenance` and is not lossy for it: the grade is a total function
      of that value and the function is public. Added by execution 2026-09-09 — see
      [`logs/T-0031.md`](logs/T-0031.md) (unlisted, attempt 1).
  - id: D-12
    grade: ASSUMED
    text: >-
      **§7's docs section splits along the phases.** P1 documents what a grade is
      and how to read it where a reader meets it; §7's worked example is a mart declaring
      `requires_evidence`, a key P1 does not add, so it lands with P2. Writing it
      earlier would document a key nobody can type. Added by execution 2026-09-09
      — see [`logs/T-0031.md`](logs/T-0031.md) (unlisted, attempt 1).
  - id: D-13
    grade: ASSUMED
    text: >-
      **Rendering the plan narrows `test_only_the_renderer_reads_the_plan` rather
      than deleting it.** That guard protected "nothing in the tree reads the semantic
      plan"; what it is *for* is that nothing changes what the query is generated
      from, and a renderer generates nothing. It became a named allowlist carrying
      how many reads each admitted file gets, because a per-file exemption would cover
      a generator landing in the same module later. Added by execution 2026-09-09
      — see [`logs/T-0031.md`](logs/T-0031.md) (unlisted, attempt 1; tightened after
      review on #94).
  - id: D-14
    grade: ASSUMED
    text: >-
      **`entity_key` grades `LOCKED`, not `ASSUMED`.** `BASIS_PROVENANCE` mapped it
      to `DERIVED`; it now maps to `DECLARED`. `Provenance` draws two lines through
      its members and they are not the same line — `closes` asks whether a fact is
      sound, `grade` asks whether a human *here* wrote it down — and an entity's key
      determining its own columns is reached mechanically but entailed by an authored
      key. Measured: left `DERIVED`, a `requires_evidence: locked` mart refuses all
      15 marts in the corpus, and `entity_key` has no remedy an author could write,
      which row 4 forbids. Added by execution 2026-09-10 — see [`logs/T-0040.md`](logs/T-0040.md)
      (unlisted, attempt 1).
  - id: D-15
    grade: ASSUMED
    text: >-
      **§5.3's worked example is unbuildable and is superseded by the message P2 ships.**
      It describes an `ASSUMED` additivity "derived by default from aggregation class
      `sum`"; additivity is never defaulted — `resolve.metrics._merge` reads it from
      the metric or its template and raises when both are silent, so every metric
      reaching a mart has a `DECLARED` one. The shipped refusal names a *column* whose
      derivation is weak rather than a measure whose additivity is, and keeps row
      4's four parts. Added by execution 2026-09-10 — see [`logs/T-0040.md`](logs/T-0040.md)
      (D4, attempts 1-3).
  - id: D-16
    grade: ASSUMED
    text: >-
      **§6's "a derived fact does not satisfy `locked`" is tested against the mapping,
      not a fixture.** After row 14 no fact the compile path mints grades below `LOCKED`,
      so no project can be written that trips the refusal; the test restores the pre-row-14
      mapping and asserts the refusal and its wording, which doubles as the regression
      test for row 14 itself. **This phase therefore ships a requirement no current
      project can fail** — it first refuses when S-0057/phasing (P-2) gives `IMPORTED_VERIFIED`
      a producer. Stated rather than discovered later. Added by execution 2026-09-10
      — see [`logs/T-0040.md`](logs/T-0040.md) (unlisted, attempt 1).
  - id: D-17
    grade: ASSUMED
    text: >-
      **`requires_evidence` never enters `MartIR`.** It is read from the authored
      `MartSet` at the guardrail stage, the shape `check_exposure_targets` already
      uses. `project_fingerprint` walks the IR dataclass tree, so a field there would
      move every fingerprint in the corpus for projects that never type the key —
      which is row 3 broken by the mechanism row 3 exists to protect. Settles the
      `MartIR` half of row 6. Added by execution 2026-09-10 — see [`logs/T-0040.md`](logs/T-0040.md)
      (D6, attempt 1).
  - id: D-18
    grade: ASSUMED
    text: >-
      **Row 16's condition is discharged: a project can now fail the requirement.**
      S-0075 P1 gave a relationship an `imported_from:` key, so a hop an artifact
      supplied grades `ASSUMED` however ordinary its cardinality, and a `locked` mart
      carrying a column through one is refused from a fixture rather than from a patched
      table. Row 16 said this would arrive with S-0057/phasing (P-2); 0044's import
      half became 0070, and its **P1** was enough because what the requirement reads
      is the grade. **Row 9's trigger has *not* fired.** It revisits when something
      produces `IMPORTED_VERIFIED`, and nothing does: 0070 P1 produces the grade `ASSUMED`,
      while `_dependency_proof` still mints `BASIS_PROVENANCE[basis]` for the same
      edge — one relationship, two provenances, which 0070 P2 owns. D8 therefore stands
      unreopened. Added by execution 2026-09-13 — see [`logs/T-0053.md`](logs/T-0053.md).
  - id: D-19
    grade: ASSUMED
    text: >-
      **A metric named by an exposure is checked against *every* mart carrying it
      as a measure**, not the one `measure_owners` would pick. That function answers
      where a measure is *emitted*; a strict exposure asks whether the number it reads
      can rest on something nobody wrote down, and the planner selects a covering
      mart at request time that need not be the cheapest — so a guarantee holding
      only for the emitter's choice would not hold for the read. Deliberately a **different
      quantifier** from `weak_bases`, where one fully-`LOCKED` route acquits a column:
      a route is an alternative *proof* of one fact and the strongest wins, while
      a mart is a runtime *selection* among relations and the weakest governs. The
      two quantify over different things. (`measure_owners` is also unreachable from
      `guardrails` — `emit` sits above it in the layers contract — but that is why
      the question had to be answered, not the answer.) Added by execution 2026-09-13
      — see [`logs/T-0054.md`](logs/T-0054.md) (unlisted, attempt 1).
  - id: D-20
    grade: ASSUMED
    text: >-
      **A mart carrying its own `locked` is skipped by the exposure walk.** Its own
      walk refuses the identical column set with the identical repair, and one problem
      printed twice is how a batch stops being read (row 4). Nothing goes unreported:
      `locked` is the only requirement that asks anything, so a mart in that set asked
      for exactly what the exposure did — the skip suppresses a duplicate, never a
      weaker requirement standing in for a stronger one. Added by execution 2026-09-13
      — see [`logs/T-0054.md`](logs/T-0054.md) (unlisted, attempt 1).
  - id: D-21
    grade: ASSUMED
    text: >-
      **The second consumer gets its own two message templates** rather than a consumer
      noun templated into the existing pair. `test_the_documented_evidence_refusal_quotes_the_template`
      reads the literal segments between a template's slots out of the constant and
      asserts the page still contains them; a placeholder in the opening clause would
      leave that guard quoting a template with a hole where the noun goes, so it would
      stop pinning the sentence a reader sees. Four flat constants is more text and
      a strictly stronger guard. Added by execution 2026-09-13 — see [`logs/T-0054.md`](logs/T-0054.md)
      (unlisted, attempt 1).
