# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      `Planner.plan` takes `paramstyle`, one of PEP 249's `qmark`, `numeric`, `named`,
      `format` and `pyformat`, or `None`. `None` is the default and renders request
      literals inline as today; any style binds them
    paths:
      - src/bloomery/planner/metricflow_planner.py
      - src/bloomery/planner/__init__.py
      - tests/unit/test_planner/test_metricflow_planner.py
    consequence: >-
      A runtime on a binding driver names the driver's style and executes the plan
      with its parameters; every caller that executes `plan.sql` alone is unchanged
    rationale: >-
      The driver reads placeholders, and drivers for one engine disagree (psycopg
      reads `pyformat`, asyncpg `$1`), so the style is the caller's fact, not the
      dialect's. Binding by default would break every caller that runs `plan.sql`
      with no parameters
    cites: [S-0030/D-2, S-0030/D-8]
  - id: D-2
    grade: ASSUMED
    text: >-
      `QueryPlan.params` is a tuple of `(name, value)` pairs in placeholder order,
      empty when nothing is bound; names are `p1`, `p2`, … by order of occurrence
      in the text
    paths: [src/bloomery/planner/result.py, tests/unit/test_planner/test_result.py]
    consequence: >-
      A positional style takes the values in order and a named style takes `dict(plan.params)`;
      `explain --format json` shows them, since it dumps every field
    rationale: >-
      One shape serves both families of style, and a tuple keeps the plan a frozen,
      comparable value as every other field is
    cites: [S-0028/D-2, S-0071/D-1]
  - id: D-3
    grade: ASSUMED
    text: >-
      What binds is every value of a request `Predicate` and of the `RowPolicy`, one
      placeholder per value; a LIKE pattern binds whole with `ESCAPE '\'` kept in
      the text. A metric's spec `filter:` and `LIMIT` stay text
    paths:
      - src/bloomery/planner/filters.py
      - tests/unit/test_planner/test_filters.py
    consequence: >-
      No request value reaches the plan text, so two requests differing only in values
      plan alike, and a caller's `%` or quote never meets the driver's parser
    rationale: >-
      Request values are the caller's and change per request; a metric filter is part
      of the compiled definition with one renderer (S-0050/D-15, LOCKED), and a limit
      is a validated integer some drivers will not bind
    cites: [S-0030/D-16, S-0032/D-13, S-0050/D-15]
  - id: D-4
    grade: ASSUMED
    text: >-
      A bound value is a Python value of the dimension's logical type, checked by
      the literal renderer's own rules: `datetime.date` for a date, a naive `datetime`
      for a timestamp, a zoned one converted to its UTC wall clock, `Decimal` for
      a decimal, `int`, `bool` or `str` otherwise
    paths: [src/bloomery/planner/filters.py, tests/execution/test_planner_binds.py]
    consequence: >-
      The driver types each bind as the column it is compared to, and a value the
      literal renderer refuses is refused bound too
    rationale: >-
      An inline `'2024-01-01'` is an untyped literal the engine coerces to the column;
      the same text bound as a `str` is typed by the driver and may not compare with
      a date. DuckDB is measured in phase 1 and the other drivers by D-7
    cites: [S-0032/D-5, S-0032/D-6, S-0032/D-15]
    fingerprint: 3cc03b46646c373d/07eb84a2aa97ef89
  - id: D-5
    grade: ASSUMED
    text: >-
      Binds travel through MetricFlow's where-constraints as opaque markers that no
      spec name can take, and the planner spells each as its placeholder in the rendered
      SQL, read with the dialect's tokenizer, so only an unquoted marker is a bind
      and a quoted literal that spells one stays text. Under `format` and `pyformat`
      every `%` in the text is doubled
    paths:
      - src/bloomery/planner/filters.py
      - src/bloomery/planner/metricflow_planner.py
      - src/bloomery/planner/compose.py
      - tests/unit/test_planner/test_binds.py
    consequence: >-
      The bind mechanism needs nothing from MetricFlow, and a psycopg-style driver
      reads a metric filter's `%` or a modulo in a measure as the character it is
    rationale: >-
      MetricFlow builds every where-filter with an empty bind set (`where_filter_spec_factory.py:121`),
      so binds cannot ride its own mechanism; and a `pyformat` driver reads every
      `%` in the statement, which is the failure #304 reported
    cites: [D-3]
    fingerprint: ffb65bb9dbb6a678/4578aec4dcecf4d8
  - id: D-6
    grade: ASSUMED
    text: >-
      `QueryPlan.fingerprint` identifies the query including its bound values: `sha256`
      over the text and the params in a canonical encoding under binds, `sha256(sql)`
      inline. `QueryPlan.shape` is `sha256(sql)` alone, equal for requests that differ
      only in bound values
    paths:
      - src/bloomery/planner/metricflow_planner.py
      - src/bloomery/planner/result.py
      - tests/unit/test_planner/test_binds.py
    consequence: >-
      A result cache keyed on `fingerprint` with the data's freshness, as the planner
      how-to documents, never serves one filter's rows for another; a runtime keys
      a prepared statement or a plan cache on `shape`; inline, both are today's fingerprint
    rationale: >-
      The how-to's contract is that the fingerprint identifies the query, and a result
      cache rests on it: with values out of the text, `sha256(sql)` alone would collide
      across filters. The shape the issue asks for is a different fact, so it is a
      different field
    cites: [S-0028/D-2]
  - id: D-7
    grade: ASSUMED
    text: >-
      On PostgreSQL through psycopg (`pyformat`) and on Trino through its client (`qmark`),
      every planner bind request returns DuckDB's inline rows, bound and inline, dates,
      timestamps and decimals included, checked by an engine differential
    paths: [tests/engines/test_planner_binds_differential.py]
    consequence: >-
      D-4's typed values are evidence on the two server engines the tier runs, and
      Q-1 is settled by the same run
    rationale: >-
      How a driver types a bind is the driver's, and only running it shows whether
      a `datetime.date` or a `Decimal` reaches the engine as the column's type. A
      row of its own because the differential lands in its own phase
    cites: [D-4, S-0012/D-2]
    fingerprint: e115bb89ee4bb229/9dbede4b19bcbad6
