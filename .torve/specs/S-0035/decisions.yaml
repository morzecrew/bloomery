# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      **Signature closure** is the root-namespace rule: any type appearing in a public
      signature, return, generic argument, or returned-dataclass field is itself exported
      from `bloomery`. **Fourteen** types are added under it (§5.1), the walk stopping
      at handle types (decision 9). Enforced by a unit test walking `get_type_hints`,
      not by review — a walk that decision 10 has to make runnable first.
    paths:
      - src/bloomery/__init__.py
      - src/bloomery/evidence.py
      - src/bloomery/ir/nodes.py
      - tests/unit/test_advisories.py
      - tests/unit/test_ir/test_nodes.py
      - tests/unit/test_package.py
      - tests/unit/test_signature_closure.py
  - id: D-2
    grade: ASSUMED
    text: >-
      **Errors are the one exemption**, carried as an explicit allowlist in the closure
      test: the root keeps `BloomeryError`; leaves stay in `bloomery.errors`, which
      is a declared `__all__` and a supported import path. An exemption in code is
      visible; an exemption in someone's head is not.
    paths: [tests/unit/test_signature_closure.py]
  - id: D-3
    grade: ASSUMED
    text: >-
      **`assert_step_contract` is promoted to `bloomery.steps.__all__`** and the generated
      wrapper's import rewritten to the shallow path. The module path was de-facto
      public API — imported by bloomery's own artifacts shipped into consumer repositories
      — with no declaration and no test protecting it. `bloomery.steps.contract` keeps
      working; this adds a supported path rather than removing an unsupported one.
      A golden assertion pins the emitted import line.
    paths: [tests/unit/test_steps/test_emission.py]
  - id: D-4
    grade: ASSUMED
    text: >-
      **`ColumnDescriptor` gains `sql_alias`, additively** (closes S-0026/D-24). `name`
      keeps meaning the requested dimension; `sql_alias` carries what the SQL returns.
      Additive beats the cleaner rename because every consumer binds positionally
      today and the rename would break them all to satisfy a preference; the recorded
      defect — by-name binding finding nothing — is closed either way. `Explanation`
      continues to speak `name`.
    paths:
      - src/bloomery/planner/coverage.py
      - src/bloomery/planner/result.py
      - tests/unit/test_planner/test_names.py
  - id: D-5
    grade: ASSUMED
    text: >-
      **Three stability surfaces, stated separately** (§5.4): SemVer over the Python
      API; per-kind document versioning over spec YAML; and **emitted artifacts are
      explicitly not stable** — byte-reproducible for fixed inputs and a fixed version,
      which is determinism, not a cross-version promise. The third gets its own docs
      paragraph because determinism and stability read alike and are not.
  - id: D-6
    grade: ASSUMED
    text: >-
      **Deep imports outside a declared `__all__` carry no promise**, stated in the
      policy. This is what makes decision 3 a fix rather than a courtesy, and what
      keeps the subpackage layering meaningful.
    paths: [src/bloomery/emit/lower/__init__.py]
  - id: D-7
    grade: ASSUMED
    text: >-
      **The four permissive version keys are pinned to `Literal[1]`**, matching `steps_version`.
      The draft proposed *adding* keys on the belief that four kinds lacked them;
      every kind already has one, and the key is the document-kind **discriminator**
      — a document without it cannot be identified at all, so "missing means 1" would
      break loading rather than preserve it. The real defect is that `spec_version:
      99` and `mapping_version: 42` are accepted and silently read as v1, so a spec
      written for a future bloomery is misread rather than refused. `spec_version`
      keeps its irregular name: renaming is a breaking change for consistency alone.
    paths:
      - src/bloomery/schema.py
      - src/bloomery/spec/catalog.py
      - src/bloomery/spec/entity.py
      - src/bloomery/spec/exports.py
      - src/bloomery/spec/exposures.py
      - src/bloomery/spec/imports.py
      - src/bloomery/spec/mapping.py
      - src/bloomery/spec/marts.py
      - src/bloomery/spec/metrics.py
      - tests/unit/test_schema.py
      - tests/unit/test_spec/test_document_versions.py
      - tests/unit/test_spec/test_exports.py
      - tests/unit/test_spec/test_exposures.py
  - id: D-8
    grade: ASSUMED
    text: >-
      This RFC **does not schedule a release**. The surface is worth being correct
      independently, and the work is cheapest while nothing is bound to it.
  - id: D-9
    grade: ASSUMED
    text: >-
      **Closure stops at handle types**, named in §5.1: `ProjectIR`, `Project` and
      `Catalog` are received and passed back, never destructured, so the walk does
      not descend into them. Without this the rule is a fixpoint over the whole IR
      — measured at **65** additions — which would export S-0020's internals as public
      API under a naming rule. The cost is stated: a handle that grows a documented
      field stops being one, and the export list grows with it.
    paths: [tests/unit/test_signature_closure.py]
  - id: D-10
    grade: ASSUMED
    text: >-
      **The `TYPE_CHECKING` guard is lifted on public signatures before the closure
      test lands.** `typing.get_type_hints` currently raises `NameError` on 7 of the
      29 exports, including `compile_project`, because `from __future__ import annotations`
      plus a `TYPE_CHECKING`-only import leaves the annotation naming something absent
      at run time. Decision 1's enforcement is unimplementable until those names are
      importable at run time — a prerequisite the design did not see, found by running
      the proposed walk rather than by reading it. Guards on internal signatures are
      untouched.
    paths:
      - src/bloomery/evidence.py
      - src/bloomery/resolve/facets.py
      - src/bloomery/resolve/lineage.py
      - src/bloomery/resolve/timeline.py
      - src/bloomery/schema.py
      - tests/unit/test_signature_closure.py
