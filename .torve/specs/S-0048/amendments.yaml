      - D-8: P1 built the Node-only signature and the retired log recorded it as D8's answer. `timeline()` accepts a string, but it spans versions and is S-0069's surface, not this one. Evidence: src/bloomery/resolve/lineage.py; src/bloomery/cli/__init__.py; tests/unit/test_cli.py::test_lineage_suggestions_are_bounded_and_deterministic.
