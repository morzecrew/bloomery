  - id: D-13
    grade: ASSUMED
    text: >-
      Planner-package DELETE list (`select.py`, `build.py`, `additivity.py`, `policy.py`):
      if they contain work, delete it — no second implementation kept "just in case";
      salvage only fixtures. The Cube equivalence suite is the second opinion.
  - id: D-14
    grade: ASSUMED
    text: >-
      **M4.5 complete (2026-08-07): V1–V4 all answered PASS** ([`spikes/metricflow/VERIFICATION.md`](spikes/metricflow/VERIFICATION.md))
      — V1: joint resolution succeeds on Python 3.12/3.13/3.14, no `requires-python`
      change, v1-shim/v2 coexistence clean in both import orders; V2: issue #241 fixed
      in 0.211.0 (by-month returns the full series); V3: cold hydration 10.5 ms median,
      1.54 MB/lookup (S-0031 budgets confirmed); V4: row-policy predicate in every
      scan pre-aggregation, escape hatch unneeded. `metricflow==0.211.*` is **confirmed**
      as the runtime pin — it resolves jointly with the sqlmesh dev tooling (sqlmesh
      0.236.1, sqlglot stays `>=30.8,<31` resolving 30.8.0). Design cleared for implementation
      (M6+).
  - id: D-15
    grade: ASSUMED
    text: >-
      *(Appended 2026-08-07, M6.)* Post-`transform()` re-sort of `input_measures`:
      MetricFlow's `AddInputMetricMeasuresRule` collects a metric's `input_measures`
      through a builtin `set` (hash-seed-dependent order, surfaced by RATIO metrics),
      so `emit_manifest` sorts `metric.type_params.input_measures` by measure name
      after `transform()` — the transformed manifest is hashed, cached (S-0031/D-5),
      and golden-byte-compared (R1); without the re-sort, ordering drift would flake
      goldens and silently defeat the cache. The determinism guarantee is therefore
      ours, applied *after* the upstream transform, not assumed of it.
  - id: D-16
    grade: ASSUMED
    text: >-
      *(Appended 2026-08-07, M14 — S-0032.)* §5.6/R6 rendering is now per-`Clause`:
      one `where_constraints` entry per clause, an `AnyOf` disjunction group **always**
      parenthesized (`policy AND a OR b` leaks every row matching `b`), policy first
      via `RowPolicy.as_clause()`. `like`/`ilike` operands are SQL `LIKE` patterns
      (caller-owned wildcards, fixed `ESCAPE '\'`; the shipped `contains` auto-`%…%`
      wrapping is removed); `ilike` lowers dialect-neutrally as `LOWER(x) LIKE LOWER(pattern)`
      (Trino has no `ILIKE`). All D8 safety rules — names only via `names.py`, typed
      literals, quote doubling, NUL refusal, `FilterTypeMismatch` never a cast — are
      unchanged and remain merge-blocking; the non-finite refusal re-homes from `FilterTypeMismatch`
      to `InvalidLiteral`.
