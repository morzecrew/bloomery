# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-19T12:36:57Z'
    title: The seeds are the golden tier's inputs
    changes:
      - subject: D-7
        field: paths
        before: [examples/**, tests/golden/**]
        after: [examples/**, tests/fixtures/**]
      - subject: D-7
        field: text
        before: >-
          Fuzz seeds are generated from `examples/**` and `tests/golden/**` at build
          time rather than committed a second time under `fuzz/`
        after: >-
          Fuzz seeds are generated from `examples/**` and `tests/fixtures/**` — the
          examples and the spec fixtures behind the golden tier — at build time rather
          than committed a second time under `fuzz/`
      - subject: D-7
        field: fingerprint
        after: 624d932148915dee/35e999ccc3b36d89
    md: |-
      The row named the golden tier by its output directory. Every `*.yaml`
      under `tests/golden/` is a generated gateway config ("Generated by
      bloomery — do not edit"), so the seeds phase 2 made from them mutated
      nothing a target reads — a reviewer's thread on #155 caught it, and the
      generator was corrected on the branch to read `tests/fixtures/`, the
      spec documents the golden tier compiles. The row now says what the code
      does; the decision itself — seeds are generated at build time, never
      committed a second time — is unchanged.
