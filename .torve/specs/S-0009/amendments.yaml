# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-09-19T12:36:57Z'
    title: The seeds are the golden tier's inputs
    changes:
      - subject: D-7
        field: paths
        before: [examples/**, tests/golden/**]
        after: [examples/**, tests/fixtures/**]
      - subject: D-7
        field: text
        before: >-
          Fuzz seeds are generated from `examples/**` and `tests/golden/**` at build
          time rather than committed a second time under `fuzz/`
        after: >-
          Fuzz seeds are generated from `examples/**` and `tests/fixtures/**` — the
          examples and the spec fixtures behind the golden tier — at build time rather
          than committed a second time under `fuzz/`
      - subject: D-7
        field: fingerprint
        after: 624d932148915dee/35e999ccc3b36d89
    md: |-
      The row named the golden tier by its output directory. Every `*.yaml`
      under `tests/golden/` is a generated gateway config ("Generated by
      bloomery — do not edit"), so the seeds phase 2 made from them mutated
      nothing a target reads — a reviewer's thread on #155 caught it, and the
      generator was corrected on the branch to read `tests/fixtures/`, the
      spec documents the golden tier compiles. The row now says what the code
      does; the decision itself — seeds are generated at build time, never
      committed a second time — is unchanged.
  - id: A-2
    at: '2026-09-29T02:32:04Z'
    title: OPEN rows the implementation settled
    changes:
      - subject: D-5
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-5
        field: text
        before: >-
          When the pull-request fuzzing job becomes a required check — not before
          a month non-blocking, and not while the harness is still producing findings
          per week
        after: >-
          The pull-request fuzz job `pr` is non-blocking: it sets `continue-on-error:
          true` and is absent from `ci.yml`'s `required-ci`. It is promoted to a required
          check only by a separate commit, after a month of non-blocking runs and
          once the harness stops producing findings week on week.
      - subject: D-5
        field: fingerprint
        after: 6d515a73a8a3c3e0/a2ae58da4858baa1
    md: |-
      These rows were graded OPEN and the implementation has since answered them. Each settled row now states what the code does and is graded ASSUMED; the owner's merge of this amendment is the acceptance, and LOCKED stays the owner's act.

      Settled by the implementation:
      - D-5: The policy and the promotion condition are in the tree and pinned by tests. The promotion itself is a future act that the condition governs, and it has not happened. Evidence: .github/workflows/fuzz.yaml; tests/unit/test_fuzz_workflows.py::test_the_pull_request_job_is_non_blocking; tests/unit/test_fuzz_workflows.py::test_no_fuzz_job_is_part_of_the_required_check; .torve/specs/S-0009/execution/T-0015-1-20260919T104650Z.yaml.
  - id: A-3
    at: '2026-10-01T05:21:50Z'
    title: What the code and later rows already answered
    changes:
      - subject: D-8
        field: text
        after: >-
          The replay job runs on every pull request touching `src/**`, `fuzz/**`,
          `examples/**`, `tests/fixtures/**` or `.github/workflows/fuzz.yaml`, on
          the weekly Monday schedule and on dispatch, under a 30-minute ceiling; one
          run compiles every seed project for three targets and three dialects in
          each of three processes (hash seed 0, hash seed 1, reversed order), measured
          at 1m24s on a developer machine when the corpus held 66 projects.
    md: |-
      What this document still left open, checked against the code and the corpus on 2026-10-01. Each is answered by what the code does or by a row written since; the owner's merge is the acceptance, and LOCKED stays the owner's act.

      - D-8 answers Q-2. Evidence: .github/workflows/fuzz.yaml; tests/unit/test_fuzz_workflows.py.
      - Q-1 stays open, and the evidence so far answers it no. The scheduled runs of 2026-09-21 and 2026-09-28 both saved every target's corpus, yet the 2026-09-28 run restored 0 entries: the week-old corpus had been evicted. The repository's cache holds eight uv entries of about 2 GB each, and a corpus touched once a week is first in line for GitHub's eviction, both for entries unused for seven days and for the least recently used past the size limit. That is the eviction S-0009/D-3 names as its departure condition; choosing the departure is the owner's call.
