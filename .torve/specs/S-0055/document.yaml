sections:
  - key: about
    md: |-
      - **Status:** 🚧 In progress — §13a's P1 and P2 have both landed. P1: two or more
        additive branches, shared dimensions by provenance, no filters
        (`logs/T-0026.md` (`logs/T-0026.md`, in history)). P2: a filter and the row policy placed on every
        branch or the request refused, `order_by`/`limit` on the composed statement, and a ratio
        or `derived:` metric whose components live on different branches computed above the join
        (`logs/T-0027.md` (`logs/T-0027.md`, in history)). The held-back classes (§8, D8) are decided per
        class — all three stay out of branch planning, directly and as components (T-0027 D183;
        `DistinctCount`'s lowering is `logs/T-0028.md` (`logs/T-0028.md`, in history)) — and nothing further
        is scheduled. Depends on S-0054, complete.
      - **Scope:** Answer requests containing measures from different origin grains by
        independently aggregating each safe branch to a common result grain and joining only
        after aggregation.
      - **Related:** S-0053 — the
        operand-preserving derived-measure IR this document depends on absolutely.
  - key: decision-notes
    md: >-
      _(Decision rows from here on are this document's D-1…; see `decisions.yaml`.)_
  - key: phasing
    md: |-
      Not scheduled. The precondition is S-0054 being stable through at least P3, since branch
      planning is single-measure planning applied N times plus a join — and if the single-measure
      half is still moving, every branch inherits the movement.
questions:
  - id: Q-1
    text: >-
      **Cross-branch filter semantics.** §6 refuses rather than defines them, deliberately,
      and the definition is a document of its own.
  - id: Q-2
    text: >-
      **Full-outer join null semantics per target.** "Defined explicitly" is the requirement;
      what the definition *is* differs per engine and is not settled here. Both are
      answered elsewhere now, and the text above is kept unchanged so the movement
      is visible. The second is settled by D13 — one rule for every dialect rather
      than one per engine, which is what D9's composed join makes possible, and what
      §5's "defined explicitly" was asking for. The first is still a document of its
      own: P1 carries no filters at all, and §13a's P2 places one only where D12's
      identity test licenses it.
