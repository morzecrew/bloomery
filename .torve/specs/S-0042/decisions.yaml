# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      The three S-0018/out-of-scope ratchets land before the `v0.1.0` tag, not after.
      Their stated trigger was the release; deferring them past it converts a deliberate
      deferral into an oversight, and a promise nothing enforces is what the release
      exists to stop.
    paths: [pages/docs/reference/stability.md]
  - id: D-2
    grade: LOCKED
    text: >-
      The docs floor checks **claims**, not links. A link checker would have passed
      the stale Postgres warning that cost the dialect its standing with a careful
      reader; a documented-refusal table would have failed. Consequence: every refusal
      the docs describe must be reachable by a test, so adding a documented refusal
      without a test becomes impossible.
    paths: [tests/conftest.py]
  - id: D-3
    grade: ASSUMED
    text: >-
      The per-package floors generalize the existing `guardrails/ = 100%` rather than
      replacing it. That floor already encodes S-0026/D-9 and is not up for renegotiation.
  - id: D-4
    grade: LOCKED
    text: >-
      The perf gate is an **absolute ceiling with headroom** against S-0031's budgets,
      never a drift comparison against a stored baseline. Runner variance makes percentage
      drift on millisecond measurements flaky, and a flaky gate is one people learn
      to re-run.
    paths: [pages/docs/reference/stability.md]
  - id: D-5
    grade: OPEN
    text: >-
      The floor percentages in §5.2. Each must be set from measured current coverage,
      one notch below — above it fails on day one, far below it ratchets nothing.
      The executor measures and logs the numbers.
  - id: D-6
    grade: LOCKED
    text: >-
      `RETIRED.md` (the retired register, since deleted) is three columns — number,
      title, retiring SHA — and **never a summary**. A fourth column would reintroduce
      the drifting second account the retirement policy exists to prevent; three columns
      describe no behaviour and so cannot drift.
    paths: [pages/docs/reference/stability.md]
  - id: D-7
    grade: ASSUMED
    text: >-
      `RETIRED.md` is hand-appended in the retiring change and checked by `rfc_index.py
      check`, not generated. A generated file that regenerates differently on a shallow
      clone is worse than a committed one.
  - id: D-8
    grade: LOCKED
    text: >-
      The changelog section is cut **before** the tag. `hatch-vcs` derives the version
      from the tag, so a section cut afterwards describes a release that already shipped.
    paths: [tests/unit/test_changelog_release.py]
  - id: D-9
    grade: ASSUMED
    text: >-
      Codecov stays `informational: true` (S-0018/D-4). The floors are enforced by
      `just coverage`, which is the same authority locally and in CI; a second branch-protection
      authority is a worse outcome than an unenforced percentage.
  - id: D-10
    grade: OPEN
    text: >-
      Which stability promises bind at 0.1 versus 1.0. §5.5 changes the page; it does
      not freeze the API. The split must be stated before the tag — after it, the
      first answer given becomes the promise.
  - id: D-11
    grade: OPEN
    text: >-
      The completeness trigger for the documented-refusal table (§5.1). A curated
      table cannot catch a claim nobody added, which is the failure it exists to prevent;
      prose cannot be parsed for claims in general. The tractable rule — every refusal-asserting
      block names an error class, every named class is in the table — is proposed,
      not settled.
  - id: D-12
    grade: OPEN
    text: >-
      The hydration benchmark's definition: fixture, what state counts as cold, whether
      `prewarm` runs, repetitions, statistic, and the ceiling. S-0031's budgets are
      targets, not a procedure, and `LruManifestHydrator.get` has three materially
      different paths. The numbers must come from measurement; D4 fixes only the *method*
      for choosing them.
  - id: D-13
    grade: LOCKED
    text: >-
      The perf gate runs in **two** places: informational on the scheduled lane, blocking
      on a release-candidate job in the tag workflow. A gate only on a schedule can
      run after the tag, which would satisfy D1 on paper and enforce nothing. The
      other two ratchets need no equivalent — they already run on every PR.
    paths: [tests/bench/test_hydration.py]
  - id: D-14
    grade: ASSUMED
    text: >-
      **Departure from D7, logged at execution (§5.4 shipped).** The consistency check
      lives in `tools/check_rfc_corpus.py`, wired into `just quality`, not in `rfc_index.py
      check` as D7 and §6 state. `rfc_index.py` is a **vendored** file — `skills-lock.json`
      pins `rfc-writer` to `morzecrew/agent-skills` with a content hash, and `c4e1c1b`
      is a sync commit — so an edit there is overwritten on the next sync, and `RETIRED.md`
      is a bloomery convention upstream has no reason to know about. `tools/check_purity.py`
      is the established precedent for a structural invariant enforced by `just quality`.
      Class: **spec-gap** — knowable at design time, and the RFC did not look. §5.4
      and §6 are left as written rather than retrofitted; this row is the record that
      they changed.
  - id: D-15
    grade: ASSUMED
    text: >-
      The check degrades in a **shallow clone**: the structural half (every number
      used exactly once, the next-free claim still free) still fails the build, the
      SHA-verification half is skipped and says so. Discovered while building it —
      `actions/checkout` defaults to depth 1, so a check that hard-failed without
      history would fail in CI on every run. **Degrading is not sufficient on its
      own**: review found that the quality job's shallow checkout meant the SHA half
      never ran in CI at all, making it a local-only check, so that job now takes
      `fetch-depth: 0` and the degradation is a fallback rather than the normal path.
      The shallow path is exercised by a real `--depth 1` clone; the SHA path by a
      temporary repository with a genuine retirement in it.
  - id: D-16
    grade: ASSUMED
    text: >-
      **Answers D5 (`OPEN`).** The floors, each measured on the tree that declared
      them and dropped one notch, with the measurement kept in a comment beside the
      number: `guardrails` 100 (exact, D3), `cli` 99, `dialects` 98, `emit` 98, `ir`
      99, `marts` 99, `plan` 99, `planner` 99, `quality` 99, `resolve` 98, `runtime`
      99, `spec` 99, `steps` 92, `transforms` 99, `typing` 98. `steps` is the lowest
      and the one worth watching — newest package, and it carries the run-time contract.
      A test asserts every package under `src/bloomery/` has a row, because the package
      with no floor is always the newest code.
  - id: D-17
    grade: ASSUMED
    text: >-
      **Answers D11 (`OPEN`).** The completeness trigger is **admonition blocks**
      (`!!! warning` / `!!! danger`), not prose. §5.1's proposed rule — every refusal-asserting
      block names an error class — does not survive measurement: 189 paragraphs in
      `pages/docs/` contain a refusal verb and 132 name no class, so the rule is either
      132 edits or an allowlist that defeats itself. An admonition is the deliberate
      form for "this will refuse you", it is the form the Postgres claim used, and
      a reader treats it as binding. **Stated limit:** a stale claim in ordinary prose
      is not caught, and the class-level census below is what covers the rest.
  - id: D-18
    grade: ASSUMED
    text: >-
      **Answers D12 (`OPEN`), and the question was already answered.** `tests/bench/test_hydration.py`
      pins all six: a 30-model reference tenant built through the real emitter, cold
      = bytes → `hydrate_manifest`, warm = an L1 hit after one populating `get`, median
      of 25, ceiling = S-0031's budget × the documented 3× CI multiplier. What §3
      called "missing a gate" was missing **wiring**: no workflow ran the `perf` marker
      at all — the only mention of it in CI was the expression excluding it — so the
      assertions had never run outside a terminal. Measured while wiring: cold 10.8
      ms against 150, warm 7.9 ms against 30. **Scope, stated rather than implied:**
      the two measured paths are a direct `hydrate_manifest` and an L1 hit. §5.3 names
      a third — an L2 fetch — and a full rebuild, and neither is benchmarked. That
      is deliberate: S-0031's budgets are two numbers, cold and warm, and a ceiling
      is only worth asserting where a budget exists to assert it against. An L2 gate
      needs an L2 budget first, which is a question for whoever writes one.
  - id: D-19
    grade: ASSUMED
    text: >-
      **Departure (spec-gap): §3's "already shipped" list was wrong about both ratchets
      it described.** The `guardrails/` 100% floor was **red** on `main` — four uncovered
      lines, including a D90 refusal branch nothing provoked — and CI never ran `just
      coverage`, so nothing enforced it. The perf tier "run in the scheduled lane"
      ran nowhere. Both are fixed here rather than worked around: the four lines are
      covered (one was unreachable and is now `guaranteed(...)`), and both lanes are
      wired. The lesson generalizes past this RFC — **a gate's existence and a gate's
      execution are separate claims**, and §3 asserted the first while meaning the
      second.
  - id: D-20
    grade: ASSUMED
    text: >-
      **Departure (discovery): two CI defects found while landing the floor, neither
      in scope and both blocking it.** `just build-docs` printed "1 issue found" and
      exited **0**, so the only check that resolves internal doc links could not fail
      anything, and no PR-triggered workflow ran it at all — `--strict` plus a `docs`
      job fixes both. And `required-ci` checked every job against a single `code`
      flag, so an rfcs-only PR would run `quality` successfully and then fail for
      not having skipped it — a latent bug from §5.4's own `corpus` filter, unexercised
      because every rfcs PR so far also touched `ci.yml`. Each job is now checked
      against its own trigger.
  - id: D-21
    grade: ASSUMED
    text: >-
      **Answers §10's placement question with §6's own answer.** The docs-floor checks
      are tests in the unit tier, not `just quality` steps, so `quality` stays byte-identical
      to CI (S-0018/D-4). §10 called this open; §6 had already settled it. The one
      exception is the *session-scoped* half — "every documented refusal is produced
      somewhere" is a claim about the whole run, so it lives in `tests/conftest.py`
      and stands down, out loud, on a narrowed session.
  - id: D-22
    grade: ASSUMED
    text: >-
      **Departure (discovery): the census's precondition is declared, not inferred.**
      It runs only when the invocation passes `--refusal-census`, which `just test`,
      `just coverage` and CI's `pytest` line all do, and a test asserts all three
      still do. Inference was tried twice and was wrong twice: comparing `config.args`
      to the rootdir made *every* session look narrowed (pytest fills `args` from
      the `testpaths` ini), and fixing that left a worse bug — `pytest -m golden`
      is narrower than anything `args` can show, so it failed with 49 refusals the
      golden tier never had reason to produce. A whole-suite claim needs a whole-suite
      session, and whether a session is whole is not recoverable from its command
      line.
  - id: D-23
    grade: ASSUMED
    text: >-
      **Answers D10 (`OPEN`) — the 0.1-versus-1.0 split.** Two of the three surfaces
      bind *fully* at 0.1 and one binds in a weaker form. **Spec YAML binds fully**:
      a document that loads keeps loading, and a breaking grammar change mints a new
      `<kind>_version`. That promise does not wait, because a spec is authored by
      people and outlives the library version that compiled it — the two clocks are
      independent by construction, which is the whole reason per-kind versioning exists.
      **Emitted artifacts** bind as stated; a non-promise does not soften. **The Python
      API binds as "never silent" now and "never outside a major" at 1.0** — below
      1.0 a breaking change may ship in a minor, which is exactly what SemVer reserves
      the `0.` series for, and what binds today is that it can never be quiet: a CHANGELOG
      entry naming what moved and what to write instead, with a minor bump as the
      floor. Claiming major-only at 0.1 was the alternative and is rejected: it is
      a promise the project cannot keep through a first year of real consumers, and
      a stability page that overstates is worse than one that states less — the Postgres
      warning is this RFC's own evidence for that. §2's "a stability promise that
      has never been tested is a draft" cuts both ways.
  - id: D-24
    grade: ASSUMED
    text: >-
      **Departure (discovery): the coverage-floors table could not see six modules,
      and D16 is where the gap was.** Every row of D16 is a directory glob, and `test_the_shipped_table_covers_every_package_under_src`
      walks `src/bloomery/` for *directories* — so `compile.py`, `errors.py`, `evidence.py`,
      `naming.py`, `schema.py` and `__init__.py` were outside every glob and had no
      floor at all. `errors.py` is the root of the entire refusal hierarchy. Nothing
      failed, because a module with no floor is exactly as green as one that holds
      — the same shape as the glob-matching-nothing case §5.2 already guards, arrived
      at from the other direction. Added as `"src/bloomery/*.py" = 98` (measured 99.0),
      with a test asserting the row exists, since a completeness check that only understands
      directories is how this recurs.
  - id: D-25
    grade: ASSUMED
    text: >-
      **Departure (spec-gap): the released thing could not say what it was.** §5.5
      lists four release-act items and none of them is a version surface, so `bloomery
      --version` did not exist, `bloomery.__version__` did not exist, and `hatch-vcs`
      wrote `_version.py` into the wheel where nothing imported it — while `.github/ISSUE_TEMPLATE/bug_report.yml`
      asked every reporter for "bloomery version". Both now exist and read the generated
      file rather than `importlib.metadata`, which would read an installed distribution
      off a disk this package promises not to touch (S-0020). Knowable at design time:
      the RFC listed what to *edit* for a release and never asked what a first-time
      installer would run first.
  - id: D-26
    grade: ASSUMED
    text: >-
      **Departure (discovery): the docs floor cannot see a count, and one was wrong
      in six places.** `StepSet` is the sixth spec kind — `spec/steps.py` says so
      in its own docstring — while `introduction.md`, `quickstart.md`, `compile-pipeline.md`,
      `spec-schemas.md`, `examples/README.md` and `README.md` said there were five,
      and `spec-schemas.md`, the field-by-field reference, had **no StepSet section
      at all**: a shipped document kind, on the one surface D23 makes fully binding,
      with no reference. Every gate passed. §5.1's checks are about refusals and citations
      by construction (D2, D17), so a stale *count* is outside all four — the same
      class as the stale prose D17 names as a stated limit, but load-bearing rather
      than decorative. No new gate is proposed here: the tractable rule over prose
      was already measured and rejected in D17, and inventing one for counts would
      be the allowlist-that-defeats-itself again.
