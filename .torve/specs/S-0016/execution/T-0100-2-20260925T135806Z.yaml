    grade: OPEN
    at: '2026-09-25T13:22:47Z'
    claim: >-
      the port targets Databricks SQL only and does not claim generic Spark SQL: the
      dialect name and the SQLGlot generator are both 'databricks'
    evidence: >-
      src/bloomery/dialects/databricks.py:97-98 — name and sqlglot_dialect; the golden
      matrix cell is tests/golden/test_sqlmesh_dialects.py:74
    action: decided
    notes: >-
      TIMESTAMP_NTZ, TRY_CAST under ANSI mode and the colon accessor are Databricks
      SQL guarantees, not open-source Spark ones; claiming both would make every rewrite
      here a claim about two engines with one lane of evidence.
  - decision: D-1
