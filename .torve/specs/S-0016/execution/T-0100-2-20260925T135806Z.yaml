      a rewrite, and the engine-side evidence stays in the live lane under tests/
    evidence: >-
      src/bloomery/dialects/databricks.py:1-40 — the module's whole import list is
      sqlglot, bloomery.dialects.base, bloomery.errors and bloomery.typing; the registry
