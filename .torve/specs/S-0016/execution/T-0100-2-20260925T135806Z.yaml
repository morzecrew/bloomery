    action: decided
  - decision: D-8
    grade: OPEN
    at: '2026-09-25T13:23:26Z'
    claim: >-
      a bloomery timestamp maps to TIMESTAMP_NTZ, not TIMESTAMP, and a neutral in-expression
      CAST(x AS TIMESTAMP) is rewritten to match so the value agrees with the column
      type it fills
    evidence: >-
      src/bloomery/dialects/databricks.py:119 — TimestampType maps to _NTZ in the
      scalar type map; _physical_types is the in-expression half
    action: decided
    notes: >-
      Databricks' plain TIMESTAMP is an instant rendered through the session zone,
      which is the S-0045 defect by another spelling: one stored row yields two days
      for two readers. The choice pins the surrogate session to ANSI mode, where a
      failing CAST raises rather than yielding NULL and TRY_CAST is the NULL-on-failure
      cast the quality layer needs. Frozen by the golden artifacts under tests/golden/*/sqlmesh/databricks/.
