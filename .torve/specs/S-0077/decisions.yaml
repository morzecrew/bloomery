# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **bloomery does not choose
      which rows a ratio is about.** Both readings — per unit over units that exist,
      and total over units with overheads included — are metrics somebody wants, and
      the defect is that they are spelled identically. The rule refuses until the
      author says; it never picks. Locked because every cheaper design is a compiler
      making a decision about somebody's business, and the wrong one is invisible
      in the output.
  - id: D-2
    grade: LOCKED
    text: >-
      **The inclusive reading stays reachable and is spelled out loud.** Without it
      the rule reduces to "exclude zero rows", which is D1 reversed with extra steps:
      an author who means `4.00` must be able to say so, and be seen to have said
      so.
    paths:
      - src/bloomery/ir/nodes.py
      - src/bloomery/spec/common.py
      - tests/fixtures/semantic_corpus/009-null-denominator/bloomery/inclusive/metrics.yaml
  - id: D-3
    grade: LOCKED
    text: >-
      **A `flag` disposition does not discharge the positivity premise.** A flagged
      row stays in the relation, so the range rule asserts nothing about what the
      ratio sums. The disposition is the premise, not the rule's presence — reading
      the rule alone would be a proof that is true of a project where the rows are
      still there.
    paths: [src/bloomery/semantic/additivity.py]
  - id: D-4
    grade: ASSUMED
    text: >-
      **The row question is one rule with two legs, not two rules.** "A ratio is over
      one row set" is a single thing to learn, and the legs fail on different projects
      so neither is redundant. Departing means the phasing wants them apart — §10's
      second question — and the cost is a second number to cite.
  - id: D-5
    grade: ASSUMED
    text: >-
      **The restriction is declared on the operands, not on the ratio.** Where the
      rows are chosen is where the restriction goes, which is the rule case 009's
      own `restricted` arm was written under. Departing means finding a restriction
      that cannot be expressed per operand.
  - id: D-6
    grade: OPEN
    text: >-
      *Superseded by D8.* **Whether a pre-filtered mart discharges the premise by
      construction.** §10's first question: the relation may already exclude zero
      rows, and whether the proof can see that depends on what the flattener records.
      The executor decides against the IR as it stands and logs it.
  - id: D-7
    grade: OPEN
    text: >-
      *Superseded by D9.* **Whether `includes_zero_denominator: true` on a denominator
      that cannot be zero is refused.** Tidier, and a refusal that helps nobody. Decide
      when writing the message; the deciding fact is whether the rule can tell "cannot
      be zero" from "not declared" without a second premise.
  - id: D-8
    grade: ASSUMED
    text: >-
      **R019 reads declarations and never relations, so no mart discharges the premise.**
      Supersedes D6, which presumed a mart could exclude rows: the spec carries no
      row restriction on a mart at all, so there is nothing for the proof to see and
      nothing the flattener could have recorded. The question was not open, it was
      empty. Should a mart-level restriction ever be designed, this rule gains a discharge
      and D6's question returns with something to read — see `logs/T-0063.md` (D-6,
      15:10Z).
  - id: D-9
    grade: ASSUMED
    text: >-
      **`includes_zero_denominator: true` on a denominator that cannot be zero is
      left alone.** Supersedes D7. "Cannot be zero" is knowable only through the positivity
      discharge, so refusing the redundant declaration needs a second premise and
      would fire on exactly the well-declared projects §9 promises not to inconvenience
      — an author who declared both the range rule and the reading, refused for agreeing
      with the compiler twice, over a number that is the same either way — see `logs/T-0063.md`
      (D-7, 15:11Z).
  - id: D-10
    grade: ASSUMED
    text: >-
      **The second leg canonicalises the restriction for itself; the IR does not.**
      §5.2 claimed identity was "a normalisation the IR already needs", and the IR
      needs the opposite: `_metric_filters` keeps clauses in authored order because
      that order is load-bearing in the artifact bytes, and two projects that wrote
      the same clauses in two orders must stay different bytes (S-0020). So the leg
      compares restrictions as sets of clauses with each set-valued operator's values
      sorted inside the clause, and §9's "if the canonical form is not as canonical
      as assumed" risk is answered by moving the normalisation into the rule — see
      `logs/T-0063.md` (unlisted, 15:12Z).
  - id: D-11
    grade: OPEN
    text: >-
      **A corpus expectation may name the result it returns.** §6's third arm is accepted
      *and* returns the number the corpus pins as naive, which the harness could not
      express: `Outcome.ACCEPTED` mapped to "correct" and that mapping was the whole
      vocabulary. An expectation now carries an optional `answer:`, defaulting to
      its outcome's mapping. Without it the arm this RFC argues hardest for cannot
      be written down, because until case 009 no case had two right answers — see
      `logs/T-0063.md` (unlisted, 15:13Z).
  - id: D-12
    grade: ASSUMED
    text: >-
      **One rule, two error classes.** D4 settles how many *rules* there are and says
      nothing about classes. Each leg names a different repair — leg 1 sends an author
      to say which rows the ratio is about, leg 2 to make two restrictions agree —
      and one class would hand the first message to the second author. R009 is the
      precedent for two reasons under one rule — see `logs/T-0063.md` (unlisted, 15:14Z).
  - id: D-13
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **`repair` does not discharge
      the positivity premise either.** D3 names only `flag`; this is D3's own sentence
      applied to the member it did not name. A repaired row stays in the relation
      carrying a fallback the rule cannot bound, because its recipe is a step and
      its fallback is whatever the author wrote. Only `quarantine` and `fail` discharge,
      because only those remove the row. Locked with D3: departing would mean proving
      a fallback is positive, which needs the step registry's output and is not a
      compile-time fact — see `logs/T-0063.md` (unlisted, 15:15Z).
  - id: D-14
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) *Superseded by D16.* **A
      fourth discharge: the denominator counts a column that cannot be NULL.** §5.1's
      three discharges refuse every ratio in this repository — eight projects, including
      the two corpus cases §6 calls untouched — and five of the eight are counts,
      where the premise holds by construction and no declaration could add anything.
      A count counts the very rows the numerator sums, so a row contributing to the
      numerator contributes 1. Without this the rule refuses `revenue / order_count`,
      and §9's claim that a well-declared project is not inconvenienced is false for
      every project in the tree — see `logs/T-0063.md` (unlisted, 15:40Z).
  - id: D-15
    grade: ASSUMED
    text: >-
      **Case 008's arms gain `includes_zero_denominator: true` and keep their grades.**
      §6 read the rule as sparing 008; the rule as written does not — 008's denominator
      is a sum over `item_count`, shape-identical to 009's `parcels` — and the corpus
      is migrated rather than the rule bent. 008's subject is the rollup of a ratio,
      not which rows it is about, and the declaration changes no SQL: the case seeds
      no zero-item order, so all three readings return its number and only the reading's
      *statement* differs — see `logs/T-0063.md` (unlisted, 15:42Z).
  - id: D-16
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **`count` and `count_distinct`
      over a column that cannot be null both discharge.** Supersedes D14, which excluded
      the second on the grounds that a distinct count is about the group rather than
      the row — true, and not the premise. What R019 refuses is a denominator whose
      *per-row* contribution can be zero while the numerator's is not, and that is
      a property of a sum over a numeric column; a count of either kind is at least
      one for any non-empty row set. The exclusion was admitted wrong on the evidence
      of the message it produced: "nothing restricts … to rows with a non-zero `customer_id`"
      about a string column, telling the author to filter `customer_id > 0` — see
      `logs/T-0063.md` (unlisted, 15:55Z, attempt 2).
  - id: D-17
    grade: ASSUMED
    text: >-
      **Leg 2 compares restrictions by the entity column each dimension resolves to,
      and a name that means two columns resolves to both.** A mart's dimension name
      is not canonical — prefixing is what makes a joined column addressable, so one
      order-level `region` is `region` on the orders mart and `order_region` on the
      order-items mart, and comparing spellings refuses exactly the cross-mart ratios
      whose operands are most likely to be restricted. Resolving to a single column
      then picks a winner where two same-grain marts flatten different entities under
      one prefix, and two restrictions meaning different things compare equal; the
      identity is therefore the *set* of meanings for that metric, so two operands
      agree exactly when every mart that can answer them agrees — see `logs/T-0063.md`
      (unlisted, 16:05Z and 18:10Z).
  - id: D-18
    grade: ASSUMED
    text: >-
      **Case 009's conversion is pinned where the harness reads it, not in a `refusal.json`.**
      §6 asks for an artifact this corpus does not have: a refused expectation carries
      `error` and `rule` inside `expected/semantic_outcome.json`, exactly as S-0076's
      conversion did. The pinning §6 asks for is unchanged and is machine-readable
      — see `logs/T-0063.md` (unlisted, 16:45Z).
