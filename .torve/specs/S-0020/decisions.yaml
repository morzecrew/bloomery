# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      IR is frozen stdlib dataclasses (slots), not Pydantic — validation happens at
      build, value semantics matter after.
    paths:
      - src/bloomery/ir/nodes.py
      - src/bloomery/plan/model.py
      - tests/unit/test_resolve/test_build.py
  - id: D-2
    grade: ASSUMED
    text: >-
      SQL is stored in the IR as canonical dialect-neutral SQLGlot text (`SqlExpr`),
      re-parsed at emit. Consequence: SQLGlot version changes can change fingerprints;
      the exact pin (D4 §5.5) makes that a deliberate event.
    paths:
      - src/bloomery/dialects/base.py
      - src/bloomery/emit/lower/marts.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/resolve/build.py
      - src/bloomery/transforms/_builtins.py
      - tests/support/type_conformance.py
      - tests/unit/test_dialects/test_base.py
      - tests/unit/test_dialects/test_postgres.py
      - tests/unit/test_transforms/test_builtins.py
      - tests/unit/test_transforms/test_type_conformance_corpus.py
  - id: D-3
    grade: ASSUMED
    text: >-
      `project_fingerprint` = `"blm1:" + sha256(canonical bytes)`; includes `bloomery_ir_version`;
      stable within a bloomery version, explicitly not across versions.
    paths:
      - src/bloomery/ir/fingerprint.py
      - tests/unit/test_ir/test_fingerprint.py
      - tests/unit/test_ir/test_nodes.py
  - id: D-4
    grade: ASSUMED
    text: >-
      All IR collections are tuples with explicit lexicographic sort, except authored-order
      fields (`key`, transform chains, recipe aliases, `partition_by`).
    paths:
      - src/bloomery/ir/lower.py
      - src/bloomery/ir/nodes.py
