  - id: D-16
    grade: ASSUMED
    text: >-
      *(2026-08-10)* **A clause takes a native audit where both targets have one,
      and a shared predicate otherwise. §10's audit-vocabulary question is settled
      — and not by availability.** The split that shipped is `not_null`/`enum` inline
      in SQLMesh's `MODEL` block and as dbt's native tests, with `min`/`max`/`regex`
      as an `audits/*.sql` artifact on one side and a generic test on the other (`dbt_utils.expression_is_true`
      as this decision was written; **amended by D18** to a macro bloomery emits,
      which changes the vehicle and not the split). §10 framed the question as "builtin
      vs custom, settled against the pinned sqlmesh" — which turns out to be the wrong
      axis. The pinned sqlmesh (0.236) **does** ship `accepted_range` and `match_regex_pattern_list`,
      and their queries read identically to `audit_predicate`'s: `accepted_range(min_v
      := N)` is `column < N`, and `match_regex_pattern_list(patterns := [p])` is `NOT
      REGEXP_LIKE(column, p)`. (Compared by reading both ASTs, not by executing them
      — stated because "identical" is the kind of claim that deserves to say how it
      was reached.) So availability was never the constraint. **The criterion is agreement
      between the two targets.** dbt-core has native `not_null` and `accepted_values`
      and no range or regex test at all — `dbt_utils` is a package, not core. For
      the first two, each framework says the same thing in its own vocabulary and
      bloomery uses each one's, which is why they read natively on both. For the rest,
      only SQLMesh has a builtin, and taking it would leave `audit_predicate` with
      dbt as its sole consumer: one function builds the violations form and the assertion
      form side by side, and that shared construction is the only thing making "select
      `amount > 100`" and "assert `amount <= 100`" provably the same check rather
      than two opinions that happen to agree today. A test pins the split per kind
      per target, and a second asserts the declined builtins still exist — a decision
      resting on a fact nobody checks is how an RFC row rots.
    paths: [src/bloomery/emit/dbt/__init__.py]
  - id: D-17
    grade: ASSUMED
    text: >-
      *(2026-08-10)* **One Cube view per mart. §10's grouping question is settled,
      and the answer is neither of the two it offered.** §10 asked "per metric or
      per metric-grain group"; what shipped is per **mart**, and the emitter's own
      comment called it "the simplest defensible grouping" — true but weaker than
      the actual reason. **Per-grain is not expressible.** Two marts may share a grain
      (nothing forbids it, and the corpus now has a case), and merging them into one
      view means a Cube view over two cubes, which needs a `join_path` between them.
      bloomery models **no relationship between marts** — they are independently pre-joined
      at build time (S-0027/D-1) — so the join would have to be invented, which is
      the move this project refuses everywhere from `unknown_member` sentinels to
      fabricated step references. **Per-metric buys nothing.** `measure_owners` already
      resolves each metric to exactly one mart, so a per-metric view would carry that
      mart's whole dimension set once per metric and fragment the subject area a view
      exists to present. The distinguishing case — two marts at one grain — was untested
      until this decision, because every fixture's marts happened to differ in grain;
      it now has a test, along with one asserting a view names exactly one cube, which
      is the structural half of the same argument.
  - id: D-18
    grade: ASSUMED
    text: >-
      *(2026-08-11)* **The dbt target defines the generic test it declares; the emitted
      project depends on no package.** D16's dbt half had to name *some* vehicle for
      `min`/`max`/`regex`/`reconcile`, and the only one dbt offers is `dbt_utils.expression_is_true`
      — which D16 itself noted "is a package, not core" without following the consequence.
      The consequence is that bloomery emitted a project **declaring a test it did
      not define**: `dbt compile` stops at ``'dbt_utils' is undefined. … install package
      dependencies with "dbt deps"``, for every project carrying one of those four
      clauses. Two fixes were available — emit a `packages.yml` pinning `dbt-labs/dbt_utils`,
      or define the test — and the second wins on the thing this compiler is for:
      artifacts are a pure function of the specs (S-0020), and a `packages.yml` makes
      the output complete only after a *network fetch* the compiler is forbidden from
      performing and the consumer may not be able to perform at all. So `macros/bloomery_expression_is_true.sql`
      is emitted, iff `schema.yml` declares the test. Three things follow. **It is
      `ArtifactKind.AUDIT`, not `CONFIG`** — it is the custom audit *body* for this
      target, the exact counterpart of the `audits/<name>.sql` file SQLMesh gets for
      the same kinds and from the same `audit_predicate`, which makes D16's "one function,
      two forms" symmetry structural rather than incidental. **The body is `dbt_utils`'
      `default__test_expression_is_true` minus the `column_name` branch bloomery never
      takes**, so the replaced semantics are preserved exactly — including that a
      NULL expression *passes*, `NOT NULL` being NULL and selecting no row, which
      is S-0033/D-19's Kleene discipline arrived at from dbt's side. **The emission
      condition reads the emitted schema rather than re-deriving the entity filter**,
      so the project can neither declare the test without the macro nor carry it unused,
      and a test pins both directions.
    paths:
      - src/bloomery/emit/dbt/__init__.py
      - tests/e2e/test_dbt_parse.py
      - tests/property/test_compile_properties.py
      - tests/unit/test_emit/test_dbt.py
  - id: D-19
    grade: ASSUMED
    text: >-
      *(2026-08-11)* **`dbt parse` does not validate that a declared test resolves;
      the e2e tier now compiles.** Recorded because the *tier built to catch this
      class of defect did not catch it*, and the reason is a documented overclaim
      rather than a missing fixture: S-0026's dbt cell asserted parse, and its module
      docstring claimed parse checks "whether a declared test is a thing dbt recognizes".
      It does not — parse validates the *shape* of a `schema.yml` entry and never
      resolves the macro behind the name. Demonstrated by renaming the test to `utter_nonsense_not_a_test`,
      which parse accepted in silence. Only `compile` renders test bodies, so D18's
      defect was invisible for as long as the tier stopped at parse. The parse pass
      stays (it is the cheap "dbt loads this at all" check, and the malformed-`config()`
      control belongs to it) and a compile pass joins it over every fixture. The build
      pass that D20 later added sits on top of both.
    paths: [src/bloomery/emit/dbt/__init__.py]
  - id: D-20
    grade: ASSUMED
    text: >-
      *(2026-08-11)* **The dbt target emits a real DAG, and keeps the naming policy
      owning namespaces. S-0026/D-22 is closed — with both of its candidates, not
      one.** D22 found `dbt build` could not pass: models named their inputs literally
      (`FROM silver.order_item`), so dbt had no edges to order them by *and* materialized
      each into the profile's target schema while the `FROM` clause said `silver`.
      It offered two fixes with an "or" between them, and the "or" was the mistake
      — **neither is sufficient alone, and each repairs the other's cost.** `+schema`
      config alone places the relations and leaves ordering absent, so a gold model
      still races its silver input. `ref()`/`source()` alone orders the DAG but resolves
      names through dbt's schema config, which is the objection D22 raised: the naming
      port stops owning the namespace. Together: `ref()` for every relation bloomery
      emits and `source()` for bronze, `+schema: <ns>` per model directory, and a
      `generate_schema_name` override returning the configured schema **verbatim**
      — because dbt's default returns `<target.schema>_<custom>`, which would put
      models in `main_silver` while `sources.yml` (which never passes through that
      macro) still said `bronze`, honouring the policy in half the project. **How
      it is emitted.** Shared lowering is untouched: both targets build inputs as
      `exp.table_(relation, db=namespace)`, and the dbt emitter rewrites *table nodes
      only*, mapping `(namespace, relation)` to a reference. A namespace-less table
      is never rewritten, which is what keeps a CTE reference from being mistaken
      for a model; a table the map does not know is left literal rather than guessed
      at, because inventing a `ref()` for a relation bloomery did not write would
      name a model dbt cannot find. An SCD2 entity resolves to its **snapshot**, the
      only thing this target builds for it. **The cost, stated.** D5's port-abstraction
      proof compared the two targets' SELECTs byte for byte and can no longer: the
      `FROM` clauses differ by construction. It is restated, not weakened — resolve
      the references, drop namespaces, and the SQL is identical on every projection,
      join, cast and dialect quirk, so the entire difference between the targets is
      one documented substitution. The namespaces the comparison erases are asserted
      separately, against the `+schema` config and the override.
    paths:
      - src/bloomery/emit/dbt/__init__.py
      - tests/e2e/test_dbt_parse.py
      - tests/property/test_compile_properties.py
      - tests/support/compiling.py
      - tests/unit/test_emit/test_dbt.py
      - tests/unit/test_emit/test_quality_mart.py
  - id: D-21
    grade: ASSUMED
    text: >-
      *(2026-08-11)* **The dbt e2e tier builds, and the thing a passing build proves
      least visibly gets its own control.** D20 has two halves and a green `dbt build`
      only obviously demonstrates one. Ordering is self-announcing — a gold model
      running before its silver input errors on a missing relation, and sabotaging
      the rewrite fails exactly the three fixtures that have a gold→silver edge and
      no others. Placement is not: with the `generate_schema_name` override deleted,
      every model still builds and every mart still finds its inputs, because `ref()`
      follows dbt wherever dbt put them. What breaks is only that the relations are
      no longer where the naming policy said — so that control asserts on the **warehouse's
      schema list**, not on the build's exit code, and requires `main_silver` to be
      present so a control that stopped discriminating fails rather than passes silently.
      Sources are seeded **empty** and the tier says so: structure — resolution, ordering,
      placement — fails identically on an empty warehouse, and arithmetic is the execution
      and equivalence tiers' claim, not restated here.
  - id: D-22
    grade: ASSUMED
    text: >-
      *(2026-08-11)* **The emitted `schema.yml` targets dbt `>=1.10,<2`, and the generic-test
      form is what sets that floor.** Found by a deprecation warning in D21's new
      build pass — "arguments to generic tests should be nested under the `arguments`
      property" — which looked like housekeeping and was not. **The two spellings
      are mutually exclusive**, measured on four real installs by compiling this repo's
      own emitted project rather than inferred from a changelog: flat compiles on
      1.9.10, 1.10.22, 1.11.12 and 1.12.0 (warning from 1.10 on); nested is a **compilation
      error** on 1.9 and clean on all three later ones. So the choice is a compatibility
      range, not a style, and the only version that discriminates is 1.9 — which is
      what makes the nested form worth taking. Adopting it at a floor of 1.12 (the
      version that happened to be installed) would have cost three further minor versions
      for nothing; the floor is the version the feature actually arrived in. **What
      this exposed is bigger than the warning.** Which dbt versions the *emitted artifact*
      works on had never been written down anywhere. `dbt-core>=1.9` was a **dev**
      dependency — the test environment, not the product — unbounded, so CI silently
      tested against whatever resolved that day, while the artifact's own compatibility
      was a matter of nobody having asked. S-0025/dbt-emitter-compatibility calls
      dbt "the compatibility target" without ever saying compatible with *what*. It
      now says: the dependency is bounded `>=1.10,<2` (as sqlmesh and metricflow already
      were — dbt was the one framework left floating), the range is stated in the
      emitter's docstring, and a test pins the emitted form with the measured matrix
      in its docstring, so the bound and the form can only move together. `not_null`
      is unaffected: it takes no arguments and stays a bare name on every version.
    paths: [src/bloomery/emit/dbt/__init__.py, tests/unit/test_emit/test_dbt.py]
