  - decision: unlisted
    grade: UNLISTED
    at: '2026-09-25T12:45:38Z'
    claim: >-
      the port declares TRY_CAST on the strength of SQLGlot's redshift generator rather
      than of a live engine — no Redshift container exists in this tree, so the offline
      rungs cannot settle it. If it is wrong, every coercible rule on this port renders
      a cast that aborts the run, which is the exact degradation the capability flag
      exists to prevent
    evidence: >-
      `uv run python -c "import sqlglot; print(sqlglot.transpile('SELECT TRY_CAST(a
      AS BIGINT)', read='duckdb', write='redshift'))"` prints ['SELECT TRY_CAST(a
      AS BIGINT)'] — the redshift generator drops PostgreSQL's no_trycast transform
      deliberately, which is a maintained dialect stating Redshift renders TRY_CAST
      natively
    action: decided
    proposal: >-
      D-2's surrogate lane must confirm TRY_CAST against a real Redshift before the
      port is called proven; a surrogate green cannot, since PostgreSQL has no TRY_CAST
      either
  - decision: unlisted
    grade: UNLISTED
    at: '2026-09-25T12:45:38Z'
    claim: >-
      the port does not declare UNICODE_NORMALIZE — Redshift defines no normalization
      function at all — so it is the first shipped dialect that refuses part of the
      dirty-data corpus. The docs-floor helper was rewritten to enumerate shipped
      dialects by capability: each port that declares what the corpus needs compiles
      it, each that does not is asserted to refuse by name
    evidence: >-
      src/bloomery/dialects/base.py:331 — the flag's own note says it exists so a
      fourth port without one refuses the rule rather than emitting a function nothing
      defines; the helper is at tests/unit/test_docs_floor.py:153
    action: decided
    proposal: >-
      a row recording that Redshift has no Unicode normalization, and that the reference
      page's 'all shipped ports declare all of them' no longer holds
  - decision: unlisted
    grade: UNLISTED
    at: '2026-09-25T12:45:38Z'
    claim: >-
      regex_extract with a capture-group index above one is refused on this port:
      Redshift's REGEXP_SUBSTR names a group only through the 'e' match parameter,
      which extracts the first subexpression and no other. Returning the whole match
      instead would be a wrong answer wearing the shape of a right one
    evidence: >-
      src/bloomery/dialects/redshift.py:259 — _regexp_substr raises UnsupportedByTarget
      above group 1; tests/unit/test_dialects/test_redshift.py asserts both the 'c'/'e'
      spellings and the refusal
    action: decided
    proposal: >-
      a row recording the new refusal, since it is a user-facing limit no decision
      in the table anticipates
  - decision: D-4
    grade: ASSUMED
    at: '2026-09-25T12:57:05Z'
    attempt: 2
    claim: >-
      the SUPER lowering swallowed TRY_CAST: exp.TryCast subclasses exp.Cast, so a
      variant cast inside the quality system emitted a bare JSON_PARSE, which raises
      on a malformed document instead of producing the NULL the coercible rule reads
      — the port now guards it with Redshift's own CAN_JSON_PARSE, which is what its
      TRY_CAST capability declaration promises
    evidence: >-
      src/bloomery/dialects/redshift.py:328-338 — the TryCast branch now precedes
      the Cast branch; tests/unit/test_dialects/test_redshift.py:257 asserts CASE
      WHEN CAN_JSON_PARSE(payload) THEN JSON_PARSE(payload) END
    action: decided
    notes: >-
      the audit that rejected _guarded_try_cast held for every type Redshift casts
      natively and not for JSON, where the neutral type is not the physical one; no
      shipped fixture declares a variant field, so no golden artifact changes
