entries:
  - decision: D-1
    grade: LOCKED
    at: '2026-09-25T12:45:10Z'
    claim: >-
      RedshiftDialect subclasses SQLGlotDialect and inherits no PostgreSQL rewrite;
      each one was audited against Redshift separately and four were rejected outright
      — pg_input_is_valid (not defined here), the JSONB lowering (no such type), the
      reserved-word list (SQLGlot's redshift generator carries its own and quotes
      it), and regexp_substr's sixth argument (Redshift's form stops at five and reads
      the third as a start position)
    evidence: >-
      src/bloomery/dialects/redshift.py:94 — class RedshiftDialect(SQLGlotDialect);
      tests/unit/test_dialects/test_redshift.py:63 asserts the non-subclassing mechanically,
      and a sibling test greps the compiled corpus for PG_INPUT_IS_VALID, JSONB and
      AT TIME ZONE
    action: decided
  - decision: D-3
    grade: LOCKED
    at: '2026-09-25T12:45:10Z'
    claim: >-
      the postgres-compatible / redshift-native split is built in the harness module
      and classifies each fixture from its own Redshift rendering rather than from
      a hand-kept list; nothing consumes it yet, as the contract states
    evidence: >-
      tests/support/redshift.py:74 — classify() reads the fixture's redshift artifacts
      and looks for constructs PostgreSQL cannot mean; over the five golden fixtures
      it splits 3 compatible / 2 native
    action: decided
  - decision: D-4
    grade: ASSUMED
    at: '2026-09-25T12:45:10Z'
    claim: >-
      SUPER replaces the JSONB lowering rather than layering over it: variant is SUPER,
      a neutral CAST(x AS JSON) becomes JSON_PARSE(x), and json_path extraction is
      refused at emit until PartiQL navigation is built
    evidence: >-
      src/bloomery/dialects/redshift.py:340 — _refuse_super_navigation; the refusal
      is needed because json_path does not declare its operand's type and Redshift
      has no coercion between a VARCHAR holding JSON and a SUPER, so any translation
      would be right for one shape and silently wrong for the other
    action: decided
  - decision: D-5
    grade: ASSUMED
    at: '2026-09-25T12:45:10Z'
    claim: >-
      no lane built here depends on LocalStack; the offline rungs are unit rewrites,
      goldens and a re-parse assertion, all of which run with nothing but the compiler
    evidence: >-
      tests/support/redshift.py:26 — the module records LocalStack as an option for
      a later phase rather than a dependency of this one
    action: decided
  - decision: D-6
    grade: OPEN
    at: '2026-09-25T12:45:22Z'
    claim: >-
      the port does not declare DialectFeature.ARRAY: Redshift has no array column
      type — SUPER can hold an array and ARRAY() constructs one, but no column is
      declared VARCHAR[] — so _quality_flags and failed_rules take the delimited-string
      fallback, which changes the emitted artifact and the reject table's shape exactly
      as the row anticipated
    evidence: >-
      tests/golden/multi_source_quality/sqlmesh/redshift/models/silver/order_line__reject.sql:22
      — failed_rules is a TRIM over concatenated CASE arms where the postgres cell
      renders nested ARRAY_CAT
    action: decided
  - decision: D-7
    grade: OPEN
    at: '2026-09-25T12:45:22Z'
    claim: >-
      exactly two helpers are genuinely shared, both as named module-level functions
      imported from the postgres port: zoneless_parse, because Redshift's TO_TIMESTAMP(text,
      text) also returns TIMESTAMPTZ with the session zone attached, and ends_with_as_right,
      because neither engine defines ends_with and RIGHT/LENGTH is exact on both.
      Everything else the postgres port carries is rejected; the Redshift port additionally
      needs a rewrite postgres does not, LEFT/LENGTH for starts_with
    evidence: >-
      src/bloomery/dialects/postgres.py:335 — ends_with_as_right and zoneless_parse
      at :359, both public and both documented as shared by name rather than by inheritance
    action: decided
