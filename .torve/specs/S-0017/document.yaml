      rule in `rfcs/INDEX.md` is that such a root leaves the directory with the last of its
      dependants. It is the root of that corpus's semantic-correctness sequence.

      Every row below is carried across with the grade the source gives it. Rows 1 through 8
      were authored; rows 9 through 19 were proposed by execution and accepted by the owner;
