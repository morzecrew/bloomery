      the second at a declared drift of three. `tasks/T-0041.json` is the contract the second
      executed under, declaring row 3 over three files of the package.
alternatives:
  - option: >-
      Keep grain comparison as string equality and let each consumer widen it
    rejected_because: >-
      Four consumers compare grains — the planner's rollup proof, the measure's origin,
      the branch join key, the mart's refusal — so one identity re-derived four times
      is four chances to disagree, and disagreement here is a plausible wrong number
      rather than a crash
    cites: [D-1]
  - option: >-
      Answer the rollup question by graph reachability over the relationship graph
    rejected_because: >-
      Undirected reachability accepts a coarser grain rolling up to a finer one on
      the strength of an edge existing, which is exactly the refinement D-2 forbids;
      reachability survives only as a diagnosis, run after the closure has already
      refused
    cites: [D-2, D-5, D-14]
  - option: Store the grain on an IR node
    rejected_because: >-
      Adding a field moves the IR version, every project fingerprint and every golden,
      which spends the corpus's fingerprints for a derived view that costs nothing
      to compute; it is also the constraint the documents downstream are next tempted
      to break
    cites: [D-9]
  - option: Infer cardinality from warehouse data
    rejected_because: >-
      A heuristic is the weakest fact admitted into the closure, and the value of
      every proof built on top is exactly that fact; a dependency this compiler believes
      is one a person declared or the compiler composed from declarations
    cites: [D-3]
  - option: >-
      Read SCD2 validity a second time inside the grain model
    rejected_because: >-
      One body with two readings of the same semantic fact is the divergence this
      project has paid for before; the shared half moved down into the package and
      the mart guard now dispatches on it, keeping only the wording
    cites: [D-4, D-10]
  - option: >-
      Compare routes by the names of the relationships they crossed
    rejected_because: >-
      Names get both directions wrong at once — one relationship declared in both
      directions reads as two meanings and refuses falsely, and two routes onto one
      dependent column read as one meaning and prove falsely
    cites: [D-11, D-19]
  - option: >-
      Return booleans from the closure and reconstruct the reason when a consumer
      needs it
    rejected_because: >-
      Reconstructing a derivation from an answer is deriving it again, differently,
      in the place least able to check it; the proof tree and the case pinning both
      need the route, not the verdict
    cites: [D-6]
  - option: Cache the closure
    rejected_because: >-
      A memo keyed on a graph walk is where a deterministic walk stops being deterministic,
      and D-7 makes that a correctness question rather than a performance one; there
      is still no measurement to argue from
    cites: [D-7, D-12]
  - option: >-
      Re-implement the mart's grain refusal on this substrate immediately
    rejected_because: >-
      The substrate has no consumer until a planner exercises it, so moving a shipped
      refusal onto it now carries the whole of the observable-behaviour risk for none
      of the benefit; the first phase with a reason to touch the mart path is where
      the question is asked again
    cites: [D-8, D-13]
questions:
  - id: Q-1
    text: >-
      Whether the grain representation can be reached without an IR version bump —
      whether the determinant representation rides existing nodes or adds one, which
      decides how much of the preserve-observable-behaviour requirement is mechanical.
    status: settled
    settled_by: D-9
  - id: Q-2
    text: Where the closure is cached, if anywhere.
    status: settled
    settled_by: D-12
