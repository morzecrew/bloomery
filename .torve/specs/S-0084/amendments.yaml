# yaml-language-server: $schema=../../schemas/amendments.json
amendments:
  - id: A-1
    at: '2026-10-01T23:08:05Z'
    title: Only a child with orphans is replayed
    changes:
      - subject: D-3
        field: text
        before: >-
          `replay_scope` names every entity whose `referential` rule at `on_missing:
          quarantine` reaches, directly or through a chain, an entity already in scope
        after: >-
          `replay_scope` names every entity whose `referential` rule at `on_missing:
          quarantine` reaches, directly or through a chain, an entity already in scope,
          provided it already quarantined on that entity before the change; a child
          that is new, or quarantines on it only from now on, holds no orphans and
          is not named
      - subject: D-3
        field: fingerprint
        after: 0c9344e9754b6c74/8c56a734bac15d77
    md: >-
      Review of the implementation found the cascade naming children with nothing
      to replay: an entity added in the same change, or one whose rule on the parent
      turned to quarantine only now, has no reject rows from that rule. D-3 now names
      only a child that already quarantined on the parent before the change.
  - id: A-2
    at: '2026-10-02T17:22:09Z'
    title: A cycle is broken, not sorted
    changes:
      - subject: D-4
        field: text
        before: >-
          `replay_scope` is ordered parents first, topologically with ties broken
          by name; entities whose `referential` rules form a cycle have no parent-first
          order and are ordered by name among themselves
        after: >-
          `replay_scope` is ordered parents first, topologically with ties broken
          by name; a cycle of `referential` rules has no parent-first order, so it
          is broken at its first member by name and parent-first order resumes from
          there
      - subject: D-4
        field: fingerprint
        after: f1dd061192a65718/de3cbb24f12438da
    md: >-
      Review found that name order cannot hold across a whole cycle: once the first
      member is released, its children become ready and parent-first order resumes,
      so a cycle A, B, C can come out A, C, B. D-4 now says what the order does: the
      cycle is broken at its first member by name, never at a child downstream of
      it, and parent-first order resumes from there.
