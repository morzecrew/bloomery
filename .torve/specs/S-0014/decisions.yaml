# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      The `DATETIME` against `TIMESTAMP` choice is made explicitly by this port and
      never inherited from a SQLGlot default: bloomery's `timestamp` is UTC and zoneless,
      BigQuery's `TIMESTAMP` is an instant and its `DATETIME` is a wall clock, and
      the port states which one a bloomery `timestamp` becomes
    paths: [src/bloomery/dialects/bigquery.py]
    consequence: >-
      The two are not interchangeable under aggregation or comparison, so a default
      that happens to work on the fixture corpus is indistinguishable from a decision
      until the day a value crosses a zone — and by then the wrong instant has been
      computed rather than refused
    rationale: >-
      The single highest-risk line in the port and the one whose failure is silent;
      carried at the grade row D1 of `rfcs/0048-bigquery-dialect.md` gives it
  - id: D-2
    grade: LOCKED
    text: >-
      `SAFE_CAST` satisfies the NULL-on-failure contract the quality system's coercion
      lowering depends on, including under the `Cast → TryCast` rewrite the other
      three ports already survive
    paths: [src/bloomery/dialects/bigquery.py]
    consequence: >-
      A port whose safe cast does not survive that rewrite silently turns a quality-carrying
      entity back into produce-or-raise on one engine: the bad value aborts the run
      instead of becoming NULL where `coercible` can see it and the row can be quarantined
    rationale: >-
      The quality system's entire coercion story is that a bad value becomes NULL
      rather than aborting a run; carried at the grade row D2 of `rfcs/0048-bigquery-dialect.md`
      gives it
  - id: D-3
    grade: LOCKED
    text: >-
      The emulator lane is pinned to an exact image tag and is never the authoritative
      lane — it is evidence, marked as a surrogate, and the real service's own compiler
      is the oracle
    paths: [tests/engines/test_bigquery_surrogate.py]
    consequence: >-
      `latest` is not a lane, because a tier whose engine version can change under
      it cannot tell a regression from an upgrade; and a green surrogate run may never
      be quoted as engine conformance, which is why the claim has to be kept out of
      the test's name rather than only out of its body
    rationale: >-
      Rows D1 and D3 of `rfcs/0046-validating-a-dialect-port.md` applied. Recorded
      on this port because BigQuery's emulator is good enough and its dry run cheap
      enough that the tempting shortcut is the opposite of the usual one: skipping
      the emulator is defensible, skipping the dry run is not
  - id: D-4
    grade: ASSUMED
    text: >-
      CI authenticates to BigQuery by Workload Identity Federation with GitHub OIDC,
      not by a stored service-account key, and the identity is scoped to issuing query
      jobs and dry runs, reading the test dataset's metadata, and running the tiny
      live corpus where it is enabled
    paths: [.github/workflows/ci.yml]
    consequence: >-
      A long-lived JSON key in repository secrets is the credential most likely to
      outlive the maintainer who created it, and nothing in the repository would notice
      that it had
    rationale: >-
      Not `LOCKED` because the trade is operational rather than semantic — a project
      without federation configured may start with a scoped key and a rotation note,
      and that is the departure this grade licenses; carried at the grade row D4 of
      `rfcs/0048-bigquery-dialect.md` gives it
  - id: D-5
    grade: ASSUMED
    text: >-
      A tiny dedicated BigQuery dataset exists before the dry-run lane does, so that
      name and type resolution actually run against something
    paths: [tests/support/bigquery.py]
    consequence: >-
      A dry run over a query that references nothing validates syntax and little else,
      which would make the lane look authoritative in a report while proving roughly
      what rung 3 already proves for free
    rationale: >-
      Carried at the grade row D5 of `rfcs/0048-bigquery-dialect.md` gives it; departing
      means a lane that names its own weaker claim rather than one that quietly inherits
      the stronger one
  - id: D-6
    grade: OPEN
    text: >-
      Whether the emulator lane runs on pull requests, and the executor decides it
      on measured runtime and on whether it catches anything rungs 1 through 3 miss
    paths: [tests/engines/test_bigquery_surrogate.py, .github/workflows/ci.yml]
    consequence: >-
      It needs no credential, which makes it eligible where the other three ports'
      live lanes are not — and it is also the rung with the least authority, so a
      slot on every pull request buys time from every contributor for a signal that
      may be redundant
    rationale: >-
      Left open by row D6 of `rfcs/0048-bigquery-dialect.md`, and left open here:
      the answer is a measurement nobody has taken, not an argument
  - id: D-7
    grade: OPEN
    text: >-
      The `NUMERIC` and `BIGNUMERIC` mapping for a declared `decimal(p, s)`, and which
      bounds a declared type may not exceed, decided against the declared-type conformance
      battery rather than from the documentation and recorded with the bounds
    paths:
      - src/bloomery/dialects/bigquery.py
      - tests/unit/test_dialects/test_bigquery.py
    consequence: >-
      The two types have different precision and scale bounds and different division
      behaviour, and bloomery forbids floats in emission paths, so this mapping decides
      what a declared decimal can express at all on this engine
    rationale: >-
      Left open by row D7 of `rfcs/0048-bigquery-dialect.md`; the battery is what
      can answer it, and the declared-against-produced corpus exists because `to_utc`
      declared one type and produced another on all three shipped ports for the whole
      life of the project without any tier noticing
