  - decision: D-7
    grade: OPEN
    class: drift
    at: '2026-09-25T12:17:20Z'
    attempt: 3
    claim: >-
      the decimal bounds recorded at attempt 2 were the unparameterized maxima read
      as independent limits, and they emit types BigQuery cannot create; GoogleSQL
      bounds a parameterized decimal's precision relative to its scale, so the mapping
      is now NUMERIC(p, s) where s <= 9 and p - s <= 29, BIGNUMERIC(p, s) where s
      <= 38 and p - s <= 38, and a refusal past both — decimal(38, 0) and decimal(30,
      0) move from NUMERIC to BIGNUMERIC, decimal(38, 9) and decimal(76, 38) stay
      where they were
    evidence: >-
      src/bloomery/dialects/bigquery.py:46-59 — the bound pairs are now (integer digits,
      scale), (29, 9) and (38, 38), and src/bloomery/dialects/bigquery.py:137 tests
      scale and p - s rather than precision and scale independently; tests/unit/test_dialects/test_bigquery.py:290-301
      walks both edges and the two cases the old reading got wrong
    action: decided
    notes: >-
      Supersedes the D-7 entry of attempt 2, which stated bounds of (38, 9) and (76,
      38) as independent maxima: NUMERIC carries 29 integer digits and BIGNUMERIC
      38, so NUMERIC(38, 0) asks a 29-integer-digit type for 38 of them. Nothing below
      the engine reports it — SQLGlot parses both spellings — which is why it survived
      a green attempt. The declared-type battery's own decimal is decimal(12, 4) and
      unaffected; the golden cells carry only unparameterized CAST(... AS NUMERIC),
      so no artifact moves.
