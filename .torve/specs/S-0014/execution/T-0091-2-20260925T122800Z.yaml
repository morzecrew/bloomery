      Measured against the declared-type conformance corpus rather than read off the
      documentation: the last case in tests/unit/test_dialects/test_bigquery.py puts
      every support.type_conformance CASE through render and physical_type, which
      is where the decimal-carrying transforms (to_decimal, multiply, divide, round)
      live. Bloomery forbids floats in emission paths, so wider-than-BIGNUMERIC has
      no lossy fallback and is a refusal rather than an approximation.
