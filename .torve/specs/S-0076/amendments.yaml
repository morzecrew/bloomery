        after: ASSUMED
      - subject: D-8
        field: text
        before: >-
          **Whether the refusal is `UndeclaredZone` or a reuse of an existing denomination
          error.** R009's family already refuses an undeclared currency, and one class
          for "undeclared denomination" may read better than two. Decide when the
          message is written, since the deciding fact is whether one message can name
          both without hedging.
        after: >-
          The refusal is its own class, `UndeclaredZone`, not a reuse of R009's undeclared-currency
          refusal: that one refuses a conversion and this one refuses a consumption,
          and the repair names `zone_in:` or `to_utc` rather than a currency.
