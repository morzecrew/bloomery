    changes:
      - subject: D-7
        field: grade
        before: OPEN
        after: ASSUMED
      - subject: D-7
        field: text
        before: >-
          **Whether a step output needs a zone declaration.** §5.3 discharges a value
          that never passed `parse_ts`, which lets a `python_model` emitting a wall
          clock through. Deciding it needs one example of a step that does so; the
          executor decides and logs it.
        after: >-
          A step output needs no zone declaration. R018 reads only mapping chains,
          and a column that no chain passed through `parse_ts` discharges as `DERIVED`,
          since it was never a wall clock. A step emitting a wall clock is a known
          hole; a zone surface on `steps:` is S-0034's question.
      - subject: D-7
