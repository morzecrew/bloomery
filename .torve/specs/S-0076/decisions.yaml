# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: LOCKED
    text: >-
      **A zone is declared, never inferred.** Not from the column name, not from a
      project default, not from the values. An inferred zone is indistinguishable
      from a declared one once written down, and the failure it produces is a five-hour
      shift with full compiler blessing. Locked because every cheaper alternative
      is a way of making the wrong answer easier to reach than today.
    paths:
      - src/bloomery/semantic/denomination.py
      - src/bloomery/spec/mapping.py
      - src/bloomery/transforms/_builtins.py
      - src/bloomery/typing/types.py
      - tests/fixtures/semantic_corpus/011-timezone-boundary/**
  - id: D-2
    grade: LOCKED
    text: >-
      **The declaration lives on the mapping, beside `currency_in:`** — not on the
      canonical field. A canonical field is shared across mappings and two feeds may
      run on two clocks, which is exactly the argument S-0066/D-6 made for currency;
      the shape is identical, so the answer is not re-derived.
    paths: [src/bloomery/spec/mapping.py]
  - id: D-3
    grade: LOCKED
    text: >-
      **`zone_in: UTC` is a declaration, not a no-op.** A feed whose wall clocks really
      are UTC says so. Today that claim is made by silence and silence cannot be checked;
      the key's only job is to turn an unfalsifiable default into a sentence somebody
      wrote.
    paths:
      - src/bloomery/semantic/denomination.py
      - src/bloomery/spec/mapping.py
      - src/bloomery/transforms/_builtins.py
      - src/bloomery/typing/types.py
      - tests/fixtures/semantic_corpus/011-timezone-boundary/**
  - id: D-4
    grade: ASSUMED
    text: >-
      **`to_utc`'s argument is the declaration for a converting source; no second
      key restates it.** A rollup lists what it keeps or what it drops and never both,
      because two statements of one fact disagree — and here the disagreement would
      be two zones, one used and one read by a human. Not `LOCKED`: it is a well-argued
      preference rather than a decision other work rests on, and the symmetric design
      — `zone_in:` required everywhere, cross-checked against the chain — stays buildable.
      Departing means the cross-check in §5.2 proves unimplementable over the transform
      chain, which would make the redundancy unchecked and therefore the thing this
      row is avoiding.
  - id: D-5
    grade: ASSUMED
    text: >-
      **R018 fires where a timestamp's *absolute position is consumed*** — a time
      dimension, a comparison against a literal instant, an as-of anchor — not at
      every use and not only at a dimension. Case 011 fails at the *second* site:
      its metric compares `placed_at` to a literal, and the mart's date role is incidental.
      A rule scoped to dimensions would pass that fixture for a reason unrelated to
      why it is wrong, and miss the same bug in a project with no `flatten:`. Departing
      means the third site turns out to be R004's — §10's first question.
  - id: D-6
    grade: ASSUMED
    text: >-
      **`to_utc` stays the only conversion and is not changed.** This RFC adds a declaration
      and a check around the existing door rather than a second door. Departing would
      mean the check cannot be expressed over the current transform vocabulary, which
      nothing so far suggests.
  - id: D-7
    grade: ASSUMED
    text: >-
      A step output needs no zone declaration. R018 reads only mapping chains, and
      a column that no chain passed through `parse_ts` discharges as `DERIVED`, since
      it was never a wall clock. A step emitting a wall clock is a known hole; a zone
      surface on `steps:` is S-0034's question.
    fingerprint: cc6a90c1436ed1c2/202c11f3690cefb1
  - id: D-8
    grade: ASSUMED
    text: >-
      The refusal is its own class, `UndeclaredZone`, not a reuse of R009's undeclared-currency
      refusal: that one refuses a conversion and this one refuses a consumption, and
      the repair names `zone_in:` or `to_utc` rather than a currency.
    fingerprint: 8c3b75d8da0e0a44/202c11f3690cefb1
  - id: D-9
    grade: ASSUMED
    text: >-
      R018 decides a comparison against a literal instant over the IR expression:
      `_pinned_columns` walks a metric's whole `expr` tree for `=`, `!=`, `<`, `<=`,
      `>`, `>=` or `BETWEEN` whose operands hold an entity column beside a string
      literal or a literal cast to `TIMESTAMP`; a metric `filter` on an entity column
      is the same site
    paths:
      - src/bloomery/guardrails/zone.py
      - tests/unit/test_guardrails/test_zone.py
      - tests/fixtures/semantic_corpus/011-timezone-boundary/**
    consequence: >-
      The rule's surface is the one the design claims, corpus case 011's zoneless
      arm is refused with `UndeclaredZone` at its comparison, and two columns compared
      with each other never fire
    rationale: >-
      The `zone.py` docstrings record the two choices that make the walk reliable:
      the whole tree, because case 011's comparison sits two levels inside a `CASE`,
      and a column looked for inside each operand, because a cast column compared
      to a literal is the same bug (PR #126)
    cites: [D-5]
  - id: D-10
    grade: ASSUMED
    text: >-
      R018 does not reach a timestamp parsed inside a catalog recipe: a recipe fills
      no transform chain, so the column's empty chain discharges it as never a wall
      clock and no `zone_in:` is asked of the mapping. `test_a_recipe_that_parses_a_timestamp_is_not_reached_by_r018`
      pins the hole, so closing it is a deliberate change
    paths:
      - src/bloomery/guardrails/zone.py
      - tests/unit/test_guardrails/test_zone.py
    consequence: >-
      A project whose recipe casts wall-clock text to a timestamp compiles without
      a zone refusal, and whoever closes the hole needs a declaration site on the
      catalog side first
    rationale: >-
      The test's docstring records the choice: the parse lives in the catalog, where
      there is no `zone_in:` to write, and refusing it would be a refusal no author
      could satisfy
    cites: [D-7]
