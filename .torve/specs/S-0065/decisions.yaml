decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) "Aggregate marts" and Cube
      `pre_aggregations` are **one feature**, scheduled once. The ceiling review named
      it twice, and building it twice is the failure this row exists to prevent.
  - id: D-2
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) Blocked on S-0017 and S-0054.
      A rollup's safety is a functional-dependency question over an aggregation class,
      and both are those RFCs' vocabulary. Building first means inventing it worse
      and then owning two.
  - id: D-3
    grade: LOCKED
    text: >-
      No hand-authored `additive_over:` escape hatch, at any point. It is an assertion
      nothing checks, it would be introduced as temporary, and it would become a second
      source of truth that disagrees with the proof.
    paths: [src/bloomery/semantic/rollup.py]
  - id: D-4
    grade: ASSUMED
    text: >-
      A rollup states the dimensions it **keeps**; what it drops is derived. Stating
      both is two statements of one fact.
    paths: [src/bloomery/semantic/rollup.py]
  - id: D-5
    grade: LOCKED
    text: >-
      An unprovable rollup is **refused**, never warned about. A rollup is read instead
      of the detail table, so a wrong one answers quickly and plausibly — the class
      this project refuses rather than approximates.
    paths:
      - src/bloomery/cli/render.py
      - src/bloomery/emit/sqlmesh/__init__.py
      - src/bloomery/errors.py
      - src/bloomery/evidence.py
