  - id: D-6
    grade: ASSUMED
    text: >-
      The acceptance evidence is S-0056's semantic bug corpus plus an execution-tier
      comparison against the same request computed from silver. A golden proves nothing
      here.
    paths: [tests/execution/test_rollup.py]
  - id: D-7
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) Cube-to-cube `joins` stay
      out of this RFC. They reintroduce the query-time joins the wide-mart design
      removes — the position S-0030/D-3 states for MetricFlow semantic models, reached
      independently for Cube rather than inherited from it. Cube's own refusal is
      unwritten, and writing it belongs with whatever RFC takes Cube's surface.
  - id: D-8
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **No plan transformation
      may merge two aggregate branches before aggregation without proving the merge
      preserves every measure's grain.** Inherited from S-0055/cost-is-secondary-to-soundness
      and §10, readable at `654d93e`: that document stated the rule and asked for
      a property test constructing such a partition and asserting the merge is refused.
      Neither was built, because the optimization pass §9 deferred it to does not
      exist. Parked here rather than dropped at S-0055's retirement, because this
      is the live document holding a preservation obligation (§5.2) and the two are
      one shape — a transformation is legal only when it can show the aggregate it
      produces is the one the detail would have produced. It is **not** a rollup-mart
      decision and does not gate this feature: it transfers to whatever document builds
      a `SemanticPlan` optimization pass, which owes §6's inherited test with it.
      `LOCKED` because a merge without the proof is silent double counting, which
      this sequence refuses rather than approximates. Recorded at S-0055's retirement
      — see `81df8cc`.
  - id: D-9
    grade: ASSUMED
    text: >-
      A rollup is a `Mart` carrying `rollup_of:`, **not a distinct spec kind** — §10's
      first question. It reuses `measures`, `partition_by`, `materialization`, `assert:`
      and `cost_hint` unchanged, and the deciding half is that `measure_owners` already
      arbitrates between marts; a second kind would have to be taught that arbitration
      again, and row 14 is the arbitration this feature actually needs. "Stops a rollup
      being mistaken for a mart in every place that iterates marts" is a predicate
      on the node, not a second kind.
  - id: D-10
    grade: ASSUMED
    text: >-
      **Rollups do not chain**: `rollup_of:` names a mart that is not itself a rollup,
      and a chain is refused — §10's second question. The obligation composes; its
      *premise* does not. Row 12 rests the grain half on R008, a measure embedded
      in a mart at that mart's grain, and a rollup's measures do not originate at
      the rollup's grain — they arrive there. Restating that premise is a phase of
      its own, and one refusal is cheaper than a wrong composition.
    paths:
      - src/bloomery/resolve/graph.py
      - src/bloomery/resolve/timeline.py
      - src/bloomery/spec/marts.py
  - id: D-11
    grade: ASSUMED
    text: >-
      **Kept dimensions are declared under their own key, never `grain:`.** Supersedes
      §5.1's spelling; D4's substance stands. `Mart.grain` names an entity and the
      mart builder refuses it unless it equals `base:` (S-0027/D-2, `marts/flatten.py`),
      so §5.1's `grain: [ordered_month, customer_segment]` puts a column list and
      an entity name under one key. A rollup declares `rollup_of:` and `keep:`, and
      declares neither `base:` nor `grain:`.
  - id: D-12
    grade: ASSUMED
    text: >-
      **The grain half of §5.2's obligation is discharged by R008, not by R006.**
      §5.2 calls it a functional-dependency question, written before the source was
      a mart. `GrainRef` admits only entity *key* columns — `_unknown` in `semantic/closure.py`
      refuses every other determinant — and a rollup's target is a set of mart columns,
      of which `customer_segment` is not a key and a date-role bucket like `ordered_month`
      is not an entity column at all. Nothing needs re-deriving: every column of a
      mart is determined by that mart's grain, so grouping by a subset partitions
      rows the mart already proved. What is left is the aggregation-class question,
      which is the whole of R013.
    paths:
      - src/bloomery/semantic/proof.py
      - src/bloomery/semantic/rollup.py
      - tests/unit/test_semantic/test_rollup.py
  - id: D-13
    grade: ASSUMED
    text: >-
      **Superseded by 15.** **P1 admits `additive`, and `ratio` when both operands
      are carried by the rollup and each is itself admitted.** `semi_additive`, `distinct_count`
      and `non_additive` are refused, each under its own reason naming its own repair.
      Phase-scoped, and written as a row so no reader takes it for permanent: a semi-additive
      measure rolled to a coarser bucket is a `first`/`last` selection rather than
      a sum, which is a computation this phase does not build. Not an escape hatch
      — D3 stands, and none of the three becomes admissible by declaring anything.
    paths: [src/bloomery/semantic/rollup.py]
  - id: D-14
    grade: ASSUMED
    text: >-
      (Locked in the RFC; no file in the tree cites it.) **A rollup mart is never
      a measure owner and never a covering mart.** §4 makes query-time rollup selection
      S-0054's job and nothing in the code knows it: `measure_owners` picks the cheapest
      mart serving a measure, a rollup is by construction the cheapest, and so the
      first rollup declared would take detail-grain requests silently and answer them
      from monthly totals — quickly, plausibly and wrongly, which is the class §2
      gives as the reason this feature is the one where being wrong is worst. `LOCKED`
      because reversing it is not a scheduling call: it is the planner learning to
      choose, and that is a different document's work.
  - id: D-15
    grade: ASSUMED
    text: >-
      **Supersedes 13**, which execution corrected in two places (see `logs/T-0033.md`
      (`logs/T-0033.md`)). P1 admits `additive`, and `ratio` when the rollup carries
      both operands and each is itself **additive** — not "itself admitted", as 13
      read: an operand that is a ratio sends the obligation back through the same
      question and nothing in the spec layer forbids two ratios naming each other,
      so the wider word had no termination argument, and additive operands are the
      only ones R011 grants anyway. Refused: `semi_additive`, `non_additive`, `distinct_count`
      **and `snapshot`** — 13 omitted the last because `SNAPSHOT` is not in `RESOLVABLE`
      and no project can mint one, which is a reason for the mapping to carry it for
      totality and not a reason for the row to read as a shorter list than the code.
      Phase-scoped as 13 was, and not an escape hatch: D3 stands, and none of the
      four becomes admissible by declaring anything.
  - id: D-16
    grade: ASSUMED
    text: >-
      **The degenerate groupings are refused, and the degenerate repeat is not** (see
      `logs/T-0033.md` (`logs/T-0033.md`)). A rollup keeping *no* dimension, one keeping
      a column the mart does not have, one keeping *every* column, and a mart carrying
      no measure are all refused. The first and the last would otherwise be **proved**,
      because a reduction over an empty set grants everything and a proof resting
      on nothing is what S-0005/D-1 refuses. The third would be proved *truly* — re-aggregating
      over nothing is sound — and is refused anyway: §1 defines a rollup as coarser
      than what it derives from, and answering yes would authorize a duplicate gold
      table that costs storage and answers nothing faster. A dimension named twice
      is one grouping stated twice and is canonicalized, the way `RollupContext` already
      treats a repeated as-of anchor.
