        before: >-
          What to emit for a project with a partitioned entity and no catalog date
          dimension: config with the key commented and the consequence named, no config
          at all, or a refusal. §5.3 states all three and ranks none. The case is
          narrow — a partitioned silver entity in a project with no marts — which
          is why it is delegated rather than settled here.
        after: >-
          A project that backfills by time and declares no catalog date dimension
          gets no `config.yaml`. `_config_artifact` returns `None` rather than a file
          missing `model_defaults.start`, because a config whose absent start lets
          `sqlmesh plan` succeed over one day is worse than no config.
