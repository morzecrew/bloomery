# yaml-language-server: $schema=../../schemas/decisions.json
decisions:
  - id: D-1
    grade: ASSUMED
    text: >-
      Resolution builds a single dependency DAG over source columns (JSONPath refs),
      mapped entity fields, catalog canonical fields + recipes, and metrics including
      `requires_metrics` metric-on-metric edges. One graph feeds reachability, cycles,
      topo order, and the guardrails (S-0023) — no parallel structures that can disagree.
    paths: [src/bloomery/resolve/graph.py, src/bloomery/resolve/reach.py]
  - id: D-2
    grade: ASSUMED
    text: >-
      The compiler never chooses a recipe. The mapping's recorded `recipe:` id is
      validated — id exists on the catalog field, every `requires` name bound by the
      mapping's `from` aliases (exactly) — else `ResolutionError`. Choice happens
      upstream; the compiler reproduces it (determinism + auditability, spec §3.4).
      Consequence: catalog evolution can invalidate recorded choices, and that is
      a loud error, not a silent re-choice.
    paths:
      - src/bloomery/evidence.py
      - src/bloomery/guardrails/operands.py
      - src/bloomery/resolve/recipes.py
      - src/bloomery/resolve/resolution.py
      - src/bloomery/spec/catalog.py
      - src/bloomery/spec/mapping.py
      - tests/golden/schema/catalog.json
      - tests/golden/schema/mapping.json
      - tests/unit/test_resolve/test_edge_shapes_offcorpus.py
      - tests/unit/test_resolve/test_recipes.py
  - id: D-3
    grade: ASSUMED
    text: >-
      A canonical field is available iff some mapped field links to it via `canonical:`
      with a direct mapping or validated recipe. A metric is reachable iff every leaf
      of its `requires`/`requires_metrics` closure is available; unreachable metrics
      report the specific missing leaves and are stored in the IR (S-0020/D-6) as
      product-facing output.
    paths:
      - src/bloomery/evidence.py
      - src/bloomery/ir/nodes.py
      - src/bloomery/resolve/reach.py
      - tests/unit/test_evidence.py
      - tests/unit/test_unresolved.py
  - id: D-4
    grade: ASSUMED
    text: >-
      Any cycle in the DAG raises `CircularDerivation` (a `ResolutionError` subclass)
      naming the full cycle path, rotated to the lexicographically smallest node for
      stable messages.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/resolve/order.py
      - tests/unit/test_resolve/test_order.py
  - id: D-5
    grade: ASSUMED
    text: >-
      Emission order is a topological sort with ties broken lexicographically by node
      name — implemented once in resolve; all consumers take the order from `Resolution`.
      This is the package's main determinism hazard, contained here.
    paths:
      - src/bloomery/resolve/order.py
      - tests/unit/test_resolve/test_resolution.py
  - id: D-6
    grade: ASSUMED
    text: >-
      `Resolution` = reachable metrics, unreachable metrics + reasons, per-field provenance
      (`direct` | `recipe:<id>` | `tenant-native`), topo order — all tuples, explicitly
      sorted. `resolve(project, catalog)` is a pure function, no I/O, and public API.
    paths:
      - src/bloomery/resolve/resolution.py
      - tests/unit/test_resolve/test_resolution.py
  - id: D-7
    grade: ASSUMED
    text: >-
      All cross-spec reference validation lives here, not parse (S-0019/D-4): mapping
      targets, `canonical:` links, relationship endpoints, metric template refs. All
      failures are `ResolutionError`s with source paths, batched per stage; later
      checks run only on a reference-clean graph.
    paths:
      - src/bloomery/errors.py
      - src/bloomery/resolve/refs.py
      - tests/unit/test_resolve/test_refs.py
  - id: D-8
    grade: ASSUMED
    text: >-
      `Graph` is two sorted tuples — `nodes` by name, `edges` by (src, dst, label)
      — with no stored adjacency; a consumer such as `order.py` builds its own successor
      and predecessor maps from `edges`. `validate_references` runs one pass per concern
      into a shared error list and raises once, as the single failure or a `ResolutionError`
      aggregate
    paths:
      - src/bloomery/resolve/graph.py
      - src/bloomery/resolve/refs.py
      - tests/unit/test_resolve/test_graph.py
      - tests/unit/test_resolve/test_refs.py
    consequence: >-
      A new reference check is one more pass appending to the shared list, and a traversal
      that needs adjacency derives it locally rather than adding an index to `Graph`
    rationale: >-
      Settled at implementation: sorted tuples keep the graph a deterministic, comparable
      value (`test_graph_collections_are_sorted`), and per-concern passes feeding
      one list still batch across kinds as `test_reference_failures_are_batched_across_kinds`
      requires
    cites: [D-1, D-7, S-0020/D-4]
  - id: D-9
    grade: ASSUMED
    text: >-
      A ratio's `numerator` and `denominator` are unioned into `requires_metrics`
      by the template merge, as derived inputs are under S-0050/D-3, and the reference
      stage checks each operand names a metric (`metrics.<name>.ratio.<operand>`)
      before the merge reads it
    paths:
      - src/bloomery/resolve/metrics.py
      - src/bloomery/resolve/refs.py
      - tests/unit/test_resolve/test_metrics.py
      - tests/unit/test_resolve/test_refs.py
    consequence: >-
      `lineage()` walks from a ratio to its operands, and `depends_on`, reachability
      and `plan().downstream_impact` follow them, without an author repeating the
      operands in `requires_metrics`; a ratio whose operand is unreachable is itself
      unreachable, and a typo'd operand is a `MissingReference` where before it compiled
      clean
    rationale: >-
      The operands are metric names the spec already declares, and every fixture and
      doc example repeated them in `requires_metrics` to get the edges; a project
      that did not had no path from a ratio to anything (#330). D-1's one graph is
      what lineage, reachability and the plan read, so the union belongs at the merge
      rather than in each reader
    cites: [D-1, D-3, D-7, S-0050/D-3]
  - id: D-10
    grade: ASSUMED
    text: >-
      A metric's `expr` is written over its `requires:` canonicals, and the IR build
      binds each to the grain entity's column that links it where the two are spelled
      differently, so the emitted expression reads the mart's column. A canonical
      no grain column links, or two do, is left as written. The units guard looks
      a bound column up as its canonical. `plan()` and `timeline` compare a metric
      unbound, in the spelling it was authored in
    paths:
      - src/bloomery/ir/lower.py
      - src/bloomery/resolve/build.py
      - src/bloomery/guardrails/arithmetic.py
      - tests/unit/test_resolve/test_canonical_binding.py
      - src/bloomery/plan/diff.py
      - src/bloomery/resolve/timeline.py
    consequence: >-
      A catalog template works for a project whose field is spelled otherwise, the
      case `canonical:` links exist for: `unit_price * quantity` over a field `qty`
      emits `unit_price * qty`, and S-0034/D-49's step-output link counts `canonical_id`
      rather than a `customer_ref` the mart lacks. `MetricIR.expr` moves only where
      a spelling differs, so those projects re-fingerprint once; a field renamed under
      a metric respells it and does not restate it, as S-0024's v2 to v3 case requires
    rationale: >-
      Nothing bound the names, and every emitter takes the expression verbatim, so
      the semantic layer queried a column the mart did not have: compiled clean, failed
      at query time (#338). The grain entity's columns carry each link, the step-wired
      ones included, and a measure's mart keeps their names. The units guard keyed
      its lookup by canonical, so a bound column would have been invisible to it and
      money beside a count would have passed
    cites: [D-3, S-0034/D-49, S-0023/D-3]
  - id: D-12
    grade: ASSUMED
    text: >-
      A canonical a metric requires that a joined entity's column links, rather than
      a grain column, is bound per mart and not in the IR. Where a mart flattens that
      column, the expression the mart's measure, rollup and plan explanation read
      names the one mart column flattened from it, under that mart's prefix. The IR
      keeps the canonical. D-10's rules carry over: a date bucket is not such a column,
      a canonical two columns could stand for is left as written, and so is one whose
      column is spelled as a name the expression reads. The measure check of S-0050/D-16
      reads the same bound expression, so a mart that does not flatten the column is
      refused by name
    paths:
      - src/bloomery/ir/lower.py
      - src/bloomery/guardrails/metrics.py
      - src/bloomery/emit/metricflow/__init__.py
      - src/bloomery/emit/cube/__init__.py
      - src/bloomery/emit/lower/rollups.py
      - src/bloomery/planner/explain.py
      - tests/unit/test_guardrails/test_per_unit_parent.py
    consequence: >-
      A template can name a parent's canonical, and two marts that flatten the parent
      under different prefixes each read their own column from one definition. The
      IR, every fingerprint and `plan()` are unchanged, because the binding happens
      after them. The planner's declared type for a bare-column measure still reads
      the expression as the IR has it, so a bare per-unit canonical gets the wide
      decimal it gives any expression
    rationale: >-
      #366. A metric's `expr` is one string, and the prefix belongs to each mart's
      flatten, so a binding in the IR would fit one mart and break another. The owner
      chose to bind at emit, per mart (2026-10-29). The grain's own columns stay with
      D-10, including the bindings it declines, because a binding that D-10 declined
      for being ambiguous must not be made one stage later
    cites: [D-10, S-0050/D-16, S-0023/D-15]
