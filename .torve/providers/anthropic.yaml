# yaml-language-server: $schema=../schemas/provider.json
# Anthropic, reached on a Claude Code subscription token (S-0064/D-1). This
# host's egress to it is region-blocked without one, so the runner's own
# upstream leg tunnels through the host's https_proxy; the sandbox never sees
# a proxy either way.
name: anthropic
key_env: CLAUDE_CODE_OAUTH_TOKEN
via_proxy: true

routes:
  anthropic:
    base_url: https://api.anthropic.com

models:
  # The vendor's published figures, not measured here. No `price`: this seat
  # runs on a subscription and has no per-token cost, so the attempt's cost is
  # unreported rather than priced off a rate card nobody is billed by
  # (S-0064/D-12).
  claude-opus-5:
    context_window: 200000
    max_tokens: 32000
  # The seat moved here on 2026-09-28. The two figures are carried over from
  # claude-opus-5 rather than read off a vendor page: the claude seat's image
  # reads neither (only the dsh seat's overlay does), so they are the record's
  # and not the attempt's until someone replaces them with the published ones.
  claude-opus-5-5:
    context_window: 200000
    max_tokens: 32000
