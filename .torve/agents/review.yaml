# yaml-language-server: $schema=../schemas/agent.json
# Declared, never read off the filename (S-0061/D-13): `review` is an ordinary
# word, and a seat's own profile that happened to be called this used to become
# the role's default for every seat in the repository.
role: review
equipment:
- kind: skill
  source: torve:working-rules
- kind: skill
  source: torve:ratchet-what-you-build
# Re-declared where the role wants it (S-0066/D-2): `readable-code` names
# `review` among its own roles, and a reviewer reading a diff for names,
# nesting and comments is the seat it was written for. What the door dropped
# instead of re-declaring is recorded once, in `implement.yaml`.
- kind: skill
  source: local:.claude/skills/readable-code
