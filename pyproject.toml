[project]
name = "bloomery"
dynamic = ["version"]
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Development Status :: 2 - Pre-Alpha",
]
description = "Entity-first spec compiler: declarative entity/mapping/metric specs → SQLMesh, dbt, and Cube artifacts"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Lev Litvinov", email = "misery7100@gmail.com" }]
maintainers = [{ name = "Lev Litvinov", email = "misery7100@gmail.com" }]
keywords = [
    "analytics",
    "compiler",
    "cube",
    "data-engineering",
    "dbt",
    "semantic-layer",
    "sqlglot",
    "sqlmesh",
]

# ....................... #
# Dependencies

dependencies = [
    "jinja2>=3.1",
    "metricflow==0.211.*",
    "pydantic>=2.9",
    "pyyaml>=6",
    # Exact-pinned in uv.lock; the metadata bound tracks one major so a sqlglot
    # bump is always a deliberate event that regenerates goldens in a dedicated
    # PR (RFC 0003 D2 §5.5). The floor is the newest sqlglot the dev group's
    # sqlmesh pin admits (sqlmesh constrains sqlglot to a narrow band), so the
    # lockfile stays co-resolvable with the e2e target it must round-trip through.
    "sqlglot>=30.8.0,<31",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    # The range the emitted dbt project is claimed to work across (RFC 0008
    # D22), not merely what the e2e tier happens to resolve. The floor is
    # 1.10.8 because that is where generic-test `arguments` nesting stops
    # needing the `require_generic_test_arguments_property` behaviour flag —
    # measured, not read off a changelog: 1.10.7 refuses the emitted
    # `schema.yml` and 1.10.8 accepts it. The emitted form and this bound move
    # together or not at all.
    # Upper-bounded for the same reason sqlmesh and metricflow are: a major
    # that changed what a `schema.yml` may say would turn the tier red with no
    # bloomery change.
    "dbt-core>=1.10.8,<2",
    "dbt-duckdb>=1.9,<2",
    "deptry>=0.23",
    "duckdb>=1.1",
    "hypothesis>=6.130",
    "import-linter>=2.3",
    "mypy[faster-cache]>=2.3.0",
    "pre-commit>=4.1",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-mock>=3.14",
    "pytest-snapshot>=0.9",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "radon>=6.0.1",
    "ruff>=0.11",
    "sqlmesh>=0.150",
    "types-pyyaml>=6.0.12",
    "vulture>=2.14",
    "zizmor>=1.5",
]
# Tier-5 engine matrix (RFC 0009 §5.2): opt-in, needs Docker. Kept out of `dev`
# so the default sync stays light on machines without Docker.
engines = [
    "psycopg[binary]>=3.3.4",
    # Trino's client and container. RFC 0009 §5.2 sketches this cell as
    # "trino+iceberg+minio (compose)"; the memory connector is enough for what
    # bloomery actually asserts there — it emits SELECTs and models, never
    # storage-format DDL, so an object store and a table format would be three
    # more moving parts serving no assertion (D24).
    "trino>=0.330",
    # `[postgres,trino]` supersedes main's `[postgres]`: the Trino tier needs
    # the container class as well as the client.
    "testcontainers[postgres,trino]>=4.15.0",
]
docs = [
    "mike",
    "pygments>=2.19",
    "pymdown-extensions>=10.14",
    "zensical>=0.0.43",
]

[tool.uv.sources]
# Zensical's mike fork (no PyPI release). Pin the exact commit: an unpinned git
# source tracks the default branch's HEAD, so any later `uv lock` (e.g. bumping
# another dep) would silently re-resolve mike — a docs-build change with no diff
# in this file. Bump deliberately by updating the rev. (== the current uv.lock.)
mike = { git = "https://github.com/squidfunk/mike", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" }

# ....................... #

[project.urls]
homepage = "https://github.com/morzecrew/bloomery"
documentation = "https://morzecrew.github.io/bloomery/"
changelog = "https://github.com/morzecrew/bloomery/blob/main/CHANGELOG.md"

# ....................... #
# Build

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "pyproject.toml",
    "README.md",
    "uv.lock",
    "tests",
    "CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bloomery"]

[tool.hatch.build.hooks.vcs]
version-file = "src/bloomery/_version.py"

# ....................... #
# Pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src", "tests"]
addopts = ["--tb=short", "--strict-markers", "--strict-config"]
# Safety net: no test may hang the run indefinitely. On timeout, dump all thread
# stacks and kill the process (the `thread` method guarantees the run can't
# stick). Generous enough for container startup on a cold runner (engine tier).
timeout = 300
timeout_method = "thread"
# Six tiers, fastest first (RFC 0009 D1): `just test` runs unit/golden/property/
# execution; engine and e2e are opt-in (Docker), perf is reserved.
markers = [
    "unit: Tier 1 — pure unit test, milliseconds, mirrors src/bloomery",
    "golden: Tier 2 — checked-in artifact snapshot per (fixture × target × dialect)",
    "property: Tier 3 — Hypothesis property test over generated valid projects",
    "execution: Tier 4 — in-process DuckDB execution of compiled SQL",
    "engine(name): Tier 5 — testcontainers engine matrix; requires Docker; opt-in",
    "e2e: Tier 6 — target-framework acceptance (sqlmesh/dbt/cube); opt-in",
    "chaos: Mutation meta-test — deforms the lowering and requires the M12 quality battery to notice (RFC 0016 §6); opt-in, runs pytest in a subprocess",
    "perf: Performance benchmark — bench lane (tests/bench), excluded from `just test`, scheduled CI (RFC 0009 §5.9, RFC 0014)",
]

# ....................... #
# Coverage

[tool.coverage.run]
source = ["src"]
branch = true
# Relative paths so data files combine cleanly across CI matrix jobs.
relative_files = true
omit = [
    "*/tests/*",
    "*/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
sort = "cover"
precision = 1
# Global floor: enforced in CI (see .github/workflows/ci.yml). The 100% branch
# floor for bloomery/guardrails/ (RFC 0009 D9) is enforced by `just coverage`
# (a scoped `coverage report --fail-under=100` over src/bloomery/guardrails/) —
# a thin new module must not hide behind the well-covered core.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    # ``@overload`` stubs (and their ``...`` bodies) are type-checker-only: the
    # runtime impl follows them, so they are never executed. Excluding them keeps
    # branch coverage honest instead of penalizing typed overloaded signatures.
    "@overload",
    "@(typing\\.)?overload",
    "^\\s*\\.\\.\\.$",
    # Inline ellipsis stub bodies (``def f(...) -> T: ...``, including the closing
    # line of a multi-line signature) are the same type-checker-only stubs as the
    # own-line ``...`` above. The formatter collapses Protocol/overload bodies to
    # this inline form, so match the terminating ``: ...`` to keep branch coverage
    # honest for inline-stub Protocols.
    ": \\.\\.\\.\\s*$",
]

# ....................... #
# Mypy configuration

# metricflow / metricflow_semantics / metricflow_semantic_interfaces all ship
# py.typed, so strict mode checks our usage against their real signatures —
# no overrides needed (verified at the 0.211.* pin); the canary test
# (RFC 0013 D11) guards the runtime surfaces the checker cannot.
[tool.mypy]
strict = true
# Excluded for the same reason as ruff's `tests` entry: the gate runs
# `mypy "src"`, and this keeps a bare `mypy .` from disagreeing with it.
# mypy's `exclude` is a regex over paths and does not apply to files named
# explicitly on the command line.
exclude = ["^tests/"]

# ....................... #
# Import contracts
#
# The compiler's layering, made mechanical (RFC 0001 D5, spec §10): emitters
# consume IR, never specs; the spec layer knows nothing internal but errors.
# Every layer is optional (parenthesised) until its module lands — the contract
# is authored before the code so the code arrives through the gate.

[tool.importlinter]
root_packages = ["bloomery"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
# M2/M3 reordering (RFC 0004): `transforms` sits above `typing` because a
# TransformSpec's input domain and output-type functions need the LogicalType
# classes at runtime; the typecheck stage consumes the registry by parameter
# only (TYPE_CHECKING imports, excluded from the contract). `naming` sits just
# below the emit side (RFC 0008: EmitContext carries the policy; it reads only
# `Layer` from the IR). `compile` is the thin orchestration top that may see
# both specs and emitters.
# M4 reordering (RFC 0006 §5.1): `guardrails` sits *below* `resolve` because
# the stage is invoked from `build_project_ir`'s seam — resolve consumes the
# guardrail stage, while the stage itself reads only ir/typing/spec/errors
# (spec models at runtime for recipe/assert clauses; never resolve).
# M5 (RFC 0010 D6): `marts` sits below `guardrails` because the stage batches
# the flattener's mart-level violations into its aggregate (guardrails →
# marts), while `resolve` consumes the flattened MartIRs directly (resolve →
# marts); the flattener itself reads only ir/typing/spec/errors.
# M6 (RFC 0013 §5.3, RFC 0014 §layering): `runtime` is request-time planner
# infrastructure (the render-only SqlClient), not a compile stage — it sits as
# an independent *sibling* of `compile` in the top layer, so the compile path
# can never import runtime and runtime can never import the compile
# orchestration (siblings in one layer are mutually independent). It reads
# the lower layers it hydrates from: emit.metricflow (the manifest build
# path, M8), ir (fingerprint), naming, errors.
# M7 (RFC 0013 §5.1): `planner` is the request-time orchestration top — it
# consumes runtime (hydrator + render-only client), emit.metricflow (the
# shared measure-ownership rule), ir, marts (the date-bucket vocabulary),
# naming, and errors. It sits *above* the compile|runtime layer: nothing in
# the compile path can import the planner, and the runtime/compile sibling
# isolation below is unchanged — `planner → runtime` is a downward edge,
# while `compile ↛ runtime` and `compile ↛ planner` stay forbidden.
# M13 (RFC 0017 §5.3): `steps` sits just above `typing` and below `transforms`.
# It needs `typing` (a manifest's `produces` carries logical types) and `spec`
# (the frozen SpecModel base), and nothing else — deliberately, because
# `steps.contract` is imported by *generated code* at target runtime, where
# dragging the compile pipeline in behind it would be a packaging bug. Every
# consumer is above it: resolve/guardrails lower manifests into `StepIR`, and
# the emit side reads only that IR (the forbidden contract below is unchanged
# — a step emitter never touches the manifest models).
# M12 (RFC 0016 §5.9): `quality` is the run-time-rule *lowering* package —
# spec blocks to IR nodes, IR nodes to dialect-neutral ASTs. It sits between
# `guardrails` and `ir` because both of its consumers are above it: the
# guardrail stage batches the data-quality refusals (guardrails → quality),
# `resolve` lowers the spec blocks into the IR (resolve → quality), and the
# emit side renders the predicates (emit → quality). `dialects` moves down to
# just above `transforms` in the same change: the port reads only
# `typing`/`errors`, and RFC 0016 §5.3 requires `pattern` rules to be
# validated against **every registered dialect at compile time** — a
# compile-stage need for the registry that the old placement (a sibling of
# `emit`, above `resolve`) made unreachable. Nothing else moves: `emit` and
# `compile` still sit above `dialects`, and the "emitters never import the
# spec layer" contract below is unaffected.
name = "Layered bloomery compile pipeline"
type = "layers"
layers = [
    "(bloomery.planner)",
    "(bloomery.compile) | (bloomery.runtime)",
    "(bloomery.emit)",
    "(bloomery.naming)",
    "(bloomery.plan)",
    "(bloomery.resolve)",
    "(bloomery.guardrails)",
    "(bloomery.quality)",
    "(bloomery.marts)",
    "(bloomery.ir)",
    "(bloomery.dialects)",
    "(bloomery.transforms)",
    "(bloomery.steps)",
    "(bloomery.typing)",
    "(bloomery.spec)",
    "(bloomery.errors)",
]

[[tool.importlinter.contracts]]
# The layers contract above allows any higher layer to reach any lower one, so
# it alone would permit an emitter to read specs. This closes that hole: the
# emit side consumes IR, never the spec layer — "emitters consume IR, not
# specs" is the whole point of having an IR. Direct imports only: the type
# layer legitimately shares the spec grammar constant (typing → spec.common,
# RFC 0002 §5.5), so every emit-side module transitively reaches `spec`
# through ir → typing; the property worth enforcing mechanically is that no
# emitter reads spec *models*, i.e. no direct import.
name = "Emitters never import the spec layer"
type = "forbidden"
source_modules = ["bloomery.emit", "bloomery.dialects"]
forbidden_modules = ["bloomery.spec"]
allow_indirect_imports = true

# ....................... #
# Dead code

[tool.vulture]
paths = ["src/bloomery"]
sort_by_size = true
min_confidence = 80

# ....................... #
# Maintainability and complexity

[tool.radon]
exclude = ["tests/**"]
cc_min = "C"
mi_min = "B"

# ....................... #
# Security

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# ....................... #
# Dependency analysis

[tool.deptry]
known_first_party = ["bloomery"]
ignore_notebooks = true
# The M4.5 verification spikes (spikes/, pivot §8) import MetricFlow from a
# throwaway environment by design — exploratory code outside the package, not
# a dependency surface. Excluded so the quality gate tracks src/ only.
extend_exclude = ["spikes"]

# jinja2 (emit, M2) has landed alongside pydantic/pyyaml (spec, M1) and
# sqlglot (ir, M1); no scaffold-time ignores remain.

# ....................... #
# Ruff configuration

[tool.ruff]
line-length = 100
# hatch-vcs writes _version.py at build/sync time (gitignored) with its own
# quoting style; generated code is not ours to format or lint.
#
# `tests` is excluded so every invocation agrees with the gate: `just quality`
# passes "src" explicitly and the pre-commit hooks scope to ^src/, but a bare
# `ruff check .` (or an editor running one) would otherwise walk the suite and
# report findings CI never sees. Lint and type tooling targets src only — the
# house convention; the trade is that test code carries no lint floor.
extend-exclude = ["src/bloomery/_version.py", "tests"]
# Honour the exclusions even when a path is passed explicitly. Without this,
# `ruff check tests/foo.py` — which is what pre-commit and editor-on-save
# integrations do — lints an excluded file anyway, so the exclusion would hold
# for a tree walk and leak for the two paths people actually hit.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # ruff-specific rules
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "T20", # flake8-print
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is owned by `ruff format` (code is wrapped at 100); the remaining long
    # lines are unwrappable prose — single-token Sphinx :class: refs and
    # `type: ignore`/`nosec` justification comments
    "ISC001", # single-line implicit concat: conflicts with `ruff format`
    "RUF001", # ambiguous unicode: docs deliberately use typographic/math notation (×, −, ∪, –)
    "RUF002", # see RUF001
    "RUF003", # see RUF001
    "RUF022", # __all__ is deliberately grouped by category (mirrors export tables), not sorted
]
