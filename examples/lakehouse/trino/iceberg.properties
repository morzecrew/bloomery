# Trino's Iceberg connector pointed at Lakekeeper's REST endpoint. The
# `warehouse` name is the one bootstrap.sh creates through Lakekeeper's
# management API; the S3 settings are how Trino reaches MinIO directly for the
# data files Lakekeeper's metadata points at.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=demo
iceberg.rest-catalog.vended-credentials-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=local-01
s3.path-style-access=true
s3.aws-access-key=minio-admin
s3.aws-secret-key=minio-admin-password
