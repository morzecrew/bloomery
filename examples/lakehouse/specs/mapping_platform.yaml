# The shop being migrated *onto*. One of two mappings that name
# `target: order_line` — and that is the whole of the syntax for a merge
# (RFC 0024 D2): no `union:` kind, no `sources:` list, just two documents
# pointing at one entity.
#
# Branch order in the emitted UNION ALL is lexicographic by **source relation**,
# not by document name, so this one (`shopify__…`) is unioned first even though
# its file sorts second. That ordering is what makes the artifact byte-identical
# across machines.
#
# This shop emits one nested JSON event per line. The first segment of every
# path below is the physical `payload` column; the rest is JSON extraction off
# it, which is why `$.payload.pricing.line_total_cents` needs no ingester to
# have shredded the event into columns first.
mapping_version: 1
source: shopify__order_lines
target: order_line

key:
  order_id: {from: "$.order_id", transform: [to_string]}
  line_no: {from: "$.position", transform: [to_int]}

fields:
  customer_id: {from: "$.payload.customer.id", transform: [to_string]}
  sku: {from: "$.payload.item.variant_sku", transform: [to_string, trim, upper]}
  quantity: {from: "$.payload.item.quantity", transform: [to_int]}

  # This shop bills in integer cents. `multiply: "0.01"` rather than
  # `divide: 100` because the two are not equivalent everywhere — decimal
  # division promotes to a float on some engines, and money that silently
  # becomes a float is the defect this project bans in its own IR. The factor
  # is quoted because an unquoted YAML `0.01` *is* a float.
  amount:
    from: "$.payload.pricing.line_total_cents"
    transform:
      - {to_decimal: [12, 0]}
      - {multiply: "0.01"}
      - {to_decimal: [12, 2]}

  discount:
    from: "$.payload.pricing.discount_cents"
    transform:
      - {to_decimal: [12, 0]}
      - {multiply: "0.01"}
      - {to_decimal: [12, 2]}

  # Already UTC on this side of the migration.
  ordered_at: {from: "$.payload.created_at", transform: [{parse_ts: ISO8601}]}

  gift_note: {from: "$.payload.gift_note", transform: [to_string]}

# The ingestion-metadata contract (RFC 0016 D21), acknowledged rather than
# mapped — see `mapping_crm.yaml`. **Both** shops must supply it: the reject
# table holds rows from either, and each one points back at the row it came
# from through its own `source_relation`.
unmapped: ["$._ingested_at", "$._load_id", "$._source_row_id"]
