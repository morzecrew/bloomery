# The shop being migrated *away from*. Every field is read from a differently
# named column than the platform shop reads it from — which is the point of the
# merge: one entity, two lowerings per column, one relation out.
#
# The two shops disagree about more than column names, and that is the part
# worth noticing. This one is a flat CSV export rather than nested JSON, it
# bills in decimal currency rather than integer cents, it writes SKUs in lower
# case, and it stamps rows in head-office local time with no zone attached.
# None of that reaches the entity: four different chains land on the same four
# typed columns, and the merged relation cannot tell which shop a row came from
# except through the generated `_source` column.
#
# `gift_note` is simply absent. This shop has no such concept, so its rows carry
# NULL for it.
mapping_version: 1
source: woo__order_lines
target: order_line

key:
  order_id: {from: "$.order_number", transform: [to_string]}
  line_no: {from: "$.item_index", transform: [to_int]}

fields:
  customer_id: {from: "$.buyer_ref", transform: [to_string]}
  sku: {from: "$.product_sku", transform: [to_string, trim, upper]}
  quantity: {from: "$.qty", transform: [to_int]}

  # Already currency, not cents — so no arithmetic, just a cast.
  amount: {from: "$.line_amount", transform: [{to_decimal: [12, 2]}]}
  discount: {from: "$.discount_amount", transform: [{to_decimal: [12, 2]}]}

  # Wall-clock time at head office, stored without a zone — the legacy shop
  # never had a concept of one. `to_utc` is the only door into the always-UTC
  # `timestamp` type: it states which zone the zoneless text was written in, so
  # the two shops' timestamps become comparable instead of merely looking
  # comparable. The platform shop already stamps UTC and needs no such step.
  ordered_at:
    from: "$.placed_at"
    transform:
      - {parse_ts: ISO8601}
      - {to_utc: Europe/Berlin}

# The ingestion-metadata contract (RFC 0016 D21), acknowledged rather than
# mapped — see `mapping_crm.yaml`. **Both** shops must supply it: the reject
# table holds rows from either, and each one points back at the row it came
# from through its own `source_relation`.
unmapped: ["$._ingested_at", "$._load_id", "$._source_row_id"]
