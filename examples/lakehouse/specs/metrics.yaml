# One metric from the vertical catalog's template, two inline, and one derived
# from the others. Every metric declares its grain and its additivity, because
# those are what let a mart be aggregated without being wrong.
metrics_version: 1

metrics:
  revenue:
    template: revenue

  line_count:
    description: Order lines, counted once each.
    grain: order_line
    additivity: additive
    agg: count
    expr: "order_id"

  units:
    description: Items shipped, summed across lines.
    grain: order_line
    additivity: additive
    agg: sum
    expr: "quantity"

  # A ratio is *not* additive: the average of two averages is not the average.
  # Declaring it as a numerator over a denominator is what lets it be
  # re-derived correctly at whatever grain the question is asked at, instead of
  # being averaged from a column that was already averaged — which is also why
  # it is absent from the mart's `measures:`. A non-additive metric is never a
  # stored number.
  average_line_value:
    description: Revenue per order line — recomputed at every grain.
    grain: order_line
    additivity: non_additive
    ratio: {numerator: revenue, denominator: line_count}
