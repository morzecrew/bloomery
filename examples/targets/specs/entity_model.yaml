# One spec set, compiled to three targets. Deliberately plain: no union merge,
# no quarantine, no reconcile — each of those is refused on dbt for a stated
# reason, and this example is about what all three targets *do* support.
spec_version: 1
entities:
  customer:
    grain: one row per customer
    key: [customer_id]
    fields:
      customer_id: {type: string, required: true}
      segment: {type: string}
  order:
    grain: one row per order
    key: [order_id]
    fields:
      order_id: {type: string, required: true}
      customer_id: {type: string, required: true}
      amount: {type: "decimal(12,2)", canonical: amount}
      order_date: {type: date, assert: {not_null: true}}
relationships:
  - name: order_of_customer
    from: order
    to: customer
    via: {customer_id: customer_id}
    cardinality: many_to_one
