# The gold layer: one wide mart at order grain.
#
# Both dimensions are joined in through *declared* relationships rather than
# hand-written joins, and each gets a prefix so `customer_segment` and
# `product_category` cannot collide with anything the base entity already has.
# The date role expands `ordered_at` into ordered_day .. ordered_year buckets —
# the dimensions the planner and Cube both serve requests from.
marts_version: 1

marts:
  orders:
    grain: order
    base: order
    flatten:
      - {via: order_of_customer, prefix: customer_}
      - {via: order_of_product, prefix: product_}
      - {date: ordered_at, role: ordered}
    measures: [revenue, order_count, units]
