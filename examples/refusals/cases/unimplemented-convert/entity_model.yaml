# `convert` typechecks decimal -> decimal, passes every guardrail, and lowers to
# a CONVERT_CURRENCY(...) call that exists in no engine. bloomery refuses it at
# emit rather than shipping a project that compiles here and fails there.
spec_version: 1
entities:
  payment:
    grain: one row per payment
    key: [payment_id]
    fields:
      payment_id: {type: string, required: true}
      amount_eur: {type: "decimal(12,2)"}
      amount_usd: {type: "decimal(12,2)"}
