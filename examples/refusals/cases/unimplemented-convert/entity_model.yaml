# `convert` typechecks decimal -> decimal and passes every guardrail, then asks
# for a rate this project never declared. A conversion is a join against a dated
# rate table; bloomery reads that table from the catalog's `fx_rates:`, and this
# catalog has none. Refused at emit rather than shipped as SQL with no rate in
# it (RFC 0023 §5.4).
spec_version: 1
entities:
  payment:
    grain: one row per payment
    key: [payment_id]
    fields:
      payment_id: {type: string, required: true}
      amount_eur: {type: "decimal(12,2)"}
      amount_usd: {type: "decimal(12,2)"}
      paid_at: {type: date}
