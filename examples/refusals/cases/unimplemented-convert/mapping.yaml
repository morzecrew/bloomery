mapping_version: 1
source: psp__payments
target: payment
key:
  payment_id: {from: "$.id", transform: [to_string]}
fields:
  amount_eur: {from: "$.amount", transform: [{to_decimal: [12, 2]}]}
  # The step that cannot be lowered here: `paid_at` dates the rate, but nothing
  # in this project says where the rates live.
  amount_usd:
    from: "$.amount"
    transform: [{to_decimal: [12, 2]}, {convert: [EUR, USD, paid_at]}]
  paid_at: {from: "$.paid_at", transform: [{parse_date: ISO8601}]}
