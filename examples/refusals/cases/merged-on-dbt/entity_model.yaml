# Two shops merged into one entity — which SQLMesh builds happily. This case
# compiles for `Target.SQLMESH` and is refused for `Target.DBT`, and that is the
# whole point: target coverage is stated rather than approximated.
spec_version: 1
entities:
  order_line:
    grain: one row per line, across both shops
    key: [order_id, line_no]
    fields:
      order_id: {type: string, required: true}
      line_no: {type: int, required: true}
      sku: {type: string, required: true}
