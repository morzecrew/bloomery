name: Continuous Integration

on:
  workflow_call:
    inputs:
      force_full:
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      force_full:
        required: false
        type: boolean
        default: true

  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"

  # Nightly lane for the Docker-backed tiers (engine matrix + target e2e —
  # RFC 0009): too heavy per-commit, too important to skip entirely.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      code: ${{ steps.scope.outputs.code }}
      force_full: ${{ steps.force.outputs.force_full }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Force full run
        id: force
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-set-force-full.sh

      - name: Detect path changes
        id: scope
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            code:
              - "src/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".pre-commit-config.yaml"
              - ".github/workflows/ci.yml"

  quality:
    name: Run quality checks
    needs: changes
    if: needs.changes.outputs.force_full == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run quality checks
        run: just quality -s

  # Default test tiers (unit/golden/property/execution) across the supported
  # Python range. Single job per interpreter — a one-package pure library needs
  # no sharding (RFC 0001 D1). The coverage floor is enforced here, in the same
  # job that measured it: the gate is ours, not an external service's, so there
  # is no Codecov upload (deliberate — no token, no third-party authority).
  test:
    name: Test (Python ${{ matrix.python }})
    needs: [changes, quality]
    if: |
      (needs.changes.outputs.force_full == 'true' || needs.changes.outputs.code == 'true') &&
      needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: |
          uv run pytest -m "not engine and not e2e and not perf" \
            --cov=src --cov-report=xml

      - name: Enforce coverage threshold
        run: uv run coverage report --fail-under=80

  # The sole branch-protection check. Kept INLINE on purpose (no checkout): its
  # pass/fail must not depend on a file pulled from the PR-head checkout.
  # Reading job results via the `needs` context — passed through `env` so
  # PR-controlled strings never interpolate into the script body — keeps the
  # gate self-contained.
  required-ci:
    name: Required Continuous Integration
    needs: [changes, quality, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Verify required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FORCE_FULL: ${{ needs.changes.outputs.force_full }}
        run: |
          echo "changes.result=${CHANGES_RESULT}"
          echo "quality.result=${QUALITY_RESULT}"
          echo "test.result=${TEST_RESULT}"
          echo "code=${CODE}"
          echo "force_full=${FORCE_FULL}"

          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "changes job failed"
            exit 1
          fi

          if [[ "${FORCE_FULL}" == "true" || "${CODE}" == "true" ]]; then
            if [[ "${QUALITY_RESULT}" != "success" ]]; then
              echo "quality job did not succeed"
              exit 1
            fi
            if [[ "${TEST_RESULT}" != "success" ]]; then
              echo "test matrix did not succeed"
              exit 1
            fi
          else
            if [[ "${QUALITY_RESULT}" != "skipped" ]]; then
              echo "quality was expected to be skipped"
              exit 1
            fi
            if [[ "${TEST_RESULT}" != "skipped" ]]; then
              echo "test was expected to be skipped"
              exit 1
            fi
          fi

          echo "required-ci passed"

  # Tiers 5–6 (engine matrix via testcontainers, target e2e): Docker-backed,
  # so they run on the nightly schedule and on explicit force_full runs
  # (workflow_dispatch, release), never per-commit. Not part of required-ci.
  engine-e2e:
    name: Engine matrix + target e2e (Docker)
    needs: [changes, quality]
    if: |
      needs.changes.outputs.force_full == 'true' &&
      needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: false
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      # Exit code 5 (no tests collected) is tolerated until the tier 5/6
      # suites land (RFC 0009 §12, M7) — an empty lane must not fail the
      # nightly, but a failing engine test must.
      - name: Run engine and e2e tiers
        run: |
          set +e
          uv run pytest -m "engine or e2e"
          code=$?
          set -e
          if [[ "$code" == "5" ]]; then
            echo "no engine/e2e tests collected yet (tiers land with M7)"
            exit 0
          fi
          exit "$code"
