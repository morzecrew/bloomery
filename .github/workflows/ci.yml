name: Continuous Integration

on:
  workflow_call:
    inputs:
      force_full:
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      force_full:
        required: false
        type: boolean
        default: true

  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".pre-commit-config.yaml"
      - "pages/**"
      - ".github/workflows/ci.yml"

  # Nightly lane for the Docker-backed tiers (engine matrix + target e2e —
  # S-0026): too heavy per-commit, too important to skip entirely.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      code: ${{ steps.scope.outputs.code }}
      corpus: ${{ steps.scope.outputs.corpus }}
      docs: ${{ steps.scope.outputs.docs }}
      engine: ${{ steps.scope.outputs.engine }}
      force_full: ${{ steps.force.outputs.force_full }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Force full run
        id: force
        env:
          FORCE_FULL: ${{ inputs.force_full }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/ci-set-force-full.sh

      - name: Detect path changes
        id: scope
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - "src/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".pre-commit-config.yaml"
              - ".github/workflows/ci.yml"
              # The docs pages are a test *input*, not only a build input:
              # `tests/unit/test_docs_floor.py` reads every page under
              # `pages/docs/` and enforces contracts over them — an admonition
              # claiming a refusal must name an exported error class, and every
              # documented error must exist. Left out of this filter, a
              # docs-only PR skipped the matrix that reads its own diff, and a
              # change that broke that test merged green. `docs` below still
              # exists and still runs the strict site build; this entry is
              # about the tests, which is a different question.
              - "pages/docs/**"
            # The design corpus and the gate that checks it. Separate from
            # `code` on purpose: a document change must run `just quality` —
            # that is where `torve spec check` lives — without pulling the
            # whole test matrix for a change that touches no Python the
            # package ships.
            corpus:
              - ".torve/specs/**"
              - ".torve/archive/**"
              - "tools/**"
              - "justfile"
              - ".github/workflows/ci.yml"
            # The documentation site and the gate that builds it. Its own
            # filter for the same reason `corpus` has one: a docs-only PR must
            # run `just build-docs --strict` — which is the only thing that
            # fails on a broken internal link — without pulling the test matrix
            # for a change that ships no Python.
            docs:
              - "pages/**"
              - "justfile"
              - ".github/scripts/install-d2.sh"
              - ".github/workflows/ci.yml"
            # What only a real engine or a real target framework can check.
            # All of `src/`, not just `dialects/**` and `emit/**`: the tiers
            # compile whole projects, so the SQL an engine executes is shaped
            # by `ir`, `quality`, `resolve`, `transforms` and `typing` just as
            # much as by the emitting packages — scoped to the two, a PR
            # editing `transforms/registry.py` (where `output_type`
            # declarations live, the S-0046 defect class this lane exists
            # for) skipped it and waited for nightly. The scoping's real job
            # survives: a docs-only PR still pulls no containers.
            engine:
              - "src/bloomery/**"
              - "tests/engines/**"
              - "tests/e2e/**"
              - "tests/support/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/ci.yml"

  # S-0042/the-docs-floor-claims-not-links item 3, the half a test cannot see. Zensical resolves page
  # links; `--strict` is what makes a broken one fail rather than print. The
  # claim checks — documented classes, the refusal census, cited repo paths —
  # are unit tests and ride the `test` matrix instead.
  docs:
    name: Build docs (strict)
    needs: changes
    if: needs.changes.outputs.force_full == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install d2
        run: bash .github/scripts/install-d2.sh

      - name: Install dependencies
        run: uv sync --all-groups

      # `build-docs` depends on `build-diagrams`, so d2 runs here before
      # Zensical does. It does *not* follow that a missing render fails the
      # build: `--strict` resolves page links, and an image is not one — a page
      # embedding `no-such-diagram.svg` builds clean and reports "No issues
      # found". `test_every_embedded_diagram_has_a_d2_source` is what catches
      # that, and it rides the test matrix rather than this job.
      - name: Build the documentation site
        run: just build-docs

  quality:
    name: Run quality checks
    needs: changes
    if: needs.changes.outputs.force_full == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A full history: `torve spec check` reads the working tree alone,
          # but the corpus test's provenance checks and the docs' `git show`
          # instructions want the mainline reachable. Depth 0 also
          # fetches `origin/main`, which the reachability half is measured
          # against.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run quality checks
        run: just quality -s

  # Default test tiers (unit/golden/property/execution) across the supported
  # Python range. Single job per interpreter — a one-package pure library needs
  # no sharding (S-0018/D-1). Each leg only *measures*; the floor is enforced
  # once over the combined data in `coverage` below, which is what S-0018/docs
  # lays out (`test` → `coverage`) and what makes version-gated lines honest.
  test:
    name: Test (Python ${{ matrix.python }})
    needs: [changes, quality]
    if: |
      (needs.changes.outputs.force_full == 'true' || needs.changes.outputs.code == 'true') &&
      needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      # One data file per interpreter so the legs combine rather than clobber.
      # `relative_files = true` (pyproject) is the other half — without it the
      # runner's absolute paths differ per leg and `combine` matches nothing.
      COVERAGE_FILE: .coverage.${{ matrix.python }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      # `--cov-fail-under=0` because this leg does not gate: the floor belongs
      # to the combined report. Left at 80 here it would fail a leg for lines
      # another interpreter covers.
      #
      # `not chaos` matches `just test`: the expression here predates the
      # chaos tier and silently kept it, so every PR ran the mutation battery
      # three times over — once per interpreter, though detection does not
      # vary by interpreter. It is an opt-in lane by design (S-0033/tests-rfc-0009-amendment) and
      # now runs once, in the scheduled `chaos` job below.
      - name: Run tests
        run: |
          uv run pytest -m "not engine and not e2e and not chaos and not perf and not surrogate" \
            --refusal-census \
            --cov=src \
            --cov-report= \
            --cov-fail-under=0 \
            --junitxml="junit-${{ matrix.python }}.xml" \
            -o junit_family=legacy

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-data-${{ matrix.python }}
          path: .coverage.${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      # Uploaded even on failure — a failing suite is exactly when the
      # per-test breakdown is worth having.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./junit-${{ matrix.python }}.xml
          # Explicit although it is the action's default: this is what keeps a
          # fork's tokenless upload — or a Codecov outage — from failing a job
          # and, through `required-ci`, blocking a merge. D4 says informational,
          # and a default is not a guarantee.
          fail_ci_if_error: false

  # Combine the per-interpreter coverage into one report, upload it, then
  # enforce the floor (S-0018/docs). The order matters: Codecov is
  # informational only (D4) — the gate is this job's own `coverage report`,
  # not the service's status — but the upload still has to happen on a
  # regression, which it would not if the gate ran first and aborted the job.
  coverage:
    name: Coverage gate
    needs: [changes, quality, test]
    if: |
      !cancelled() &&
      (needs.changes.outputs.force_full == 'true' || needs.changes.outputs.code == 'true') &&
      needs.quality.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage + generate report
        run: bash .github/scripts/combine-coverage.sh

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
          files: ./coverage.xml
          # See the note on the test-results upload: the service never gates.
          fail_ci_if_error: false

      # The gate. `combine-coverage.sh` deliberately swallows its own failures,
      # so an empty or missing report surfaces here as a floor failure rather
      # than as a green job that measured nothing.
      #
      # These are the three lines `just coverage` runs, over the *combined*
      # data — which is what makes a version-gated line honest, since a per-leg
      # check would fail a package for lines another interpreter covers.
      # Separate steps so the log says which floor failed.
      - name: Enforce the global coverage threshold
        run: uv run coverage report --fail-under=98

      - name: Enforce the guardrails floor (S-0026/D-9)
        run: uv run coverage report --include='src/bloomery/guardrails/*' --fail-under=100

      - name: Enforce the steps floor
        run: uv run coverage report --include='src/bloomery/steps/*' --fail-under=92

  # The sole branch-protection check. Kept INLINE on purpose (no checkout): its
  # pass/fail must not depend on a file pulled from the PR-head checkout.
  # Reading job results via the `needs` context — passed through `env` so
  # PR-controlled strings never interpolate into the script body — keeps the
  # gate self-contained.
  required-ci:
    name: Required Continuous Integration
    needs: [changes, docs, quality, test, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Verify required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CORPUS: ${{ needs.changes.outputs.corpus }}
          DOCS: ${{ needs.changes.outputs.docs }}
          FORCE_FULL: ${{ needs.changes.outputs.force_full }}
        run: |
          echo "changes.result=${CHANGES_RESULT}"
          echo "docs.result=${DOCS_RESULT}     (docs=${DOCS})"
          echo "quality.result=${QUALITY_RESULT}"
          echo "test.result=${TEST_RESULT}"
          echo "coverage.result=${COVERAGE_RESULT}"
          echo "code=${CODE} corpus=${CORPUS} force_full=${FORCE_FULL}"

          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "changes job failed"
            exit 1
          fi

          # Each job is checked against *its own* trigger, not against `code`.
          # A single flag was right while `code` gated everything; it stopped
          # being right when `quality` gained the `corpus` trigger, which made
          # a corpus-only PR run quality successfully and then fail here for not
          # having skipped it. `docs` would have repeated the mistake.
          expect() {
            local name="$1" triggered="$2" result="$3"
            if [[ "${FORCE_FULL}" == "true" || "${triggered}" == "true" ]]; then
              if [[ "${result}" != "success" ]]; then
                echo "${name} did not succeed"
                exit 1
              fi
            elif [[ "${result}" != "skipped" ]]; then
              echo "${name} was expected to be skipped, got ${result}"
              exit 1
            fi
          }

          quality_triggered=false
          if [[ "${CODE}" == "true" || "${CORPUS}" == "true" ]]; then
            quality_triggered=true
          fi

          expect "docs build" "${DOCS}" "${DOCS_RESULT}"
          expect "quality" "${quality_triggered}" "${QUALITY_RESULT}"
          expect "test matrix" "${CODE}" "${TEST_RESULT}"
          # The coverage floor lives in that job, so a skipped or failed
          # `coverage` on a code change means the floor went unenforced.
          expect "coverage gate" "${CODE}" "${COVERAGE_RESULT}"

          echo "required-ci passed"

  # The bench lane (S-0026/benchmark-lane-tests-bench), informational — the other half of D13.
  # Its module docstring claimed it "runs in the scheduled lane" while no
  # workflow ran the `perf` marker at all: the only mention of it in CI was the
  # expression excluding it. Drift between releases shows up here; the blocking
  # copy is the release-candidate job in `release.yaml`.
  #
  # The marker selects the whole lane, so this job is named for what the lane
  # measures rather than for its first entry: hydration budgets *and* the
  # compile path at 100/500/1000 entities. It was called "Hydration budgets"
  # for one release after the compile bench landed — a check that goes red
  # under a name that does not cover the assertion that failed is the same
  # defect as a comment asserting the opposite of its filter.
  #
  # Not in `required-ci`, and `continue-on-error` on purpose: a slow shared
  # runner must not fail a nightly for reasons no code changed. The release
  # job is where the budgets bind.
  perf:
    name: Performance budgets (informational)
    needs: [changes, quality]
    if: |
      needs.quality.result == 'success' &&
      (needs.changes.outputs.force_full == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Measure the performance budgets
        run: uv run pytest -m perf

  # The mutation battery (S-0033/tests-rfc-0009-amendment): deforms the lowering and requires the
  # M12 quality suite to notice — the only evidence that suite is detection
  # rather than decoration. Opt-in by design and excluded from the test
  # matrix above; this job is where it actually runs: nightly, and on
  # force_full (dispatch, release).
  #
  # Blocking, unlike `perf`: a surviving mutation is a hole in the battery,
  # not a slow runner. No Docker, no matrix — mutation detection does not
  # vary by interpreter.
  chaos:
    name: Mutation battery (chaos)
    needs: [changes, quality]
    if: |
      needs.quality.result == 'success' &&
      needs.changes.outputs.force_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run the mutation battery
        run: uv run pytest -m chaos

  # The authoritative compile rung for the BigQuery port (S-0012/D-3): a dry
  # run is the service's own parser, binder and type resolution, and it neither
  # executes nor scans. Rungs 1–4 never ask BigQuery anything, so this is the
  # only job in this file where something other than SQLGlot has an opinion
  # about what the port renders.
  #
  # Never on a pull request (S-0012/D-5): GitHub withholds secrets from a fork's
  # workflow, and a public contribution must not run SQL under a maintainer's
  # cloud identity — `pull_request_target` is named here so it is not proposed
  # later as a convenience. `main`, the nightly schedule and force-full runs
  # only, behind an Environment so its protection rules apply and the credential
  # is out of reach of the jobs above.
  #
  # Its own job, and deliberately the only BigQuery job that exists today: the
  # execution lane is a separate one when it lands, so the default cloud lane
  # cannot scan or bill by accident.
  #
  # Identity is Workload Identity Federation over the runner's OIDC token
  # (S-0014/D-4) — `id-token: write` is what mints it. No service-account JSON
  # key: a long-lived key in repository secrets is the credential most likely to
  # outlive the maintainer who created it, and nothing here would notice that it
  # had. The provider, the service account and the dataset are configuration
  # rather than secrets, so they are Environment variables; the access token the
  # exchange returns is the only secret in the job, and it expires in minutes.
  #
  # Green without any of them: the lane skips with a stated reason rather than
  # failing, which is also what makes its acceptance command quiet in a sandbox.
  # The job itself does not start without the provider and the service account:
  # the token exchange runs before pytest could skip, and an empty input fails
  # it rather than producing the skip the lane promises.
  bigquery-dry-run:
    name: BigQuery dry run (authoritative compile)
    needs: [changes, quality]
    if: |
      needs.quality.result == 'success' &&
      vars.BIGQUERY_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.BIGQUERY_SERVICE_ACCOUNT != '' &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.force_full == 'true' ||
       github.event_name == 'schedule' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: bigquery
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate by federated identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.BIGQUERY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BIGQUERY_SERVICE_ACCOUNT }}
          # The harness speaks the REST API over `urllib` and wants a bearer
          # token, not a credentials file — no cloud SDK enters this repository
          # (S-0012/D-4), on either side of the `src/` boundary.
          token_format: access_token
          # An hour is longer than the lane, and a token that outlives the job
          # is a credential nobody revokes.
          access_token_lifetime: 900s

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Dry-run the corpus on BigQuery
        env:
          BLOOMERY_BIGQUERY_PROJECT: ${{ vars.BIGQUERY_PROJECT }}
          BLOOMERY_BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET }}
          BLOOMERY_BIGQUERY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: uv run pytest tests/engines/test_bigquery_live.py -q

  # The OS smoke lane: the default tiers on Windows and macOS, nightly and on
  # force-full runs. The bug template offers both platforms while CI ran
  # Ubuntu alone, so the classic portability failures — console encoding on
  # Windows above all — had no runner to fail on. Informational
  # (`continue-on-error`, not in `required-ci`): a platform-specific breakage
  # deserves a red nightly and an issue, not a blocked merge on a lane no PR
  # exercises. No harden-runner step: the action is Linux-only.
  os-smoke:
    name: OS smoke (${{ matrix.os }})
    needs: [changes, quality]
    if: |
      needs.quality.result == 'success' &&
      needs.changes.outputs.force_full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run the default test tiers
        run: uv run pytest -m "not engine and not e2e and not chaos and not perf and not surrogate" --refusal-census

  # Tiers 5–6 (engine matrix via testcontainers, target e2e). Runs on the
  # nightly schedule, on explicit force_full runs (workflow_dispatch, release),
  # and — since the PR that measured it — on same-repo pull requests that touch
  # what it covers.
  #
  # It used to be force_full only, on the reasoning that Docker-backed means
  # expensive. Measured on run 31534974983: **199s**, against a Python test
  # matrix taking 203–325s in parallel. It finishes inside the existing
  # critical path and adds no wall-clock at all, so the cost premise was wrong
  # and the gap it left was real — the PR that measured this changed the
  # Postgres TRY_CAST guard and the whole dbt reference model, and nothing
  # would have exercised either until the following night.
  #
  # Two limits are deliberate. **Path-scoped**, so a docs-only or spec-layer PR
  # does not pull three containers to assert nothing. **Fork PRs are excluded**,
  # because secrets are unavailable to them: their pulls go out anonymous
  # against the runner IP's shared Docker Hub budget, so a fork would get a lane
  # that fails for reasons no test changed.
  #
  # Still **not part of required-ci**, and that is the same asymmetry: a rate
  # limit or a container that will not start would block a merge for reasons no
  # test changed. Advisory here, blocking nightly.
  engine-e2e:
    name: Engine matrix + target e2e (Docker)
    needs: [changes, quality]
    if: |
      needs.quality.result == 'success' && (
        needs.changes.outputs.force_full == 'true' || (
          needs.changes.outputs.engine == 'true' &&
          github.event.pull_request.head.repo.fork != true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: false
    permissions:
      contents: read

    # Docker Hub rate-limits anonymous pulls by runner IP, which on shared
    # GitHub runners is a budget this job shares with strangers — the failure
    # mode is testcontainers timing out on a pull, nightly, for reasons no
    # test changed. A token moves the pulls onto this account's budget.
    #
    # Absent, they stay anonymous and everything still runs. That is not a
    # tidiness fallback: secrets are unavailable to a pull request from a
    # fork, so anonymous is the contributor path, and a login that was
    # required would lock out exactly the people it is meant to serve.
    env:
      # Whether a token exists, never the token. A step's `if:` cannot read the
      # secrets context, so the *answer* has to be a job-level value — while the
      # credentials themselves stay bound to the single step that needs them,
      # rather than sitting in the environment of every step after it.
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before anything pulls. Guarded on the token's presence rather than on
      # the event, so a fork's run skips it silently; --password-stdin keeps
      # the token out of the process table.
      #
      # `docker login` does leave the credential in the runner's Docker config
      # for the rest of the job, which is unavoidable while later steps have to
      # pull with it. What bounds that is the token's scope: it needs
      # `Public Repo Read-only` and nothing more, so the worst a leaked one
      # buys is the right to pull public images against this account's limit.
      - name: Log in to Docker Hub when a token is configured
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      # Exit code 5 (no tests collected) is now a **failure**, not a
      # tolerance. It was allowed while the tier 5/6 suites were unwritten;
      # they exist (postgres, trino, sqlmesh replan, dbt parse), so an empty
      # lane can only mean a collection error — and tolerating it would let a
      # broken import turn the whole nightly green (S-0026/D-23).
      - name: Run engine and e2e tiers
        run: |
          uv run pytest -m "engine or e2e"

      # Rung 4 (S-0012/D-2): a step of its own, never folded into the selector
      # above, because the two rungs may not report as one — a surrogate is
      # evidence and the log has to say which line ran an emulator.
      #
      # **Not on pull requests yet** (S-0014/D-6). Of the row's two inputs only
      # one is answered: the lane does catch what rungs 1–3 miss, because every
      # assertion in it is about a *value* — a quarantined row, a decimal's
      # scale, the instant a wall clock lands on — and no offline rung produces
      # one. Its runtime is unmeasured: it had never run against a daemon when
      # it landed, so there is no number to put beside the 199s that earned the
      # tiers above their PR slot. The nightly and push runs below produce it;
      # whoever reads one may delete this condition and record the measurement,
      # which is the same evidence the engine tiers were promoted on.
      - name: Run the BigQuery surrogate lane (emulator, not engine conformance)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          uv run pytest -m surrogate
  # The authoritative compile lane for the Snowflake port (S-0013/D-7): every
  # statement the shared corpus renders, put through `EXPLAIN USING JSON` on a
  # real account, which is Snowflake's own parser, binder and function
  # resolution and the acceptance oracle the emulator lane is only evidence for.
  #
  # **Compile-only, in its own job.** Nothing here executes a query, creates an
  # object or needs a warehouse, so the lane cannot scan or bill — and keeping
  # it separate from any execution job is what makes that structural rather than
  # a promise about which tests were written.
  #
  # **Never on a pull request.** The credentials live in the `snowflake` GitHub
  # Environment and never in the repository, and a fork pull request cannot
  # reach an environment at all, so the trigger is main, releases, the nightly
  # schedule and manual dispatch — the events where the account's owner is the
  # one running the code.
  #
  # **Absent credentials skip, they do not fail.** The lane reads them from the
  # environment and skips with the missing variable named, because a red lane on
  # an unconfigured account trains everyone to ignore the lane. Not part of
  # `required-ci` for the same reason the engine matrix is not: a cloud endpoint
  # being unreachable must not block a merge no test changed.
  snowflake-compile:
    name: Snowflake compile lane (EXPLAIN, no execution)
    needs: changes
    if: |
      needs.changes.outputs.force_full == 'true' || (
        github.event_name == 'push' && github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: snowflake
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --all-groups

      # The credentials are bound to this one step rather than to the job, so no
      # later step inherits them. The account identifier and the session context
      # are environment *variables* and only the token is a secret: what has to
      # stay unreadable is the bearer, and naming the account in a log is how
      # anyone tells which account answered.
      - name: Compile the corpus on Snowflake
        env:
          BLOOMERY_SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          BLOOMERY_SNOWFLAKE_TOKEN: ${{ secrets.SNOWFLAKE_TOKEN }}
          BLOOMERY_SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          BLOOMERY_SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
          BLOOMERY_SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
        run: |
          uv run pytest tests/engines/test_snowflake_live.py -rs
