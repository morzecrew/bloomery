name: Release a new package version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: Run CI before release
    uses: ./.github/workflows/ci.yml
    with:
      force_full: true
    permissions:
      contents: read
      # The called workflow's `changes` job declares `pull-requests: read` (dorny/paths-filter
      # reads the PR's file list through the API on pull_request events). A called workflow's
      # jobs cannot exceed the calling job's permission ceiling, and GitHub checks that
      # statically — so the grant is required here even though a tag push never resolves a PR
      # (paths-filter falls back to git, and force_full skips the filter's result anyway).
      pull-requests: read

  # RFC 0025 D13. The perf lane is informational on the nightly schedule and
  # **blocking here**, and the asymmetry is the decision: `just test` excludes
  # `perf`, so a gate living only on a schedule can run after the tag or skip a
  # release candidate entirely — satisfying D1 on paper and enforcing nothing.
  #
  # The assertion is an absolute ceiling with headroom (D4), never a drift
  # comparison against a stored baseline: runner variance on millisecond
  # measurements makes percentage drift flaky, and a flaky gate is one people
  # learn to re-run. Measured on this tree, 30-model reference tenant, median
  # of 25: cold 10.8 ms against a 150 ms ceiling, warm 7.9 ms against 30 ms.
  # An order-of-magnitude regression is what this blocks; noise is not.
  perf:
    name: Hydration budgets (release candidate)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uncached deliberately. This workflow publishes, so a restored cache is
      # a supply-chain surface (`build` suppresses the same audit with a
      # justification it can make and this job cannot). A perf job also has a
      # second reason: it measures, and a restored environment is one more
      # thing that differs between the number here and the number nightly.
      # One `uv sync` per release is a cost worth paying twice over.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Explicit: the action caches by default, so omitting the key would
          # have left the cache on while the comment above said otherwise.
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-groups

      # Exit code 5 (no tests collected) is a failure, not a tolerance: an
      # empty perf lane is a release that measured nothing, which is the one
      # outcome indistinguishable from a release that met its budgets.
      - name: Assert the hydration budgets
        run: uv run pytest -m perf

  build:
    name: Build the package
    needs: [ci, perf]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure release tag is on main
        run: bash .github/scripts/ensure-tag-on-main.sh

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.3.2 # zizmor: ignore[cache-poisoning] cache feeds `uv build`; lockfile-keyed and the published wheel is built from a pinned checkout
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Build
        run: uv build

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bloomery
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package
          path: dist/

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package
          path: dist/

      - name: Checkout code # zizmor: ignore[artipacked] no workspace/.git is uploaded as an artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version from tag
        id: ver
        run: bash .github/scripts/compute-version-from-tag.sh

      - name: Get Changelog Entry
        id: changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ steps.ver.outputs.version }}
          path: ./CHANGELOG.md

      - name: Create GitHub Release # zizmor: ignore[superfluous-actions] prefer the pinned action over an inline `gh release` script
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.changes }}
