name: Bug report
description: Report a bug in bloomery
title: "🐛 bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?

    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue? A minimal spec (entity/mapping/metric YAML) helps enormously.
      placeholder: |
        1. ...
        2. ...
        3. ...

    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback / emitted artifact
      description: If applicable, paste stack traces, error output, or the offending emitted SQL/YAML.

  - type: input
    id: version
    attributes:
      label: bloomery version
      placeholder: "0.1.0"

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Linux / macOS / Windows"
